      tur: env
      yol: "/home/ubuntu/.hermes/.env"
      alan: OPENROUTER_API_KEY
      mod: null
      sahip: null
      tuketici: "hermes CLI GLOBAL env — motorun hermes._agent_call yolu (kind=review/generic; timer'sız, restart gerekmez)"
      not: "KEŞİF 2026-09-12: 09-08 rotasyonu bu kopyayı ATLADI (envanterde yoktu) → akşam inceleme çağrısı 401 'User not found', self_review/validation/nous_eval 4 gün atlandı (TSK-181). Değer profillerden farklı ELE ALINMAZ: aynı OpenRouter anahtarı"

    # ---- KAPI YÖNETİM ANAHTARI (TSK-064 Faz-1C, spec §3 madde 4; repo tarafı 2026-09-13) --------
    # `APISIX_ADMIN_KEY` `KAPI_APIKEY`den AYRI BİR SIRDIR ve karıştırmak pahalıdır: `KAPI_APIKEY`
    # kapının TÜKETİCİ anahtarıdır (`motor_meridian` key-auth, proxy 9080), bu ise Admin API'nin
    # (9180, yalnız loopback) YÖNETİM anahtarıdır. Ayrı yüzey, ayrı kanıt, ayrı alt komut
    # (`sir_rotasyon.sh --apisix-admin`).
    #
    # FAZ NOTU — BU İKİ SATIR BİR GEÇİŞİN İKİ UCUDUR, bir kopya çifti değil.
    #   · `env` satırı KAPININ KENDİ KANALIDIR ve Faz-1C'den SONRA da KALIR: apisix konteyneri
    #     `/opt/apisix/.env-apisix`i `--env-file` ile okur ve `config.yaml`taki
    #     `${{APISIX_ADMIN_KEY}}` oradan çözülür (B sınıfı yarım kazanım — spec §2). Yani TSK-049
    #     faz-2'deki gibi "sonra silinecek satır" DEĞİLDİR; silinirse KAPI AÇILMAZ.
    #   · `dosya` satırı `ops/apisix_uygula.py`nin Faz-1C kaynağıdır (0400 root). Bir
    #     `LoadCredential=` kaynağı DEĞİLDİR (hiçbir birim onu açılışta aramaz) — okuyucu
    #     operatörün eliyle koştuğu ops aracıdır ve araç her koşumda okuduğu KANALI bildirir.
    #   · REFERANS `env` SATIRIDIR (tabloda ÖNCE gelir): credential kaynağı A1'de elle kurulana
    #     kadar YOKTUR ve ilk sıraya konsaydı `--envanter`/`--esitle` "referans kopya YOK" ile
    #     dururdu. Gerekçenin tamamı `sir_rotasyon.sh::_kopyalar` altındaki şerhtedir.
    #   · A1 UYGULAMASI AÇIK KALEM: dosya henüz YARATILMADI (`sir_credential_gecis.sh
    #     --faz1-apisix`, operatör/Rol-1 penceresi) ve `mod`/`sahip` alanları o günün ÖLÇÜMÜ değil
    #     betiğin YAZACAĞI değerdir. Aracın 0400 root bir kaynağı okuyabilmesi `sudo` ile koşmasına
    #     bağlıdır; kimlik kararı (0400 root:root ↔ 0440 root:ubuntu) Rol-1'dedir.
    - alt_komut: apisix-admin
      sir: APISIX_ADMIN_KEY
      tur: env
      yol: "/opt/apisix/.env-apisix"
      alan: APISIX_ADMIN_KEY
      mod: null                # korunur (dosya 640 → faz0_hedef_mod 600; `dosyalar:` bloğunda ölçülü)
      sahip: null
      tuketici: "apisix.service (docker --env-file; config.yaml ${{APISIX_ADMIN_KEY}} çözümü — RESTART gerekir, reload yetmez)"
      not: "REFERANS kopya: kapının kendi kanalı, Faz-1C'den sonra da KALIR (silinirse kapı açılmaz)"
    - alt_komut: apisix-admin
      sir: APISIX_ADMIN_KEY
      tur: dosya
      yol: "/etc/meridian/apisix_admin_key"
      alan: null
      mod: "400"
      sahip: "root"
      tuketici: "ops/apisix_uygula.py (operatör eliyle koşan ops aracı; birim DEĞİL, restart yok)"
      not: "TSK-064 Faz-1C kaynağı — A1'de HENÜZ YOK (sir_credential_gecis.sh --faz1-apisix yaratır); LoadCredential kaynağı DEĞİL"

# =================================================================================================
# VAULT KV DALGA-1 — TSK-064 Faz-2 (2026-09-14, repo tarafı; A1 kurulumu Rol-1'de)
# =================================================================================================
# NİYE ÜÇÜNCÜ BİR BLOK. Yukarıdaki iki blok iki AYRI gerçeği taşır: `dosyalar:` spec §1
# tablosundan türer ("bugün hangi sır nerede yaşıyor"), `rotasyon_kopyalari:` rotasyon betiğinden
# ("bir değer döndüğünde hangi kopyalar aynı pencerede yazılmalı"). Bu blok ÜÇÜNCÜ bir soruyu
# yanıtlar: "hangi sır Vault'ta hangi yolda durur ve Agent onu hangi dosyaya render eder".
# Üçünü tek bloğa sıkıştırmak üç farklı kaynağı tek yerde ayrıştırırdı (tek-kaynak yasası iki
# yönlüdür: aynı gerçeğin iki kopyası da, farklı gerçeklerin tek kopyası da ayrışma üretir).
#
# BU BLOK ÜRETİCİNİN GİRDİSİDİR. `ops/vault_politika_uret.py` buradan ÜÇ dosya üretir:
#   deploy/vault/policies/meridian-agent.hcl   — YALNIZ buradaki yolları `read` (sayı DÜZYAZIYA
#                                                GÖMÜLMEZ: liste blokla birlikte büyür)
#   deploy/vault/policies/meridian-admin.hcl   — yönetim (CRUD + sağlık + secret-id yenileme)
#   deploy/vault/agent.hcl                     — auto_auth + her hedef için bir `template` bloğu
#                                                (+ dalga-2: `vault_dosyalar` yan dosyaları)
# Üçü de ÜRETİLMİŞ dosyadır ve ELLE DÜZENLENMEZ; tazelik kapısı `--kontrol` (çıkış 1 = bayat).
#
# DALGA-1 KAPSAMI (2026-09-14 sabahı): YALNIZ tek-değer dosyaları. Sebep teknikti — bir `template`
# bloğu dosyanın TAMAMINI yazar; çok-değişkenli bir dosyayı Vault'tan render etmek o dosyadaki
# AYAR satırlarının da kasaya girmesini gerektirirdi.
# DALGA-2 (aynı günün akşamı, operatör kararı "HEPSİ") KISITI KALDIRMADAN AŞTI: `vault_dosyalar`
# bloğunun SIR-YALNIZ yan dosyaları (`<dosya>.vault`) yalnız sır satırlarını taşır, ayar satırları
# asıl dosyada KALIR ve tüketici iki kaynağı birlikte okur. Bu bloğun dalga-2 girdileri aşağıda,
# yan dosyaların kendisi `vault_dosyalar` bloğundadır.
#
# DEĞER YOK: bu blok da yalnız AD ve YOL taşır (v439 E4 ile aynı kural; çivi
# tests/test_vault_faz2_v485.py E3).
#
# `tuketici` ALANI BİR BEYANDIR, süs değil: çivi (v485 F2) alanı `LoadCredential` kelimesi için
# okur ve drop-in'lerden ÖLÇÜLEN kaynak kümesiyle İKİ YÖNLÜ karşılaştırır. Yani "bu dosyayı kim
# okuyor" sorusu envanterde yazılı DURUR ve yazıldığı gibi ölçülür.

vault_kv:
  # ---- MOTOR (meridian.service · LoadCredential) ------------------------------------------------
  - ad: dash_token
    vault_yolu: "secret/meridian/dash_token"
    hedef: "/etc/meridian/dash_token"
    mod: "0400"
    sahip: "root"
    tuketici: "meridian.service (LoadCredential=dash_token)"
  - ad: nous_api_key
    vault_yolu: "secret/meridian/nous_api_key"
    hedef: "/etc/meridian/nous_api_key"
    mod: "0400"
    sahip: "root"
    tuketici: "meridian.service (LoadCredential=NOUS_API_KEY)"
  - ad: kapi_apikey
    vault_yolu: "secret/meridian/kapi_apikey"
    hedef: "/etc/meridian/kapi_apikey"
    mod: "0400"
    sahip: "root"
    tuketici: "meridian.service (LoadCredential=KAPI_APIKEY)"

  # ---- KAPI YÖNETİM ANAHTARI — TEK LoadCredential-DIŞI HEDEF, BEYANLI --------------------------
  # Bu dosyayı hiçbir birim açılışta ARAMAZ: okuyucusu operatörün eliyle koştuğu bir ops aracıdır
  # (Faz-1C, `rotasyon_kopyalari` bloğundaki `apisix-admin` satırlarının şerhi). Beyan olmasaydı
  # çivi onu "kapsanmayan LoadCredential kaynağı" ya da "bayat beyan" diye kırmızıya çevirirdi —
  # ve doğrusu budur: bir istisna ancak ADIYLA yazıldığında istisnadır.
  - ad: apisix_admin_key
    vault_yolu: "secret/meridian/apisix_admin_key"
    hedef: "/etc/meridian/apisix_admin_key"
    mod: "0400"
    sahip: "root"
    tuketici: "ops/apisix_uygula.py (operatör eliyle koşan ops aracı; birim DEĞİL, restart yok)"

  # ---- HAFIZA (hindsight-api.service + meridian.service pano vekili · LoadCredential) -----------
  # Dosyanın ADI değişkenin ADIDIR (`LoadCredential=<kimlik>:<kaynak>` sözleşmesi, v439 I6/I9).
  # Bu yüzden `ad` alanı burada BÜYÜK HARFLİDİR ve motor tarafındaki küçük-harfli adlardan
  # ayrılır: ad bir üslup tercihi değil, systemd'nin okuduğu dosya adıdır.
  - ad: HINDSIGHT_API_DATABASE_URL
    vault_yolu: "secret/meridian/HINDSIGHT_API_DATABASE_URL"
    hedef: "/etc/hindsight/creds/HINDSIGHT_API_DATABASE_URL"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-api.service (LoadCredential=HINDSIGHT_API_DATABASE_URL)"
  - ad: HINDSIGHT_API_LLM_API_KEY
    vault_yolu: "secret/meridian/HINDSIGHT_API_LLM_API_KEY"
    hedef: "/etc/hindsight/creds/HINDSIGHT_API_LLM_API_KEY"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-api.service (LoadCredential=HINDSIGHT_API_LLM_API_KEY)"
  - ad: HINDSIGHT_API_TENANT_API_KEY
    vault_yolu: "secret/meridian/HINDSIGHT_API_TENANT_API_KEY"
    hedef: "/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-api.service · meridian.service · meridian-defter-ozeti-retain (LoadCredential=HINDSIGHT_API_TENANT_API_KEY — AYNI dosya)"

  # ===============================================================================================
  # DALGA-2 — KALAN BÜTÜN SIRLAR (operatör kararı 2026-09-14 17:47Z "HEPSİ"; spec §2)
  # ===============================================================================================
  # DALGA-1'DEN FARKI TEK CÜMLEDİR: bu sekizinin tüketicisi bir `LoadCredential` kaynağı DEĞİL,
  # aşağıdaki `vault_dosyalar` bloğunun SIR-YALNIZ YAN DOSYALARIDIR. Sebep teknikti ve dalga-1'in
  # kapsam şerhinde yazılıydı: bir `template` bloğu dosyanın TAMAMINI yazar, yani çok-değişkenli
  # bir `.env`i kasadan render etmek o dosyadaki AYAR satırlarının da kasaya girmesini
  # gerektirirdi — ve envanterin TEK kuralı "burada DEĞER yoktur"dur. Yan dosya deseni kısıtı
  # kaldırmadan aşar: Agent yalnız SIR satırlarını `<dosya>.vault`a yazar, tüketici iki kaynağı
  # birlikte okur, asıl dosyadaki sır satırları iki-kanal döneminden SONRA ayrı bir adımda düşer.
  #
  # `hedef` ALANI (`/etc/meridian/<ad>`) BİR SÜS DEĞİL, OKUNAN BİR DOSYADIR (Yasa 6). İki okuyucu
  # ADIYLA yazılıdır: (1) `sir_rotasyon.sh --vault` RENDER KANITI — kasaya konan yeni değerin
  # Agent tarafından gerçekten render edildiğini bu KANONİK tek-değer kopyasının sha'sından ölçer
  # (yan dosyanın sha'sı değişti demek, HANGİ alanın değiştiğini söylemez); (2) aynı betiğin
  # iki-kanal yazımı, eski kanal kopyalarını bu dosyadan okuyarak eşitler. Okuyucusu olmayan bir
  # render yapılmaz — "kanonik kopya" gerekçesi tek başına Yasa 6'yı karşılamazdı.
  #
  # `kaynak` / `kopya_kaynaklari` (spec §4): `vault_sir_koy.sh` değeri NEREDEN alacağını buradan
  # okur. `kaynak` REFERANSTIR (ilk kopya), `kopya_kaynaklari` AYNI değerin öteki yerleridir ve
  # taşımadan önce sha EŞİTLİĞİ ölçülür — ayrışma DURDURUR. Bu kapı bir konfor değil: TSK-181'de
  # rotasyonun ATLADIĞI bir kopya (GLOBAL `/home/ubuntu/.hermes/.env`) dört gün eski anahtarla
  # yaşadı ve arıza ancak akşam incelemesinin 401'inde göründü. Kasaya yanlış kopyadan taşımak
  # aynı sınıfın daha pahalı hâlidir: kasa artık TEK KAYNAK olduğu için hata bütün tüketicilere
  # yayılır.
  #
  # `rotasyon_siri`: bu sır `rotasyon_kopyalari` tablosunda da yaşıyorsa onun KİMLİĞİ. Kaynak +
  # kopya kümesi o tablodan TÜRETİLİR ve çivi ikisinin BİREBİR eşit olduğunu ölçer — ikinci bir
  # kopya listesi tutmak, tek-kaynak yasasının bu depoda en pahalıya mal olmuş ihlalidir. `null`
  # ise sır rotasyon tablosunda YOKTUR (bot anahtarları, pano parolası, CP erişim anahtarı için
  # bugün böyledir) ve kopya listesi ADIYLA beyanlıdır.
  #
  # AÇIK KALEM — AYNI DEĞER, ÜÇ KASA YOLU (Rol-1'e): `openrouter_api_key` ile
  # `HINDSIGHT_API_LLM_API_KEY`, `bot_key_meridian` ile `kapi_apikey`,
  # `hindsight_cp_dataplane_api_key` ile `HINDSIGHT_API_TENANT_API_KEY` BUGÜN aynı değeri taşıyor
  # ama kasada AYRI yollardır. Spec §2 sekiz adı ADIYLA sayar ve bu dosya onu izler; ayrışma riski
  # `kopya_kaynaklari` kapısıyla TAŞIMA anında ölçülür, ama kasadaki iki yol ROTASYONDAN SONRA
  # ayrışabilir. Kararı (tek yol + takma ad mı, yoksa iki yol + eşitlik çivisi mi) Rol-1 verir.
  - ad: openrouter_api_key
    vault_yolu: "secret/meridian/openrouter_api_key"
    hedef: "/etc/meridian/openrouter_api_key"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonları (apisix · hindsight · hermes ×4) · sir_rotasyon.sh --vault render kanıtı (kanonik tek-değer kopyası; birim DEĞİL, systemd kaynağı DEĞİL)"
    rotasyon_siri: OPENROUTER_API_KEY
    kaynak: {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: OPENROUTER_API_KEY, onek: null}
    kopya_kaynaklari:
      - {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: OPENROUTER_AUTH, onek: "Bearer"}
      - {tur: dosya, dosya: "/etc/hindsight/creds/HINDSIGHT_API_LLM_API_KEY", alan: null, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_REFLECT_LLM_1_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_REFLECT_LLM_2_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_REFLECT_LLM_3_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_CONSOLIDATION_LLM_1_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_CONSOLIDATION_LLM_2_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env", alan: HINDSIGHT_API_CONSOLIDATION_LLM_3_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/bekci/.env", alan: OPENROUTER_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/karne/.env", alan: OPENROUTER_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/sef/.env", alan: OPENROUTER_API_KEY, onek: null}
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/.env", alan: OPENROUTER_API_KEY, onek: null}

  # BOT ANAHTARLARI — `rotasyon_siri: null` VE BU BİR BEYAN: bugün hiçbir alt komut bu üçünü
  # döndürmüyor (rotasyon tablosunda satırları YOK). Kopya listesi o yüzden ADIYLA yazılıdır ve
  # iki uçludur: kapının key-auth tüketici tanımı (`.env-apisix`) ile botun kendi profili. İkisi
  # ayrışırsa bot kapıdan 401 alır — ve bu, taşımadan ÖNCE ölçülmesi gereken tam olarak o hâldir.
  - ad: bot_key_bekci
    vault_yolu: "secret/meridian/bot_key_bekci"
    hedef: "/etc/meridian/bot_key_bekci"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonları (apisix · hermes bekci profili) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: null
    kaynak: {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: BOT_KEY_BEKCI, onek: null}
    kopya_kaynaklari:
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/bekci/.env", alan: BOT_KEY_BEKCI, onek: null}
  - ad: bot_key_karne
    vault_yolu: "secret/meridian/bot_key_karne"
    hedef: "/etc/meridian/bot_key_karne"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonları (apisix · hermes karne profili) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: null
    kaynak: {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: BOT_KEY_KARNE, onek: null}
    kopya_kaynaklari:
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/karne/.env", alan: BOT_KEY_KARNE, onek: null}
  - ad: bot_key_sef
    vault_yolu: "secret/meridian/bot_key_sef"
    hedef: "/etc/meridian/bot_key_sef"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonları (apisix · hermes sef profili) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: null
    kaynak: {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: BOT_KEY_SEF, onek: null}
    kopya_kaynaklari:
      - {tur: env_satiri, dosya: "/home/ubuntu/.hermes/profiles/sef/.env", alan: BOT_KEY_SEF, onek: null}

  # `BOT_KEY_MERIDIAN` MOTORUN kapı anahtarıdır ve `KAPI_APIKEY` ile AYNI değerdir — kopya kümesi
  # rotasyon tablosundan TÜRER (`--kapi` iki kopya yazar). Ad `bot_key_meridian`dir çünkü yan
  # dosyada o ALANI doldurur; kasadaki `kapi_apikey` yolu ise `LoadCredential` kaynağını besler.
  # İkisinin bugün aynı değeri taşıması, yarın da taşıyacağı anlamına GELMEZ (yukarıdaki AÇIK KALEM).
  - ad: bot_key_meridian
    vault_yolu: "secret/meridian/bot_key_meridian"
    hedef: "/etc/meridian/bot_key_meridian"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonları (apisix key-auth tüketicisi motor_meridian) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: KAPI_APIKEY
    kaynak: {tur: dosya, dosya: "/etc/meridian/kapi_apikey", alan: null, onek: null}
    kopya_kaynaklari:
      - {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: BOT_KEY_MERIDIAN, onek: null}

  # PANO GİRİŞ PAROLASI — kapının kendi yüzeyinde çözülür; tek kopya, tek dosya.
  - ad: pano_giris_parola
    vault_yolu: "secret/meridian/pano_giris_parola"
    hedef: "/etc/meridian/pano_giris_parola"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonu (/opt/apisix/.env-apisix.vault) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: null
    kaynak: {tur: env_satiri, dosya: "/opt/apisix/.env-apisix", alan: PANO_GIRIS_PAROLA, onek: null}

  # HİNDSİGHT KONTROL PANELİ — İKİ AYRI SIR, tek dosya. `ACCESS_KEY` CP'nin kendi giriş anahtarı
  # (rotasyon tablosunda YOK), `DATAPLANE_API_KEY` ise TENANT anahtarının kopyasıdır ve o tabloda
  # YAŞAR — kopya kümesi oradan türer (üç satır: credential kaynağı · hafıza okuyucusunun düz
  # dosyası · CP env satırı).
  - ad: hindsight_cp_access_key
    vault_yolu: "secret/meridian/hindsight_cp_access_key"
    hedef: "/etc/meridian/hindsight_cp_access_key"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonu (/opt/hindsight/.env-cp.vault) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: null
    kaynak: {tur: env_satiri, dosya: "/opt/hindsight/.env-cp", alan: HINDSIGHT_CP_ACCESS_KEY, onek: null}
  - ad: hindsight_cp_dataplane_api_key
    vault_yolu: "secret/meridian/hindsight_cp_dataplane_api_key"
    hedef: "/etc/meridian/hindsight_cp_dataplane_api_key"
    mod: "0400"
    sahip: "root"
    tuketici: "vault_dosyalar şablonu (/opt/hindsight/.env-cp.vault) · sir_rotasyon.sh --vault render kanıtı"
    rotasyon_siri: HINDSIGHT_API_TENANT_API_KEY
    kaynak: {tur: dosya, dosya: "/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY", alan: null, onek: null}
    kopya_kaynaklari:
      - {tur: dosya, dosya: "/opt/hindsight/.key", alan: null, onek: null}
      - {tur: env_satiri, dosya: "/opt/hindsight/.env-cp", alan: HINDSIGHT_CP_DATAPLANE_API_KEY, onek: null}

# =================================================================================================
# VAULT YAN DOSYALARI — sır-yalnız `<dosya>.vault` (TSK-064 Faz-2 DALGA-2, 2026-09-14)
# =================================================================================================
# NİYE DÖRDÜNCÜ BİR BLOK. `vault_kv` "hangi sır kasada hangi yolda durur"u söyler; bu blok BAŞKA
# bir soruyu yanıtlar: "Agent hangi DOSYAYI, hangi SATIRLARLA, kimin için yazar". İkisini tek
# bloğa sıkıştırmak, bir sırrın birden çok dosyada birden çok ALAN adıyla yaşadığı gerçeğini
# (OpenRouter anahtarı on üç yerde, altısı farklı ad altında) temsil edemezdi.
#
# SÖZLEŞME:
#   yol             `<asıl dosya>.vault` — asıl dosyanın YANINDA, aynı dizinde (çivi: asıl dosya
#                   envanterde TANINIYOR olmalı)
#   mod             render izni (`template { perms = … }`)
#   sahip           `root` | `ubuntu`. Agent ROOT koşar ve `template` bloğunda SAHİP parametresi
#                   YOKTUR (resmî belge, ölçüldü 2026-09-14) → `ubuntu` olan dosya için üretici
#                   bir `exec { command = ["chown", "ubuntu:ubuntu", <yol>] }` yazar. Bu, Agent'ın
#                   TEK ek yetkisidir ve `chown` bir RESTART DEĞİLDİR: tasarım §6.4'ün "Agent
#                   tüketiciyi yeniden başlatmaz" ilkesi KORUNUR.
#   tuketici        dosyayı KİMİN, HANGİ kanalla okuduğu (Yasa 6 beyanı). Biçim ÖLÇÜLDÜ, seçilmedi
#                   — aşağıdaki her satırın kanalı canlı birim dosyasından okundu.
#   yeniden_baslat  rotasyonun (`--vault`) koşacağı birim; `null` = restart GEREKMEZ ve gerekçesi
#                   `tuketici` alanında yazılıdır (timer'lı oneshot / her çağrıda dosyayı okuyan CLI)
#   satirlar        `{alan, sir, onek}` — `sir` bir `vault_kv.ad`ıdır (çivi: dangling referans yok),
#                   `onek` `null` ya da `Bearer` (donuk sözlük; rotasyon betiğinin ONEKLER tablosu
#                   ile AYNI iki jeton)
#
# İKİ KANAL, İKİ ADIM (Faz-1 deseni): bu blok yalnız yan dosyayı tanımlar. Asıl dosyalardaki sır
# satırları iki-kanal dönemi boyunca (≥2 gece) OLDUĞU GİBİ KALIR ve AYRI bir adımda kaldırılır —
# geri alım `systemctl stop vault-agent` + drop-in'lerin kaldırılmasıdır, tüketiciler eski kanalla
# devam eder (tasarım §6.4).
vault_dosyalar:
  # KAPI — tüketici docker konteyneridir ve sırları `--env-file` ile alır (ÖLÇÜLDÜ 2026-09-14,
  # `deploy/apisix/apisix.service` ExecStart satırı). İkinci `--env-file` drop-in ile eklenir;
  # docker aynı anahtarı taşıyan iki dosyada SONRAKİNİ geçerli sayar, yani yan dosya kazanır.
  # `$env://` ve `${{…}}` çözümlerini APISIX YALNIZ AÇILIŞTA yapar: reload YETMEZ, RESTART gerekir.
  - yol: "/opt/apisix/.env-apisix.vault"
    mod: "0400"
    sahip: "root"
    tuketici: "apisix.service (docker --env-file, ikinci dosya — drop-in 50-vault-yan-dosya.conf; root okur)"
    yeniden_baslat: "apisix.service"
    satirlar:
      - {alan: APISIX_ADMIN_KEY, sir: apisix_admin_key, onek: null}
      - {alan: OPENROUTER_API_KEY, sir: openrouter_api_key, onek: null}
      # TÜRETİLMİŞ DEĞER: kapının upstream Authorization başlığı `Bearer <anahtar>`dır. Önek
      # şablonda SABİT, değer kasadan gelir — iki ayrı kasa yolu tutmak (anahtar + önekli kopya)
      # aynı gerçeğin iki kopyası olurdu ve rotasyonda ayrışırdı.
      - {alan: OPENROUTER_AUTH, sir: openrouter_api_key, onek: "Bearer"}
      - {alan: PANO_GIRIS_PAROLA, sir: pano_giris_parola, onek: null}
      - {alan: BOT_KEY_BEKCI, sir: bot_key_bekci, onek: null}
      - {alan: BOT_KEY_KARNE, sir: bot_key_karne, onek: null}
      - {alan: BOT_KEY_SEF, sir: bot_key_sef, onek: null}
      - {alan: BOT_KEY_MERIDIAN, sir: bot_key_meridian, onek: null}

  # HAFIZA API — tüketici systemd birimidir (`EnvironmentFile=`, ÖLÇÜLDÜ 2026-09-14
  # `deploy/hindsight/hindsight-api.service`). İkinci `EnvironmentFile=` drop-in ile eklenir ve
  # systemd SONRAKİ dosyayı geçerli sayar. Altı satırın altısı da AYNI kasa yolundan gelir:
  # failover zinciri üyesi ana anahtarı DEVRALMAZ (EDG-2026-080/081), her üye kendi satırını okur.
  - yol: "/opt/hindsight/.env.vault"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-api.service (EnvironmentFile, ikinci dosya — drop-in 51-vault-yan-dosya.conf; systemd PID 1 olarak root okur)"
    yeniden_baslat: "hindsight-api.service"
    satirlar:
      - {alan: HINDSIGHT_API_REFLECT_LLM_1_API_KEY, sir: openrouter_api_key, onek: null}
      - {alan: HINDSIGHT_API_REFLECT_LLM_2_API_KEY, sir: openrouter_api_key, onek: null}
      - {alan: HINDSIGHT_API_REFLECT_LLM_3_API_KEY, sir: openrouter_api_key, onek: null}
      - {alan: HINDSIGHT_API_CONSOLIDATION_LLM_1_API_KEY, sir: openrouter_api_key, onek: null}
      - {alan: HINDSIGHT_API_CONSOLIDATION_LLM_2_API_KEY, sir: openrouter_api_key, onek: null}
      - {alan: HINDSIGHT_API_CONSOLIDATION_LLM_3_API_KEY, sir: openrouter_api_key, onek: null}

  # KONTROL PANELİ — birim docker koşar ama sırları `--env-file` ile DEĞİL, systemd ortamından
  # `-e VAR` ikamesiyle alır (ÖLÇÜLDÜ 2026-09-14, `deploy/hindsight/hindsight-cp.service`). Yani
  # bu tüketicinin ikinci kaynağı bir `EnvironmentFile=`dır, ikinci bir `--env-file` DEĞİL:
  # spec §1'in "docker → ikinci --env-file" cümlesi APISIX'in ölçülen biçimidir ve buraya
  # kopyalanamaz. Ölçmeden genellemek, sırrın konteynere HİÇ ulaşmadığı bir geçiş üretirdi.
  - yol: "/opt/hindsight/.env-cp.vault"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-cp.service (EnvironmentFile → docker -e ikamesi, ikinci dosya — drop-in 50-vault-yan-dosya.conf; systemd PID 1 olarak root okur)"
    yeniden_baslat: "hindsight-cp.service"
    satirlar:
      - {alan: HINDSIGHT_CP_ACCESS_KEY, sir: hindsight_cp_access_key, onek: null}
      - {alan: HINDSIGHT_CP_DATAPLANE_API_KEY, sir: hindsight_cp_dataplane_api_key, onek: null}

  # HERMES PROFİLLERİ — SAHİP `ubuntu` VE BU BLOĞUN TEK `exec` GEREKÇESİDİR. Profil `.env`ini
  # hermes CLI `ubuntu` olarak okur; Agent root render eder ve `template` sahip parametresi
  # taşımaz → render sonrası `chown ubuntu:ubuntu`.
  # A1'DE ÖLÇÜLECEK (yerelde ÖLÇÜLEMEZ, uydurma yasağı): hermes `env_loader`ın İKİNCİ bir dosyayı
  # okuyup okumadığı. Okuyorsa yan dosya doğrudan tüketilir; OKUMUYORSA yol bot birimlerine
  # `EnvironmentFile=` eklemektir (spec §1) ve o karar ölçümden SONRA verilir. `yeniden_baslat`
  # her hâlde `null`dur: bot birimleri timer'lı ONESHOT'tur ve yeni değeri bir sonraki tetikte
  # okur (rotasyon betiğinin kapsam beyanıyla AYNI hüküm).
  - yol: "/home/ubuntu/.hermes/profiles/bekci/.env.vault"
    mod: "0600"
    sahip: "ubuntu"
    tuketici: "hermes bekci profili (env_loader ikinci dosya — A1'DE ÖLÇÜLECEK; timer'lı oneshot, restart YOK)"
    yeniden_baslat: null
    satirlar:
      - {alan: BOT_KEY_BEKCI, sir: bot_key_bekci, onek: null}
      - {alan: OPENROUTER_API_KEY, sir: openrouter_api_key, onek: null}
  - yol: "/home/ubuntu/.hermes/profiles/karne/.env.vault"
    mod: "0600"
    sahip: "ubuntu"
    tuketici: "hermes karne profili (env_loader ikinci dosya — A1'DE ÖLÇÜLECEK; timer'lı oneshot, restart YOK)"
    yeniden_baslat: null
    satirlar:
      - {alan: BOT_KEY_KARNE, sir: bot_key_karne, onek: null}
      - {alan: OPENROUTER_API_KEY, sir: openrouter_api_key, onek: null}
  - yol: "/home/ubuntu/.hermes/profiles/sef/.env.vault"
    mod: "0600"
    sahip: "ubuntu"
    tuketici: "hermes sef profili (env_loader ikinci dosya — A1'DE ÖLÇÜLECEK; timer'lı oneshot, restart YOK)"
    yeniden_baslat: null
    satirlar:
      - {alan: BOT_KEY_SEF, sir: bot_key_sef, onek: null}
      - {alan: OPENROUTER_API_KEY, sir: openrouter_api_key, onek: null}

  # GLOBAL HERMES ENV — profil DEĞİL: motorun `hermes._agent_call` yolu (kind=review/generic) bu
  # dosyayı okur ve 2026-09-08 rotasyonu tam bu kopyayı ATLADI (TSK-181: akşam inceleme çağrısı
  # dört gün 401 aldı). Kasaya bağlanan ilk dalga-2 dosyası olması tesadüf değil: "unutulan kopya"
  # sınıfının tek kalıcı çözümü, kopyanın kaynağının TEK olmasıdır.
  - yol: "/home/ubuntu/.hermes/.env.vault"
    mod: "0600"
    sahip: "ubuntu"
    tuketici: "hermes CLI GLOBAL env — motorun hermes._agent_call yolu (env_loader ikinci dosya — A1'DE ÖLÇÜLECEK; timer'sız, her çağrıda okunur, restart YOK)"
    yeniden_baslat: null
    satirlar:
      - {alan: OPENROUTER_API_KEY, sir: openrouter_api_key, onek: null}
