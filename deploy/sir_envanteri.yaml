# =================================================================================================
# sir_envanteri.yaml — TSK-064 YOL-1 Faz-0: A1'deki sır YÜZEYİNİN çivilenmiş envanteri
# =================================================================================================
# YALNIZ AD TAŞIR. Bu dosyada hiçbir sır DEĞERİ yoktur ve olmayacaktır (spec §4 bedel maddesi:
# "sır DEĞERİ hiçbir aşamada terminale/loga basılmaz"). Envanter üç soruyu yanıtlar — hangi dosya,
# hangi DEĞİŞKEN ADLARI, bugün hangi kanal — ve dördüncüyü (hangi değer) hiç sormaz.
#
# NEDEN DOSYA. "Envanter" bir belgede kalırsa yalnız OKUNUR; burada MAKİNE OKUNUR hâlde durur ve
# iki yerden zorlanır:
#   (1) `tests/test_sir_credential_v439.py` bu dosyayı spec §1 tablosundan TÜRETİLEN ad listesiyle
#       kıyaslar — spec'e yeni bir sır girer de envanter güncellenmezse çivi öter (ayrışma çivisi,
#       tek-kaynak yasası: aynı gerçeğin iki kopyası sessizce ayrışır);
#   (2) A1 geçiş penceresinde canlı `.env` dosyalarının `cut -d= -f1` ile alınan AD listesi buna
#       karşı kıyaslanır — "belgede olmayan bir sır canlıda duruyor" hâli ancak böyle görülür.
#
# TEK KAYNAK: `kaynak_belge`. Buradaki her satır o belgenin §1 tablosundan türer; tablo değişirse
# ÖNCE orası değişir, sonra burası — ters sıra çiviyi kırar ve doğrusu budur.
#
# SINIFLAR (spec §2 donuk sözlüğü):
#   A · systemd-doğal süreç      → hedef: LoadCredential (sır ortama HİÇ girmez) — TAM kazanım
#   B · docker-sarmalı süreç     → hedef: LoadCredential + ExecStart sarmalayıcı — YARIM kazanım,
#                                   sır konteyner ortamında kalır; dürüstçe beyanlıdır
#   C · hermes profil `.env`     → DEĞİŞMEZ (env_loader sözleşmesi); Faz-2'de Vault Agent kapsar
#   D · yapılandırma (sır değil) → KALIR
# `sir: false` satırları D sınıfıdır: dosyada dururlar ama taşınacak sır DEĞİLDİRLER; faz-2'nin
# "sır dosyası ayrı, ayar dosyası ayrı" ayrımının ölçüsü onlardır.

kaynak_belge: docs/TASARIM-SIR-YOL1-2026-09-03.md
olcum: "2026-09-03 21:5x UTC — A1, yalnız DEĞİŞKEN ADLARI okundu (değer hiçbir terminale basılmadı)"

dosyalar:

  # ---- MOTOR ------------------------------------------------------------------------------------
  # ÖLÇÜM GÜNCELLEMESİ 2026-09-08 10:0xZ + 10:5xZ (spec §1 "ÖLÇÜM GÜNCELLEMESİ" 4. maddesi):
  # bu dosyanın ÜÇ sırrı (NOUS_API_KEY · KAPI_APIKEY · MERIDIAN_DASH_TOKEN) ARTIK BURADA DEĞİL —
  # üçünün de satır sayısı 0 ölçüldü ve sonek taraması (`_TOKEN|_API_KEY|_APIKEY|…`) bu dosyada
  # hiçbir sır adı bulmadı. Faz-1B (NOUS/KAPI → `LoadCredential`,
  # `deploy/oracle-a1/meridian.service.d/53-nous-kapi-credential.conf`) 2026-09-07 gecesi
  # tamamlandı; `MERIDIAN_DASH_TOKEN` `.dash.env` + `/etc/meridian/dash_token` ikilisinde yaşıyor
  # (TSK-049 faz-1) ve spec Bulgu-2'nin istediği "motor `.env`teki kopya kalksın" olmuş durumda.
  # DOSYA SATIRI KALDI: dosya duruyor ve ÜÇ YAPILANDIRMA değişkeni taşıyor — "dosya yok" ile
  # "dosyada sır yok" iki ayrı gerçektir; faz-2'nin "sır dosyası ayrı, ayar dosyası ayrı" ayrımı
  # tam olarak bu hâlin ölçüsüdür. Sınıf "A" KALIR (tüketici systemd-doğal süreçtir), ama artık
  # taşınacak bir sırrı olmadığı için `kanal_hedef` bir HEDEF değil bir BEYANDIR.
  - yol: "/opt/meridian/.env"
    mod: "600"
    sahip: "ubuntu"
    tuketici: "meridian.service"
    sinif: "A"
    kanal_bugun: "EnvironmentFile (yalnız yapılandırma; sır 0 — ölçüldü 2026-09-08 10:5xZ)"
    kanal_hedef: "DEĞİŞMEZ — taşınacak sır kalmadı (Faz-1B tamamlandı 2026-09-07)"
    degiskenler:
      - ad: NOUS_MODEL
        sir: false
      - ad: NOUS_ENDPOINT
        sir: false
      - ad: MERIDIAN_FMP_BASE
        sir: false

  # TSK-049'un faz-1'i BURADA canlı: `LoadCredential=dash_token:/etc/meridian/dash_token`
  # (50-dash-credential.conf). Faz-2 (51-dash-env-kaldir.conf) boş `EnvironmentFile=` ile bu
  # dosyanın okunmasını tümüyle keser — tek amaçlı dosya olduğu için satır silmek gerekmez.
  - yol: "/opt/meridian/.dash.env"
    mod: "600"
    sahip: "ubuntu"
    tuketici: "meridian.service"
    sinif: "A"
    kanal_bugun: "EnvironmentFile + LoadCredential (faz-1 paralel)"
    kanal_hedef: "LoadCredential"
    degiskenler:
      - ad: MERIDIAN_DASH_TOKEN
        sir: true

  # ---- HAFIZA (hindsight-api) --------------------------------------------------------------------
  # ÖLÇÜM GÜNCELLEMESİ 2026-09-08 (spec §1 "ÖLÇÜM GÜNCELLEMESİ" notu): bu dosyanın ÜÇ sırrı
  # (DATABASE_URL · LLM_API_KEY · TENANT_API_KEY) ARTIK BURADA DEĞİL — Faz-1A/LoadCredential
  # geçişi 2026-09-07'de tamamlandı ve üçü aşağıdaki `/etc/hindsight/creds/<AD>` girdisine taşındı.
  # Yerlerine hafıza failover zincirinin ALTI ÜYE anahtarı girdi (2026-09-06, EDG-2026-080/081):
  # zincir üyesi ana anahtarı DEVRALMAZ, her üye kendi satırını okur ve altısı da OpenRouter
  # anahtarının birebir kopyasıdır — yani `sir_rotasyon.sh --openrouter` kapsamındadırlar.
  # SINIF B'YE ÇEKİLDİ: kalan sırların tüketicisi docker-sarmalı hindsight-api'dir ve sır o
  # sürecin ortamında yaşar (yarım kazanım, spec §2). Eski "A" etiketi taşınan üç sır içindi.
  # `ayar_sayisi` 2026-09-03 ölçümüdür ve 2026-09-08'de YENİDEN SAYILMADI (yalnız sır adlarının
  # varlığı ölçüldü) — sayı taşıyan satır ölçüm tarihini taşır.
  - yol: "/opt/hindsight/.env"
    mod: "600"
    sahip: "ubuntu"
    tuketici: "hindsight-api.service"
    sinif: "B"
    kanal_bugun: "EnvironmentFile"
    kanal_hedef: "DEĞİŞMEZ — üye anahtarları `.env`de kalır (B sınıfı, beyanlı); Faz-2'de Vault Agent template"
    ayar_sayisi: 29
    degiskenler:
      - ad: HINDSIGHT_API_REFLECT_LLM_1_API_KEY
        sir: true
      - ad: HINDSIGHT_API_REFLECT_LLM_2_API_KEY
        sir: true
      - ad: HINDSIGHT_API_REFLECT_LLM_3_API_KEY
        sir: true
      - ad: HINDSIGHT_API_CONSOLIDATION_LLM_1_API_KEY
        sir: true
      - ad: HINDSIGHT_API_CONSOLIDATION_LLM_2_API_KEY
        sir: true
      - ad: HINDSIGHT_API_CONSOLIDATION_LLM_3_API_KEY
        sir: true

  # ---- HAFIZA CREDENTIAL KAYNAKLARI (Faz-1A TAMAMLANDI, 2026-09-07) -----------------------------
  # Dosyanın ADI değişkenin ADIDIR: `LoadCredential=<kimlik>:<kaynak>` sözleşmesinde ikisi birebir
  # aynı olmak zorundadır (v439 I6/I9, v447 P6). Bu üç dosya `sir_rotasyon.sh`in de hedefidir
  # (`--tenant`, `--db`, `--openrouter`) — rotasyon systemd'nin OKUDUĞU dosyayı yazmazsa
  # credential ESKİ değerde kalır ve arıza ilk gerçek çağrıda görünür.
  # SINIF B: TENANT bacağı motorda (pano vekili) A sınıfıdır ama aynı dosyayı docker-sarmalı
  # hindsight-api de tüketir; dosya EN ZAYIF kazanımla etiketlenir, yoksa yarım kazanım TAM
  # görünürdü (spec §2 bedel maddesi).
  - yol: "/etc/hindsight/creds/<AD>"
    mod: "0400"
    sahip: "root"
    tuketici: "hindsight-api.service (LoadCredential + ExecStart sarmalayıcı) · meridian.service (pano vekili, yalnız TENANT)"
    sinif: "B"
    kanal_bugun: "LoadCredential"
    kanal_hedef: "LoadCredential (ULAŞILDI); Faz-2'de Vault Agent kaynağı olur"
    degiskenler:
      - ad: HINDSIGHT_API_DATABASE_URL      # parola GÖMÜLÜ — 2026-09-02'de tam bu sınıf terminale düştü
        sir: true
      - ad: HINDSIGHT_API_LLM_API_KEY
        sir: true
      - ad: HINDSIGHT_API_TENANT_API_KEY
        sir: true

  # ---- DOCKER SARMALI (B sınıfı — yarım kazanım, beyanlı) ---------------------------------------
  - yol: "/opt/hindsight/.env-cp"
    mod: "600"
    sahip: "root"
    tuketici: "hindsight-cp.service (docker)"
    sinif: "B"
    kanal_bugun: "docker env-file"
    kanal_hedef: "LoadCredential + ExecStart sarmalayıcı"
    degiskenler:
      - ad: HINDSIGHT_CP_ACCESS_KEY
        sir: true
      - ad: HINDSIGHT_CP_DATAPLANE_API_KEY
        sir: true

  # BULGU-1 (Faz-0'ın tek satırlık işi): bu dosya 640 — GRUP OKUYABİLİR, öteki sır dosyaları 600.
  # docker'ın `EnvironmentFile`ını root okur, grup gerekmez. `faz0_hedef_mod` uygulanınca buradaki
  # `mod` de 600'e çekilir (ölçüm tarihi güncellenerek — sayı taşıyan satır tarih taşır).
  - yol: "/opt/apisix/.env-apisix"
    mod: "640"
    faz0_hedef_mod: "600"
    sahip: "root"
    tuketici: "apisix.service (docker, $env:// çözümü) · ops/apisix_uygula.py (admin anahtarı)"
    sinif: "B"
    kanal_bugun: "EnvironmentFile → docker run env"
    kanal_hedef: "LoadCredential + ExecStart sarmalayıcı"
    degiskenler:
      - ad: APISIX_ADMIN_KEY
        sir: true
      - ad: OPENROUTER_API_KEY
        sir: true
      - ad: OPENROUTER_AUTH
        sir: true
      - ad: PANO_GIRIS_PAROLA
        sir: true
      - ad: BOT_KEY_BEKCI
        sir: true
      - ad: BOT_KEY_KARNE
        sir: true
      - ad: BOT_KEY_SEF
        sir: true
      - ad: BOT_KEY_MERIDIAN
        sir: true

  # ---- HERMES BOT PROFİLLERİ (C sınıfı — DEĞİŞMEZ) ----------------------------------------------
  # `BOT_KEY_<AD>` bir ŞABLONDUR, tek bir değişken değil: her profil kendi `.env`inde kendi adını
  # taşır. İzin ÖLÇÜLMEDİ (spec §1) — "600 sanıyorum" yazmak uydurma olurdu; ölçüldüğü gün girer.
  - yol: "~/.hermes/profiles/<bekci,karne,sef>/.env"
    mod: null                # ölçülmedi (uydurma yasağı: ölçülemeyen değer None + neden)
    sahip: null              # ölçülmedi
    tuketici: "hermes bot birimleri (timer'lı oneshot)"
    sinif: "C"
    kanal_bugun: "HERMES_HOME/.env (hermes env_loader)"
    kanal_hedef: "DEĞİŞMEZ — Faz-2'de Vault Agent template ile kapsanır"
    degiskenler:
      - ad: BOT_KEY_<AD>
        sir: true
      # ÖLÇÜM 2026-09-07 22:0xZ: profillerin her biri OpenRouter anahtarının bir kopyasını da
      # taşıyor. Rotasyon bloğunda 2026-09-08'den beri beyanlıydı, §1'de AÇIK KALEMDİ; spec
      # güncellemesiyle birlikte buraya da girdi (tek-kaynak yasası iki yönlüdür).
      - ad: OPENROUTER_API_KEY
        sir: true

# =================================================================================================
# ROTASYON KOPYALARI — ölçüm 2026-09-07 22:0xZ (A1, elle rotasyon penceresi; yalnız AD ve YOL)
# =================================================================================================
# NİYE AYRI BİR BLOK. Yukarıdaki `dosyalar:` bloğu `kaynak_belge` §1 tablosundan TÜRER ve ona
# çivilenmiştir (v439 E2/E3: dosya ve ad listeleri BİREBİR eşit). Buradaki liste BAŞKA bir gerçeği
# taşır — "bir sırrın DEĞERİ döndüğünde hangi dosyalar aynı pencerede yazılmalı" — ve onun tek
# kaynağı `deploy/oracle-a1/sir_rotasyon.sh --kopyalar` çıktısıdır. İki listeyi tek bloğa
# sıkıştırmak, iki farklı kaynağı tek yerde ayrıştırırdı: §1 tablosu 2026-09-03 ölçümüdür ve
# Faz-1B'nin ürettiği `/etc/*` credential kaynaklarını HENÜZ tanımaz.
#
# ÇİVİ (v447): `--kopyalar` çıktısındaki her `dosya`/`env`/`url` satırı burada olmak ZORUNDA ve
# BURADAKİ her satır orada olmak zorunda — yani iki liste EŞİT. Tek yön (⊆) yeterli değildi:
# betikten bir kopya SİLİNSEYDİ envanter onu taşımaya devam eder, "rotasyon bu dosyayı yazıyor"
# beyanı sessizce yalan olurdu. `api` ve `sql` satırları DOSYA DEĞİLDİR (motor ucu / ALTER ROLE)
# ve bu blokta `tur:` alanlarıyla beyanlı dururlar — kanal beyanı olmadan "envanterde yok" ile
# "dosya değil" aynı görünürdü.
#
# AÇIK KALEM (2026-09-07 · KISMEN KAPANDI 2026-09-08): hermes profillerindeki `OPENROUTER_API_KEY`
# artık `dosyalar:` bloğunda ve §1 tablosunda (spec "ÖLÇÜM GÜNCELLEMESİ" notu). AÇIK KALAN TEK
# SATIR `/opt/hindsight/.key`tir: §2'nin DONUK sınıf sözlüğünde (A/B/C/D) karşılığı yoktur — bir
# kabuk okuyucusunun (`~/bin/hafiza_sor.sh`) düz dosyası ne systemd-doğal (A), ne docker (B), ne
# hermes profili (C), ne de ayar (D). Sözlüğü esnetmek yerine burada beyanla duruyor; sınıf
# ataması spec turunun işidir (Rol-1).

rotasyon_kopyalari:
  olcum: "2026-09-07 22:0xZ — A1, elle rotasyon penceresi (yalnız AD ve YOL okundu; değer basılmadı) · EK 2026-09-08 08:0xZ — /opt/hindsight/.env failover ÜYE anahtarları (altı satır) ölçüldü ve eklendi"
  kaynak_betik: "deploy/oracle-a1/sir_rotasyon.sh"

  kopyalar:
    - alt_komut: kapi
      sir: KAPI_APIKEY
      tur: dosya
      yol: "/etc/meridian/kapi_apikey"
      alan: null
      mod: "400"
      sahip: "root"
      tuketici: "meridian.service (LoadCredential=KAPI_APIKEY)"
    - alt_komut: kapi
      sir: KAPI_APIKEY
      tur: env
      yol: "/opt/apisix/.env-apisix"
      alan: BOT_KEY_MERIDIAN
      mod: null                # korunur (mevcut izin okunur) — bkz. `dosyalar:` bloğundaki satır
      sahip: null
      tuketici: "apisix.service ($env:// çözümü — RESTART gerekir, reload yetmez)"

    - alt_komut: tenant
      sir: HINDSIGHT_API_TENANT_API_KEY
      tur: dosya
      yol: "/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY"
      alan: null
      mod: "400"
      sahip: "root"
      # ÜÇÜNCÜ TÜKETİCİ (TSK-168, kart EDG-2026-089): günlük defter özeti retain birimi. Adı
      # `.service` UZANTISIZ yazılıdır ve bu bir üslup tercihi DEĞİL: N10 çivisi bu alandaki
      # `<ad>.service` eşleşmelerini rotasyonun YENİDEN BAŞLATTIĞI birim listesiyle eşitler, oysa
      # bu birim `Type=oneshot` + timer-tetiklidir ve rotasyon penceresinde restart EDİLMEZ —
      # taze anahtarı bir sonraki tetikte kaynaktan okur (tablosu: `_oneshot_kredensiyeller`).
      tuketici: "hindsight-api.service (50-creds) · meridian.service (54 drop-in) ·
        meridian-defter-ozeti-retain (timer'lı oneshot, 54 drop-in — restart YOK) — AYNI dosya"
    - alt_komut: tenant
      sir: HINDSIGHT_API_TENANT_API_KEY
      tur: dosya
      yol: "/opt/hindsight/.key"
      alan: null
      mod: "600"
      sahip: "ubuntu"
      tuketici: "~/bin/hafiza_sor.sh (kabuk okuyucu; LLM'siz recall)"
      not: "spec §1 tablosunda YOK — açık kalem (yukarıdaki şerh)"
    - alt_komut: tenant
      sir: HINDSIGHT_API_TENANT_API_KEY
      tur: env
      yol: "/opt/hindsight/.env-cp"
      alan: HINDSIGHT_CP_DATAPLANE_API_KEY
      mod: null                # korunur
      sahip: null
      tuketici: "hindsight-cp.service (docker env-file)"

    - alt_komut: db
      sir: HINDSIGHT_DB_PAROLA
      tur: sql
      yol: "hindsight"         # DOSYA DEĞİL: `ALTER ROLE hindsight PASSWORD` (psql -f, sonra silinir)
      alan: null
      mod: null
      sahip: null
      tuketici: "postgres"
    - alt_komut: db
      sir: HINDSIGHT_DB_PAROLA
      tur: url
      yol: "/etc/hindsight/creds/HINDSIGHT_API_DATABASE_URL"
      alan: null
      mod: null                # korunur
      sahip: null
      tuketici: "hindsight-api.service — YALNIZ parola alanı değişir, query korunur"

    - alt_komut: dash
      sir: MERIDIAN_DASH_TOKEN
      tur: dosya
      yol: "/etc/meridian/dash_token"
      alan: null
      mod: "400"
      sahip: "root"
      tuketici: "meridian.service (LoadCredential=dash_token)"
    - alt_komut: dash
      sir: MERIDIAN_DASH_TOKEN
      tur: env
      yol: "/opt/meridian/.dash.env"
      alan: MERIDIAN_DASH_TOKEN
      mod: null                # korunur
      sahip: null
      tuketici: "brifing/learn/sprint@ birimleri (EnvironmentFile, başlangıçta okunur)"

    - alt_komut: openrouter
      sir: NOUS_API_KEY
      tur: dosya
      yol: "/etc/meridian/nous_api_key"
      alan: null
      mod: "400"
      sahip: "root"
      tuketici: "meridian.service (LoadCredential=NOUS_API_KEY)"
    - alt_komut: openrouter
      sir: NOUS_API_KEY
      tur: api
      yol: "/api/secrets/NOUS_API_KEY"   # DOSYA DEĞİL: motor ucu (POST, gövde dosyadan)
      alan: null
      mod: null
      sahip: null
      tuketici: "meridian yerel sır deposu"
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: env
      yol: "/opt/apisix/.env-apisix"
      alan: OPENROUTER_API_KEY
      mod: null                # korunur
      sahip: null
      tuketici: "apisix.service (upstream)"
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: env
      yol: "/opt/apisix/.env-apisix"
      alan: OPENROUTER_AUTH
      onek: "Bearer"           # değerin başına `Bearer ` gelir — tırnak biçimi korunur
      mod: null
      sahip: null
      tuketici: "apisix.service (upstream Authorization başlığı)"
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: dosya
      yol: "/etc/hindsight/creds/HINDSIGHT_API_LLM_API_KEY"
      alan: null
      mod: "400"
      sahip: "root"
      tuketici: "hindsight-api.service (LLM çağrıları)"
    # HAFIZA FAILOVER ZİNCİRİNİN ÜYE ANAHTARLARI — ölçüm 2026-09-08 08:0xZ (A1, yalnız AD okundu).
    # Zincir üyesi ana anahtarı DEVRALMAZ: her üye kendi `_API_KEY` satırını okur ve altısı da
    # OPENROUTER_API_KEY değerinin birebir kopyasıdır. Tabloda olmasalardı rotasyon creds
    # dosyasını döndürür, üyeler ESKİ anahtarla kalır ve eski anahtar iptal edildiği an zincir
    # sessizce birincile düşerdi. `dosyalar:` bloğuna GİRMEZLER: orası spec §1 tablosuna çivili
    # (v439 E3, BİREBİR eşitlik) ve spec bu satırları henüz taşımıyor — açık kalem, Rol-1'e.
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: env
      yol: "/opt/hindsight/.env"
      alan: HINDSIGHT_API_REFLECT_LLM_1_API_KEY
      mod: null                # korunur (dosya 600 ubuntu — `dosyalar:` bloğunda ölçülü)
      sahip: null
      tuketici: "hindsight-api.service (reflect failover zincir üyesi 1)"
      not: "üye ana anahtarı DEVRALMAZ (EDG-2026-080/081); spec §1 tablosunda YOK — açık kalem"
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: env
      yol: "/opt/hindsight/.env"
      alan: HINDSIGHT_API_REFLECT_LLM_2_API_KEY
      mod: null                # korunur (dosya 600 ubuntu — `dosyalar:` bloğunda ölçülü)
      sahip: null
      tuketici: "hindsight-api.service (reflect failover zincir üyesi 2)"
      not: "üye ana anahtarı DEVRALMAZ (EDG-2026-080/081); spec §1 tablosunda YOK — açık kalem"
    - alt_komut: openrouter
      sir: OPENROUTER_API_KEY
      tur: env
      yol: "/opt/hindsight/.env"
      alan: HINDSIGHT_API_REFLECT_LLM_3_API_KEY
