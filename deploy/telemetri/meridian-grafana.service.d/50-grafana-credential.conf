# =================================================================================================
# 50-grafana-credential.conf — Grafana yönetici parolası KASADAN, DOSYA kanalıyla (TSK-020 UYGULA-9 Faz A)
# =================================================================================================
# Tasarım T5 (docs/TASARIM-TELEMETRI-PROMETHEUS-2026-09-28.md). Kaynak `/etc/meridian/grafana_admin_parola`
# Vault Agent'ın RENDER HEDEFİDİR (`deploy/sir_envanteri.yaml` `vault_kv` girdisi `grafana_admin_parola` →
# `ops/vault_politika_uret.py` → `deploy/vault/agent.hcl`). Değer bu dosyada, birimde ya da ortamda YOKTUR.
#
# ---- KURULUM MEKANİZMASI (A0 genel yolu) --------------------------------------------------------
# `dropinler.yml`in genel mekanizması: `defaults/main.yml::dropin_dizinleri` + `dropin_kaynaklari`. Birim
# ETKİN DEĞİLDİR ve rol onu başlatmaz — bu yüzden bu drop-in `zorunlu_sir_dosyalari` kapısına bağlanmadı:
# kaynak yokken kurulması çalışan hiçbir şeyi durdurmaz; yalnız bu birim AÇILAMAZ (aşağıda — doğru yön).
#
# ---- ZİNCİR (halkaların eşitliği v584 C3'te ölçülür) --------------------------------------------
# (1) `LoadCredential=` — systemd kaynağı PID 1 (root) olarak okur ve `%d` (credential dizini) altına koyar.
#     Kaynak YOKSA birim HİÇ BAŞLAMAZ ("Failed to load credential") — parola kasaya konmadan Grafana açılmaz.
# (2) Boşluk kapısı `test -s`: BOŞ bir parola dosyası Grafana'da boş ortam değişkenine, o da VARSAYILAN
#     yönetici parolasına (admin/admin) düşerdi — ilk açılışta hesaba kalıcı yazılırdı. Kapı kopyadan ÖNCE.
# (3) tmpfs kopya: credential dosyası root'a aittir (0400) ve konteyner kullanıcısı (472, imaj yapılandırması)
#     onu OKUYAMAZ. `install` değeri argv'ye koymadan (yalnız YOLLAR) birimin `RuntimeDirectory`sine (tmpfs,
#     0700 root; birim durunca systemd siler) 0400 ve sahibi 472 olarak kopyalar. Değer DİSKE inmez.
#     472/0 A0 `defaults/main.yml::telemetri_grafana_uid/gid` ile AYNI (birim şablonsuz kopyalanır — v584 D3/C3).
# (4) Birim ExecStart'ı kopyayı `--mount …,readonly` ile `/run/secrets/grafana_admin_parola`ya bağlar;
#     Grafana `GF_SECURITY_ADMIN_PASSWORD__FILE` ile okur.
# `%d` bir systemd BELİRTECİDİR (systemd ≥248; A1 Ubuntu 24.04 → 255), kabuk genişlemesi DEĞİL — argv'de
# yalnız yol görünür (v554 sınıfı dışında).
#
# ---- İLK AÇILIŞ SEMANTİĞİ / ROTASYON -------------------------------------------------------------
# Grafana bu değeri YALNIZ veritabanı ilk kurulurken yönetici hesabına yazar. Kasada döndürmek hesabı
# DEĞİŞTİRMEZ — `sir_rotasyon.sh` bu yüzden bu sırrı TAŞIMAZ (`rotasyon_siri` yok); döndürme reçetesi
# `deploy/oracle-a1/RUNBOOK.md` "Telemetri (Grafana) erişimi" bölümünde (grafana cli, değer stdin'den).
[Service]
LoadCredential=grafana_admin_parola:/etc/meridian/grafana_admin_parola
ExecStartPre=/usr/bin/test -s %d/grafana_admin_parola
ExecStartPre=/usr/bin/install -m 0400 -o 472 -g 0 %d/grafana_admin_parola /run/meridian-grafana/grafana_admin_parola
