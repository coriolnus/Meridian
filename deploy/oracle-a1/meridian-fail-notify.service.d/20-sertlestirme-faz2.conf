# =================================================================================================
# 20-sertlestirme-faz2.conf — fail-notify H3 tur-2 FAZ 2 (seccomp + yetenek sıfırlama)
# =================================================================================================
# FAZ 1 kurulup test-ateşlemesi (telefona düşen bildirim) DOĞRULANMADAN KURULMAZ; kurulduktan
# sonra AYNI doğrulama bir kez daha koşulur (10-sertlestirme-faz1.conf ön-şart bloğu — bu birimde
# her faz kendi ateşleme kanıtını ister, çünkü arıza tanım gereği sessizdir).
#
# @system-service ağ syscall'larını (socket/connect) İÇERİR — Telegram/webhook gönderimi kesilmez;
# aynı filtre altında meridian.service her gün ağa çıkıyor (ölçülmüş zemin, aynı python yüzeyi).
# RestrictAddressFamilies BİLEREK YOK: bu birimin tek işi ağa çıkmaktır; aile daraltması ayrı bir
# karar ve ayrı bir ölçümdür, seccomp faz'ına iliştirilmez.
[Service]
CapabilityBoundingSet=
SystemCallFilter=@system-service
