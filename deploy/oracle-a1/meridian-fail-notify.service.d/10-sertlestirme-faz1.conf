# =================================================================================================
# 10-sertlestirme-faz1.conf — fail-notify H3 tur-2 FAZ 1 (HAZIRLIK — ÖN-ŞART DOLMADAN KURULMAZ)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR (LoadCredential drop-in sözleşmesi): `deploy.sh` bu dizini
# kopyalamaz; kurulum `h3_tur2_sertlestir.sh` ile, bakım penceresinde, operatör eliyle.
#
# ÖN-ŞART — birim dosyasındaki "H3 SERTLEŞTİRME — BU BİRİME UYGULANMADI, VE BU BİLİNÇLİ" bloğunun
# hükmü BURADA DA GEÇERLİDİR ve bu drop-in onu İPTAL ETMEZ, sadece dolduğu gün hazır bekler:
# bu birim SON KATMANDIR ve kendi arızasını BİLEREK yutar (`|| true` + `exit 0` +
# `SuccessExitStatus=0 1`) — bir sertleştirme hatası burada TANIM GEREĞİ GÖRÜNMEZDİR. Bu yüzden:
#   (1) journal'da GERÇEK bir başarılı gönderim ("gonderim sonucu: True") doğrulanmadan KURULMAZ —
#       h3_tur2_sertlestir.sh bu ön-şartı journal'dan ÖLÇER, sözle geçmez;
#   (2) kurulumdan hemen sonra elle test-ateşlemesi (systemctl start meridian-fail-notify +
#       operatörün TELEFONUNA düşen bildirim) ile YENİDEN doğrulanır — betik ateşlemeyi koşar,
#       telefona düştüğünü yalnız operatör doğrulayabilir.
# Ölçmeden sertleştirmek bu birimde "sessiz güvenlik ağı" üretir — hiç ağ olmamasından kötüdür.
#
# FAZ 1 KÜMESİ — çekirdek birimlerle aynı sıra. Ölçülen yüzey: `uv run python` (ubuntu olarak) →
# ~/.local/bin/uv okur, ~/.cache/uv'ye yazabilir, /opt/meridian ağacını okur (state/secrets.json
# dahil) ve ağa çıkar (Telegram/webhook).
[Service]
NoNewPrivileges=true
ProtectSystem=strict
PrivateTmp=true
# read-only (true DEĞİL): uv ikilisi ~/.local/bin'de yaşar — tam kapatma ExecStart'ı açılışta keser.
ProtectHome=read-only
# meridian.service:170 ile aynı kümenin daraltılmışı: `~/.hermes` YOK (fail-notify LLM/hermes
# yüzeyine dokunmaz — sprint@ AYRIŞMA-1 gerekçesinin akrabası). `-` öneki: dizin yoksa birim yine
# açılır (taze kurulumda ~/.cache henüz doğmamış olabilir).
ReadWritePaths=/opt/meridian -/home/ubuntu/.cache
