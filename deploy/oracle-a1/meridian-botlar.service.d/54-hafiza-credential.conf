# =================================================================================================
# 54-hafiza-credential.conf — bot ağ geçidinin (MCP `bot_hafizasi_ara`) Hindsight TENANT anahtarı LoadCredential
# kanalına (konuşan filo Parça 1b G3b Task 2, 2026-10-01)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. Kurulumu A0 rolü yapar (`roles/meridian_a1/tasks/dropinler.yml`;
# `defaults/main.yml::dropin_dizinleri` + `dropin_kaynaklari` bu dizini taşır). Birim de ETKİN DEĞİLDİR
# (`etkin_birimler`de yok; etkinleştirme G3c'de, test-ateşlemeden SONRA): `LoadCredential=` kaynağı yoksa systemd
# birimi HİÇ BAŞLATMAZ — bu yüzden bu satırın kurulması, kaynak (`/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY`,
# Faz-1A'dan beri A1'de VAR — Vault Agent render hedefi) ölçülmeden çalışan hiçbir şeyi durdurmaz.
#
# ---- NEDEN ---------------------------------------------------------------------------------------------------------
# MCP `bot_hafizasi_ara` aracı ağ geçidinin ÇOCUĞUdur ve kiracı anahtarını `secrets.credential_oku` ile
# `CREDENTIALS_DIRECTORY=/run/credentials/meridian-botlar.service` üzerinden okur (sohbet profil config'inin
# `mcp_servers.meridian.env`i; yol üretecin `ops/sohbet_profili_uret.py::BOT_CREDENTIAL_DIZINI` sabitinden türer).
# Kanal olmadan araç "credential yok" döner. KİMLİK = SIR ADI: `meridian/secrets.py::HAFIZA_KRED_ADI`.
# Kaynak `meridian.service.d/54-hafiza-credential.conf` ile AYNI dosyadır — iki yol ayrışsaydı aynı sır iki kez
# üretilir ve ilk rotasyonda sessizce ayrışırdı (çivi v604 B7: satır emsalle BİREBİR).
#
# ---- YALNIZ HAFIZA — `API_SERVER_KEY` BURADA YOK ----------------------------------------------------------------------
# Hermes dinleyici anahtarını credential'dan DEĞİL, kök ve profil `.env`lerinden okur: çoklu kipte sır kapsamı PROFİLDİR
# (`agent/secret_scope.py` `get_secret`, `os.environ`a/credential'a düşmez — Rol-1 A1 kaynak ölçümü 2026-09-30). Bu
# birime bir `API_SERVER_KEY` credential'ı okunmayan bir kopya olurdu (Yasa 6) ve rotasyon onu "döndü" sayardı (v604 B8).
#
# ---- ROTASYON ---------------------------------------------------------------------------------------------------------
# `deploy/oracle-a1/sir_rotasyon.sh --tenant`: `_kredensiyeller` tablosunda `tenant meridian-botlar.service …` satırı
# (v447 P6 drop-in ↔ tablo iki yönlü eşitliği). Birim KOŞULLU birimdir (`_KOSULLU_BIRIMLER`): yalnız ETKİNSE yeniden
# başlar ve ancak o zaman `/run/credentials/meridian-botlar.service/<kimlik>` ölçülür; etkin değilse ATLANDI satırı.
#
# TEK YASAK: BOŞ atama (`LoadCredential=`) — listeyi SIFIRLAR (systemd birikimli listeyi boş atamayla temizler).
[Service]
LoadCredential=HINDSIGHT_API_TENANT_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY
