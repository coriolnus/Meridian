# 10-s3-env.conf — litestream S3 kimliği (AŞAMA-2, 2026-08-23)
# Sır zinciri: operatör PANO Ayarlar'a girer → api secrets deposuna (0600) yazar → api iki anahtar
# da mevcutken state/litestream.env (0600) üretir → bu birim onu yükler. `-` öneki BİLİNÇLİ:
# dosya henüz yokken (anahtar girilmeden önceki dağıtım) birim ESKİ yapılandırmayla açılabilsin,
# LoadCredential faz-1 dersinin (kaynak-yokken-ilk-dağıtım) tekrarı yaşanmasın.
[Service]
EnvironmentFile=-/opt/meridian/state/litestream.env
