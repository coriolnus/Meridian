# EMEKLİ — BU DOSYA ARTIK SERTLEŞTİRME TAŞIMIYOR (H3 tur-2, 2026-08-02).
# ══════════════════════════════════════════════════════════════════════════════════════════════
#
# NE İDİ: H3 tur-1'in (2026-07-31) ortak drop-in'i. bakim_h9.sh `[9] H3 sertleştirme drop-in'leri` adımı bu dosyayı hem
# `meridian.service.d/` hem `meridian-barsarchive.service.d/` altına kuruyordu ve maruziyeti
# 9.2 UNSAFE → 6.3 MEDIUM'a indirmişti.
#
# NEDEN EMEKLİ — İKİ ÖLÇÜLMÜŞ SEBEP:
#
# 1) OKUNAMAZ YÜRÜRLÜK. Drop-in bir SKALER direktifi (ProtectHome, ProtectSystem, PrivateTmp) birim
#    dosyasının üstüne SESSİZCE yazar; `ReadWritePaths` ise BİRİKİR. Birim dosyasını açan mühendis
#    yürürlükteki ayarı okuduğunu sanır, oysa okumaz. Sertleştirme artık birim dosyalarının
#    İÇİNDEDİR — tek kaynak, tek okuma.
#
# 2) BU DOSYA CANLIDA SESSİZ BİR KIRIKLIK TAŞIYORDU. `ProtectHome=read-only` vardı ama
#    `ReadWritePaths` yalnız `/opt/meridian /home/ubuntu/.cache` idi — `~/.hermes` YOKTU. Oysa
#    meridian süreci oraya YAZAR (`hermes.py::sync_local_agent_gemini` `.env` mkstemp + model yedeği ·
#    `hermes.py::config_ensure_integrations` `config.yaml` + `.meridian.bak` · `hermes.py::sync_agent_skills` `skills/` mkdir + symlink kur/sök). O yazımların
#    hepsi `except OSError: pass` / `except Exception` altında olduğu için hata GÖRÜNMEDEN yutuldu:
#    ajan skill eşitlemesi ve entegrasyon config'i 2026-07-31'den beri sessiz no-op olmuş olabilir.
#    Tur-2 birimleri `/home/ubuntu/.hermes`i ReadWritePaths'e ekler ve RUNBOOK bunu ölçen bir
#    yazma probu tanımlar.
#
# CANLIDAN NASIL SÖKÜLÜR (RUNBOOK "H3 tur-2" bölümü, adım 2):
#   sudo rm -f /etc/systemd/system/meridian.service.d/sertlestirme.conf \
#              /etc/systemd/system/meridian-barsarchive.service.d/sertlestirme.conf
#   sudo systemctl daemon-reload
#   sudo systemd-analyze cat-config systemd/system/meridian.service   # tek kaynak görünmeli
#
# DOSYA NEDEN SİLİNMEDİ: bakim_h9.sh `[8] yedek unit düzeltmesi` adımı hâlâ onu `scp`liyor. İçeriği boşaltıldı ki yanlışlıkla
# kurulsa bile hiçbir direktif TAŞIMASIN (boş `[Service]` geçerli bir drop-in'dir, no-op'tur).
# Yeni sertleştirme: `meridian.service` · `meridian-barsarchive.service` · `meridian-backup.service`.
[Service]
