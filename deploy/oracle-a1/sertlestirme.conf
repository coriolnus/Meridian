# H3 sertleştirme, tur-1 (dosya-sistemi/ad-alanı; seccomp BİLEREK YOK — ROADMAP H3 notu:
# "filesystem/namespace önce, seccomp en son ve dikkatli"). Hedef: 9.2 UNSAFE → <5 bu turda.
# ReadWritePaths: /opt/meridian (state+defter) ve ~/.cache (uv run önbelleği — ProtectHome
# read-only olduğu için açıkça delinir; uv olmadan servis başlamaz).
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ReadWritePaths=/opt/meridian /home/ubuntu/.cache
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
