# =================================================================================================
# 54-hafiza-credential.conf — günlük defter özeti retain'inin Hindsight TENANT anahtarına systemd
# LoadCredential kanalından erişmesi (TSK-168, kart EDG-2026-089)
# =================================================================================================
# NEDEN. `ops/defter_ozeti_retain.py --uygula` bankaya İKİ çağrı yapar (idempotens GET + retain
# POST) ve ikisi de `Authorization: Bearer <tenant anahtarı>` ister. Kanal olmadan
# `meridian.secrets.credential_oku("HINDSIGHT_API_TENANT_API_KEY")` `None` döner; betik alt kanala
# (`secrets.get` → ortam → `state/secrets.json`) düşer ve A1'de bu ad ORADA DA YOKTUR. Sonuç
# SESSİZ DEĞİLDİR (betik çıkış 1 verip adı stderr'e basar, birim `failed` olur) ama kadans
# HİÇ dolmaz — K1 "7/7 gün" sorusu ilk günden KALDI'ya düşerdi.
#
# ---- KURULUM MEKANİZMASI (A0 genel yolu, elle geçiş YOK) ----------------------------------------
# TSK-176 A0'dan beri drop-in kurulumu `deploy/ansible/roles/meridian_a1/tasks/dropinler.yml`in
# GENEL mekanizmasıdır: `defaults/main.yml::dropin_dizinleri` (hedef dizin) + `dropin_kaynaklari`
# (kaynak glob) listelerine bu dizin eklendiği an `site.yml` HER koşumda bu dosyayı
# `/etc/systemd/system/meridian-defter-ozeti-retain.service.d/54-hafiza-credential.conf`a kopyalar
# ve handler `daemon-reload` tetikler. Çivi: `tests/test_ansible_a0_v451.py` (Çivi 2b, iki yönlü
# eşitlik) + `tests/test_defter_ozeti_retain_v464.py` (bölüm (g)).
#
# ---- BEDEL --------------------------------------------------------------------------------------
# `LoadCredential=` KAYNAK DOSYASI YOKSA birim HİÇ BAŞLAMAZ ("Failed to load credential"). Bu
# birimde bedel düşüktür ve ölçülüdür: kaynak canlıda ZATEN VAR (Faz-1A'dan beri, `sir_envanteri`
# satırı) VE birim `Type=oneshot` + timer-tetiklidir — kaynak bir gün silinirse etkisi ilk retain
# koşumunda `failed` olarak görünür (okuyucu: timer'ın `Persistent=true` telafisi + `/api/infra`,
# Yasa 6), `meridian.service`in her zaman-açık sürecini DÜŞÜRMEZ.
#
# ---- AYNI KAYNAK, ÜÇ BAĞIMSIZ TÜKETİCİ ----------------------------------------------------------
# `/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY` artık ÜÇ birimin `LoadCredential`ıdır:
# `hindsight-api.service` (50-creds), `meridian.service` (54 drop-in) ve BU birim. systemd
# `LoadCredential=` birim-BAŞINADIR: her biri kaynağı BAĞIMSIZ okur, kendi `$CREDENTIALS_DIRECTORY`
# kopyasını alır; biri ötekini SİLMEZ/ETKİLEMEZ (`deploy/sir_envanteri.yaml` tüketici satırı).
#
# ---- ROTASYON -----------------------------------------------------------------------------------
# `deploy/oracle-a1/sir_rotasyon.sh::_oneshot_kredensiyeller` bu birimi ONESHOT tabloda taşır:
# rotasyon penceresi timer'lı oneshot birimleri YENİDEN BAŞLATMAZ (restart+`/run/credentials`
# doğrulaması burada uygulanamaz — birim koşmuyor); birim taze anahtarı BİR SONRAKİ tetikte okur.
# Aynı karar hermes profilleri ve `meridian-brifing.service` için de verilmişti. Çivi: v447 P6.
#
# ---- User=ubuntu ve İZİN ------------------------------------------------------------------------
# Kaynak root:root 0400 KALIR — servis kullanıcısı (`User=ubuntu`) dosyaya HİÇ erişmez ve erişmesi
# GEREKMEZ: systemd sırrı PID 1 (root) olarak okur ve `$CREDENTIALS_DIRECTORY/...` altına ubuntu'nun
# okuyabileceği izinle kopyalar — sır diske hiç düşmez, `/proc/<pid>/environ`da hiç görünmez
# (gerekçenin tamamı `meridian.service.d/53-nous-kapi-credential.conf`ta).
#
# ---- KİMLİK = SIR ADI ---------------------------------------------------------------------------
# `LoadCredential=<kimlik>:<kaynak>` sözleşmesinde kimlik `$CREDENTIALS_DIRECTORY` altındaki DOSYA
# ADIDIR ve o ad `secrets.credential_oku`nun aradığı ADIN BİREBİR AYNISI olmalıdır. Ayrışsaydı
# okuyucu dosyayı bulamaz, kanal SESSİZCE ölür ve alt kanallara düşerdi.
[Service]
LoadCredential=HINDSIGHT_API_TENANT_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY
