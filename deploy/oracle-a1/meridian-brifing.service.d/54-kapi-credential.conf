# =================================================================================================
# 54-kapi-credential.conf — brifing denetçisinin KAPI_APIKEY'e systemd LoadCredential kanalından
# erişmesi (TSK-138 dilim-2, 2026-09-08; inceleme bulgusu B-1)
# =================================================================================================
# NEDEN. `ops/sef_brifingi.py --uygula`nın kural denetçisi (TSK-138 dilim-2: "hızlı model + ölçüm"
# kararı) kapıya (KAPI ai-proxy-multi) DOĞRUDAN bir HTTP çağrısı yapacak — bugün model rotasını
# `ai-proxy-multi` kapının kendisi belirliyor, denetçi yalnız kimliğini taşımalı. BUGÜN bu birimde
# ne `LoadCredential` ne `EnvironmentFile` var (şerh 2026-08-29 tarihli, KİMLİK bölümünde: bu bir
# eksiklik değil ÖLÇÜLMÜŞ bir sonuçtu — o ölçüm `secrets.json`daki Telegram kimliği İÇİNDİ, KAPI
# İÇİN DEĞİL). Kanal olmadan `meridian.secrets.credential_oku("KAPI_APIKEY")` sessizce `None`
# döner ve `secrets.get` alt kanallara (env → dosya) düşer; ikisi de bu birimde TANIMSIZDIR — yani
# çağrı sessizce anahtarsız gider ve denetçi ölçümü SIFIRDA kalır (inceleme bulgusu B-1: "düzeltilmezse
# denetçi sessizce eski yola düşer").
#
# ---- KURULUM MEKANİZMASI, 53/54 (meridian.service.d) İLE FARKLI ------------------------------
# 53-nous-kapi-credential.conf / 54-hafiza-credential.conf TEK SEFERLİK bir geçiş betiğiyle
# (`sir_credential_gecis.sh --faz1…`) elle kuruldu, çünkü o betik kaynak dosya YOKKEN kurmayı
# REDDediyordu ve TSK-176 A0 rolü henüz yoktu. BU dosya farklı bir yoldan gider: TSK-176 A0'dan
# beri drop-in kurulumu `deploy/ansible/roles/meridian_a1/tasks/dropinler.yml`in GENEL
# mekanizmasıdır — `defaults/main.yml::dropin_dizinleri` (hedef dizin) + `dropin_kaynaklari`
# (kaynak glob) listelerine bu dizin eklendiği an `site.yml` HER koşumda bu dosyayı
# `/etc/systemd/system/meridian-brifing.service.d/54-kapi-credential.conf`a kopyalar + handler
# `daemon-reload` tetikler (elle bir alt-komut YOK, tek seferlik bir geçiş de YOK). Kaynak dosya
# zaten VAR (`/etc/meridian/kapi_apikey`, root 0400, 48 B — Faz-1B'den beri, 53'ün ölçtüğü aynı
# dosya) — yani bu drop-in kurulduğu an motoru düşürecek bir "kaynak henüz yok" penceresi YOKTUR.
#
# ---- BEDEL (aynı kapı, gerekçesi 53'te uzun uzun yazılı; burada özet) --------------------------
# `LoadCredential=` KAYNAK DOSYASI YOKSA birim HİÇ BAŞLAMAZ ("Failed to load credential"). Bu
# birimde bunun bedeli düşüktür: kaynak zaten canlıda var VE birim `Type=oneshot` + timer-tetikli
# (`meridian-brifing.timer`) — kaynak bir gün silinirse ETKİSİ ilk brifing koşumunda `failed`
# görünür (okuyucusu `meridian-brifing.timer`in `Persistent=true` telafisi + `/api/infra`; Yasa 6),
# meridian.service'in her zaman-açık sürecini düşürmez.
#
# ---- AYNI KAYNAK, İKİ BAĞIMSIZ TÜKETİCİ ---------------------------------------------------------
# `/etc/meridian/kapi_apikey` artık İKİ birimin `LoadCredential`ıdır: `meridian.service` (53) ve
# bu birim. systemd `LoadCredential=` birim-BAŞINADIR: her ikisi kaynağı BAĞIMSIZ okur, kendi
# `$CREDENTIALS_DIRECTORY`sine kopyalar; biri ötekini SİLMEZ/ETKİLEMEZ. Aynı örüntü zaten
# `hindsight-api.service.d/50-creds.conf` ↔ `meridian.service.d/54-hafiza-credential.conf`
# çiftinde kurulu (tek kaynak, iki bağımsız tüketici; ölçüldü, `sir_envanteri.yaml` satırı).
#
# ---- User=ubuntu ve İZİN --------------------------------------------------------------------
# Kaynak `/etc/meridian/kapi_apikey` root:root 0400 KALIR — bu birimin servis kullanıcısı
# (`User=ubuntu`, üstteki `[Service]` bloğunda) dosyaya HİÇ erişmez ve erişmesi GEREKMEZ:
# systemd sırrı PID 1 (root) olarak okur ve `$CREDENTIALS_DIRECTORY/KAPI_APIKEY`e (`/run/
# credentials/meridian-brifing.service/KAPI_APIKEY`) ubuntu'nun okuyabileceği izinle kopyalar —
# sır diske hiç düşmez, `/proc/<pid>/environ`da hiç görünmez (gerekçenin tamamı 53'te).
#
# ---- KİMLİK = SIR ADI ---------------------------------------------------------------------------
# `LoadCredential=KAPI_APIKEY:/etc/meridian/kapi_apikey` — kimlik `secrets.credential_oku`nun
# aradığı ADIN BİREBİR AYNISI olmalı (53'ün ölçtüğü kural, aynen burada geçerli).
#
# ---- ÇİVİLER --------------------------------------------------------------------------------
# `tests/test_ansible_a0_v451.py` (Çivi 2b: `dropin_dizinleri` bu dizini kapsar; drop-in
# kaynak↔hedef iki yönlü eşitliği) + `deploy/ansible/dagit.yml` `[1c]` (yalnız üst-düzey
# `*.service` dosyalarını karşılaştırır — bu drop-in [1c]'nin TARAMA YÜZEYİ DIŞINDADIR, ayrı
# ölçüldü, rapor bu turun devir notunda).
[Service]
LoadCredential=KAPI_APIKEY:/etc/meridian/kapi_apikey
