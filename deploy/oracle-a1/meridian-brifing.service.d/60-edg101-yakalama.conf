# 60-edg101-yakalama.conf — EDG-2026-101 brifing denetimi girdisinin İLERİYE DÖNÜK yakalanması (TSK-200;
# kart rol1_notu_2026_09_16). Üç brifing biriminde (bekci · brifing · karne) BİREBİR AYNI dosya — çivi v516.
# Yazan: ops/soul_denetimi.py yakalama bölümü (`gecir` başına tam bir satır); okuyan: EDG-2026-101 ölçüm kodu.
# Dizin /opt/veri: repo/state DIŞI (dagit --delete'ten korunur; kart kill-list: ölçüm canlı defterlere yazmaz).
# NEDEN ReadWritePaths: birim ProtectSystem=strict ile koşar ve yalnız /opt/meridian + kendi hermes profili
#   yazılabilirdir; izin verilmezse /opt/veri salt-okur kalır ve yakalama HER koşumda düşer.
# NEDEN `-` öneki: dizin yoksa öneksiz ReadWritePaths birimin AÇILMASINI engeller (namespace kurulamaz) →
#   brifing TESLİM EDİLMEZ. `-` ile birim açılır, yakalama `edg101_yakalama_dustu` uyarısıyla düşer.
#   Brifing teslimi yakalamaya ASLA bağlanmaz. Dizini A0 rolü kurar (tasks/dizinler.yml, 0700).
[Service]
Environment=MERIDIAN_EDG101_YAKALAMA_DIZIN=/opt/veri/olcum/edg101/yakalama
ReadWritePaths=-/opt/veri/olcum/edg101/yakalama
