# =================================================================================================
# 20-sertlestirme-faz2.conf — tick-watchdog H3 tur-2 FAZ 2 (seccomp + yetenek sıfırlama)
# =================================================================================================
# FAZ 1 DOĞRULANMADAN KURULMAZ (LoadCredential faz sözleşmesinin aynısı: 50→51 sırası nasıl
# tersine çevrilemezse 10→20 de çevrilemez). Seccomp EN SON ve dikkatli (ROADMAP H3):
# @system-service dışında kalan bir syscall süreci EPERM'le değil ANINDA ölümle keser ve arıza
# şekli "bekçi hiç konuşmadı"dır — bekçinin kendisi susarsa bunu ancak OnUnitActiveSec ritminin
# journal'dan kesilmesi gösterir. Sertleştirilmiş altı çekirdek birimde aynı filtre 2026-08-02'den
# beri canlı (ölçülmüş zemin); ama o birimler python/uv yüzeyi, bu birim bash+systemctl yüzeyi —
# zemin AYNI DEĞİL, o yüzden doğrulama adımı pazarlıksız.
#
# DİKKAT KALEMİ — BEKLENTİ, ÖLÇÜM DEĞİL (burada beyan, uydurma yasağı): birim ROOT koşar ve
# `systemctl restart`ı D-Bus üzerinden ister; yetkiyi polkit UID'den verir, yetenekten değil —
# yani CapabilityBoundingSet= (boş) tetiği KIRMAMALIDIR. Bu cümle canlıda henüz SINANMADI.
# ── 2026-08-23 CANLI ÖLÇÜM (tetik-testi bunu YAKALADI — varlık sebebi buydu): tetik değil OKUMA
# kırıldı: birim ROOT koşar ama boş küme CAP_DAC_READ_SEARCH'ü de söker → ubuntu'ya ait 0600
# `scheduler_status.json` root'a EACCES döndü, bekçi iki koşumda ÖLÇÜLEMEDİ dedi (10:40:41 normal
# eşik + 10:41:07 test; fail-open sözleşmesi doğru işledi, restart atılmadı). Düzeltme: kümeye
# YALNIZ salt-okuma DAC yeteneği geri konur — yazma/ptrace/mknod vb. hâlâ yasak.
# Faz 2 kurulduktan sonra AYNI pencerede zorlamalı ateşleme ŞARTTIR:
#   h3_tur2_sertlestir.sh --tetik-testi meridian-tick-watchdog
# (meridian'ı GERÇEKTEN restart eder — yalnız bakım penceresinde; betik geçici eşiği runtime
# drop-in'le kurar ve söker, kalıcı hiçbir şey bırakmaz). Journal'da "yeniden başlatılıyor" +
# meridian'ın yeni ActiveEnterTimestamp'ı görülmeden bu faz YÜRÜRLÜKTE SAYILMAZ. Doğrulanmadan
# bırakılan seccomp, bekçiyi sessizce öldürmenin en kibar yoludur.
[Service]
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
SystemCallFilter=@system-service
