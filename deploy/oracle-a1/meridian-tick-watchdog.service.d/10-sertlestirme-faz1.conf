# =================================================================================================
# 10-sertlestirme-faz1.conf — tick-watchdog H3 tur-2 FAZ 1 (dosya-sistemi/temel küme; seccomp YOK)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR (LoadCredential drop-in'leriyle aynı sözleşme —
# meridian.service.d/50-dash-credential.conf): `deploy.sh` birimleri tek tek `cp`ler ve bu dizini
# KOPYALAMAZ. Kurulum `h3_tur2_sertlestir.sh` ile, bakım penceresinde, operatör eliyle.
#
# NEDEN — H3 tur-2'nin kalan yüzeyi (ROADMAP WP6, ölçüm 2026-08-23): altı çekirdek birim
# (meridian · barsarchive · backup · learn · litestream · sprint@) sertleştirmeyi 2026-08-02'den
# beri BİRİM DOSYASININ İÇİNDE taşıyor; tick-watchdog o turun dışında kaldı. Üstelik biriminde
# `User=` satırı YOK, yani ROOT koşuyor — filodaki en yetkili ve en az kısıtlı birim buydu.
#
# NEDEN DROP-IN, BİRİM İÇİNE DEĞİL (sertlestirme.conf mezar taşının "drop-in yürürlüğü okunmaz
# kılar" hükmüne rağmen — BİLİNÇLİ): (1) fazlı kurulum/geri alma tek dosya silmek kadar ucuz
# olmalı, çünkü seccomp EN SON ve dikkatli girer (ROADMAP H3 sırası); (2) mevcut birim dosyası bu
# turda DEĞİŞTİRİLMEZ (tur ayrıklığı — [1c] kapısı yürürlükteki /etc kopyasıyla farkı zaten
# raporlar). Fazlar bir bakım penceresi boyunca doğrulanıp KALICI olduğunda yönergeleri birimin
# içine taşımak ayrı, bilinçli bir turdur — mezar taşının hükmü o gün uygulanır.
#
# FAZ 1 KÜMESİ — ROADMAP sırası: "NoNewPrivileges/ProtectSystem=strict/PrivateTmp/ProtectHome
# önce; seccomp EN SON". Betiğin ölçülen yüzeyi (tick_watchdog.sh): /proc/uptime + systemctl
# (D-Bus) + /opt/meridian/state SALT-OKUMA + python3/awk — diske TEK yazım yok (journal'a konuşur).
[Service]
NoNewPrivileges=true
ProtectSystem=strict
PrivateTmp=true
# ProtectHome=true (çekirdek birimlerdeki read-only DEĞİL): betik ev dizinine hiç dokunmaz.
# Çekirdekteki read-only, uv/~/.local/bin içindir; o gerekçe burada yok — daha sıkı değer bedava.
ProtectHome=true
# ReadWritePaths BİLEREK YOK: betik diske yazmaz. Beklenmedik bir yazım EROFS/EACCES ile düşer ve
# journal'da görünür — betik `set -uo pipefail` taşır, sessiz yutulmaz (ÖLÇÜLEMEDİ dalı ayrıca
# restart TETİKLEMEZ, yani sertleştirme arızası izlenen sürece bulaşmaz).
#
# DOĞRULAMA (kurulumdan hemen sonra, AYNI pencerede — "kurdum" ≠ "yürürlükte", [1c] dersi):
#   sudo systemctl start meridian-tick-watchdog && journalctl -u meridian-tick-watchdog -n 5
#   → "ilerleme var" / YAS / ÖLÇÜLEMEDİ satırlarından biri görünmeli; EROFS/EACCES görünürse
#     --geri-al ve gerekçe MERIDIAN_ENGINEERING_LOG'a.
# GERİ ALMA: h3_tur2_sertlestir.sh --geri-al meridian-tick-watchdog (dosya silinir + daemon-reload).
