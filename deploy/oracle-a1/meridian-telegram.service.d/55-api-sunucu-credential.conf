# =================================================================================================
# 55-api-sunucu-credential.conf — Telegram dinleyicisinin bot ağ geçidi anahtarı (`API_SERVER_KEY`) LoadCredential
# kanalına (konuşan filo Parça 1b G3b Task 2, 2026-10-01)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. Kurulumu A0 rolü yapar (`roles/meridian_a1/tasks/dropinler.yml`). Birim de
# ETKİN DEĞİLDİR (G3c). KAYNAK BUGÜN YOK: `/etc/meridian/api_server_key` yeni bir sırdır (2026-09-30 ölçümü) — ilk değer
# kasaya RUNBOOK borusuyla konur ve Vault Agent render eder (`deploy/sir_envanteri.yaml` `vault_kv.api_server_key`).
# `LoadCredential=` kaynağı yokken systemd birimi BAŞLATMAZ ("Failed to load credential"): bu satır etkin olmayan bir
# birimde zararsızdır ve birimi etkinleştirmenin ön koşulu kaynağın render edilmiş olmasıdır (G3b canlı reçetesi).
#
# ---- NEDEN ---------------------------------------------------------------------------------------------------------
# `meridian/bot_kanal.py::HermesTasiyici` ağ geçidine her soruyu `Authorization: Bearer <API_SERVER_KEY>` ile gönderir ve
# anahtarı YALNIZ credential kanalından okur (`secrets.credential_oku("API_SERVER_KEY")` — kimlik o literalden; v604 B7).
# Değer bot ağ geçidinin kök + sohbet profili `.env`lerindeki kopyalarla AYNIDIR (Hermes PROFİL kapsamı): dördü ve bu
# kaynak `sir_rotasyon.sh --api-sunucu` ile AYNI pencerede döner.
#
# ---- ROTASYON ---------------------------------------------------------------------------------------------------------
# `_kredensiyeller` tablosunda `api-sunucu meridian-telegram.service API_SERVER_KEY` satırı (v447 P6); kaynak kopya
# tablosunun REFERANS satırıdır (P6 üçüncü ayak: kaynak ⊆ `dosya` hedefleri). Birim KOŞULLU birimdir: yalnız ETKİNSE
# yeniden başlar ve `/run/credentials/meridian-telegram.service/API_SERVER_KEY` ölçülür.
#
# TEK YASAK: BOŞ atama (`LoadCredential=`) — listeyi SIFIRLAR ve 54'ün kimliğini sessizce düşürürdü.
[Service]
LoadCredential=API_SERVER_KEY:/etc/meridian/api_server_key
