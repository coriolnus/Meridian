# =================================================================================================
# 54-hafiza-credential.conf — Telegram dinleyicisinin (dönüş kaydı, `bota_sor` → `HindsightHafiza`) Hindsight TENANT
# anahtarı LoadCredential kanalına (konuşan filo Parça 1b G3b Task 2, 2026-10-01)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. Kurulumu A0 rolü yapar (`roles/meridian_a1/tasks/dropinler.yml`;
# `defaults/main.yml::dropin_dizinleri` + `dropin_kaynaklari` bu dizini taşır). Birim de ETKİN DEĞİLDİR (G3c):
# `LoadCredential=` kaynağı yoksa systemd birimi HİÇ BAŞLATMAZ — kaynak Faz-1A'dan beri A1'de VAR (Agent render hedefi).
#
# ---- NEDEN ---------------------------------------------------------------------------------------------------------
# `meridian/bot_hafiza.py::HindsightHafiza` kiracı anahtarını HER çağrıda `secrets.credential_oku(secrets.HAFIZA_KRED_ADI)`
# ile okur — YALNIZ credential kanalı (ortam/`state/secrets.json` geri düşüşü YOK); kanal olmadan dönüş kaydı HTTP'den
# önce `anahtar_yok` olur. KİMLİK = SIR ADI (`meridian/secrets.py::HAFIZA_KRED_ADI`); kaynak
# `meridian.service.d/54-hafiza-credential.conf` ile AYNI dosya (çivi v604 B7: satır emsalle BİREBİR).
# Dinleyici anahtarı (`API_SERVER_KEY`) AYRI dosyadadır (`55-api-sunucu-credential.conf`): iki sır iki ayrı rotasyon alt
# komutuyla döner (`--tenant` · `--api-sunucu`) ve dosya başına tek sır, birinin geri alımını ötekine bağlamaz.
#
# ---- ROTASYON ---------------------------------------------------------------------------------------------------------
# `deploy/oracle-a1/sir_rotasyon.sh --tenant`: `_kredensiyeller` tablosunda `tenant meridian-telegram.service …` satırı
# (v447 P6). Birim KOŞULLU birimdir: yalnız ETKİNSE yeniden başlar ve credential ölçülür; değilse ATLANDI satırı.
#
# TEK YASAK: BOŞ atama (`LoadCredential=`) — listeyi SIFIRLAR ve 55'in kimliğini sessizce düşürürdü.
[Service]
LoadCredential=HINDSIGHT_API_TENANT_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY
