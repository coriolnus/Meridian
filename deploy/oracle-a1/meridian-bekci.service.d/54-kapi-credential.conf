# =================================================================================================
# 54-kapi-credential.conf — meridian-bekci.service: brifing denetçisinin KAPI_APIKEY'e systemd LoadCredential
# kanalından erişmesi (TSK-138 dilim-2 TAMAMLAMA, 2026-09-12)
# =================================================================================================
# NEDEN. Dilim-2 (2026-09-08) kapı rotasını ve bu drop-in'i yalnız `meridian-brifing.service`e
# (@sef) kurdu. ÖLÇÜM (A1 `state/events.jsonl`, 2026-09-09/10 10:0xZ): bu birimin denetçisi hâlâ
# hermes profil yolunda "150 sn'de bitmedi" ile düşüyordu — hem kod (`cagir=_profili_cagir`) hem
# kanal eksikti. Kod `ops/denetci_rota.py`ye taşındı; kanal bu dosyayla açılır. Gerekçenin tamamı
# (kurulum mekanizması = A0 rolü `dropinler.yml`; bedel; aynı kaynak-bağımsız tüketici; User=ubuntu
# ve izin; kimlik = sır adı) `meridian-brifing.service.d/54-kapi-credential.conf`ta — bu dosya o
# sözleşmenin AYNI satırlık kopyasıdır ve çivi (v462) üç dosyada satırın aynı olduğunu ölçer.
# Rotasyon: `sir_rotasyon.sh::_oneshot_kredensiyeller` bu birimi de listeler (sonraki tetikte okur).
[Service]
LoadCredential=KAPI_APIKEY:/etc/meridian/kapi_apikey
