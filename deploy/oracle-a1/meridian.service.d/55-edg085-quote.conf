# 55-edg085-quote.conf — EDG-2026-085 Senaryo-A icra-anı quote kaydı (pilot bayrağı; kart adim_0_kaydi_2026_09_13).
# PİLOT AÇIK (Rol-1, 2026-09-21 23:19Z; kart pilot_kaydi_2026_09_22): 0→1. Tavan aşılırsa (healthz_max p95 > 51,90 ms ya da CPU +5pp) 1→0 ve restart.
# Tarihçe: kod 2026-09-14 dağıtımıyla bayrak KAPALI indi; CPU tabanı 5 seans 09-18'de doldu; TSK-208 gece kanıtı 09-21 22:00Z.
# Kayıt dizini /opt/veri (repo/state DIŞI; dagit --delete'ten korunur; kill#4). Yazan: meridian/quotecapture.py (motor);
#   okuyan: research/olcumler/edg085_icra_ani_quote/rapor.py (Rol-1, aynı kullanıcı).
# DÜZELTME (TSK-225, 2026-09-25): bu satır eskiden "Dizin yoksa quotecapture kendisi kurar" diyordu — YANLIŞTI.
#   meridian.service ProtectSystem=strict ile koşar; ad alanında yalnız birimin kendi ReadWritePaths'i
#   (/opt/meridian · ~/.cache · ~/.hermes) yazılabilirdir, /opt/veri SALT-OKURDUR ve `store.append_jsonl`in
#   mkdir'i orada EROFS ile düşer. Pilotun ilk canlı seansı (2026-09-25, 13:34:25Z `quote_capture_yazim_dustu`
#   "Read-only file system: '/opt/veri/olcum/edg085/kayit'") bu yüzden KAYITSIZ geçti; dizin A1'de yoktu.
# NEDEN ReadWritePaths: izin verilmezse dizin var olsa bile salt-okur kalır ve her quote yazımı düşer.
# NEDEN `-` öneki: dizin yoksa öneksiz ReadWritePaths birimin AÇILMASINI engeller (namespace kurulamaz) →
#   MOTOR (işlem döngüsü + pano) AÇILMAZ. `-` ile motor açılır, kayıt `quote_capture_yazim_dustu` uyarısıyla
#   düşer. Motorun açılması ölçüm kaydına ASLA bağlanmaz. Bedeli: dizin yokluğu birimi düşürmez ama kaydı
#   yine düşürür — bu yüzden dizini A0 rolü kurar (tasks/dizinler.yml, 0700), birim kuramaz.
# BİRİKME: ReadWritePaths drop-in'de BİRİKİR — birimin kendi listesine EKLENİR, onu ezmez (boş
#   `ReadWritePaths=` ise listeyi SIFIRLAR ve motorun state/ iznini düşürürdü: bu dosyada YASAK). Skaler
#   sertleştirme direktifleri (ProtectSystem, ProtectHome, …) bu dosyaya KONMAZ: drop-in skaleri birimin
#   değerini sessizce ezer (meridian.service H3 tur-2 şerhi).
# Çiviler: tests/test_sertlesmis_birim_yazim_yolu_v553.py — SINIF (strict birimde ortamla verilen her yazım
#   yolu ReadWritePaths kapsamında; ReadWritePaths'teki her /opt/veri yolu için dizinler.yml görevi) + bu örnek.
[Service]
Environment=MERIDIAN_QUOTE_CAPTURE=1
Environment=MERIDIAN_EDG085_KAYIT_DIZIN=/opt/veri/olcum/edg085/kayit
ReadWritePaths=-/opt/veri/olcum/edg085/kayit
