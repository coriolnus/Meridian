# =================================================================================================
# 50-dash-credential.conf — pano token'ı systemd LoadCredential kanalına (WP-H/H3 tur-3, 2026-08-03)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. `deploy.sh` birimleri tek tek `cp`ler ve bu dizini
# KOPYALAMAZ — kurulumu `dash_token_credential.sh` yapar, bakım penceresinde, operatör eliyle.
# Bilerek böyle: `LoadCredential=` kaynak dosyası YOKSA systemd birimi BAŞLATMAZ (hata: "Failed to
# load credential"). Yani bu satırı doğrudan meridian.service'e yazmak, /etc/meridian/dash_token
# henüz üretilmemişken koşacak İLK dağıtımda canlı panoyu düşürürdü — hazırlığın kendisi arıza
# olurdu. Drop-in, satırı canlıya değmeden VERSİYONA almanın yoludur.
#
# ---- NEDEN EnvironmentFile YETMİYOR (tur-1/2'nin kapatmadığı kalan yüzey) ----------------------
# Tur-1 gerçek bir sınıfı kapattı: token 0644'lük birim dosyasından çıkıp 0600'lük `.dash.env`e
# taşındı — makinedeki her kullanıcı artık onu DOSYADAN okuyamıyor. Kalan yüzey DOSYA değil SÜREÇ
# ORTAMIDIR ve bu depoda ortam ÇOCUKLARA AKAR; iki yol ÖLÇÜLDÜ:
#   * `serve.sh:51` uvicorn'u açıkça `env=os.environ` ile doğurur;
#   * `hermes_composite.py:341` ajan alt süreçlerini `subprocess.Popen(cmd, ...)` ile başlatır —
#     ortam devralınır.
# Yani `MERIDIAN_DASH_TOKEN` bugün pano sürecinin VE onun doğurduğu her LLM ajan sürecinin
# `/proc/<pid>/environ`ında duruyor. O dosya süreç sahibine (ubuntu) okunurdur — token'ı 0600 bir
# dosyada saklayıp aynı token'ı ubuntu olarak koşan her alt sürecin ortamına dağıtmak, kilidi
# takıp anahtarı kapının üstüne bırakmaktır.
#
# LoadCredential bunu YAPISAL olarak kapatır: sır ortama HİÇ girmez. systemd onu PID 1 olarak
# (yani sandbox'tan ÖNCE) okur, `$CREDENTIALS_DIRECTORY` altına 0400/servis-kullanıcısı izinleriyle
# bir tmpfs dosyası olarak koyar ve süreç sona erince siler. Diske düşmez, `environ`da görünmez.
#
# ---- İKİ FAZLI GEÇİŞ — BU DOSYA FAZ 1'DİR ------------------------------------------------------
# Faz 1 (bu dosya): kanal EKLENİR, `EnvironmentFile` KALIR. İki kanal aynı anda canlıdır ve
#   uygulama credential'ı TERCİH eder, yoksa ortama düşer. Uygulama tarafı henüz güncellenmemişse
#   davranış BİREBİR bugünküdür — yani bu faz TEK BAŞINA kurulsa bile hiçbir şeyi bozmaz.
# Faz 2 (`51-dash-env-kaldir.conf`): ortam kanalı KAPATILIR. YALNIZ faz 1 doğrulandıktan VE
#   uygulama tarafı credential'ı gerçekten okuduktan sonra. Sıra tersine çevrilirse token ortadan
#   kalkar ve operatör/CLI panodan kilitlenir (yüzey açılmaz — `MERIDIAN_BIND_HOST=127.0.0.1`
#   kapısı yerinde durur — ama erişim kaybı da bir arızadır).
#
# KAYNAK DOSYA BİÇİMİ: `/etc/meridian/dash_token` YALNIZ token'ı içerir (`KEY=VALUE` DEĞİL, sondaki
# yeni satır serbest). LoadCredential dosyanın TAMAMINI değer olarak taşır; `.dash.env`in
# `MERIDIAN_DASH_TOKEN=...` biçimi buraya olduğu gibi konsaydı değer önekiyle birlikte okunurdu.
# İzin: root:root 0400 — systemd onu PID 1 olarak okur, servis kullanıcısının erişmesi GEREKMEZ.
[Service]
LoadCredential=dash_token:/etc/meridian/dash_token
