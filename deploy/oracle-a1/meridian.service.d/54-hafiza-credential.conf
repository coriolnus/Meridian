# =================================================================================================
# 54-hafiza-credential.conf — pano vekilinin Hindsight TENANT anahtarı LoadCredential kanalına
# (TSK-064 YOL-1 Faz-1A / spec Bulgu-3, 2026-09-07)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. Kurulumu `sir_credential_gecis.sh --faz1-hafiza` yapar,
# bakım penceresinde, operatör eliyle — ve o alt komut kaynak dosya YOKKEN kurmayı REDDEDER.
# Neden kodlu bir kapı, belgeye yazılmış bir uyarı değil: `LoadCredential=` kaynağı yoksa systemd
# birimi HİÇ BAŞLATMAZ, yani bu tek satır MOTORU kapatabilir. Aynı kapı 53-nous-kapi'de de kodlu.
#
# ---- NEDEN AYRI DROP-IN (53'ün içine değil) ----------------------------------------------------
# 53 MOTORUN KENDİ sırlarını taşır (NOUS_API_KEY, KAPI_APIKEY) ve kaynakları `/etc/meridian/`
# altındadır; bu satır BAŞKA BİR SERVİSİN sırrını motora ödünç verir ve kaynağı
# `/etc/hindsight/creds/` altındadır. İki geçiş AYRI pencerelerde koşar (Faz-1B motor, Faz-1A
# hindsight): tek dosyada birleştirilselerdi, hindsight kaynağı üretilmeden 53 kurulamaz olurdu ve
# iki bağımsız iş birbirinin rehinesi olurdu. `LoadCredential=`i systemd BİRİKTİRİR — iki drop-in
# yan yana yaşar. TEK YASAK: bu dosyada BOŞ atama (`LoadCredential=`) olamaz, çünkü boş atama
# listeyi SIFIRLAR ve 53'ün iki kimliğini sessizce düşürürdü (çivi I10c).
#
# ---- NEDEN MOTORA BİR HINDSIGHT SIRRI --------------------------------------------------------
# Pano tarayıcısı 8888'e ASLA gitmez: `/api/hindsight*` uçları SUNUCU tarafında okur ve anahtarsız
# bir gövde döner (v375'in sır duvarı). Yani anahtar motor sürecinde bulunmak ZORUNDA. Bugün
# `api._hafiza_anahtari` onu `/opt/hindsight/.env` DOSYASINDAN okuyor (spec Bulgu-3) — faz-2'de o
# üç satır `.env`ten çıkacak ve okuma yolu taşınmamış olsaydı pano Hafıza tablosunu SESSİZCE
# kaybederdi. Okuma yolu taşındı (`meridian.secrets.credential_oku`, çiviler v375 bölüm K).
#
# EN AZ YETKİ: motora YALNIZ TENANT anahtarı yüklenir. DB parolasının ve LLM anahtarının motor
# sürecinde işi yoktur; üçünü birden yüklemek, ihtiyacı olmayan bir sürece sır dağıtmak olurdu.
#
# KİMLİK = SIR ADI: `api.HAFIZA_KRED_ADI` (`HAFIZA_ANAHTAR_ONEKI`den TÜRETİLİR) tam bu adı arar.
# Kaynak dosya `hindsight-api.service.d/50-creds.conf` ile AYNI dosyadır — iki yol ayrışsaydı
# operatör aynı sırrı iki kez üretir, ikisi ilk rotasyonda sessizce ayrışır ve arıza "pano Hafıza'yı
# göremiyor" diye görünürdü. Çiviler: `tests/test_sir_credential_v439.py` bölüm I (I10/I10b/I10c).
#
# İZİN: kaynak root:root 0400 — systemd onu PID 1 olarak okur; motorun servis kullanıcısı (ubuntu)
# `/etc/hindsight/creds/` içine ERİŞEMEZ ve erişmesi GEREKMEZ. Kazanım tam da budur.
[Service]
LoadCredential=HINDSIGHT_API_TENANT_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY
