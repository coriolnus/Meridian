# =================================================================================================
# 51-dash-env-kaldir.conf — FAZ 2: pano token'ının ORTAM kanalını kapat (WP-H/H3 tur-3)
# =================================================================================================
# FAZ 1'DEN (50-dash-credential.conf) SONRA, VE YALNIZ ŞU İKİSİ DOĞRULANDIYSA KURULUR:
#   (1) `systemctl show meridian -p LoadCredential` credential'ı gösteriyor ve servis AÇILIYOR;
#   (2) uygulama tarafı credential'ı GERÇEKTEN okuyor — yani `api.DASH_TOKEN` credential
#       dosyasından geliyor (`CREDENTIALS_DIRECTORY` yolu). Bu doğrulanmadan bu dosya kurulursa
#       token ortadan kalkar ve pano/CLI erişimi kaybedilir.
# Doğrulama adımları `dash_token_credential.sh --faz2` içinde kodludur; elle kurma.
#
# BOŞ `EnvironmentFile=` BİR SIFIRLAMADIR, bir "dosya yok" beyanı DEĞİL: systemd'de değer
# ALINMAYAN bir liste-direktifi o ana kadar birikmiş TÜM girdileri siler. Ana birimdeki
# `EnvironmentFile=-/opt/meridian/.dash.env` satırı böylece etkisizleşir — ana birim dosyasına
# HİÇ dokunmadan. (Ana birimi düzenlemek, depo–canlı ayrıklığını yeniden açardı; bkz. birimdeki
# H3 tur-2 notu: depodaki birimi canlıya kopyalayan her prosedür rotasyonu sessizce geri alıyordu.)
#
# GERİ ALMA: bu dosyayı sil + `systemctl daemon-reload` + `systemctl restart meridian`. Ortam
# kanalı anında geri gelir (`.dash.env` yerinde bırakılır — faz 2 onu SİLMEZ, yalnız okumayı keser;
# operatörün `source /opt/meridian/.dash.env` ile curl atan betikleri de bu yüzden çalışmaya devam
# eder). Dosyanın silinmesi ancak faz 2 bir bakım penceresi boyunca sorunsuz koştuktan sonra,
# AYRI bir kararla gündeme gelir.
#
# 2026-09-14 GÜNCELLEME — O AYRI KARAR VERİLDİ: `/opt/meridian/.dash.env` A1'de 2026-09-14 17:46Z'de
# operatör kararıyla SİLİNDİ (yedek /root/sir-yedek-20260914T174655Z-dash-env; healthz 200). Yukarıdaki
# "yerinde bırakılır" cümlesi o günün doğrusuydu ve tarihçe olarak KALIR. Birim ETKİLENMEZ: ana birimin
# satırı `EnvironmentFile=-/opt/meridian/.dash.env` biçimindedir ve baştaki TİRE systemd'ye "dosya
# yoksa sessizce atla" der — silinmiş dosya bir açılış hatası üretmez. Bu drop-in de YERİNDE KALIR:
# dosya geri doğarsa ortam kanalını yine keser. GERİ ALMA notu buna göre okunur: drop-in'i silmek
# artık ortam kanalını GERİ GETİRMEZ (okunacak dosya yok); pano jetonunun tek kanalı
# `LoadCredential=dash_token` (50-dash-credential.conf; kaynak Vault Agent'ın render hedefi).
# `deploy/oracle-a1/sir_rotasyon.sh` kopya tablosu bu dosyayı 2026-09-17'de bıraktı (TSK-064 (d-1)).
[Service]
EnvironmentFile=
