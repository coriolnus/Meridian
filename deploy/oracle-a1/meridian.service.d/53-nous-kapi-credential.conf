# =================================================================================================
# 53-nous-kapi-credential.conf — NOUS_API_KEY + KAPI_APIKEY systemd LoadCredential kanalına
# (TSK-064 YOL-1 Faz-1B, 2026-09-07)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. `deploy.sh` birimleri tek tek `cp`ler ve bu dizini
# KOPYALAMAZ — kurulumu `sir_credential_gecis.sh --faz1 <ad>` yapar, bakım penceresinde, operatör
# eliyle. Bilerek böyle: `LoadCredential=` KAYNAK DOSYASI YOKSA systemd birimi HİÇ BAŞLATMAZ
# ("Failed to load credential"). Yani bu iki satırı doğrudan `meridian.service`e yazmak,
# /etc/meridian/{nous_api_key,kapi_apikey} henüz üretilmemişken koşacak İLK dağıtımda motoru
# düşürürdü — hazırlığın kendisi arıza olurdu. Drop-in, satırları canlıya değmeden VERSİYONA
# almanın yoludur (50-dash-credential.conf ile aynı hüküm, orada gerekçesi uzun uzun yazılı).
#
# İKİ SATIR, TEK DOSYA — VE BUNUN BEDELİ: birim ancak İKİ kaynak dosya da varken açılır. Geçiş
# betiği bu yüzden drop-in'i yalnız İKİSİ birden hazırken kurar ve tek ad için `--faz1`
# çağrıldığında "öteki kaynak eksik, drop-in kurulmadı" der. Kazanç: iki sır tek restart'la geçer
# ve yarım kurulu bir birim hiç doğmaz.
#
# ---- NEDEN EnvironmentFile YETMİYOR ------------------------------------------------------------
# Sır bugün 0600'lük `/opt/meridian/.env`te; makinedeki başka kullanıcılar onu DOSYADAN okuyamaz.
# Kalan yüzey DOSYA değil SÜREÇ ORTAMIDIR ve bu depoda ortam ÇOCUKLARA AKAR: `serve.sh` uvicorn'u
# `env=os.environ` ile, `hermes_composite` ajan alt süreçlerini devralınan ortamla doğurur. Yani
# `NOUS_API_KEY` bugün motor sürecinin VE onun doğurduğu her LLM ajan sürecinin
# `/proc/<pid>/environ`ında duruyor — o dosya süreç sahibine (ubuntu) okunurdur. Sırrı 0600 bir
# dosyada saklayıp aynı sırrı ubuntu olarak koşan her alt sürecin ortamına dağıtmak, kilidi takıp
# anahtarı kapının üstüne bırakmaktır.
#
# `LoadCredential=` bunu YAPISAL olarak kapatır: systemd sırrı PID 1 olarak (yani sandbox'tan
# ÖNCE) okur, `$CREDENTIALS_DIRECTORY` altına 0400/servis-kullanıcısı izinleriyle bir tmpfs
# dosyası olarak koyar ve süreç sona erince siler. Diske düşmez, `environ`da görünmez.
#
# ---- KİMLİK = SIR ADI (v184'ten AYRILAN nokta) -------------------------------------------------
# `LoadCredential=<kimlik>:<kaynak>` — `<kimlik>` `$CREDENTIALS_DIRECTORY` altındaki DOSYA ADIDIR.
# Pano token'ında kimlik `dash_token`dı, çünkü onu okuyan yer o adı sabit tutuyordu. Burada okuyucu
# `secrets.credential_oku(ad)`dır ve `ad` SIR ADIDIR — yani kimlik BÜYÜK HARFLE, sır adıyla birebir
# aynı yazılır. Ayrışırsa okuyucu dosyayı bulamaz, kanal SESSİZCE ölür ve `.env` hâlâ okunduğu
# için hiçbir şey bozulmaz: en pahalı hâl, çünkü geçiş "yapıldı" sanılır. Çivi:
# `tests/test_sir_credential_v439.py` (drop-in kimliği ↔ okuyucunun aradığı ad).
#
# KAYNAK DOSYA BİÇİMİ: `/etc/meridian/{nous_api_key,kapi_apikey}` YALNIZ değeri içerir (`AD=DEGER`
# DEĞİL; sondaki yeni satır serbest — okuyucu kırpar). `AD=` öneki de tanınır (operatörün `.env`
# satırını kopyalaması öngörülebilir bir kazadır) ama sözleşme çıplak değerdir.
# İzin: root:root 0400 — systemd onu PID 1 olarak okur, servis kullanıcısının erişmesi GEREKMEZ.
#
# ---- İKİ FAZLI GEÇİŞ — BU DOSYA FAZ 1'DİR ------------------------------------------------------
# Faz 1 (bu dosya): kanal EKLENİR, `EnvironmentFile` KALIR. İki kanal aynı anda canlıdır ve
#   uygulama credential'ı TERCİH eder (`secrets._fetch` sırası), yoksa ortama düşer. Bu faz TEK
#   BAŞINA kurulsa bile davranış BİREBİR bugünküdür.
# Faz 2: `.env`ten iki SATIR silinir (`sir_credential_gecis.sh --faz2 <ad>`) — burada boş
#   `EnvironmentFile=` SIFIRLAMASI KULLANILAMAZ, çünkü `/opt/meridian/.env` sır DIŞINDA
#   yapılandırma da taşır (NOUS_MODEL, NOUS_ENDPOINT, MERIDIAN_FMP_BASE) ve onların da okunması
#   kesilirdi. `.dash.env`in tek-amaçlı olması 51-dash-env-kaldir.conf'u mümkün kılmıştı; burada
#   o kolaylık YOK.
# Faz 2'den ÖNCE farksal ölçüm şarttır (ortama SAHTE değer + credential'a gerçek değer → servis
#   hâlâ iş yapıyor mu?); ölçüm betikte kodludur, elle atlanmaz.
[Service]
LoadCredential=NOUS_API_KEY:/etc/meridian/nous_api_key
LoadCredential=KAPI_APIKEY:/etc/meridian/kapi_apikey
