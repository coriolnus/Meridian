# deploy/apisix/config.yaml — APISIX ana konfigi (TSK-089 tek-kapı, Faz 1).
# SIRSIZ ŞABLON: admin anahtarı ${{APISIX_ADMIN_KEY}} ile /opt/apisix/.env-apisix'ten çözülür
# (dosya 0600, F9-DIŞI sır — env.iskelet repodaki sırsız aynadır). $ENV çözüm hatası SESSİZDİR
# (literal string kalır) — canary ② kurulum günü bilinçli-bozuk referansla error-log'u doğrular.
#
# GÜVENLİK DURUŞU (TSK-089 gövdesi):
#   * proxy (9080) ve admin (9180) YALNIZ 127.0.0.1 — dış dünyaya kapalı; kapı şimdilik A1-içi
#     egress proxy'sidir (LLM rotası). İngress fazı (pano) AYRI faz, TLS'iyle gelir.
#   * `plugins:` listesi varsayılanı EZER — aşağıdaki liste kullanılan HER plugin'in açık
#     beyanıdır; batch-requests (CVE-2022-24112 aracı) · server-info · inspect LİSTEDE YOK =
#     kapalı. Yeni faz plugin'i buraya adıyla eklenir, "varsayılan zaten açıktı" yok.
#   * worker_processes AUTO DEĞİL 2: container host'un 4 çekirdeğini görür (canary ⑨ sınıfı);
#     kapı meridian'ın yanında ikincil iş — 2 worker beyanlı tavan.
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://127.0.0.1:2379"
    prefix: /apisix
    timeout: 30
  admin:
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin
    allow_admin:
      - 127.0.0.1/32
    admin_listen:
      ip: 127.0.0.1
      port: 9180

apisix:
  node_listen:
    - ip: 127.0.0.1
      port: 9080
  enable_admin: true
  # Faz 3 (2026-09-01): TLS ingress dinleyicisi. 0.0.0.0'a bağlanır ama dış dünya İKİ ayrı
  # kapıyla kapalı (host iptables yalnız 22 + OCI güvenlik listesi) — dış açılış, rota
  # kimlik korumaları canary'lendikten SONRA operatörün konsol adımıyla olur. Sertifika
  # Admin API /ssls'e yüklenir (self-signed geçici; alan adı kararı → certbot).
  ssl:
    enable: true
    listen:
      - ip: 0.0.0.0
        port: 9443   # 443 DEĞİL — ölçüldü (2026-09-01): imajın nginx'i root olmayan kullanıcıda,
                     # <1024 bind'ı "Permission denied" ile konteyneri düşürdü. Dış URL :9443 taşır.

nginx_config:
  # error_log_level: kurulum canary'leri (⑨) info ile koşuldu ve KAPANDI; info düzeyi balancer
  # satırına TAM istek URI'sini (FMP apikey sorgu parametresi DAHİL) yazıyor — ölçüldü 2026-09-01.
  # warn'da $ENV çözüm hataları görünmeye devam eder, istek-başına sızıntı satırı kesilir.
  error_log_level: warn
  worker_processes: 2
  http:
    # SIR SIZINTISI ÖNLEMİ (ölçüldü 2026-09-01): varsayılan biçim $request taşır = sorgu dizesi
    # = FMP apikey loga düşer. Biçim $uri kullanır (sorgusuz); kalan alanlar teşhis için yeter.
    access_log_format: '$remote_addr - $remote_user [$time_local] $host "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time "$apisix_request_id"'

plugins:
  - ai-proxy-multi   # Faz 1: LLM rotası — öncelik zinciri + fallback
  - proxy-rewrite    # canary ③: ai-proxy varsayılanı TÜM istemci header'larını iletir — temizlik şart
  - prometheus       # bedel ölçümü (canary ⑧) — /apisix/prometheus/metrics yalnız loopback
  # Faz 2-4 öne çekme (operatör talimatı 2026-09-01) — her biri routes.yaml'da adıyla kullanılır:
  - limit-count            # Faz 2: FMP 250/gün + Faz 4: filo 1000/gün (policy redis)
  # basic-auth KALDIRILDI 2026-09-01: kapı kimliği emekli — tek katman uygulamanın kendi oturumu
  # (routes.yaml pano-ingress yorumundaki Safari vakası). Liste kullanım beyanıdır; kullanılmayan
  # plugin listede durmaz. Bu satır konteynerin SONRAKİ yeniden başlatmasında etkinleşir.
  - key-auth               # Faz 4: bot kimlikleri (apikey başlığı — makine istemcileri)
  - limit-req              # Faz 3: ingress kaba hız sınırı
  - client-control         # Faz 3: ingress gövde tavanı
  - consumer-restriction   # Faz 4: LLM rotaları yalnız filo+motor tüketicilerine
  - serverless-pre-function # TSK-105: Bearer→apikey köprüsü (bot göçü) — rewrite fazı, yalnız
                            # LLM rotalarında; Lua yalnız istek başlığı işler, log/print yok.
                            # VAKA 2026-09-02: listeye yazılmadan routes PUT'u 400 verdi
                            # ("unknown plugin") — liste kullanım beyanıdır ve ZORLAYICIDIR.
