# deploy/apisix/routes.yaml — APISIX rotalarının TEK KAYNAĞI (TSK-089 GitOps; tek-kaynak yasası).
# Uygulama: ops/apisix_uygula.py (idempotent PUT; --denetle drift kıyası). Admin API'ye ELLE
# CRUD kalıcı DEĞİLDİR — tünelden yapılan her deneme ya buraya işlenir ya kaybolur (drift
# denetimi ayrışmayı alarmlar). `?ttl=` YASAK (kaynağı sessizce siler — TSK-089).
# SIR YOK: anahtarlar $ENV:// referansıyla iner; etcd'ye değer yazılmaz.

rotalar:
  - id: llm-danisma
    # Faz 1 — LLM egress rotası: A1-içi istemci http://127.0.0.1:9080/llm/v1/chat/completions
    # çağırır; kapı OpenRouter'a öncelik zinciriyle gider. Fallback: 429 + 5xx (şema teyitli
    # fallback_strategy dizisi — kurulum günü Admin API'den ölçüldü).
    uri: /llm/v1/chat/completions
    plugins:
      # `plugins:` varsayılanı EZER (TSK-089): prometheus açıkça yazılmazsa rota-başına
      # apisix_http_status sayacı HİÇ üretilmez — Kapı sayfasının metrik bölümü boş kalır
      # (ölçüldü 2026-09-01: istek geçti, sayaç 0 satır). Yalnız sayaç üretir, gövdeye dokunmaz.
      prometheus: {}
      proxy-rewrite:
        # canary ③: ai-proxy varsayılanı istemci header'larını iletir — burada istemciden
        # gelen Authorization/X-* temizlenir; upstream auth'u instance'ların kendi auth'udur.
        headers:
          remove: ["Authorization", "X-Forwarded-For", "X-Real-IP"]
      ai-proxy-multi:
        fallback_strategy: ["http_429", "http_5xx"]
        instances:
          - name: birincil-nemotron
            provider: openai-compatible
            priority: 10
            weight: 1
            auth:
              header:
                Authorization: "$env://OPENROUTER_AUTH"
            options:
              model: nvidia/nemotron-3-ultra-550b-a55b:free
            override:
              endpoint: https://openrouter.ai/api/v1/chat/completions
          - name: yedek-gemma
            provider: openai-compatible
            priority: 1
            weight: 1
            auth:
              header:
                Authorization: "$env://OPENROUTER_AUTH"
            options:
              model: google/gemma-4-26b-a4b-it:free
            override:
              endpoint: https://openrouter.ai/api/v1/chat/completions

  - id: fmp-veri
    # Faz 2 — FMP egress: adapter (meridian/adapters/fmp.py) MERIDIAN_FMP_BASE env'iyle buraya
    # yönlenir; anahtar ADAPTER'da kalır (?apikey sorgu parametresi — rotasyon + anahtar-başına
    # kota muhasebesi adapter'ın ölçülü işi; kapıya taşımak o muhasebeyi köreltirdi. ROADMAP'teki
    # "$ENV anahtar" hedefinden BEYANLI sapma, tek-kaynak gerekçesiyle). Kapının işi: günlük
    # tavan (mekanik kill), durum-kodu GEÇİRGENLİĞİ (402≠429 adapter'a bozulmadan iner) ve sayaç.
    uri: /fmp/*
    plugins:
      prometheus: {}
      proxy-rewrite:
        regex_uri: ["^/fmp/(.*)", "/stable/$1"]
        host: financialmodelingprep.com
      limit-count:
        count: 250                # FMP ücretsiz plan tavanı — anahtar-başına değil rota-geneli emniyet kemeri
        time_window: 86400
        policy: redis
        redis_host: 127.0.0.1
        redis_port: 6379
        key_type: constant
        key: fmp-gunluk
        rejected_code: 429
        rejected_msg: "kapi-fmp-gunluk-kota"   # FMP'nin kendi 429'undan ayırt edilebilir gövde
    upstream:
      type: roundrobin
      scheme: https
      nodes:
        "financialmodelingprep.com:443": 1

  - id: metrics-dis
    # /metrics dış yüzeyde CANLILIĞA indirgenir: kapı arkasında `api._local_request` TCP eşini
    # 127.0.0.1 görür ve tam seti (öz sermaye, P&L) dökerdi — kök düzeltme motor tarafında
    # (v365: XFF taşıyan istek yerel sayılmaz), bu rota o düzeltme CANLIYA İNENE KADAR köprü
    # ve sonrasında derinlemesine savunma. Dış izleyicinin sözleşmesi zaten /healthz.
    # A1-içi scrape 127.0.0.1:8080'e DOĞRUDAN gider — bu rotadan hiç geçmez, tam setini korur.
    uri: /metrics
    plugins:
      prometheus: {}
      proxy-rewrite:
        uri: /healthz
      limit-req:
        rate: 10
        burst: 20
        key_type: var
        key: remote_addr
        rejected_code: 429
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:8080": 1

  - id: pano-ingress
    # Faz 3 — pano girişi: TLS dinleyicisinden gelen HER istek (belge + /api/*) panoya
    # (127.0.0.1:8080). KİMLİK KAPIDA DEĞİL — operatör kararı 2026-09-01: tek kimlik katmanı
    # uygulamanın kendi tam oturum sistemi (parola + çerez + fail-closed açılış duruşu;
    # api.py::_auth ~80 uçta). Kapıdaki basic-auth İKİ ölçülmüş arıza üretti: Safari fetch-401
    # döngüsü (yerel kimlik kutusu) + kapı-401'inin uygulamada "oturum düştü" yanlış sınıfı.
    # Kapının işi bu yüzeyde: hız sınırı + gövde tavanı + sayaç.
    # uri /* — llm/fmp/metrics rotaları daha uzun önekle önce eşleşir (radixtree).
    uri: /*
    plugins:
      prometheus: {}
      limit-req:
        rate: 10
        burst: 20
        key_type: var          # şema ölçümü 2026-09-01: constant enum'da YOK (o limit-count'un)
        key: remote_addr       # istemci-IP başına — ingress için doğrusu zaten bu
        rejected_code: 429
      client-control:
        max_body_size: 1048576   # 1 MiB — pano POST'ları küçüktür; büyük gövde bu yüzeyin işi değil
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:8080": 1

  - id: llm-hizli
    # Hafif model rotası: kısa/mekanik işler + kapının kendi smoke'u. Ölçülen ders (kurulum
    # günü): nemotron-550b free ucu dakikalarca boğulabiliyor — kapı sağlığı ağır modelin
    # sağlığıyla ölçülmez; bu rota o ayrımı taşır.
    uri: /llm/hizli/v1/chat/completions
    plugins:
      prometheus: {}   # yukarıdaki notla aynı: sayaç ancak açık yazılınca doğar
      proxy-rewrite:
        uri: /llm/v1/chat/completions
        headers:
          remove: ["Authorization", "X-Forwarded-For", "X-Real-IP"]
      ai-proxy-multi:
        fallback_strategy: ["http_429", "http_5xx"]
        instances:
          - name: hizli-gemma
            provider: openai-compatible
            priority: 10
            weight: 1
            auth:
              header:
                Authorization: "$env://OPENROUTER_AUTH"
            options:
              model: google/gemma-4-26b-a4b-it:free
            override:
              endpoint: https://openrouter.ai/api/v1/chat/completions

# --- Faz 3-4 kimlikleri (2026-09-01 öne çekme) ------------------------------------------------
# Sır YOK: değerler $env:// ile konteyner ortamından (/opt/apisix/.env-apisix) çözülür.
# Bot anahtarları key-auth (makine istemcisi, apikey başlığı); pano kimliği uygulamanın kendi
# oturumu (kapı basic-auth'u 2026-09-01'de emekli — pano-ingress yorumundaki vaka).
# LLM rotalarına key-auth+consumer-restriction KİLİDİ henüz YOK — flip, tüm istemciler
# (motor nous çağrısı + üç bot profili) anahtar taşıyınca AYRI adımda gelir (plan F4-B sırası).

tuketici_gruplari:
  - id: filo
    plugins:
      limit-count:
        count: 1000               # LLM kota memory'si: filo günlük 1000 çağrı — mekanikleşiyor
        time_window: 86400
        policy: redis
        redis_host: 127.0.0.1
        redis_port: 6379
        key_type: constant
        key: filo-gunluk
        rejected_code: 429
        rejected_msg: "kapi-filo-gunluk-kota"

tuketiciler:
  # pano_operator (basic-auth) KALDIRILDI 2026-09-01: kapı kimliği operatör kararıyla emekli —
  # tek kimlik katmanı uygulamanın kendi oturumu (pano-ingress yorumundaki vaka). etcd'deki
  # kaydı ve pano-api rotası aynı gün Admin DELETE ile düşürüldü; PANO_GIRIS_PAROLA env'i
  # /opt/apisix/.env-apisix'te zararsız artık olarak durabilir.
  - username: bot_bekci
    group_id: filo
    plugins:
      key-auth:
        key: "$env://BOT_KEY_BEKCI"
  - username: bot_karne
    group_id: filo
    plugins:
      key-auth:
        key: "$env://BOT_KEY_KARNE"
  - username: bot_sef
    group_id: filo
    plugins:
      key-auth:
        key: "$env://BOT_KEY_SEF"
  - username: motor_meridian
    # Motor filo kotasının DIŞINDA: nous çevirisi + warmup sınıfı kendi bütçesiyle yaşar.
    plugins:
      key-auth:
        key: "$env://BOT_KEY_MERIDIAN"
