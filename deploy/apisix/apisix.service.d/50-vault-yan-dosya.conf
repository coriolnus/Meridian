# =================================================================================================
# 50-vault-yan-dosya.conf — kapının sırları KASADAN: ikinci `--env-file` (TSK-064 Faz-2 DALGA-2)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. `dagit.sh` birimleri tek tek kıyaslar ve `.service.d`
# dizinini KOPYALAMAZ; kurulumu A0 rolü ya da operatörün bakım penceresi yapar. Bilerek böyle:
# aşağıdaki `--env-file` HARD bir bağımlılıktır (bkz. BEDEL) ve dosya yokken kurulursa kapı HİÇ
# açılmaz. Sıra bu yüzden spec §5'te yazılı: önce Agent render eder ve sha kanıtı alınır, SONRA
# bu drop-in kurulur, EN SON restart.
#
# ---- NİYE ExecStart YENİDEN YAZILIYOR ----------------------------------------------------------
# systemd'de `ExecStart`a bir bayrak EKLEMENİN yolu yoktur: drop-in önce onu SIFIRLAR (`ExecStart=`),
# sonra TAMAMINI yeniden yazar. Yani komut satırı artık İKİ yerde yaşıyor — tek-kaynak yasasının
# "kopya kaçınılmazsa türetme + ayrışma çivisi" istisnası. Çivi (v491 C6) drop-in'in jeton
# listesini temel birimin jeton listesiyle karşılaştırır ve TAM OLARAK bir `--env-file <yan dosya>`
# çifti dışında her ayrışmayı kırmızıya çevirir: imaj sürümü, mount ya da ağ kipi temel birimde
# değişip burada değişmezse kapı ESKİ imajla açılırdı ve kimse fark etmezdi.
#
# ---- SIRA HÜKÜMDÜR ----------------------------------------------------------------------------
# Yan dosya ASIL dosyadan SONRA verilir: docker aynı anahtarı taşıyan iki `--env-file` gördüğünde
# SONRAKİNİ geçerli sayar. Ters sırada kasa kurulur, render edilir, tüketiciye ULAŞMAZ — ve
# "geçiş yapıldı" cümlesi ölçülmemiş bir iyimserlik olurdu.
#
# ---- BEDEL (bedel yasası: kazanç sayıldı, kayıp da sayılmalı) ----------------------------------
# `--env-file` OPSİYONEL DEĞİLDİR: docker eksik dosyada `failed to read` ile düşer. Yani bu
# drop-in kurulduktan sonra `/opt/apisix/.env-apisix.vault`ın VARLIĞI kapının açılış ön şartıdır.
# Kazanç: sır tek kaynaktan gelir ve "unutulan kopya" sınıfı kapanır. Kayıp: kasa/Agent arızası
# artık kapıyı da düşürebilir. GERİ ALIM tam olarak bu yüzden tek adımdır — bu dosyayı kaldır,
# `systemctl daemon-reload`, `systemctl restart apisix`: kapı eski kanala (`.env-apisix`) döner,
# çünkü asıl dosyadaki sır satırları iki-kanal dönemi boyunca OLDUĞU GİBİ durur.
# `EnvironmentFile=-` ise OPSİYONELDİR (eksi işareti): systemd tarafı, dosya yokken birimi
# düşürmez — o satır konteynere değil, birimin kendi ortamına bakar.
#
# `$env://` ve `${{…}}` çözümlerini APISIX YALNIZ AÇILIŞTA yapar: reload YETMEZ, RESTART gerekir.
[Service]
EnvironmentFile=-/opt/apisix/.env-apisix.vault
ExecStart=
ExecStart=/usr/bin/docker run --rm --name apisix-kapi --network host \
  --env-file /opt/apisix/.env-apisix \
  --env-file /opt/apisix/.env-apisix.vault \
  -v /opt/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro \
  apache/apisix:3.18.0-debian
