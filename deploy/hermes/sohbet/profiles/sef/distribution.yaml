# ÜRETİLMİŞ — elle düzenlenmez; üreteç `ops/sohbet_profili_uret.py`.
# Kaynak: deploy/hermes/profiles/sef/distribution.yaml (sürüm tabanı, kapı anahtarının adı ve zorunluluğu);
# yazma kökü ağ geçidinin ortak kum havuzu, açıklamalar üretecin sohbet sabitleri.
name: sef
version: 0.1.0
description: sef sohbet profili — ÜRETİLMİŞ (rapor profilinden türetildi)
hermes_requires: '>=0.19.0'
env_requires:
- name: HERMES_WRITE_SAFE_ROOT
  description: Ağ geçidinin yazabileceği tek dizin; tanımsız değişken sınırsız yazma
    demektir. Değişken süreç başına okunur, bu yüzden tek ağ geçidindeki bütün sohbet
    profilleri bu ortak kum havuzunu paylaşır; dosya ve terminal takımları zaten kapalıdır.
  required: true
  default: /opt/meridian/var/bots/sohbet
- name: BOT_KEY_SEF
  description: Kapı anahtarı — rapor profiliyle AYNI APISIX tüketicisi. Sohbet profili
    bu anahtarla model çağırır; değer profilin kendi .env dosyasında durur, depoya
    yazılmaz. Anahtar yoksa ya da yanlışsa kapı 401 döner ve bot sohbet cevabı veremez.
  required: true
- name: HINDSIGHT_API_KEY
  required: true
  description: Hindsight kiracı anahtarı; değer profilin kendi .env dosyasında durur
    (çoklu ağ geçidinde sırlar profilin .env dosyasından okunur), depoya yazılmaz.
- name: API_SERVER_KEY
  required: true
  description: API sunucusu anahtarı — kanal katmanı (bugün Telegram dinleyicisi)
    bu bota /p/<ad>/ önekiyle sorar ve isteği bu anahtarla imzalar; çoklu ağ geçidi
    isteği profilin kendi .env dosyasındaki değerle doğrular. Değer depoya yazılmaz.
    Anahtar yoksa ya da kanal katmanının anahtarıyla aynı değilse istek 401 ile düşer
    ve bot sohbet cevabı veremez.
distribution_owned:
- SOUL.md
- config.yaml
- hindsight/config.json
