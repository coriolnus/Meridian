# ÜRETİLMİŞ — elle düzenlenmez; üreteç `ops/sohbet_profili_uret.py`.
# Kaynak: deploy/hermes/profiles/sef/distribution.yaml (sürüm tabanı, kapı anahtarı beyanı).
name: sef
version: 0.1.0
description: sef sohbet profili — ÜRETİLMİŞ (rapor profilinden türetildi)
hermes_requires: '>=0.19.0'
env_requires:
- name: BOT_KEY_SEF
  description: 'Profilin KAPI anahtarı — koşumun GERÇEKTEN okuduğu anahtar (TSK-105,
    2026-09-02). `config.yaml` `model.provider: custom:kapi` diyor ve o girdinin `key_env`i
    tam bu addır; hermes değeri `Authorization: Bearer` olarak gönderir, kapıdaki
    köprü `apikey`e çevirir, `key-auth` doğrular. Değer KAPININ tüketici beyanıyla
    AYNI olmak zorunda (`deploy/apisix/routes.yaml` → `bot_sef` → `$env://BOT_KEY_SEF`).
    Profil = bağımsız HERMES_HOME dizini, yani KENDİ `.env`ini okur (ÖLÇÜLDÜ, v0.18.2
    `hermes_cli/env_loader.py`: yüklenen dosya `HERMES_HOME/.env`) ve ana profilin
    anahtarı ona GEÇMEZ. Anahtar yoksa/yanlışsa arıza GÜRÜLTÜLÜ DEĞİLDİR: kapı 401
    döner, LLM her koşumda düşer, Görev 2''nin ham-brifing düşüş yolu devreye girer
    ve teslimat çalışıyor GÖRÜNÜR — bot hiç düşünmeden. Sessiz bozulma tam olarak
    budur. `env_requires` `.env` YAZMAZ; ÖLÇÜLDÜ (v0.18.2 `profile_distribution.py`,
    `ENV_EXAMPLE_FILENAME`): kurulu profile `.env.EXAMPLE` bırakır (`.env` kullanıcı-sahipli).'
  required: true
- name: HINDSIGHT_API_KEY
  required: true
  description: Hindsight kiracı anahtarı; değer G3 biriminin credential'ından, dosyaya
    yazılmaz
distribution_owned:
- SOUL.md
- config.yaml
- hindsight/config.json
