model:
  provider: gemini
  default: gemini-flash-latest
mcp_servers:
  meridian:
    command: /opt/meridian/.venv/bin/python
    args:
    - -m
    - meridian.mcp_server
    env:
      PYTHONPATH: /opt/meridian
      MERIDIAN_ROOT: /opt/meridian
    tools:
      resources: false
      prompts: false
hooks:
  pre_tool_call:
  - matcher: terminal|write_file|patch|edit|apply_patch
    command: /opt/meridian/ops/meridian-guard.sh
    timeout: 10
hooks_auto_accept: true
prompt_caching:
  cache_ttl: 1h
credential_pool_strategies:
  gemini: round_robin
  anthropic: least_used
  openrouter: round_robin
fallback_providers:
- provider: nous
  model: openai/gpt-oss-20b:free

# --- GÜVENLİK DURUŞU (spec §9.2, operatör kararı 2026-08-27) --------------------------------
# Terminal arka ucu BİLEREK `local`: A1 dört çekirdek ve 8 sa 55 dk CPU yakan sprint koşuyor;
# ayrıca konteyner arka uçlarında Hermes'in KENDİ tehlikeli-komut denetimi ATLANIR (konteyner
# sınır sayılır), yani docker göründüğü kadar net kazanç değil. Karşılığı bu blok + guard hook.
approvals:
  mode: smart
  # Kod varsayılanı ZATEN `deny` (tools/approval.py; ölçüm 2026-08-27, Hermes v0.19.0) —
  # yani bu satır bir DELİK KAPATMAZ, bir BEYANDIR: başsız cron oturumunun tehlikeli komutu
  # ONAYLAMAMASI bizim duruşumuzdur, üst akımın varsayılanına emanet edilmiş bir şans değil.
  # Varsayılan bir gün değişirse burası değişmez. Satıra taşımadığı bir ağırlık yüklemeyelim:
  # asıl taşıyıcı `deny` listesi ve guard kancasıdır.
  cron_mode: deny
  deny:                      # fnmatch; --yolo'da BİLE geçersiz
    - "*dagit.sh*"           # dağıtım yalnız Rol-1'in (CLAUDE.md madde 5)
    # İKİ YANDAN SARILI — ÖLÇÜLMÜŞ DELİK (denetim 2026-08-29): bunlar `git push*` / `git commit*`
    # diye ÖN EKE ÇAKILIYDI ve fnmatch TÜM DİZGEYİ eşlediği için `cd /opt/meridian && git push`,
    # `/usr/bin/git push` ve baştaki tek boşluk yasağın ALTINDAN geçiyordu. Listedeki öteki üç
    # desen zaten sarılıydı; yasak bir KOMUTU yasaklar, komutun satır başında olmasını değil.
    - "*git push*"
    - "*git commit*"         # CLAUDE.md madde 8'in EN KESKİN İKİ kalemi. Madde 8 "ajanlar git
    #                          komutu KOŞMAZ" der, yani liste maddenin TAMAMI DEĞİL: `git tag`,
    #                          `git reset --hard`, `git checkout` hâlâ geçer. Kapsamı KASITLI dar
    #                          tutuldu — `*git*` okuma komutlarını da (log/diff/status) bloklardı
    #                          ve ajanın kendi işini görmesini engellerdi. Geri kalanı prompt
    #                          düzeyinde kalıyor; bu bir kapı değil, en pahalı ikisine çekilmiş
    #                          bir çit. Genişletmek isteyen ölçsün: hangi git komutu geri
    #                          alınamaz bir dış etki üretir?
    - "*systemctl*"
    - "*serve.sh*"           # CLAUDE.md madde 5: yerelde koşma, çift-emir riski

# --- SKILL KEŞFİ (görev 3 denetimi — meridian-olcum'un OKUYUCUSU) ---------------------------
# Hermes skill'leri yalnız `~/.hermes/skills/` (kendi SSoT'u) VE burada listelenen
# external_dirs'te arar. Depo dizinini göstermek: skill versiyonlanır, incelenebilir, HER
# dağıtımda güncellenir — ikinci bir kopya yok, o kopyanın kendi sürüklenme kapısına ihtiyacı
# olmaz. Bu kayıt olmadan deploy/hermes/skills/ altındaki hiçbir SKILL.md yüklenmez (YASA 6).
skills:
  external_dirs:
    - /opt/meridian/deploy/hermes/skills
