etkin_timerlar:
  - meridian-backup.timer
  - meridian-tick-watchdog.timer
  - meridian-skill-gorus.timer
  - meridian-edg085-taban.timer
  - meridian-geridolum.timer
  - meridian-aylik-bucket-kopya.timer
  - hindsight-yedek.timer
  - hindsight-taban-tazele.timer
  - meridian-brifing.timer
  - meridian-bekci.timer
  - meridian-karne.timer
  - meridian-defter-ozeti-retain.timer   # TSK-168 / EDG-2026-089: kadans operatör kararıyla AÇIK (2026-09-13 '(b) melez+retain');
                                         # rol birim+drop-in'i kopyalar ve timer'ı enable eder; kurulum günü elle test-ateşleme Rol-1'de
                                         # (CLAUDE.md §9 "kurulu ≠ çalışır"), pencere ilk başarılı retain damgasıyla açılır.
  - meridian-bar-arsiv.timer             # TSK-020 UYGULA-3 haftalık tazeleme (Pazar 22:00 UTC; sıra operatör onaylı 2026-09-01);
                                         # kurulum günü elle test-ateşleme Rol-1'de (2026-09-13).
  - vault-admin-yenile.timer             # TSK-064 Faz-2 tur-4 (2026-09-14): yönetici jetonu (PERİYODİK)
                                         # haftalık yenileme; birim `ConditionFileNotEmpty=/etc/vault/admin.token`
                                         # ile jeton yokken sessizce atlanır (bootstrap öncesi yanlış alarm yok).
                                         # Kurulum günü elle test-ateşleme Rol-1'de (CLAUDE.md §9).
  - vault-sagligi.timer                  # TSK-064 Faz-2 (2026-09-14): kasa mühür/erişilebilirlik bekçisi.
                                         # BİRİM KENDİ KAPISINI TAŞIR: `vault-sagligi.service`
                                         # `ConditionPathExists=/etc/vault/vault.hcl` ile, Vault HENÜZ
                                         # KURULMAMIŞKEN sessizce (journal'a yazarak) atlanır — yani
                                         # timer'ı kasadan ÖNCE enable etmek yanlış alarm üretmez.
                                         # Kurulum günü elle test-ateşleme Rol-1'de (CLAUDE.md §9).


# --- A1'de BİLEREK disabled kalan birimler (A1 ölçümü) — rol bunlara DOKUNMAZ, yalnız raporlar
# (Yasa 6: "dokunmadım" da okunabilir bir çıktı olmalı; sessiz atlama körlüktür) ---
devre_disi_birimler:
  - meridian-learn.service
  - meridian-aylik-bucket-kopya.service

# --- drop-in KAYNAK glob'ları (dropinler.yml; `birim_kaynaklari` ile AYNI şekil) ---
# `dropin_dizinleri` HEDEFteki dizin adlarıdır; bu liste KAYNAK dosyaları verir. İkisi ayrışırsa
# rol ya boş dizin yaratır ya da bir drop-in'i hiç kopyalamaz → `tests/test_ansible_a0_v451.py`
# ikisinin (dizin adı ↔ glob'un ana dizini) EŞİT olduğunu ölçer (tek-kaynak yasası: iki liste,
# tek gerçek, aralarında çivi). Wildcard YALNIZ dosya adında: `fileglob` lookup'ı dizin adını
# `find_file_in_search_path` ile çözer, ara dizinde `*` çalışmaz — ölçüldü (2026-09-08, yerel
# `query('fileglob')` koşumu: ara-`*` desenleri UYARI basıp boş döner, dosya-adı `*` 10 conf bulur).
dropin_kaynaklari:
  - "{{ playbook_dir }}/../oracle-a1/meridian.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-tick-watchdog.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-fail-notify.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-litestream.service.d/*.conf"
  - "{{ playbook_dir }}/../hindsight/hindsight-api.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-brifing.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-bekci.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-karne.service.d/*.conf"
  - "{{ playbook_dir }}/../oracle-a1/meridian-defter-ozeti-retain.service.d/*.conf"
  # TSK-064 Faz-2 DALGA-2: drop-in KAYNAĞI birimin YANINDA durur — apisix `deploy/apisix/`,
  # CP `deploy/hindsight/` altında. Glob'un ana dizin adı `dropin_dizinleri`ndeki HEDEF dizin
  # adıyla BİREBİR aynı olmak zorundadır (v451 o eşitliği ölçer).
  - "{{ playbook_dir }}/../apisix/apisix.service.d/*.conf"
  - "{{ playbook_dir }}/../hindsight/hindsight-cp.service.d/*.conf"
  - "{{ playbook_dir }}/../telemetri/meridian-grafana.service.d/*.conf"

# --- polkit kuralları (deploy.sh 6g + A1 ölçümü: /etc/polkit-1/rules.d'de 50 ve 51) ---
polkit_kaynaklari:
  - "{{ playbook_dir }}/../oracle-a1/50-meridian-sprint.rules"
  - "{{ playbook_dir }}/../oracle-a1/51-meridian-birim-anahtari.rules"

# --- hermes (hermes.yml) ---
hermes_dizin: "/home/{{ meridian_kullanici }}/.hermes"
# meridian/hermes.py::_hermes_bin arama sırası (deploy.sh 5 ile aynı üç yol; PATH bacağı ajanın
# ölçemeyeceği bir şeydir, o yüzden mutlak yollar).
hermes_ikili_yollari:
  - "/home/{{ meridian_kullanici }}/.hermes/bin/hermes"
  - "/home/{{ meridian_kullanici }}/.local/bin/hermes"
  - "/usr/local/bin/hermes"

# --- sağlık kontrolü (deploy.sh 16) ---
saglik_url: "http://127.0.0.1:8080/healthz"
saglik_deneme: 5
saglik_bekleme: 3
# SAĞLIK KAPISININ SEMANTİĞİ (TUR 2, K5): "servis çalışıyorsa sağlıklı olmalı".
# Koşulsuz `active` şartı rolün kendi sözleşmesiyle çelişiyordu: rol hiçbir uzun ömürlü servisi
# BAŞLATMAZ (F10 kararı, `state` verilmez), dolayısıyla taze/soğuk bir A1'de yakınsama tamamen
# başarılıyken bile kapı "failed" derdi ve rolün bunu düzeltmesi imkânsızdı — görmezden gelinen
# kapı, kapı değildir. Soğuk kurulum ve bakım penceresi koşumu: `-e beklenen_aktif=false`
# (kapı KAPANIR, atlandığı ADIYLA basılır — sessiz atlama yok).
beklenen_aktif: true

# --- dagit F9 beyanı ∖ rol kapsamı: BEYANLI istisnalar (TUR 2, K10) ---
# `dagit.sh::F9_LISTE` "canlıya giden repo dosyaları"nın tek kaynağıdır. Rol bu dosyaları
# TAŞIMAZ; boşluk yasak değil ama BEYANLI olmak zorunda (bedel yasası: kazanç sayıldı, kayıp da
# sayılmalı). Gerekçeler README "Bu rolün YAPMADIKLARI" bölümünde; hepsi A1 fazına açık kalem.
# `tests/test_ansible_a0_v451.py::test_f9_beyani_rol_kapsami_ve_beyanli_istisnalarla_ortusur`
# bu listenin F9 ∖ kapsam kümesine TAM EŞİT olduğunu ölçer: yeni bir F9 dosyası eklendiğinde ya
# rol onu taşır ya da buraya yazılır — sessiz üçüncü yol yok.
f9_rol_disi:
  # Enable edilen birimlerin yapılandırma dosyaları (A1 fazı: ya role, ya kendi betiğine).
  - deploy/apisix/config.yaml
  - deploy/oracle-a1/litestream.yml
  - deploy/oracle-a1/geridolum.py
  # Geri-dolum ölçüm artefaktları (research/ altında; birim değil, veri/işçi betiği).
  - research/olcumler/edg066_tick_arsiv/pilot.py
  - research/olcumler/edg066_tick_arsiv/kapsam.txt
  # Bot profilleri: kurulumu `hermes profile install` ile olur ve yeni ajan kimliği OPERATÖR
  # kararıdır (hermes.yml şerhi) — rol yalnız varlıklarını RAPORLAR.
  - deploy/hermes/profiles/sef/distribution.yaml
  - deploy/hermes/profiles/sef/config.yaml
  - deploy/hermes/profiles/sef/SOUL.md
  - deploy/hermes/profiles/bekci/distribution.yaml
  - deploy/hermes/profiles/bekci/config.yaml
  - deploy/hermes/profiles/bekci/SOUL.md
  - deploy/hermes/profiles/karne/distribution.yaml
  - deploy/hermes/profiles/karne/config.yaml
  - deploy/hermes/profiles/karne/SOUL.md
  # TSK-064 Faz-2 (2026-09-14): Vault'un BİRİM OLMAYAN dosyaları (sayı düzyazıya GÖMÜLMEZ —
  # liste F9 ile birlikte büyür). Rol onları TAŞIMAZ ve bu bilinçlidir: hepsi kasanın kendi
  # kurulumuna aittir ve `deploy/vault/vault_kur.sh` onları doğru sahiplik/izinle (0640 root:vault
  # yapılandırma, 0750 root:root betik) yerine koyar. Rol taşısaydı iki yazar olurdu ve izinler her
  # playbook koşumunda salınırdı — `meridian-backup.service` chmod salınımıyla AYNI sınıf (K9).
  # `agent.hcl` ayrıca ÜRETİLMİŞ bir dosyadır.
  # `vault_admin_yenile.sh` BEYAN BOŞLUĞUYDU (tur-4, 2026-09-14): F9 çiftlerine girdi ama bu
  # listeye girmedi ve v451 eşitliği kırmızıydı. Kardeşi `vault_unseal.sh` ile AYNI sınıf: kur
  # betiği 0750 root:root kurar, rol dokunmaz.
  - deploy/vault/vault.hcl
  - deploy/vault/agent.hcl
  - deploy/vault/vault_unseal.sh
  - deploy/vault/vault_admin_yenile.sh
