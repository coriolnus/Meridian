---
# TSK-176 Faz A0 Task 2 — dizinler (deploy.sh 8 + 9a-c + sır dizinleri).
#
# Bot kum havuzlarının depo tarafında karşılığı YOKTUR ve olamaz: dagit.sh rsync'i `/var`ı
# ANKORLU dışlar (aksi hâlde `--delete` botun biriktirdiği her şeyi her dağıtımda silerdi) ve
# `.gitignore` da `/var/` taşır — dizini canlıda birinin yaratması ŞART (deploy.sh 9a'nın
# gerekçesi). 0700 + sahip `ubuntu`: `sudo bash deploy.sh` ile koşulan bir kurulumda dizin
# ROOT'un oluyordu ve birim (`User=ubuntu`) kendi kum havuzuna SESSİZCE yazamıyordu — ham-brifing
# düşüş yolu tam bu arızayı maskeler. Ansible'da sahiplik VARSAYILMAZ, ZORLANIR.
# MOD 0700, 0755 DEĞİL (TUR 2, K9): `meridian-backup.service` bu dizini her koşumda
# `ExecStartPre=/bin/chmod 700 /home/ubuntu/backups` ile sertleştiriyor — arşivde secrets var
# (birim başlığı: "secrets arşive girer → 0700/0600 disiplini korunur"). Rol 0755 yazarken iki
# yazar aynı dizini ters yönde çekiyordu: kalıcı salınım. Bedeli yalnız gürültü değil, (a)
# idempotency KANITI (2. koşum changed=0) çürür, (b) yedek arşivi her playbook koşumu ile bir
# sonraki timer atışı arasında dünyaya okunur kalır. Değer birim dosyasından TÜRETİLİR ve
# `tests/test_ansible_a0_v451.py::test_yedek_dizini_modu_birim_chmodu_ile_esit` ikisini kıyaslar.
# (Plan taslağındaki "ubuntu 0755" satırı bu ölçümle çürüdü — rapora yazıldı.)
- name: Yedek hedefi (meridian-backup.timer ilk atışta var olmalı)
  ansible.builtin.file:
    path: "/home/{{ meridian_kullanici }}/backups"
    state: directory
    owner: "{{ meridian_kullanici }}"
    group: "{{ meridian_kullanici }}"
    mode: "0700"

- name: Bot kum havuzları (her bot kendi artefaktının TEK yazarı — §9.3)
  ansible.builtin.file:
    path: "{{ repo_kok }}/var/bots/{{ item }}"
    state: directory
    owner: "{{ meridian_kullanici }}"
    group: "{{ meridian_kullanici }}"
    mode: "0700"
  loop: "{{ bot_adlari }}"

# EDG-2026-101 yakalama dizini (TSK-200, 2026-09-17). Yazan: `ops/soul_denetimi.py` yakalama bölümü,
# üç brifing biriminden (bekci · brifing · karne); yol `60-edg101-yakalama.conf` drop-in'lerindeki
# `Environment=`/`ReadWritePaths=` ile AYNI olmak zorundadır — `tests/test_edg101_yakalama_v516.py`
# çivi 7 ikisini kıyaslar. ROL KURAR, BİRİM KURAMAZ: birimler `ProtectSystem=strict` ile koşar ve
# `/opt/veri` onlar için salt-okurdur; drop-in'deki `-` önekli izin dizin YOKSA boşa düşer (birim açılır,
# yakalama `edg101_yakalama_dustu` ile düşer, brifing yine gider) — yani dizini canlıda birinin
# yaratması ŞART. MOD 0700: içerik brifing metni + üretici istemi (VERİ blokları); A1 tek kullanıcı,
# okuyan ölçüm kodu da aynı kullanıcıyla koşar. Yalnız YAPRAK dizin kurulur: `/opt/veri` ve
# `/opt/veri/olcum` A1'de zaten `ubuntu:ubuntu 0755` (2026-09-16 ölçümü).
- name: EDG-2026-101 brifing denetimi yakalama dizini (üç brifing biriminin drop-in'iyle aynı yol)
  ansible.builtin.file:
    path: /opt/veri/olcum/edg101/yakalama
    state: directory
    owner: "{{ meridian_kullanici }}"
    group: "{{ meridian_kullanici }}"
    mode: "0700"

# EDG-2026-085 quote kayıt dizini (TSK-225, 2026-09-25). Yazan: `meridian/quotecapture.py` (motor,
# meridian.service); yol `meridian.service.d/55-edg085-quote.conf`teki `Environment=`/`ReadWritePaths=` ile
# AYNI olmak zorundadır — `tests/test_sertlesmis_birim_yazim_yolu_v553.py` (F3 + sınıf çivisi C1) kıyaslar.
# ROL KURAR, BİRİM KURAMAZ: motor `ProtectSystem=strict` ile koşar, `/opt/veri` onun için salt-okurdur ve
# `-` önekli izin dizin YOKSA boşa düşer. Pilotun ilk canlı seansı (2026-09-25) tam bu yüzden kayıtsız geçti:
# dizin yoktu, drop-in izin vermiyordu, `store.append_jsonl`in mkdir'i EROFS ile düştü.
# MOD 0700 — EDG-101 emsalinin gerekçesi burada YARISIYLA geçerli: içerik HASSAS DEĞİL (IEX quote satırları +
# dolum işaretleri; sır yok), ama okuyucu tek — `research/olcumler/edg085_icra_ani_quote/rapor.py`, Rol-1
# tarafından AYNI kullanıcıyla (ubuntu, ssh) koşar. Başka kullanıcıya/servise okuma izni verecek bir okuyucu
# YOK; en az yetki 0700'dür. Yalnız YAPRAK dizin: `/opt/veri/olcum/edg085` A1'de zaten var (taban örnekleyicisi
# `taban.jsonl`i oraya yazıyor — Rol-1 okumaları 2026-09-15..21).
- name: EDG-2026-085 quote kayıt dizini (meridian.service 55-edg085-quote.conf drop-in'iyle aynı yol)
  ansible.builtin.file:
    path: /opt/veri/olcum/edg085/kayit
    state: directory
    owner: "{{ meridian_kullanici }}"
    group: "{{ meridian_kullanici }}"
    mode: "0700"

- name: Sır dizini /etc/meridian (DEĞER yazılmaz — yalnız dizin; A1 ölçümü root:root 0755)
  ansible.builtin.file:
    path: /etc/meridian
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sır dizini /etc/hindsight/creds (A1 ölçümü root:root 0755)
  ansible.builtin.file:
    path: /etc/hindsight/creds
    state: directory
    owner: root
    group: root
    mode: "0755"
