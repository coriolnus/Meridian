---
# TSK-176 Faz A0 — sır DOSYASI denetimi (deploy.sh 6j/7'nin denetim yarısı).
#
# ZİNCİRDEKİ YERİ SÖZLEŞMEDİR (TUR 2, K1): bu dosya `dropinler.yml`den ÖNCE koşar. Kopyalanacak
# drop-in'lerin beşi (`meridian.service.d/50-dash-credential.conf`, `51-dash-env-kaldir.conf`,
# `53-nous-kapi-credential.conf`, `54-hafiza-credential.conf`, `hindsight-api.service.d/
# 50-creds.conf`) `LoadCredential=` taşır ve dosyaların KENDİ başlıkları şunu yazar: "BU DOSYA
# KENDİLİĞİNDEN ETKİN DEĞİLDİR … LoadCredential= kaynak dosyası YOKSA systemd birimi BAŞLATMAZ."
# Yani sır dosyaları eksikken bu drop-in'leri kurmak, meridian.service'i (ve hindsight-api'yi)
# başlatılamaz hâle getirmektir — rolün "hiçbir şeyi bozmadan yakınsa" sözleşmesinin tersi.
# Denetim burada DURDURUR: birim dosyaları o noktada kurulmuştur, credential kanalı ise
# kaynağı doğrulanmadan AÇILMAZ.
#
# SIR DEĞERİ BU ROLDE YOKTUR: rol hiçbir sır üretmez (deploy.sh 7'nin `openssl rand -hex 24`
# üretimi A0'a GEÇMEDİ), yazmaz, okumaz. Yalnız DOSYANIN varlığı/izni/sahibi denetlenir; eksikse
# playbook DURUR ve hangi betiğin koşulacağını söyler. Üretim koşumlarında `-v` üstü YASAK
# (`no_log` `-vvv`'yi etkilemez — TASARIM §2.1, sır süzgeci ilkesi).

- name: Sır dosyaları — stat (İÇERİK OKUNMAZ; checksum/mime/attr KAPALI)
  ansible.builtin.stat:
    path: "{{ item.yol }}"
    # get_checksum: true (varsayılan) dosyayı BAŞTAN SONA OKUR — sır dosyasında bu, değeri
    # ansible'ın bellek/log yoluna sokmak demektir. Denetim yalnız metadata ister.
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ zorunlu_sir_dosyalari }}"
  loop_control:
    label: "{{ item.yol }}"
  register: sir_stat
  no_log: true

# `no_log` BU görevde BİLEREK YOK: burada basılan her şey (yol, mod, sahip) zaten depoda,
# `defaults/main.yml` içinde açık yazılıdır — DEĞER değildir. `no_log: true` koysaydık düşen
# assert'in tek çıktısı "output has been hidden" olurdu ve operatör hangi dosyanın eksik
# olduğunu ÖĞRENEMEZDİ (Yasa 6: okunmayan artefakt üretilmemişten farksızdır).
- name: Sır dosyaları — varlık + izin + sahip kapısı
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.mode == item.item.mod
      - item.stat.pw_name == item.item.sahip
    fail_msg: >-
      SIR DOSYASI DENETİMİ DÜŞTÜ: {{ item.item.yol }} —
      beklenen mod={{ item.item.mod }} sahip={{ item.item.sahip }};
      ölçülen exists={{ item.stat.exists }}
      mod={{ item.stat.mode | default('(yok)') }} sahip={{ item.stat.pw_name | default('(yok)') }}.
      SONUCU: credential drop-in'leri KURULMADI (bilerek) — kurulsalardı meridian.service
      `LoadCredential=` kaynağı olmadan başlatılamaz hâle gelirdi.
      REÇETE (DEĞER bu rolde ÜRETİLMEZ; dosya-başı eşleme burada YAZILMAZ — tek kaynak envanterdir):
      (1) bu dosya bir Vault Agent RENDER HEDEFİDİR (`deploy/vault/agent.hcl` `destination`,
      `deploy/sir_envanteri.yaml`den üretilir) → önce `systemctl status vault-agent`; kasa
      mühürlüyse `deploy/vault/vault_unseal.sh` (A1'de `sudo systemctl start vault-unseal` aynı
      betiği koşar). (2) değeri döndürmek/yeniden kurmak: `deploy/sir_envanteri.yaml`
      `rotasyon_kopyalari` bloğunda `yol`u bu dosya olan satırın `alt_komut`u (kasa bağı: `vault_kv`
      → `rotasyon_siri`) → `sudo deploy/oracle-a1/sir_rotasyon.sh --<alt> --vault [--uret]`
      (önce `--kuru`; `--uret`i kabul etmeyen alt komutu betik AÇIK hatayla reddeder).
    success_msg: "{{ item.item.yol }}: var, {{ item.item.mod }}, {{ item.item.sahip }}"
  loop: "{{ sir_stat.results }}"
  loop_control:
    label: "{{ item.item.yol }}"

# ---------------------------------------------------------------------------------------------
# İZİN-DENETİMLİ KAPI (TSK-020 UYGULA-9 Faz A tur 2, inceleme O-1) — ROTASYON DIŞI sırlar
# ---------------------------------------------------------------------------------------------
# `izin_denetimli_sir_dosyalari` (defaults şerhi): rotasyon tablosuna ait OLMAYAN ama izin biçimi yine de
# bekçilik isteyen dosyalar (bugün: Grafana yönetici parolası — değeri yalnız ilk açılışta okunur, dosya
# döndürmeyle DÖNMEZ). İki dal, ikisi de AYRI görev ve ikisi de okunur:
#   YOKSA → beyan satırı (ilk kurulumda parola kasada değil; birimin kendi `LoadCredential`ı onu zaten açmaz),
#   VARSA → sahip/grup/mod kapısı; farklıysa playbook DURUR — credential drop-in'leri kurulmadan önce.
# `register` adı `sir_stat` İÇERMEZ: zorunlu kapının tekil-görev süzgeçleri (v451/v565) o alt dizgeyle arar.
- name: İzin-denetimli sır dosyaları — stat (İÇERİK OKUNMAZ; checksum/mime/attr KAPALI)
  ansible.builtin.stat:
    path: "{{ item.yol }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ izin_denetimli_sir_dosyalari }}"
  loop_control:
    label: "{{ item.yol }}"
  register: izin_denetim_sonucu
  no_log: true

- name: İzin-denetimli sır dosyaları — YOKSA geç (beyan satırı, Yasa 6)
  ansible.builtin.debug:
    msg: >-
      İZİN DENETİMİ ATLANDI (dosya YOK): {{ item.item.yol }} — ilk kurulumda beklenen hâl (değer henüz
      kasaya konmadı; tüketici birim `LoadCredential=` kaynağı olmadan AÇILMAZ). Kasaya konduktan sonraki
      ilk koşumda bu dosya sahip={{ item.item.sahip }} grup={{ item.item.grup }} mod={{ item.item.mod }}
      ile denetlenir. Reçete: deploy/oracle-a1/RUNBOOK.md "Telemetri (Grafana) erişimi" adım 2.
  loop: "{{ izin_denetim_sonucu.results }}"
  loop_control:
    label: "{{ item.item.yol }}"
  when: not item.stat.exists

# `no_log` BİLEREK YOK (zorunlu kapıyla aynı gerekçe): basılan yol/mod/sahip/grup depoda açık yazılıdır, DEĞER değildir.
- name: İzin-denetimli sır dosyaları — VARSA sahip + grup + mod kapısı
  ansible.builtin.assert:
    that:
      - item.stat.mode == item.item.mod
      - item.stat.pw_name == item.item.sahip
      - item.stat.gr_name == item.item.grup
    fail_msg: >-
      İZİN DENETİMİ DÜŞTÜ: {{ item.item.yol }} — beklenen sahip={{ item.item.sahip }}
      grup={{ item.item.grup }} mod={{ item.item.mod }}; ölçülen sahip={{ item.stat.pw_name }}
      grup={{ item.stat.gr_name }} mod={{ item.stat.mode }}. SONUCU: credential drop-in'leri KURULMADI.
      Bu dosya bir Vault Agent RENDER HEDEFİDİR ve izni şablondan gelir (`deploy/vault/agent.hcl` `perms`;
      agent root koşar). REÇETE: (1) canlı `/etc/vault/agent.hcl` depodakiyle aynı mı — dagit [F9] raporu;
      (2) aynıysa izni bozan bir elle müdahale vardır: nedenini bul, sonra `systemctl restart vault-agent`
      (yeniden render şablonun izniyle yazar). Değer rotasyon tablosunda DEĞİLDİR (rotasyon dışı sır —
      döndürme reçetesi RUNBOOK telemetri bölümünde).
    success_msg: "{{ item.item.yol }}: {{ item.item.mod }} {{ item.item.sahip }}:{{ item.item.grup }}"
  loop: "{{ izin_denetim_sonucu.results }}"
  loop_control:
    label: "{{ item.item.yol }}"
  when: item.stat.exists
