---
# TSK-176 Faz A0 — sağlık hükmü (deploy.sh 16). "kurulu != çalışır".
#
# İKİ TUR 2 DÜZELTMESİ BURADA BULUŞUR:
#
# K5 — KAPININ SEMANTİĞİ. Eski hâl koşulsuzdu: rol hiçbir uzun ömürlü servisi BAŞLATMAZ
# (`etkin_birimler` görevinde `state` YOK, F10 kararı), ama sonunda `meridian.service` aktif
# olmasını ŞART koşuyordu. Taze/soğuk bir A1'de — yani rolün ilan edilmiş birincil senaryosunda —
# yakınsama tamamen başarılıyken playbook "failed" derdi ve rolün bunu düzeltmesi kısıtı gereği
# imkânsızdı; operatör her koşumda kırmızı görüp kapıyı kendisi geçersiz sayardı. Görmezden
# gelinen kapı, kapı değildir. Yeni semantik: kapı `beklenen_aktif` ile açılır/kapanır ve
# KAPANDIĞI ADIYLA BASILIR. Soğuk kurulum / bakım penceresi: `-e beklenen_aktif=false`.
#
# K4 — CHECK-MODE. `command`/`shell` check-mode'da ATLANIR ve register'da `stdout` hiç doğmaz;
# ona dayanan bir assert boş dizgeyle karşılaşıp "hiç ölçülmemiş bir şey hakkında" arıza beyan
# ederdi. README'nin İLK ops komutu (`--check --diff`) tam bu yüzden HER ZAMAN kırmızı bitiyordu.
# Ölçüm yapılamayan bir modda kapı KAPI DEĞİL, açıkça "ÖLÇÜLMEDİ" raporudur.
#
# `delegate_to` YOK ve gerekmez: playbook ZATEN hedefte koşuyor, 127.0.0.1 A1'in kendisidir
# (healthz yalnız A1 içinden erişilir — dagit [5] ile aynı kısıt).

# ÖNCE ÖLÇ, SONRA HÜKÜM VER: aktiflik durumu hem kapının teşhis metnini hem de kapı kapalıyken
# basılan raporu besler. Ölçüm görevi kapıya TABİ DEĞİLDİR — `-e beklenen_aktif=false` ile koşan
# operatör de servisin ne durumda olduğunu görmelidir.
- name: Meridian servisi aktif mi (ÖLÇÜM — hüküm bir sonraki görevde)  # noqa: command-instead-of-module
  # noqa gerekçesi: `systemd_service` bir birimi BAŞLATIR; burada istenen "hiçbir şeyi
  # değiştirmeden sor"dur. `is-active` aktifken 0, aktif değilken 3 döner; başka çıkış kodu
  # gerçek arızadır (`failed_when: false`/`ignore_errors` Yasa 4 gereği YASAK).
  ansible.builtin.command:
    cmd: systemctl is-active meridian.service
  register: meridian_aktif
  changed_when: false
  failed_when: meridian_aktif.rc not in [0, 3]

- name: KAPI — meridian.service aktif olmalı
  ansible.builtin.assert:
    that:
      - meridian_aktif.stdout | trim == 'active'
    fail_msg: >-
      meridian.service AKTİF DEĞİL (durum: {{ meridian_aktif.stdout | default('(ölçülemedi)') | trim }}).
      Bu rol hiçbir uzun ömürlü servisi başlatmaz/restart etmez (bakım penceresi kararı) —
      teşhis: `journalctl -u meridian -n 100`; başlatma kararı operatörün/dagit.sh'ındır.
      Soğuk kurulum/bakım koşumuysa kapıyı `-e beklenen_aktif=false` ile kapatın.
    success_msg: "meridian.service: active"
  when: (beklenen_aktif | bool) and (not ansible_check_mode)

- name: Sağlık kontrolü — healthz 200
  # SINIR, açık beyan: healthz nabız 900 sn'den eskiyse 503 döner ("bayat ama süreç canlı" —
  # meridian/api.py::healthz). Döngü her turda nabzı tazeler (bar işlenmese de), yani 503 normal
  # işleyişte beklenmez; beklenirse bu görev DÜŞER ve bu FAIL-CLOSED tercih bilinçlidir.
  ansible.builtin.uri:
    url: "{{ saglik_url }}"
    method: GET
    status_code: 200
    return_content: false
  register: saglik
  until: saglik.status == 200
  retries: "{{ saglik_deneme }}"
  delay: "{{ saglik_bekleme }}"
  changed_when: false
  when: (beklenen_aktif | bool) and (not ansible_check_mode)

# Yasa 6 + bedel yasası: atlanan kapı SESSİZ kalmaz. "Ölçmedim" ile "ölçtüm, iyiydi" aynı
# görünmemeli — atlama nedeni ve o an ölçülebilen durum ADIYLA basılır.
- name: Sağlık kapısı ATLANDI — neden (kapı kapalıyken tek çıktı budur)
  ansible.builtin.debug:
    msg: >-
      SAĞLIK KAPISI ATLANDI — neden:
      {{ 'check-mode (--check): command görevleri koşmaz, healthz sorgulanmaz' if ansible_check_mode
         else '-e beklenen_aktif=false verildi (soğuk kurulum / bakım penceresi)' }}.
      Ölçülebilen durum: meridian.service =
      {{ meridian_aktif.stdout | default('(check-mode: ölçülmedi)') | trim }}.
      Bu ATLAMA bir sağlık HÜKMÜ DEĞİLDİR: "kurulu != çalışır" sorusu cevapsız kalmıştır.
  when: (not (beklenen_aktif | bool)) or ansible_check_mode

# TSK-265 düzeltme turu 1 (güvenlik incelemesi I2) — BEKÇİNİN RESTART YETKİSİ "kurulu ≠ çalışır".
# tick-watchdog `User=ubuntu` koşar; meridian.service'i yeniden başlatma yetkisi YALNIZ
# 52-meridian-tick-watchdog.rules'tadır. Kural eksik/bozuksa bekçi her koşuda "ilerleme var" basar ve
# sağlıklı görünür — ilk gerçek ihtiyaçta RESTART BAŞARISIZ. Bu kapı yetkiyi MÜDAHALESİZ ölçer:
# root olarak `pkcheck`, özne herhangi bir ubuntu süreci (kural `subject.user`a bakar), ayrıntılar
# systemd'nin restart'ta geçirdiğinin aynısı (unit=meridian.service, verb=restart). Hiçbir şey
# yeniden başlatılmaz. pkcheck(1) çıkışları: 0 izinli · 1 izinsiz · 2 etkileşim gerekir (kural
# eşleşmedi) · 3 iptal · 127 sorgu hatası.
# ÖLÇÜLEMEYEN HÂL KAPI DEĞİL RAPORDUR (K4 disiplini): ikili yok / ubuntu süreci yok / 127 / check-mode
# → adıyla basılır, "geçti" SAYILMAZ. Beklenti (ÖLÇÜLMEDİ, ilk koşum ölçer): root çağıran başka bir
# kimliğin süreci için ayrıntılı sorgu yapabilir; root OLMAYAN bir çağıranın ayrıntı geçirmesi
# polkit'te güvenilir-çağıran kısıtına takılır — bekçinin kendi kendini sınaması bu yüzden yazılmadı.
- name: Bekçi restart yetkisi — pkcheck ikilisi var mı (ÖLÇÜM)
  ansible.builtin.stat:
    path: /usr/bin/pkcheck
  register: pkcheck_ikili

- name: Bekçi restart yetkisi — ubuntu öznesi (ÖLÇÜM; herhangi bir ubuntu süreci)
  ansible.builtin.command:
    cmd: "pgrep -o -u {{ meridian_kullanici }}"
  register: pkcheck_ozne
  changed_when: false
  failed_when: pkcheck_ozne.rc not in [0, 1]
  when: not ansible_check_mode

- name: Bekçi restart yetkisi — pkcheck (ÖLÇÜM; root çağıran, ubuntu öznesi, restart ayrıntıları)
  ansible.builtin.command:
    argv:
      - /usr/bin/pkcheck
      - --action-id
      - org.freedesktop.systemd1.manage-units
      - --process
      - "{{ pkcheck_ozne.stdout | trim }}"
      - --detail
      - unit
      - meridian.service
      - --detail
      - verb
      - restart
  register: pkcheck_sonuc
  changed_when: false
  failed_when: pkcheck_sonuc.rc not in [0, 1, 2, 3, 127]
  when:
    - not ansible_check_mode
    - pkcheck_ikili.stat.exists
    - (pkcheck_ozne.rc | default(1)) == 0

- name: KAPI — 52 kuralı ubuntu öznesine meridian.service restart'ını VERİR
  ansible.builtin.assert:
    that:
      - pkcheck_sonuc.rc == 0
    fail_msg: >-
      BEKÇİ YETKİSİZ: pkcheck çıkış {{ pkcheck_sonuc.rc }} (1 izinsiz · 2 kural eşleşmedi, etkileşim
      ister · 3 iptal). tick-watchdog meridian.service'i yeniden BAŞLATAMAZ — asılı-tick koruması dişsiz.
      Teşhis: `ls -l /etc/polkit-1/rules.d/52-meridian-tick-watchdog.rules`, `journalctl -u polkit -n 20`.
      stderr: {{ pkcheck_sonuc.stderr | default('') }}
    success_msg: "52-meridian-tick-watchdog.rules: ubuntu → meridian.service restart İZİNLİ (pkcheck 0)"
  when:
    - not ansible_check_mode
    - pkcheck_sonuc is not skipped
    - (pkcheck_sonuc.rc | default(-1)) in [0, 1, 2, 3]

- name: Bekçi restart yetkisi ÖLÇÜLEMEDİ — neden (pkcheck kapısı kapalıyken tek çıktı budur)
  ansible.builtin.debug:
    msg: >-
      BEKÇİ YETKİ KAPISI (pkcheck) ÖLÇÜLEMEDİ — neden:
      {{ 'check-mode (--check): command görevleri koşmaz' if ansible_check_mode
         else ('/usr/bin/pkcheck yok' if not pkcheck_ikili.stat.exists
         else ('ubuntu süreci bulunamadı (pgrep çıkış ' ~ (pkcheck_ozne.rc | default('?')) ~ ')'
               if (pkcheck_ozne.rc | default(1)) != 0
         else 'pkcheck sorgu hatası (127): ' ~ (pkcheck_sonuc.stderr | default('')))) }}.
      Bu bir yetki HÜKMÜ DEĞİLDİR: 52 kuralının çalıştığı bu koşumda ölçülmedi.
  when: >-
    ansible_check_mode
    or (not pkcheck_ikili.stat.exists)
    or ((pkcheck_ozne.rc | default(1)) != 0)
    or ((pkcheck_sonuc.rc | default(-1)) == 127)

- name: Timer envanteri  # noqa: command-instead-of-module
  # RAPOR, KAPI DEĞİL (Rol-1 hükmü 6): timer'ların "next elapse" değeri kadans kararına bağlıdır
  # ve kapalı bir kadans arıza DEĞİLDİR — düşürmek yanlış alarm üretirdi.
  ansible.builtin.command:
    cmd: systemctl list-timers --no-pager --no-legend
  register: timer_envanteri
  changed_when: false
  failed_when: timer_envanteri.rc not in [0, 1]

- name: Timer raporu
  ansible.builtin.debug:
    msg: "{{ timer_envanteri.stdout_lines | default(['(check-mode: command atlandı)']) }}"

# TSK-176 T1 Task 1 (2026-09-15) — "kurulu != çalışır" sorusunun TERRAFORM yarısı. `paketler.yml`
# paketi kurar; kurulmuş bir paket ÇALIŞAN bir ikili demek DEĞİLDİR (fail-notify dersi: birim
# H9'dan beri kuruluydu ve hiç ateşlenmemişti). Kapı iki şeyi birden ölçer: ikili KOŞUYOR mu ve
# sürümü PİNLE aynı mı — ikincisi olmadan apt bir gün başka bir sürüm bırakır ve
# `.terraform.lock.hcl` ile state'in birlikte yaşadığı dünyada bunu ancak plan çıktısı bozulunca
# görürdük. SÜRÜM BURADA SABİT YAZILMAZ: beklenen değer `terraform_surumu` değişkeninden türetilir
# (apt revizyon soneki atılarak) — tek-kaynak yasası; çivi tests/test_ansible_a0_terraform_v501.py.
- name: Terraform sürümü (ÖLÇÜM — hüküm bir sonraki görevde)
  ansible.builtin.command:
    cmd: terraform version -json
  register: tf_surum
  changed_when: false

- name: KAPI — terraform sürümü pinden ayrışmamalı
  ansible.builtin.assert:
    that:
      - (tf_surum.stdout | from_json).terraform_version == (terraform_surumu | regex_replace('-\d+$', ''))
    fail_msg: >-
      terraform sürümü PİNDEN AYRIŞTI (ölçülen:
      {{ (tf_surum.stdout | from_json).terraform_version | default('(ölçülemedi)') }}).
      Teşhis: `apt policy terraform`; düzeltme `paketler.yml` Terraform görevinin yeniden
      koşmasıdır — sürümü elle yükseltmek İKİNCİ BİR KAYNAK yaratır (pin `terraform_surumu`).
    success_msg: "terraform: kurulu sürüm pinle aynı"
  when: not ansible_check_mode

# Yasa 6 + bedel yasası (yukarıdaki sağlık kapısıyla AYNI disiplin): atlanan kapı SESSİZ kalmaz —
# "ölçmedim" ile "ölçtüm, iyiydi" aynı görünmemeli.
- name: Terraform sürüm kapısı ATLANDI — neden (kapı kapalıyken tek çıktı budur)
  ansible.builtin.debug:
    msg: >-
      TERRAFORM SÜRÜM KAPISI ATLANDI — neden: check-mode (--check): `command` görevleri koşmaz,
      `terraform version` sorulmaz. Bu ATLAMA bir sürüm HÜKMÜ DEĞİLDİR: "kurulu != çalışır"
      sorusunun terraform yarısı cevapsız kalmıştır.
  when: ansible_check_mode
