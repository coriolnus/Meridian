---
# TSK-176 Faz A0 Task 2 — `meridian_a1` görev zinciri.
#
# SIRA SÖZLEŞMEDİR, süs değil:
#   paketler     → redis/docker/unattended olmadan sonraki hiçbir adım anlamlı değil
#   dizinler     → birimler ve kum havuzları var olmayan dizine yazamaz
#   venv         → birimlerin ExecStart'ı .venv/bin/python'a bakar; venv'siz enable edilen birim
#                  ilk atışta 203/EXEC ile düşerdi
#   polkit       → BİRİMLERDEN ÖNCE (TSK-265 düzeltme turu 1, güvenlik incelemesi I2). Kural tek başına
#                  zararsızdır (yalnız ek yetki), ama bir birim yetkisini ondan alabilir: tick-watchdog
#                  `User=ubuntu` koşar ve restart'ı 52 kuralındadır. Birimler kendi flush'larıyla
#                  daemon-reload'u HEMEN yapar; polkit sonra koşsaydı aradaki bir kapı (sir_denetimi)
#                  düştüğünde bekçi kuralsız kalırdı — "ilerleme var" basar, ilk gerçek ihtiyaçta
#                  RESTART BAŞARISIZ. polkit.yml kendi flush'ıyla polkit'i birimlerden ÖNCE yeniden
#                  başlatır (handler'lar tanım sırasıyla koşar: ortak flush'ta önce daemon-reload olurdu).
#   birimler     → drop-in'ler var olmayan birimin .d dizinine yazılmaz
#   sir_denetimi → DROP-IN'LERDEN ÖNCE (TUR 2, K1). Kopyalanan drop-in'lerin beşi
#                  `LoadCredential=` taşır ve dosyaların kendi başlıkları şunu yazar: "kaynak
#                  dosya YOKSA systemd birimi BAŞLATMAZ". Yani sırsız bir hosta bu drop-in'leri
#                  koymak, çalışan (ya da çalışacak) meridian.service'i başlatılamaz hâle
#                  getirmektir. Denetim burada DURUR ve hangi betiğin koşulacağını söyler;
#                  birim dosyaları o noktada zaten kurulmuş olur (yarım değil, kapılı yakınsama).
#   dropinler    → hermes'ten önce: sertleştirme + credential kanalı yerinde olsun
#   hermes       → beyin zinciri yapılandırması (ikili kurulumu ROL DIŞI)
#   saglik       → EN SONDA: "kurulu != çalışır" hükmü (koşullu kapı, bkz. `beklenen_aktif`)
# `tests/test_ansible_a0_v451.py::test_gorev_zinciri_tam_ve_sirali` ve
# `::test_sir_denetimi_dropinlerden_once_kosar` bu listeyi ölçer.
- name: Sistem paketleri
  ansible.builtin.import_tasks: paketler.yml

- name: Dizinler ve kum havuzları
  ansible.builtin.import_tasks: dizinler.yml

- name: Uv ve Meridian venv'i
  ansible.builtin.import_tasks: venv.yml

- name: Polkit kuralları (birimlerden ÖNCE — TSK-265 I2)
  ansible.builtin.import_tasks: polkit.yml

- name: Systemd birimleri ve kadans kapısı
  ansible.builtin.import_tasks: birimler.yml

- name: Sır dosyası denetimi (credential drop-in'lerinin ÖN KOŞULU)
  ansible.builtin.import_tasks: sir_denetimi.yml

- name: Systemd drop-in'leri
  ansible.builtin.import_tasks: dropinler.yml

- name: Hermes yapılandırması
  ansible.builtin.import_tasks: hermes.yml

- name: Sağlık kontrolü ("kurulu != çalışır")
  ansible.builtin.import_tasks: saglik.yml
