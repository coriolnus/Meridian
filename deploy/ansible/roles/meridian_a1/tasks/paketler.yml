---
# TSK-176 Faz A0 Task 2 — sistem paketleri + redis + unattended-upgrades (deploy.sh 1).
# TSK-195 (2026-09-16) EKİ: `docker` grubu üyeliği de burada — gerekçesi ilgili görevin şerhinde.
#
# redis-server ŞART, opsiyonel değil: meridian/hotstate.py sıcak durumu (heartbeat, mrd:bars ring)
# Redis'te tutar, meridian/barsarchive.py o ring'i diske arşivler. Redis yoksa arşivci her turda
# "REDIS YOK" deyip boşa döner ve dakikalık barlar TEMELLİ kaybolur (deploy.sh başlığındaki
# gerekçenin aynısı). Ubuntu paketi VARSAYILAN OLARAK yalnız 127.0.0.1 dinler — bu rol
# /etc/redis/redis.conf'a DOKUNMAZ (dokunmak A1'in public IP'sinde parolasız Redis açmak olurdu).
- name: Sistem paketleri (apt)
  ansible.builtin.apt:
    name: "{{ apt_paketleri }}"
    state: present
    update_cache: true
    # 3600 sn: aynı saatte ikinci koşum apt indeksini yeniden çekmez (idempotency turunun
    # "changed=0" hedefi apt cache'i yüzünden gürültüye boğulmasın).
    cache_valid_time: 3600

- name: Redis servisi (enable + started — deploy.sh 1 `enable --now` ile birebir)
  # redis-server uzun ömürlü MERIDIAN servisi DEĞİLDİR (restart yasağı listesi meridian/
  # barsarchive/litestream/hindsight/apisix birimlerini kapsar); deploy.sh onu her koşuda
  # `enable --now` ile açıyordu ve `started` yalnız DURUYORSA başlatır (restart DEĞİL).
  ansible.builtin.systemd_service:
    name: redis-server
    enabled: true
    state: started

# TSK-195 (2026-09-16) — `meridian_kullanici`nın `docker` grubu ÜYELİĞİ.
#
# KAPSAM GENİŞLEMESİ, BEYANLI: rol bugüne dek hiçbir SİSTEM GRUBUNA dokunmuyordu — `dizinler.yml`
# yalnız kendi yarattığı dizinlerin sahipliğini zorlar, kullanıcı hesabına hiç dokunulmazdı. Bu iki
# görev o sınırı bilerek aşıyor.
# TAŞIDIĞI RİSK KÜÇÜK DEĞİLDİR ve burada adıyla duruyor: `docker` grubu üyeliği pratikte
# ROOT-EŞDEĞERİ yetkidir — grubun üyesi konteynere kök dosya sistemini yazılabilir bağlayabilir ve
# sudo parolası hiç sorulmadan root olabilir; yani bu iki satır, `ubuntu` hesabının yetki sınıfını
# değiştirir. Üyelik yine de role giriyor çünkü ALTERNATİFİ DAHA KÖTÜ: yetki A1'de ZATEN var
# (operatör 2026-09-16, sunucu Docker bağlantısı için ELLE verdi) ve elle verilen bir yetki
# yeniden kurulumda SESSİZCE kaybolur — kök neden aylar sonra aranır (ROADMAP TSK-195 Why).
# Ölçülebilir bir root-eşdeğeri, ölçülemeyen bir root-eşdeğerinden iyidir.
#
# ÖN KOŞUL ÖLÇÜLDÜ (2026-09-16): rol docker'ı KURUYOR — `docker.io` bu dosyanın İLK görevinin
# çektiği `apt_paketleri` listesindedir ve grubu yaratan o paketin kendisidir; `paketler.yml` de
# görev zincirinin ilk halkasıdır (`tasks/main.yml`). Yani gerçek koşumda grup bu satıra
# gelindiğinde VARDIR: aşağıdaki koşul normal yolda DAİMA işler, sessiz atlama değildir.
#
# KOŞUL YİNE DE VAR, tek ve ÖLÇÜLMÜŞ bir arıza için: `--check` kipinde apt hiçbir şey KURMAZ, yani
# soğuk bir hostun kuru koşumunda grup yoktur. `ansible.builtin.user` grup adını `grp.getgrnam` ile
# çözer ve bulamazsa "Group docker does not exist" ile DÜŞER — bu doğrulama modülün check-mode
# dalından ÖNCE gelir (ansible-core 2.18.19 `modules/user.py` içindeki `get_groups_set`, kaynaktan
# okundu). Koşulsuz yazılsaydı soğuk-host kuru koşumu tam burada kırmızı olur ve arıza rolün kendi
# hatası gibi görünürdü — `python3-debian` satırının kapattığı ("check kipi kuramadı") AYNI sınıf.
- name: Docker grubu VAR MI (varsayılmaz, ölçülür — üyelik koşulu bundan türer)
  # `fail_key: false` bir sessiz-yutma DEĞİLDİR: grubun YOKLUĞU burada ölçülen sonucun kendisidir
  # (kayıt `None` döner ve üyelik görevi atlanır), arıza değil. Modül `getent` ikilisini okur,
  # `command`/`shell` değildir — check kipinde de gerçekten koşar.
  ansible.builtin.getent:
    database: group
    key: "{{ docker_grubu }}"
    fail_key: false
  register: docker_grup_olcumu

- name: Meridian kullanıcısı docker grubuna eklenir (root-eşdeğeri yetki — yukarıdaki şerh)
  ansible.builtin.user:
    name: "{{ meridian_kullanici }}"
    groups: "{{ docker_grubu }}"
    # `append: true` ŞARTTIR. Modülün varsayılanı `false`'tur ve `false` kullanıcının ikincil grup
    # kümesini bu listeyle DEĞİŞTİRİR: `ubuntu`nun `adm`/`sudo`/`dialout`/… üyelikleri tek koşumda
    # silinir, yani hesap sudo'sunu kaybeder ve makineye ancak konsoldan girilebilirdi. Gerçek bir
    # arıza sınıfı, süs değil — çivi bu bayrağı ADIYLA ölçer.
    append: true
  when: docker_grup_olcumu.ansible_facts.getent_group[docker_grubu] is not none

- name: Gözetimsiz güncelleme politikası (52meridian-unattended-upgrades)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../oracle-a1/52meridian-unattended-upgrades"
    dest: /etc/apt/apt.conf.d/52meridian-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# TSK-176 T1 Task 1 — Terraform (HashiCorp apt deposu, aarch64). Sürüm TEK yerde: `terraform_surumu`
# (defaults/main.yml). Okuyucusu (Yasa 6): bu iki görev + `saglik.yml` sürüm kapısı + `altyapi/altyapi.sh`
# (A1'de `terraform` ikilisini çağıran tek yer) + çivi `tests/test_ansible_a0_terraform_v501.py`.
#
# NEDEN DEPO, NEDEN ELLE ZIP DEĞİL: ikili doğrudan indirilirse imza doğrulaması ve yükseltme yolu
# bize kalır (uv installer'ının sha256 kapısını yazdıran aynı ders); apt deposu imzayı ve
# yeniden-kurulabilirliği taşır. `signed_by` bir URL'dir: `deb822_repository` anahtarı indirir ve
# `/etc/apt/keyrings` altına yazar — `apt-key` (küresel anahtarlık, 2022'den beri kullanım dışı)
# bilinçli olarak KULLANILMAZ. Modül ansible-core 2.15+ ile gelir; bu depo 2.18.19 ile koşar
# (ölçüldü 2026-09-15, `.venv/bin/ansible --version`), yani düşürme gerekmedi.
- name: HashiCorp apt deposu (deb822, imza anahtarı URL'den)
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: arm64
    signed_by: https://apt.releases.hashicorp.com/gpg
    state: present
  register: hashicorp_depo

# Handler DEĞİL, koşullu görev: v451 Rol-1 hükmü 5 handler kümesini iki kimliğe pinler (restart sözleşmesi);
# apt listesi Terraform görevinden ÖNCE çekilmeli — cache_valid_time yeni deponun listesini görmez
# (vaka 2026-09-15 'No package matching terraform'). ansible-lint no-handler bilinçli atlanır.
- name: Depo yeni eklendiyse apt önbelleğini tazele # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: hashicorp_depo is changed

# PİN BİR KARARDIR: `state: present` + tam sürüm, `latest` DEĞİL. `latest` olsaydı altyapı aracının
# sürümü bakım penceresinde kendiliğinden değişir ve `.terraform.lock.hcl` ile state'in birlikte
# yaşadığı bir dünyada bunu ancak plan çıktısı bozulunca görürdük. Yükseltme = `terraform_surumu`
# satırının değişmesi (bir commit) + bu görevin koşması.
- name: Terraform (pinli; yükseltme apt'ye bırakılmaz — sürüm değişimi bir commit'tir)
  ansible.builtin.apt:
    name: "terraform={{ terraform_surumu }}"
    state: present
    update_cache: true
    # 3600 sn: yukarıdaki sistem paketleri göreviyle aynı gerekçe — aynı saatte ikinci koşum apt
    # indeksini yeniden çekmez (idempotency turunun "changed=0" hedefi).
    cache_valid_time: 3600
