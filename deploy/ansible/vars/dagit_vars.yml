# Bu dosyalar rsync kapsamının DIŞINDA yaşar ve ELLE kurulur (`deploy/oracle-a1/deploy.sh`).
# Kapı içerik kıyaslar, RAPORLAR — engellemez: kurulum bakım penceresinin işidir, hüküm operatörün.
# `repo` DEPO KÖKÜNE görelidir, `canli` MUTLAK yoldur (göreli bir canlı yol A1'in o anki cwd'sine
