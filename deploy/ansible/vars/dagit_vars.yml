---
# deploy/ansible/vars/dagit_vars.yml — TSK-176 Faz A1: dağıtım playbook'unun TEK-KAYNAK listeleri.
#
# NE İÇİN VAR. `deploy/ansible/dagit.yml` (Task 2) `dagit.sh`ın kapılarını devralır; kapıların
# okuduğu DÖRT liste burada yaşar. Geçiş süresince (Task 3'e kadar) `dagit.sh` kendi kopyasını
# TUTAR ve iki kopyanın ayrışmasını `tests/test_ansible_dagit_v452.py` bölüm A KIRMIZI yapar
# (Tek-kaynak yasası: kopya kaçınılmazsa türetme + ayrışma çivisi). Task 3'te dagit.sh listeleri
# SİLİNİR ve bu dosya tek kaynak kalır.
#
# ÜRETİM DEĞİL, TAŞIMA: bu dosyanın ilk hâli `dagit.sh`tan MAKİNEYLE çıkarıldı (elle kopyalama
# bir liste taşımasında en sık ölçülen hata sınıfıdır), sonra gerekçeler yanına yazıldı.
# Gerekçelerin TAMAMI `dagit.sh`ın ilgili bölüm başlığındadır — burada yalnız SINIF adı durur.

# =================================================================================================
# rsync dışlama listesi — `dagit.sh` RSYNC_EXC ile BİREBİR (28 öğe, ölçüldü 2026-09-08)
# =================================================================================================
# `--delete` ile koşan bir rsync'te bu liste bir KONFOR değil bir GÜVENLİK sınırıdır: listede
# olmayan her canlı-sahipli dizin dağıtımda SİLİNİR. Sınıflar (her biri ölçülmüş bir vaka):
#   * canlı-sahipli defter/yedek : state · backups · /var (bot kum havuzu, 2026-08-29)
#   * sır                        : .env · .env.* · .dash.env (2026-08-01: --delete .dash.env'i SİLDİ)
#   * araç katmanı / harness     : .claude · .agents · .codex · .superpowers · .impeccable …
#   * scratch                    : scratchpad · scratch-* (2026-08-24: scratch-panov2 canlıya gidiyordu)
#   * derleme                    : node_modules · ui/node_modules · /ui (artefakt gider, kaynak GİTMEZ)
#   * ölçüm ham çıktısı          : research/olcumler/*/{seanslar.json,run.stderr.log,state}
# ANKORLU DESENLER (`/var`, `/ui`) BİLİNÇLİDİR: baştaki `/` rsync'te "transfer kökü" demektir —
# ileride doğacak bir `ui/src/var/` ya da `meridian/web/ui/` sessizce dağıtım dışı kalmasın.
# UYARI: rsync `.gitignore` OKUMAZ, yalnız bu listeyi okur — iki mekanizma AYRI ve birini
# kapatmak ötekini kapatmaz.
rsync_disla:
  - ".venv"
  - ".git"
  - "state"
  - "backups"
  - "/var"
  - "scratchpad"
  - "scratch-*"
  - ".superpowers"
  - "__pycache__"
  - ".claude"
  - ".hypothesis"
  - "mutants"
  - ".pytest_cache"
  - ".env"
  - ".env.*"
  - ".dash.env"
  - ".agents"
  - ".codex"
  - ".github"
  - "skills-lock.json"
  - ".impeccable"
  - ".import_linter_cache"
  - "research/olcumler/*/seanslar.json"
  - "research/olcumler/*/run.stderr.log"
  - "research/olcumler/*/state"
  - "node_modules"
  - "ui/node_modules"
  - "/ui"

