# =================================================================================================
# 51-vault-yan-dosya.conf — failover zincirinin ALTI üye anahtarı KASADAN (Faz-2 DALGA-2)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR (kardeşi 50-creds.conf ile aynı hüküm): `dagit.sh`
# `.service.d` dizinini kopyalamaz; kurulumu A0 rolü ya da operatörün bakım penceresi yapar.
#
# ---- NUMARA 51, ÇÜNKÜ SIRA HÜKÜMDÜR ------------------------------------------------------------
# systemd drop-in'leri ADA GÖRE sıralı okur ve aynı anahtarda SONRAKİ dosya kazanır. `50-creds.conf`
# LoadCredential kanalını kurar (üç sır: DB · LLM · TENANT); bu dosya `EnvironmentFile` kanalına
# ALTI ÜYE anahtarını ekler. İkisi AYRI sırlara dokunur, ama numara yine de 50'den BÜYÜK seçildi:
# aynı anahtara dokunan bir gelecekteki satırın hangi tarafta kazanacağı tahmine bırakılmamalı.
#
# ---- NE EKLİYOR --------------------------------------------------------------------------------
# `/opt/hindsight/.env.vault` YALNIZ sır satırlarını taşır (envanter `vault_dosyalar`):
# HINDSIGHT_API_{REFLECT,CONSOLIDATION}_LLM_{1,2,3}_API_KEY. Altısı da OpenRouter anahtarının
# kopyasıdır ve zincir ÜYESİ ana anahtarı DEVRALMAZ (EDG-2026-080/081) — her üye kendi satırını
# okur. Asıl `/opt/hindsight/.env` (29 ayar + bu altı satır) DOKUNULMADAN durur: systemd ikinci
# dosyayı SONRA okur ve altı anahtarı kasadaki değerlerle EZER; ayar satırları ilk dosyadan gelir.
# Boş `EnvironmentFile=` sıfırlaması KULLANILAMAZ — asıl dosya sır dışında yapılandırma da taşır
# (50-creds.conf'un Faz-2 şerhiyle aynı gerekçe).
#
# ---- GERİ ALIM ---------------------------------------------------------------------------------
# `-` işareti (opsiyonel): dosya YOKSA satır atlanır ve birim eski kanalla açılır. Kasa hiç
# kurulmasa da, Agent durdurulsa da hafıza API'si koşmaya devam eder (tasarım §6.4). Geri alım:
# bu dosyayı kaldır + `daemon-reload` + `restart hindsight-api`.
#
# ---- RESTART GEREKİR ---------------------------------------------------------------------------
# `EnvironmentFile` AÇILIŞTA okunur. Birim adı envanterin `vault_dosyalar.yeniden_baslat` alanında
# yazılıdır ve rotasyon (`sir_rotasyon.sh --vault`) restart listesini ORADAN okur.
#
# ---- KAZANIM SINIRI, DÜRÜSTÇE ------------------------------------------------------------------
# Bu kanal B SINIFIDIR ve öyle KALIR: değer hindsight-api sürecinin ORTAMINA girer
# (`/proc/<pid>/environ`da görünür). Kazanılan şey "sır ortamda değil" DEĞİL, "sırrın TEK kaynağı
# kasa" — yani rotasyonda unutulan kopya sınıfının kapanmasıdır. Bunu "tam kazanım" diye yazmak
# 50-creds.conf'un açıkça reddettiği uydurma olurdu.
[Service]
EnvironmentFile=-/opt/hindsight/.env.vault
