# =================================================================================================
# 50-creds.conf — hindsight-api'nin ÜÇ sırrı systemd LoadCredential kanalına
# (TSK-064 YOL-1 Faz-1A, 2026-09-07)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR. `dagit.sh` birimleri tek tek kıyaslar (F9 listesi) ve
# `.service.d` dizinini KOPYALAMAZ; kurulum bakım penceresinde, operatör eliyle yapılır. Bilerek
# böyle: `LoadCredential=` KAYNAK DOSYASI YOKSA systemd birimi HİÇ BAŞLATMAZ ("Failed to load
# credential"). Bu üç satırı doğrudan `hindsight-api.service`e yazmak, `/etc/hindsight/creds/*`
# henüz üretilmemişken koşacak İLK kurulumda Hafıza API'sini düşürürdü — hazırlığın kendisi arıza
# olurdu. Drop-in, satırları canlıya değmeden VERSİYONA almanın yoludur (53-nous-kapi ve
# 50-dash-credential ile aynı hüküm; gerekçenin uzun hâli 50-dash-credential.conf'ta).
#
# ÜÇ SATIR, TEK DOSYA — VE BUNUN BEDELİ: birim ancak ÜÇ kaynak dosya da varken açılır. Kazanç:
# üç sır tek restart'la geçer ve yarım kurulu bir birim hiç doğmaz. Bedel: eksik tek bir kaynak
# bütün geçişi durdurur — ki doğrusu budur, çünkü DB parolası olmadan açılan bir hindsight-api
# zaten iş yapamaz.
#
# ---- SINIF B YARIM KAZANIM, DÜRÜSTÇE BEYANLI (spec §2) -----------------------------------------
# Motor sırlarında (Faz-1B) kazanım TAMDIR: `secrets.get` credential dosyasını DOĞRUDAN okur, sır
# hiçbir sürecin ortamına girmez. Burada öyle DEĞİL. hindsight-api ÜÇÜNCÜ PARTİ bir süreçtir ve
# yapılandırmasını `HINDSIGHT_API_*` ORTAM değişkenlerinden okur; kaynağına dokunamayız. Bu yüzden
# `ExecStart` bir sarmalayıcıdır (`hindsight-api-baslat.sh`) ve credential dosyalarını hindsight'ın
# KENDİ ortamına koyar.
#   KAZANILAN: sır artık 0600'lük `/opt/hindsight/.env` DİSK dosyasında ve birimin `EnvironmentFile`
#     ortamında değil, süreç ölünce silinen 0400'lük bir tmpfs dosyasında yaşar; yedeklere,
#     `.env.bak-*` kopyalarına ve dosya izni kazalarına maruz kalan yüzey kapanır.
#   KAYBEDİLEN: hindsight-api sürecinin `/proc/<pid>/environ`ında sır YİNE görünür (aynı kullanıcı
#     olarak koşan başka bir sürece karşı korunmaz). Yani §4'ün canary'sindeki
#     "`/proc/<pid>/environ` grep 0" ölçütü BU birim için SAĞLANMAZ ve sağlanacakmış gibi
#     yazılamaz (uydurma yasağı) — sağlanan tek birim motordur.
# TAM kazanımın yolu upstream'in `HINDSIGHT_API_*_FILE` desteğidir ve o ÖLÇÜLMEDİ. Ölçülmemiş bir
# yeteneği "var" saymak, geçişi sessizce yarım bırakırdı; ölçüm Rol-1'in A1 penceresine ait
# (`hindsight-api --help` / upstream kaynağı). Ölçüm "var" derse sarmalayıcı düşer, drop-in KALIR.
#
# ---- KİMLİK = SIR ADI --------------------------------------------------------------------------
# `LoadCredential=<kimlik>:<kaynak>` — `<kimlik>` `$CREDENTIALS_DIRECTORY` altındaki DOSYA ADIDIR.
# Burada kimlik, kaynak dosyanın adı ve ortam değişkeninin adı ÜÇÜ DE AYNIDIR. Bunun iki okuyucusu
# var ve ikisi de tam bu adı arar: sarmalayıcı (hindsight-api için) ve
# `meridian.secrets.credential_oku` (pano vekili için, 54-hafiza-credential.conf ile). Ayrışırsa
# okuyucu dosyayı bulamaz, kanal SESSİZCE ölür ve `.env` hâlâ okunduğu için hiçbir şey bozulmaz:
# en pahalı hâl, çünkü geçiş "yapıldı" sanılır. Çivi: `tests/test_sir_credential_v439.py` bölüm I.
#
# KAYNAK DOSYA BİÇİMİ: `/etc/hindsight/creds/<AD>` YALNIZ değeri içerir (`AD=DEGER` DEĞİL; sondaki
# yeni satır serbest — iki okuyucu da kırpar). `AD=` öneki de tanınır (operatörün `.env` satırını
# kopyalaması öngörülebilir bir kazadır) ama sözleşme çıplak değerdir.
# İzin: root:root 0400 — systemd kaynağı PID 1 olarak, sandbox'tan ÖNCE okur; servis kullanıcısının
# (ubuntu) erişmesi GEREKMEZ. Spec §3 bu satırı "0600 root" diye yazmıştı; 0400 aynı işi gören DAR
# izindir ve 53-nous-kapi ile aynı hükümdür — plan (2026-09-07 Task 2) 0400 der, bu dosya onu izler.
#
# ---- İKİ FAZLI GEÇİŞ — BU DOSYA FAZ 1'DİR ------------------------------------------------------
# Faz 1 (bu dosya + sarmalayıcı): kanal EKLENİR, `EnvironmentFile` KALIR. İki kanal aynı anda
#   canlıdır ve sarmalayıcı credential'ı TERCİH eder (dosyası olmayan ad için ortam OLDUĞU GİBİ
#   kalır — çivi I6). Bu faz tek başına kurulsa bile davranış BİREBİR bugünküdür.
# Faz 2: `/opt/hindsight/.env`ten ÜÇ SATIR silinir; 29 AYAR satırı KALIR (spec §2 "32 → 3 + 29").
#   Boş `EnvironmentFile=` sıfırlaması KULLANILAMAZ — dosya sır dışında yapılandırma da taşır.
# Faz 2'den ÖNCE farksal ölçüm şarttır: `.env`teki üç satıra SAHTE değer + gerçek değer yalnız
#   credential'da → servis hâlâ `/health` 200 veriyor ve `/v1/*` kimlikli bir çağrı hâlâ 200 mü?
#   (Sağlık TEK BAŞINA yetmez: `/health` kimlik istemez ve sır tamamen yanlışken de 200 döner.)
[Service]
LoadCredential=HINDSIGHT_API_DATABASE_URL:/etc/hindsight/creds/HINDSIGHT_API_DATABASE_URL
LoadCredential=HINDSIGHT_API_LLM_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_LLM_API_KEY
LoadCredential=HINDSIGHT_API_TENANT_API_KEY:/etc/hindsight/creds/HINDSIGHT_API_TENANT_API_KEY
