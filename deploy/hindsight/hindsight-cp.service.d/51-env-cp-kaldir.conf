# =================================================================================================
# 51-env-cp-kaldir.conf — CP'nin iki sırrı YALNIZ KASADAN: eski ortam dosyasını (`.env-cp`) KAPAT
# (TSK-064 iki-kanal kapanışı, 2026-09-29; emsal `deploy/oracle-a1/meridian.service.d/51-dash-env-kaldir.conf`)
# =================================================================================================
# BOŞ `EnvironmentFile=` BİR SIFIRLAMADIR, bir "dosya yok" beyanı DEĞİL: systemd'de değer ALMAYAN bir
# liste-direktifi o ana kadar birikmiş TÜM girdileri siler — temel birimin
# `EnvironmentFile=/opt/hindsight/.env-cp` satırı VE `50-vault-yan-dosya.conf`un
# `EnvironmentFile=-/opt/hindsight/.env-cp.vault` satırı. Ardından TEK satır geri konur: Vault yan dosyası,
# bu kez TİRESİZ (ZORUNLU). Temel birim dosyasına DOKUNULMAZ (dagit [F9] içerik aynası ve depo–canlı
# ayrıklığı; dash-token emsali). 50 tarihsel kayıt olarak kalır; yönergesi bu dosya tarafından etkisizdir.
#
# NİYE ZORUNLU (tiresiz). Tire "dosya yoksa sessizce atla" demektir. `.env-cp` artık okunmadığı için yan
# dosyasız bir açılış konteyneri ANAHTARSIZ başlatırdı: ExecStart iki sırrı DEĞERSİZ `-e AD` ile verir ve
# değişken ortamda yoksa docker onu konteynere HİÇ koymaz (CP girişi 503, veri düzlemi çağrıları anahtarsız)
# — sessiz ve ancak ilk girişte görünen bir arıza. Zorunlu satırla aynı hâl birimin AÇILMAMASIDIR
# (`systemctl status hindsight-cp`: "Failed to load environment files") — gürültülü ve anında.
#
# ÖN KOŞUL (Rol-1 A1 ölçümü, 2026-09-29; yalnız AD ve izin okundu): `.env-cp.vault` 0400 root, Vault
# Agent'ın render hedefi ve `.env-cp` ile AYNI iki değişkeni taşır (HINDSIGHT_CP_ACCESS_KEY ·
# HINDSIGHT_CP_DATAPLANE_API_KEY). Envanter: `deploy/sir_envanteri.yaml` → `vault_dosyalar`.
#
# KURULUM: A0 rolü (`site.yml` → `dropinler.yml`); `dropin_kaynaklari`nın `hindsight-cp.service.d/*.conf`
# glob'u bu dosyayı ZATEN kapsar (yeni liste satırı gerekmez — v451). Elle kurma. `dagit.sh` drop-in KURMAZ.
# RESTART GEREKİR: konteynerin ortamı AÇILIŞTA yazılır; `daemon-reload` tek başına hiçbir şeyi değiştirmez.
#
# ESKİ DOSYA KALDIRILDI. `/opt/hindsight/.env-cp` bu drop-in yürürlüğe girdikten SONRA okuyucusuzdu;
# 2026-09-29 11:32Z'de Rol-1 (operatör "sen çalıştır") onu `/opt/hindsight/.key` ile birlikte A1'den KALDIRDI —
# `rm` DEĞİL, root-only yedek dizinine TAŞIMA: `/root/sir-yedek-20260929T113217Z-ikikanal/orijinal/`. Kaldırma
# KODUN işi değildi, operatör adımıydı (yedek → kaldır → doğrula) — reçete ve UYGULANDI notu
# `deploy/oracle-a1/RUNBOOK.md` "TSK-064 iki-kanal kapanışı" (dosyanın son bölümü); kayıt
# `deploy/sir_envanteri.yaml` → `rotasyon_kopyalari.emekli_kopyalar` (`kaldirildi` + `yedek_dizini`). Dosya geri
# doğarsa bu drop-in okumayı YİNE keser ve `sir_rotasyon.sh --envanter` onu EMEKLİ KOPYA diye bağırır.
# Çiviler: `tests/test_iki_kanal_kapanisi_v590.py` A bölümü (birleşik liste + systemd modeli) ·
# `tests/test_birim_argv_sir_v554.py` G4/G5 (argv'de değer yok, değer yan dosyadan).
#
# GERİ ALMA: ÖNCE `.env-cp` yedekten geri konur — dosya 2026-09-29'da kaldırıldı, yeri
# `/root/sir-yedek-20260929T113217Z-ikikanal/orijinal/` (sahip/izinleriyle; komut RUNBOOK'un GERİ ALMA satırında).
# SONRA bu dosyayı kaldır + `systemctl daemon-reload` + `systemctl restart hindsight-cp`: temel birimin `.env-cp`
# satırı ve 50'nin opsiyonel yan dosya satırı geri gelir. Sıra ters çevrilmez — dosya yokken 51'i kaldırmak
# temel birimin ZORUNLU `.env-cp` satırıyla birimi AÇMAZ.
[Service]
EnvironmentFile=
EnvironmentFile=/opt/hindsight/.env-cp.vault
