# =================================================================================================
# 50-vault-yan-dosya.conf — CP'nin iki sırrı KASADAN: ikinci `EnvironmentFile` (Faz-2 DALGA-2)
# =================================================================================================
# BU DOSYA KENDİLİĞİNDEN ETKİN DEĞİLDİR (50-creds.conf ile aynı hüküm): `dagit.sh` `.service.d`
# dizinini kopyalamaz; kurulumu A0 rolü ya da operatörün bakım penceresi yapar.
#
# ---- NİYE `--env-file` DEĞİL — ÖLÇÜLDÜ, GENELLENMEDİ --------------------------------------------
# Spec §1 "docker tüketicisi → ikinci `--env-file`" der ve bu APISIX'in ÖLÇÜLEN biçimidir. Bu birim
# docker koşar ama sırları `--env-file` ile ALMAZ: `hindsight-cp.service` ExecStart'ı iki sırrı
# DEĞERSİZ `-e HINDSIGHT_CP_ACCESS_KEY` · `-e HINDSIGHT_CP_DATAPLANE_API_KEY` biçiminde verir
# (TSK-226, 2026-09-25). docker istemcisi değersiz `-e AD`nin değerini KENDİ ortamından okur; o ortam
# systemd'nin birim ortamıdır ve onu `EnvironmentFile=` satırları doldurur. Yani kasa kanalı için
# bir dosya satırı YETER; `--env-file` eklemek drop-in'de ExecStart'ı sıfırlayıp BÜTÜNÜYLE yeniden
# yazmayı gerektirirdi (apisix'teki gibi: ikinci bir komut satırı kopyası + ayrışma çivisi) ve hiçbir
# şey kazandırmazdı.
# ARGV GÖRÜNÜRLÜĞÜ — bu şerhin 2026-09-14 hâli bunu hiç tartmamıştı: ExecStart o gün
# `-e HINDSIGHT_CP_ACCESS_KEY=${HINDSIGHT_CP_ACCESS_KEY}` biçimindeydi; systemd değeri ExecStart'a
# GENİŞLETİR, yani iki sır root `docker run` sürecinin argv'sinde (`ps`, `/proc/<pid>/cmdline`)
# makinedeki HER kullanıcıya açıktı (Rol-1 A1 ölçümü 2026-09-25; 2026-09-15'ten beri). Değersiz
# `-e AD` ile değer yalnız sürecin ORTAMINDA durur (`/proc/<pid>/environ` — sahibi root) ve docker
# onu API üzerinden konteynere taşır. Eski gerekçenin "`-e VAR=deger` `--env-file`i EZER" cümlesi
# docker için hâlâ doğrudur ama artık gerekçe DEĞİLDİR: komut satırında `=deger` kalmadı.
#
# ---- NİYE BU SATIR YETER -----------------------------------------------------------------------
# systemd birden çok `EnvironmentFile=` satırını SIRAYLA okur ve aynı anahtarda SONRAKİ dosya
# kazanır; drop-in'ler ana birimden SONRA yüklenir. Yani bu tek satır, iki değişkeni de kasadan
# gelen değerlerle değiştirir; docker istemcisi değersiz `-e AD` ile o BİRLEŞİK ortamdan okur ve
# ExecStart'a DOKUNULMAZ (ikinci bir komut satırı kopyası yok). Bu zincir — iki dosya sırası, kasa
# değerinin konteynere ulaşması, yan dosya yokken eski kanal, argv'de değer olmaması — sentetik
# değerlerle `tests/test_birim_argv_sir_v554.py` G4/G5/G6'da modellenir.
#
# ---- GERİ ALIM ---------------------------------------------------------------------------------
# `-` işareti (opsiyonel): dosya YOKSA systemd satırı atlar ve birim eski kanalla (`.env-cp`)
# açılır. Yani kasa hiç kurulmasa da, Agent durdurulsa da CP koşmaya devam eder (tasarım §6.4).
# Geri alım: bu dosyayı kaldır + `daemon-reload` + `restart hindsight-cp`.
#
# ---- RESTART GEREKİR ---------------------------------------------------------------------------
# Değerler konteynerin ORTAMINA açılışta yazılır: reload yetmez. `yeniden_baslat` alanı envanterde
# (`vault_dosyalar`) bu birimi ADIYLA taşır ve rotasyon (`sir_rotasyon.sh --vault`) onu oradan
# okur — burada ikinci bir liste tutulmaz.
[Service]
EnvironmentFile=-/opt/hindsight/.env-cp.vault
