# G3b ÇIKIŞ REFORMU (ROADMAP §3.2 G3b, 2026-07-30) — DÖRT YENİ SATIR, HEPSİ VARSAYILAN KAPALI/NÖTR.
# Batch L deseni birebir: satırlar burada olduğu için kum havuzunda ARANABİLİR, strategy.yaml onları
# taşımadığı için canlı etkileri SIFIRDIR (çivi testi: test_g3b_cikis_v124).
# Kanıt tabanı — G3b ön-ölçümü (2026-07-29, cf n≈2100): kapanış-KONUMU sürekli sinyal olarak SIFIR
# (IC≈0), ama PİVOT-ALTI kapanış kısa ufukta gerçek negatif (@5bar -0.74% vs pivot-üstü +0.32%, n=302;
# @20'de kısmen toparlar) → erken itlaf YALNIZ "pivot-altı kapanış" biçiminde savunulabilir.
exit.early_kill_pivot:    {min: 0,   max: 1,   step: 1,   type: int}     # pivot-altı kapanış → ertesi açılış çık; 0 = kapalı
# ERKEN İTLAF PENCERESİ: kural yalnız ilk `early_kill_bars` yönetim barında geçerlidir. Varsayılan 1 =
# ROADMAP'in düz okunuşu ("kırılım günü kapanışı"), yani pozisyonun GÖRDÜĞÜ ilk kapanış. Kanıt ufku 5
# bar olduğu için aralık 10'a kadar açık — ama kalibrasyon kapıdan geçmek zorunda.
exit.early_kill_bars:     {min: 1,   max: 10,  step: 1,   type: int}     # itlaf penceresi (bar); early_kill_pivot=0 iken ATIL
# YAPI-TABANLI STOP: 0 = ATR stopu (varsayılan, bugünkü yasa), 1 = pivot − tampon.
stop_mode:                {min: 0,   max: 1,   step: 1,   type: int}     # 0=atr (varsayılan) / 1=pivot_alti
stop_buffer_atr:          {min: 0.1, max: 1.0, step: 0.1, type: float}   # pivot_alti tamponu (ATR katı); stop_mode=0 iken ATIL
