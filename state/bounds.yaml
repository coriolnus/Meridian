# DE-RISK RAMPASI — BU DOSYADA SATIRI YOK, VE BU BİLİNÇLİ (OPT Faz-1 kablolaması, 2026-08-12)
# =================================================================================================
# NE OLDU: `broker.derisk_mult`in iki eşiği (fonksiyon gövdesinde gömülü 0,03 / 0,08) parametreye
# çevrildi ve operatör kararıyla 0,15 / 0,36'ya taşındı (EDG-2026-023 ölçümü + karar penceresi
# §E.1/§E.3). Yürürlükteki değerler `state/goal.yaml` → `limits.derisk_full_dd` /
# `limits.derisk_floor_dd`; okuyan tek yer `broker.derisk_ramp()`.
# ARAMA ARALIĞI YAZILMADI, ÇÜNKÜ ÖYLE BİR KARAR YOK (uydurma yasağı): 2026-08-12 penceresinde
# operatör bir ARALIK değil TEK NOKTA seçti (0,15 / 0,36 — EDG-023'ün iki kollu ölçümünden).
# Buraya bir min/max/step yazmak, verilmemiş bir kararı kayda geçirmek olurdu. Kodun uyguladığı
# TEK kelepçe akıl-sağlığıdır: `0 <= full_dd < floor_dd <= 1` (broker.derisk_ramp) — bir arama
# aralığı DEĞİL, ters/anlamsız bandı reddeden fail-safe.
# NEDEN SATIR YOK — İKİ AYRI YASA, İKİSİ DE BU DEPODA YAZILI:
#   1. İKİ SAHİP YASAĞI: bir ad hem `guard.LIMIT_KEYS`te hem burada olamaz. `validate_change`
#      LIMIT_KEYS'teki her adı reddeder (guard.py:166), yani buradaki satır Hermes'e ASLA
#      geçmez — ama `config.bounds().keys()` UCB arama eksenlerini üretir (analytics.py:2781,
#      api.py:3446), dolayısıyla eksen ÖRNEKLENİR ve her örnek "immutable" retine harcanır.
#      Çivi emsali: tests/test_kovab_dalga3_v166.py::test_c24_uc_esik_de_HERMESE_KAPALI —
#      "bounds.yaml'a da girmiş → iki sahip, sessiz ayrışma".
#   2. HÜKÜMSÜZ EKSEN YASAĞI: `regime.spy_sma_gate` mezar taşı (8b6bbbc, yukarıda) tam bu zararı
#      anlatıyor — "bir arama uzayında etkisiz bir eksen tutmak, kapsamayı değil yalnız bütçeyi
#      büyütür". Altı değerlendirme, sonucu yapısal olarak sabit bir düğmeye harcanmıştı.
# UYGULAMA POLİTİKASI (ROADMAP §2-10(3)): rampa/slot/boyut/ısı = HEP-PENCEREYE sınıfı (risk-artıran
# vanalar). Bunlar makine tarafından evriltilmez; kapı-içi evrim kenar-iyileştirmeleri içindir.
# BU SATIRLARIN GERİ GELMESİ İSTENİRSE: önce ad `guard.LIMIT_KEYS`ten ÇIKARILIR (yani operatör
# kalemi olmaktan çıkarılır) — yoksa yukarıdaki iki yasa aynı anda çiğnenir.
