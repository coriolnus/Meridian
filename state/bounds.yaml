entry.max_ext_atr:        {min: 0.0, max: 12.0, step: 1.0, type: float}  # 50SMA extension climax filter (#13)
entry.rs_dual_horizon:    {min: 0,   max: 1,   step: 1,   type: int}     # dual-horizon RS gate on/off (#12)
exit.scale_out_r:         {min: 1.0, max: 4.0, step: 0.5, type: float}   # bank partial at this R (#8)
exit.scale_out_frac:      {min: 0.0, max: 0.75, step: 0.25, type: float} # fraction to bank; 0 = off (#8)
# öneri #3 — VCP skor bileşen ağırlıkları (seçilim fonksiyonu artık kapı disipliniyle tunlanabilir).
