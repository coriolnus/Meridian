[project]
name = "meridian"
version = "0.1.0"
description = "Meridian — a self-improving US-equity research-and-trading agent (L0 paper). Research system. Not financial advice."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "pandas-market-calendars>=4.4",
    "rich>=13.7",
    "jinja2>=3.1",
    "websockets>=16.1",
    "redis>=8.0.1",
    # TSK-020 aracı `ops/olay_sorgu.py` için — DEV'DEN ANA'YA TAŞINDI (2026-09-02, dagit [0d]
    # kapısı ısırdı): sabahki "canlı A1 kurulumuna girmesi gerekmez" kararının öncülü yanlıştı —
    # aracın sorguladığı defter CANLIDA yaşar (yerel defter test-kirli; "o soru A1'de sorulur"),
    # dagit [3] ise A1'e dev grubunu KURMAZ. Dev'de kalsaydı araç tam da verisinin olduğu
    # makinede ImportError'la ölürdü. Motor hâlâ import ETMEZ (test_olay_sorgu_v355 çivili).
    "duckdb>=1.5",
    # BEYAN-DIŞI BAĞIMLILIK KAPATILDI (2026-08-03): `streamhealth._ssl_context` certifi'yi
    # OPSİYONEL olarak import eder (ImportError → sistemin varsayılan CA bağlamı). Bugüne dek
    # ÇALIŞIYORDU çünkü httpx→httpcore certifi'yi DOLAYLI çekiyor — yani TLS doğrulamamız başka
    # bir paketin bağımlılık ağacına yaslanmıştı. httpx bir gün certifi'yi bırakırsa (ya da onu
    # çekmeyen bir yolda kurulum yapılırsa) import sessizce düşer, `except ImportError` dalı
    # devreye girer ve macOS framework Python'da CA'sız bir bağlamla akış TLS'i BOZULUR — hata
    # "certifi yok" demez, bağlantı hatası gibi görünür. Bağımlılık DOLAYLI değil BEYANLIDIR.
    # (streamhealth.py'ye dokunulmadı: opsiyonel import doğru davranıştır — bu satır onu
    #  "opsiyonel ama garanti kurulu" hâline getirir.)
    "certifi>=2024.7.4",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
# Live broker path — installed but NEVER imported unless MERIDIAN_MODE=live AND MERIDIAN_I_ACCEPT_RISK=true
live = ["alpaca-py>=0.20"]
# Hermes brain — the Anthropic SDK. Installed LAST on the VM (§7); the deterministic proposer runs without it.
brain = ["anthropic>=0.40", "google-cloud-secret-manager>=2.20"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

[tool.pytest.ini_options]
# `--durations=25`: 28 dakikanın NEREYE gittiği bu depoda hiç ölçülmemişti. Her koşum en
# yavaş 25 testi kendiliğinden raporlar; ek maliyet SIFIR (pytest süreyi zaten tutuyor,
# yalnız basmıyordu). İKİNCİ BİR `-q` EKLENMEZ: `-q` zaten burada ve ikincisi özet
# satırını siler — "temiz" ile "çıktı yok" aynı görünür (ölçülmüş tuzak).
addopts = "-q --durations=25"
testpaths = ["tests"]
markers = [
    # Hermes danışma katmanının GERÇEK arka plan ipliğini isteyen test. Varsayılan olarak
    # `tests/conftest.py::hermes_async_cagrilari` bu iplikleri no-op'a çevirir; işaretli test
    # ipliği kendi join etmekle yükümlüdür (etmezse aynı fikstürün dedektörü onu adıyla düşürür).
    "hermes_gercek_iplik: hermes arka plan ipliği taklit EDİLMEZ; test onu kendi join eder",
]

[dependency-groups]
dev = [
    "hypothesis>=6.164.0",
    "import-linter>=2.13",
    "mutmut>=3.7.0",
    # UYGULA-8 (2026-09-01): tam suite `-n 4` ile ~9 dk (seri ~26 dk; 2 temiz koşum, 8.344 test,
    # 0 paralellik kırmızısı — xdist_group gerekmedi). Hedefli küçük koşumlar SERİ kalır:
    # işçi açılışı küçük kümede net kayıptır. Ölçüm: MERIDIAN_ENGINEERING_LOG.md UYGULA-8 kaydı.
    "pytest-xdist>=3.8",
    # duckdb BURADAYDI (TSK-020 adım 1, 2026-09-01 sabahı) — aynı gün ANA bağımlılığa taşındı:
    # gerekçe ana listedeki satırında, tersine dönüşün kaydıyla.
]

# ================================================================================================
# IMPORT-LINTER — MİMARİ SÖZLEŞMELERİ (WP-H/H4, 2026-07-31)
# ================================================================================================
# NE YAPAR: `lint-imports` grimp ile GERÇEK import grafiğini çıkarır ve aşağıdaki sözleşmeleri
# ölçer. Bu bir TESPİT KAPISIDIR, refactor aracı değil: sözleşmeler BUGÜNKÜ grafikten türetildi ve
# bugün GEÇİYOR. Amaç yeni bir yukarı-yön bağımlılığın SESSİZCE doğmasını engellemek — bugüne
# kadar "adapters üst katmanı import etmez" yalnız bir GELENEKti, ölçülmüyordu.
#
# İSTİSNALAR UYDURULMADI, ÖLÇÜLDÜ: `ignore_imports` satırlarının her biri bugün grafikte GERÇEKTEN
# var olan bir kenardır ve gerekçesi yanında yazar. İstisna listesi boşalırsa satır silinir;
# BÜYÜRSE bu bir mimari borç kaydıdır (denetimde görünür).
[tool.importlinter]
root_package = "meridian"
# Grafik dışı bırakılanlar YOK: ölçüm tam pakete uygulanır (kısmi grafik = kısmi güvence).

# ---- SÖZLEŞME 1: ADAPTÖR BAĞIMSIZLIĞI ----------------------------------------------------------
# adapters/* DIŞ DÜNYAYA bakan kenar katmandır (HTTP, CSV, üçüncü-taraf SDK). Motor katmanını
# (loop/api/scheduler/hermes*/sprint*) import ederse iki şey birden bozulur: (a) veri katmanı
# karar katmanının yaşam döngüsüne bağlanır — bir adaptör testi tüm motoru içe aktarmak zorunda
# kalır; (b) döngüsel import riski kenardan merkeze doğru yayılır.
[[tool.importlinter.contracts]]
name = "adapters yukarı-yön import etmez (kenar katman motoru tanımaz)"
type = "forbidden"
source_modules = ["meridian.adapters"]
forbidden_modules = [
    "meridian.api",
    "meridian.loop",
    "meridian.scheduler",
    "meridian.run",
    "meridian.broker",
    "meridian.hermes",
    "meridian.hermes_runtime",
    "meridian.hermes_composite",
    "meridian.sprint",
    "meridian.sprint_run",
    "meridian.reflect",
    "meridian.backtest",
    "meridian.strategy",
]
ignore_imports = [
    # ÖLÇÜLEN TEK İSTİSNA (2026-07-31): `adapters/alpaca.py` fonksiyon gövdelerinde
    # `from ..broker import ENTRY_TIF, RISK_PCT_PER_R, MAX_NOTIONAL_PCT, entry_order_decision`
    # yapar. Bu BİLİNÇLİ bir bağımlılıktır — WP-E "iki-motor icra yasası": giriş emrinin tipi/
    # limiti/TIF'i İÇ broker'ın yasasıdır ve dış adaptör ona UYAR. Yasayı adaptöre kopyalamak iki
    # motorun sessizce ayrışmasına yol açardı (mirror_drift sınıfı). Refactor edilecekse yön:
    # yasa ortak bir `execution_law` modülüne iner, iki motor da ondan okur. BU TURDA YAPILMADI.
    "meridian.adapters.alpaca -> meridian.broker",
    # ÖLÇÜLEN İKİNCİ İSTİSNA (2026-08-04, v186 nabız): `adapters/data.py::_nabiz` fonksiyon-İÇİ
    # geç-import ile `scheduler.nabiz`ı çağırır — İLERLEME TELEMETRİSİ, veri değil (canlı vaka:
    # bekçi meşru-uzun süpürmeyi 3 kez öldürdü; nabız süpürmenin İÇİNDEN atılmak zorunda).
    # Çalışma-zamanı katman yönü KORUNUR: istisna-yutmalı, zamanlayıcı yüklü değilse no-op;
    # lint statik sayımda fonksiyon-içini de kenar sayar. BORÇ/refactor yönü: scheduler init'te
    # data.NABIZ_HOOK'a geri-çağrı enjekte eder, import tamamen kalkar. BU TURDA YAPILMADI.
    "meridian.adapters.data -> meridian.scheduler",
]

# ---- SÖZLEŞME 2: ÇEKİRDEK-ALTYAPI KATMANI ------------------------------------------------------
# store/storage/config/obs HERKESİN import ettiği tabandır. Taban bir üst katmanı import ederse
# grafik tersine döner ve "yalnız store'u içe aktar" diyen bir test aslında tüm uygulamayı yükler.
# (Not: tabanın KENDİ arasında döngü VARDIR ve bu sözleşme onu ÖLÇMEZ — yalnız DIŞARI-YUKARI
#  yönü ölçer. DÖNGÜNÜN GERÇEK BOYU 6 MODÜLDÜR, 3 DEĞİL: {config, notify, obs, secrets, storage,
#  store} tek bir güçlü-bağlı bileşendir (Tarjan, grimp grafiği üzerinde, 2026-08-16). Eski not
#  burada `config→obs→store→config` yazıyordu — o üçlü, altı modüllük bileşenin yalnız GÖRÜNEN bir
#  turudur; `notify`, `secrets` ve `storage` da aynı bileşenin içindedir. Borcun boyu iki kat
#  küçük yazılırsa borç kapanmış gibi okunur.)
[[tool.importlinter.contracts]]
name = "çekirdek-altyapı üst katmanları import etmez"
type = "forbidden"
source_modules = [
    "meridian.store",
    "meridian.storage",
    "meridian.config",
    "meridian.obs",
]
forbidden_modules = [
    "meridian.api",
    "meridian.loop",
    "meridian.scheduler",
    "meridian.run",
    "meridian.backtest",
    "meridian.reflect",
    "meridian.hermes",
    "meridian.hermes_runtime",
    "meridian.sprint",
    "meridian.sprint_run",
    "meridian.broker",
    "meridian.strategy",
    "meridian.score",
    "meridian.analytics",
    "meridian.health",
    "meridian.skills",
    "meridian.watchdog",
    "meridian.dataset",
    "meridian.adapters",
    "meridian.memory",
    "meridian.guard",
]

# ---- SÖZLEŞME 3: SAF YAPRAKLAR BİRBİRİNDEN BAĞIMSIZ --------------------------------------------
# Bu beş modülün BUGÜN hiçbir meridian import'u yoktur (ölçüldü). Saf-fonksiyon adacıklarıdır:
# `indicators` matematiktir, `barclock` takvimdir, `codelaw` metin denetimidir, `provenance`
# köken takibidir. Aralarında bir kenar doğarsa bu bir tasarım kayması sinyalidir — sessiz kalmaz.
[[tool.importlinter.contracts]]
name = "saf yapraklar (indicators/barclock/codelaw/provenance/macro) birbirinden bağımsız"
type = "independence"
modules = [
    "meridian.indicators",
    "meridian.barclock",
    "meridian.codelaw",
    "meridian.provenance",
    "meridian.adapters.macro",
]

# ---- SÖZLEŞME 4+5: DÖNGÜSÜZLÜK (İKİ AYRI ZİNCİR — TEK ZİNCİR OLAMADIĞI ÖLÇÜLDÜ) ---------------
# `layers` sözleşmesi yön DAYATIR, yani kapsadığı küme üzerinde DÖNGÜSÜZLÜĞÜ garanti eder
# (yukarı-yön import yasak → geri kenar imkânsız → döngü imkânsız) ve DOLAYLI zincirleri de sayar.
#
# ÖLÇÜLEN GERÇEK (2026-07-31, ilk deneme kırmızı döndü — bulgu kaydedildi): tek bir
# `api > scheduler > loop > backtest > strategy > indicators` zinciri KURULAMIYOR, çünkü backtest
# DOLAYLI olarak loop'a bağlı:
#     meridian.backtest → skills (l.33) → analytics (l.198) → shadow_variants (l.2658)
#                       → shadow_lifecycle (l.373…) → loop (l.439: `from .loop import _scan_tail`)
# Yani "backtest loop'un altındadır" iddiası BUGÜN YANLIŞTIR. Bu, repo genelindeki büyük
# güçlü-bağlı bileşenin (analytics/hermes/loop/reflect/watchdog/skills/shadow_*) backtest'i de
# içine çektiğinin kanıtı. İddiayı `ignore_imports` ile bastırmak yerine sözleşme İKİYE bölündü.
#
# BİLEŞENİN BOYU YENİDEN ÖLÇÜLDÜ (2026-08-16): 33 MODÜL — burada uzun süre "20 modüllük" yazıyordu
# ve o sayı artık doğru değildi. Ölçüm (grimp grafiği + Tarjan, `meridian.*` birinci düzey, 84
# modül): analytics, arming, backtest, baseline, broker, cf_backfill, component_ic, counterfactual,
# faz5_cikis, health, hermes, hermes_runtime, intraday_shadow, ledgerstamp, loop, nous_eval,
# recompute, reflect, rollback, run, scheduler, selfreview, sermaye, shadow_lifecycle,
# shadow_model, shadow_variants, skill_evolve, skill_gorus, skills, sprint, threshold_curve,
# validation_report, watchdog. Yani repodaki 84 modülün %39'u TEK bir düğümdür.
#
# İKİ SÖZLEŞMENİN DE `ignore_imports`I VAR — "sıfır istisnayla geçiyor" İDDİASI DOĞRU DEĞİLDİ ve
# 2026-08-16'da düzeltildi. Kadans zinciri iki kenar, karar çekirdeği iki kenar bastırıyor;
# dördünün de gerekçesi ve borç yönü ilgili `ignore_imports` bloğunda ADIYLA yazılı. İstisnalar
# bastırma DEĞİL kayıtlı borçtur — ama sayısı sıfır değildir ve öyle yazılmamalıdır.
[[tool.importlinter.contracts]]
name = "üst kadans zinciri katmanlı ve döngüsüz (api > scheduler > loop)"
type = "layers"
layers = [
    "meridian.api",
    "meridian.scheduler",
    "meridian.loop",
]
ignore_imports = [
    # v186 nabız telemetrisi (2026-08-04): iki kenar da fonksiyon-İÇİ geç-import + istisna-yutmalı
    # İLERLEME NABZI — loop._nabiz (l.637) ve data._nabiz (l.83) yalnız scheduler.nabiz'ı çağırır
    # (hüküm/kısma/sahiplik zamanlayıcıda). Çalışma-zamanı kadans yönü DEĞİŞMEZ; lint statik
    # sayımda fonksiyon-içini kenar sayar. BORÇ: NABIZ_HOOK enjeksiyonu (sözleşme-1 kaydıyla aynı).
    "meridian.loop -> meridian.scheduler",
    "meridian.adapters.data -> meridian.scheduler",
]

# Deterministik karar çekirdeği: motorun LLM'siz, defter-yazmayan, saf hesap katmanı. Bu zincirin
# döngüsüz kalması sözleşmenin en değerli parçası — bir gün `indicators` `strategy`yi import
# ederse ölçüm şasisi kendi kuyruğunu yemeye başlar.
[[tool.importlinter.contracts]]
name = "deterministik karar çekirdeği katmanlı ve döngüsüz (backtest > strategy > regime > guard > indicators)"
type = "layers"
layers = [
    "meridian.backtest",
    "meridian.strategy",
    "meridian.regime",
    "meridian.guard",
    "meridian.indicators",
]
ignore_imports = [
    # v187 D2-ratchet (2026-08-04): `broker.beyan_olcusu` (l.276) fonksiyon-İÇİ geç-import ile
    # `sermaye.resetler`i okur — kayıtları okuyan TEK yer, ÖLÇÜ-okumasıdır (karar/veri akışı değil;
    # ratchet kapısının iki yazım-kaynağını aynı fonksiyonla kıyaslaması için). Bu kenar olmadan
    # strategy→earnings→data→alpaca→broker→sermaye→watchdog→hermes_runtime→reflect→backtest dolaylı
    # zinciri kurulmuyor (öbür halkalar bu dalgadan önce de vardı ve tek başlarına zinciri kapatmaz).
    # BORÇ/refactor yönü: beyan-ölçüsü sermaye modülüne iner, broker onu çağırır (yön düzelir).
    "meridian.broker -> meridian.sermaye",
    # v186 nabız (aynı gün): İKİNCİ paralel zincir strategy→earnings→data→SCHEDULER→loop→backtest —
    # aynı telemetri-kenarı (data._nabiz l.83, fonksiyon-içi, istisna-yutmalı); gerekçe/borç
    # sözleşme-1 ve kadans-sözleşmesindeki kayıtlarla AYNI (NABIZ_HOOK enjeksiyonu).
    "meridian.adapters.data -> meridian.scheduler",
]

# ================================================================================================
# MUTMUT — HAFTALIK MUTASYON TESTİ (WP-H/H5, 2026-07-31)
# ================================================================================================
# KURULUM, KOŞUM DEĞİL. İlk gerçek koşum bakım ritüelindedir (saatler sürer) — `ops/haftalik_
# mutasyon.sh` onu koşar ve skoru `docs/mutasyon/<tarih>.md`ye yazar.
#
# ANAHTAR ADLARI ÖLÇÜLDÜ, EZBERDEN YAZILMADI: kurulu mutmut 3.7.0'da `paths_to_mutate` ve
# `tests_dir` DEPRECATED (configuration.py:100-113 uyarı basıyor); karşılıkları `source_paths` ve
# `pytest_add_cli_args_test_selection`. Eski adlar bugün çalışır ama bir sonraki ana sürümde
# sessizce düşer — o gün mutasyon TÜM repoyu mutasyona uğratmaya başlardı (koşum saatlerden
# günlere çıkar, kimse nedenini anlamaz).
#
# NEDEN `source_paths=meridian` + `only_mutate=üç dosya`: mutmut 3 kaynak ağacını `mutants/`e
# KOPYALAR ve testler oradan import eder (__main__.py:264 setup_source_paths). source_paths yalnız
# üç dosya olsaydı `mutants/meridian/` paketi EKSİK kopyalanır ve her test import hatasıyla ölürdü
# — mutasyon skoru "%100 öldürüldü" gibi görünürdü (en tehlikeli yanlış-yeşil). Paket bütün
# kopyalanır, mutasyon YALNIZ üç dosyaya uygulanır.
#
# ÜÇ DOSYA NEDEN BUNLAR: para yolunun karar çekirdeği. broker.py = pozisyon/risk/de-risk rampası,
# guard.py = parametre sınırları, score.py = skor=para yasası. Bir mutant burada hayatta kalıyorsa
# testler o davranışı ÖLÇMÜYOR demektir ve bu depoda ölçülmeyen davranış = uydurma riski.
[tool.mutmut]
source_paths = ["meridian"]
only_mutate = [
    "meridian/broker.py",
    "meridian/guard.py",
    "meridian/score.py",
]
pytest_add_cli_args_test_selection = [
    # POZİTİF SEÇİM (H5 nihai biçim, 2026-08-01 — 8 koşumluk dışlama-kovalamacasının dürüst sonu):
    # mutasyon skoru broker/guard/score DAVRANIŞINI sınayan testlerin gücünü ölçer. Negatif-dışlama
    # her yeni repo-kökü-varlık testinde kırılıyordu (4 sınıf, 5 kayıt); seçim artık POZİTİF ve
    # TÜRETİLMİŞ: bu üç modülü doğrudan import eden test dosyaları (grep ile; liste büyüyünce
    # ops/haftalik_mutasyon.sh öz-testi biçimi doğrular, içeriği ezberlemez). Tam suite'in kapsamı
    # DEĞİŞMEZ — bu seçim yalnız mutasyon koşumuna özgüdür.
    #
    # SÜRÜKLENME ÖLÇÜLDÜ, GİZLENMEDİ (2026-08-14, v246-A): kural mekanik olarak uygulandığında
    # (AST: `from meridian import broker|guard|score`, `from meridian.<mod> import ...`, modül
    # düzeyi VE fonksiyon içi) bugün **79 test modülü** kuralı sağlıyor; bu liste **39**. Yani
    # kural ile liste arasında **41 dosyalık** bir fark var ve fark BU TURDA KAPATILMADI: kapsam
    # genişletme mutasyon ritüelinin süresini değiştirir ve karar Rol-1'indir (ops/haftalik_
    # mutasyon.sh başlığı). Fark iki alt sınıf taşıyor ve ikisi de körü körüne eklenemez:
    # (a) `tests/wf_fixtures.py` kuralı sağlar ama TEST MODÜLÜ DEĞİLDİR (pytest toplamaz) —
    #     eklenirse seçim sessizce hiçbir şey seçmeyen bir öğe kazanır;
    # (b) kaynak METNİ tarayan testler (`Path(guard.__file__).read_text()` sınıfı) mutantı
    #     davranışla değil metinle "öldürebilir" — skoru şişirir. Liste büyütülürken bu iki sınıf
    #     ayrıştırılmalı. Ters yön de ölçüldü: `tests/test_trend_shadow_v144.py` listede DURUYOR
    #     ama üç modülün hiçbirini import etmiyor (zararsız fazlalık; daraltma da bir karardır,
    #     bu turda dokunulmadı — 8 koşumluk dışlama-kovalamacasının dersi).
    #
    # TSK-029 SINIFLANDIRMA TURU (2026-09-03, ROADMAP §4): 2026-08-24 masa-başı kararı — "körlemesine
    # eklenemez, DAVRANIŞSAL olanlar eklenir, METİN-TARAYANLAR skoru şişirir" — mekanik uygulandı.
    # ÖLÇÜM SÜRÜKLENDİ: bugün kural **92** test modülü buluyor (79 değil — 2026-08-14'ten beri 13
    # yeni dosya kuralı sağlıyor); önceki liste **39**ydu ve içlerinden BİRİ (`test_trend_shadow_
    # v144.py`, yukarıda not düşülmüş) kuralı hiç sağlamıyor — yani gerçek kesişim 38, boşluk 54.
    # SINIFLANDIRMA ÖLÇÜTÜ: her boşluk dosyasındaki `test_*` fonksiyonlarının kaçı kaynak-metin
