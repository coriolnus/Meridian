# ci — DUMAN KAPISI (2026-08-15'te tam-suite'ten dumana indirildi).
#
# NEDEN: tam suite ~50 dk (4 çekirdek) ve canlı-benzeri state/hermes/ağ ister; 15 dk'lık CI onu
# HİÇ bitirememişti (bütün koşular zaman aşımı iptali — ölçüm: MODUL-ENVANTERI-2026-08-15.md §5).
# Kapının içeriği TEK yerde tanımlıdır: ops/ci_duman.sh. Tam suite Rol-1'de tek-otoriter koşar.
#
# Python bilerek 3.11'e sabitlenir: requires-python >= 3.11 tabanını CI zorlasın diye
# (3.12+'da derlenen ama 3.11'de test toplamasını kesen f-string vakası, 2026-08-15).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # ELLE TETİK: PR'da koşu kuyruğa hiç girmediği iki vaka yaşandı (PR #5 ve #6; aynı dosya,
  # aynı tetiklerle #3/#4'te sorunsuz koşmuştu). `workflow_dispatch` olmadan böyle bir durumda
  # kapıyı canlandırmanın API yolu YOKTUR — koşu beklenir ya da boş commit atılır. Bu satır
  # kapıyı operatörün ve API'nin erişimine açar; davranışı DEĞİŞTİRMEZ.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # uv SÜRÜMÜ PİNLİ (TSK-230 tur 2): sürümsüz installer her koşumda "en son" uv'yi kurar ve duman
      # kapısı [0/4] `uv lock --check`in sözleşmesine dayanır — kod değişmeden kırmızı dönebilirdi.
      # TEK KAYNAK A1 pini: deploy/ansible/roles/meridian_a1/defaults/main.yml::uv_surum; buradaki literal
      # kopya tests/test_uv_cagri_hijyeni_v566.py (E6) ile çivili. Biçim astral'ın belgelediği sürüm-pinli
      # URL'dir ("include it in the URL", docs.astral.sh/uv/getting-started/installation, 2026-09-27) —
      # A0 `venv.yml` ile aynı. `uv --version` kurulan sürümü log'a düşürür.
      # DOĞRULAMALI KURULUM (TSK-238): sürüm-pinli URL sürümü sabitler, İÇERİĞİ doğrulamaz — `curl … | sh`
      # indirdiğini körlemesine koşuyordu. Installer dosyaya iner, sha256'sı A0 ile AYNI değere karşı
      # doğrulanır (defaults/main.yml::uv_installer_sha256 — literal kopya E6b ile çivili), sonra koşar.
      # Özet kaynağı ÖLÇÜLDÜ (2026-09-27, GitHub API üst verisi): uv 0.12.0 sürümü `immutable: true`;
      # `uv-installer.sh` varlığının GitHub-hesaplı özeti bu değere EŞİT (Rol-1'in 2026-09-08 ölçümüyle
      # iki bağımsız kaynak); installer her arşivin sha256'sını GÖMÜLÜ taşır ve `verify_checksum` ile
      # doğrular (cargo-dist 0.31.0) — zincir: sabit özetli installer → gömülü arşiv özeti. Sürüm ya da
      # özet değişirse İKİSİ de defaults ile AYNI değişiklikte güncellenir (uyuşmazsa bu adım DÜŞER).
      - name: Install uv (sürüm pinli + installer sha256 kapısı — A1 uv_surum / uv_installer_sha256)
        run: |
          curl -LsSf -o "$RUNNER_TEMP/uv-install.sh" https://astral.sh/uv/0.12.0/install.sh
          echo "b67e385074fddc9b99cd152b838fd91046d9fbc261b2c45f448a983ad23b8764  $RUNNER_TEMP/uv-install.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/uv-install.sh"
          ~/.local/bin/uv --version
      # `--frozen` (TSK-230): bayraksız `uv sync` pyproject ↔ uv.lock ayrışmasında kilidi SESSİZCE
      # yeniden yazar — duman kapısının [0/4] kilit kontrolü sonra koşar ve yeniden yazılmış kilidi
      # "taze" görürdü (kapı CI'da kör). Kilit olduğu gibi kurulur; ayrışmayı [0/4] KIRMIZI bildirir.
      - name: Sync deps (Python 3.11 = beyan edilen taban)
        run: |
          ~/.local/bin/uv python install 3.11
          ~/.local/bin/uv sync --frozen --extra dev --python 3.11
      - name: Duman kapısı (kilit tazeliği + compileall + lint-imports + audit + pytest duman)
        run: UV=~/.local/bin/uv ./ops/ci_duman.sh
