# ci — DUMAN KAPISI (2026-08-15'te tam-suite'ten dumana indirildi).
#
# NEDEN: tam suite ~50 dk (4 çekirdek) ve canlı-benzeri state/hermes/ağ ister; 15 dk'lık CI onu
# HİÇ bitirememişti (bütün koşular zaman aşımı iptali — ölçüm: MODUL-ENVANTERI-2026-08-15.md §5).
# Kapının içeriği TEK yerde tanımlıdır: ops/ci_duman.sh. Tam suite Rol-1'de tek-otoriter koşar.
#
# Python bilerek 3.11'e sabitlenir: requires-python >= 3.11 tabanını CI zorlasın diye
# (3.12+'da derlenen ama 3.11'de test toplamasını kesen f-string vakası, 2026-08-15).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # ELLE TETİK: PR'da koşu kuyruğa hiç girmediği iki vaka yaşandı (PR #5 ve #6; aynı dosya,
  # aynı tetiklerle #3/#4'te sorunsuz koşmuştu). `workflow_dispatch` olmadan böyle bir durumda
  # kapıyı canlandırmanın API yolu YOKTUR — koşu beklenir ya da boş commit atılır. Bu satır
  # kapıyı operatörün ve API'nin erişimine açar; davranışı DEĞİŞTİRMEZ.
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps (Python 3.11 = beyan edilen taban)
        run: |
          ~/.local/bin/uv python install 3.11
          ~/.local/bin/uv sync --extra dev --python 3.11
      - name: Duman kapısı (compileall + lint-imports + audit + pytest duman)
        run: UV=~/.local/bin/uv ./ops/ci_duman.sh
