name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync deps
        run: ~/.local/bin/uv sync --extra dev
      - name: Tests (pytest + network-free synthetic replay smoke)
        run: ~/.local/bin/uv run pytest -q
