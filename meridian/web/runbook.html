<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · Operasyon Runbook</title>

<!-- ==========================================================================================
  RUNBOOK YÜZEYİ (UIUX S1-T3, 2026-08-01) — `docs/RUNBOOK.md`'nin PANODAKİ OKUYUCUSU (YASA 6).

  NEDEN BAĞIMSIZ SAYFA. Pano (`index.html`) tek bir soruya hizmet eder: "şu an ne oluyor?".
  Runbook ise olay ANINDA okunan, uzun, kaydırmalı bir metindir; panonun görünüm kaydına
  (RENDER.*) sokmak onu 13. bir görünüm yapardı ve "her ekran tek soruya cevap verir"
  kuralını bozardı. Ayrıca teşhis anında panonun 15 sn'lik poll'ünün altında metin okumak
  istemezsin. Bu sayfa panodan AYRILIR — tıpkı /workflow ve /landing gibi.

  NEDEN KENDİ STİLİ (index.html'in <style>'ına dokunulmaz). Bu tur paralel koşuyor: jeton/tema
  katmanı BAŞKA bir hattın alanı. Bu sayfanın index.html'in değişkenlerine bağlanması, iki
  hattı tek dosyada çakıştırırdı. Burada kendi kendine yeten, ~120 satırlık bir sayfa var:
  dış font yok, dış betik yok, CDN yok — SSH tüneli arkasında ve ağ yokken de açılır.

  NEDEN SIFIR JAVASCRIPT (ve nasıl doluyor). Dağıtım CSP'si `script-src 'self'`; satır içi
  betik ve satır içi işleyici BLOKLANIR. Üç seçenek vardı:
    (a) ayrı bir /runbook.js + /api/runbook ucu + istemci tarafı markdown ayrıştırıcı,
    (b) üretim anında HTML gömme (docs/RUNBOOK.md ile sessizce ayrışabilir),
    (c) SUNUCUDA render: `/runbook` rotası md'yi ISTEK ANINDA okur ve aşağıdaki yer
        tutucuların yerine koyar.
  (c) SEÇİLDİ: en az hareketli parça (yeni betik dosyası yok, yeni veri ucu yok), ayrışma
  İMKÂNSIZ (kaynak her istekte diskten okunur) ve sayfa JS'siz çalışır — yani CSP tartışması
  hiç doğmaz. Yer tutucular AYNEN korunmalı; `meridian/api.py::runbook()` bunları arar ve
  bulamazsa SESSİZ BOŞ SAYFA yerine hata döner.

  TEMA: `prefers-color-scheme`. Panonun `theme.js`'i BİLEREK yüklenmiyor — o dosya paralel
  hattın alanı ve bu sayfanın onun sözleşmesine bağlanması gereksiz bir bağ olurdu.
=========================================================================================== -->
<style>
:root{
  --bg:#fbfaf9; --bg2:#f4f2f0; --tx:#1b1a19; --tx2:#5f5c58; --tx3:#8a8580;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.06); --kod:#f0edea; --uyari:#8a5a00;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    /* Saf siyah YOK (iş emri Program V): ISA-101 çizgisinde yumuşak koyu griler.
       Vurgu rengi de yok — bu sayfada renk yalnız "yazılmadı" işaretini taşır. */
    --bg:#17181a; --bg2:#1d1f21; --tx:#e6e4e1; --tx2:#a3a09c; --tx3:#77746f;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.06); --kod:#232527; --uyari:#d8a657;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);
     font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px;display:grid;
      grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1000px){ .wrap{grid-template-columns:250px minmax(0,1fr);gap:44px} }

/* ---- üst bar: tek dönüş yolu. Panoya dönmek bir kısayol değil, sayfanın sözleşmesi ---- */
.ust{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
     padding:14px 24px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.ust b{font-weight:600;letter-spacing:-.01em}
.ust .yol{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.ust a{color:var(--tx2);text-decoration:none;border-bottom:1px solid var(--line);font-size:13px}
.ust a:hover,.ust a:focus-visible{color:var(--tx);border-bottom-color:var(--tx2)}

/* ---- içindekiler: 50 bölümlük bir belgede gezinme bir süs değil, kullanılabilirlik ---- */
nav.toc{font-size:13px;line-height:1.5;padding-top:28px}
@media (min-width:1000px){ nav.toc{position:sticky;top:56px;max-height:calc(100vh - 76px);overflow:auto;padding-right:8px} }
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc .g{margin-top:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
nav.toc a{display:block;padding:3px 0;color:var(--tx2);text-decoration:none;
          font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--tx)}

main{min-width:0;padding-top:28px}
h1{font-size:26px;line-height:1.25;letter-spacing:-.02em;margin:44px 0 12px;font-weight:600}
h1:first-child{margin-top:8px}
h2{font-size:18px;line-height:1.3;letter-spacing:-.01em;margin:36px 0 8px;font-weight:600;
   padding-top:10px;border-top:1px solid var(--line2)}
h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);
   margin:18px 0 6px;font-weight:600}
p{margin:10px 0;max-width:78ch}
ul{margin:8px 0;padding-left:22px;max-width:88ch}
li{margin:4px 0}
li ul{margin:2px 0}
hr{border:0;border-top:1px solid var(--line);margin:44px 0}
blockquote{margin:14px 0;padding:10px 16px;border-left:2px solid var(--line);
           background:var(--bg2);color:var(--tx2);max-width:82ch}
blockquote p{margin:4px 0}
/* YARIÇAP EVİN ÖLÇEĞİNDEN (DESIGN.md: 2px · 10px · 12px — "dördüncü yarıçap yok").
   Bu sayfa kendi stil sayfasını taşır ama kendi GEOMETRİSİNİ icat etmez: sayfa bağımsız
   olsun diye jetonlardan kopmak, sistemin ölçeğinden de kopmak anlamına gelmez. */
code{font-family:var(--mono);font-size:.86em;background:var(--kod);padding:1px 5px;
     border-radius:2px;color:var(--tx)}
pre{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;
    overflow-x:auto;margin:12px 0}
pre code{background:none;padding:0;font-size:12px;line-height:1.55;white-space:pre}
strong{font-weight:600;color:var(--tx)}
em{font-style:normal;color:var(--tx3);font-size:.92em}
a{color:var(--tx);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover,a:focus-visible{text-decoration-color:var(--tx2)}
:target{scroll-margin-top:72px}
/* Çapayla gelinen bölüm KENDİNİ SÖYLER: pano "/runbook#nabız" der ve operatör 977 satırın
   ortasına düşer — hangi bölüme geldiğini bir kenar çizgisi söylemezse arama baştan başlar.
   İŞARET NÖTR (--tx3), KEHRİBAR DEĞİL: "buraya geldin" bir DURUM sinyali değildir ve iş
   emrinin renk disiplini (Ç1: renk = anormallik) onu boyamayı yasaklar. Bu sayfada kehribar
   TEK bir şeye ayrılmıştır ve aşağıda duruyor. */
h2:target{border-left:2px solid var(--tx3);padding-left:12px;margin-left:-14px}
/* "yazılmadı" işareti SAYFANIN TEK RENKLİ ÖĞESİDİR. Renk burada bir süs değil, bir eksiğin
   adıdır: çözülmüş bir satırla aynı tonda duran bir boşluk, olmayan bir boşluktur. */
.yok{color:var(--uyari)}
:focus-visible{outline:2px solid var(--tx2);outline-offset:2px}
@media print{ nav.toc,.ust{display:none} .wrap{grid-template-columns:1fr} }
</style>
</head>
