# TSK-176 Faz A0 — Ansible kontrolcü ayarları (`deploy/ansible/` rolü `meridian_a1` için).
# Bağlam: docs/TASARIM-ALTYAPI-KOD-2026-09-08.md §2, docs/superpowers/plans/2026-09-08-ansible-a0.md.
#
# NEDEN DEPO KÖKÜNDE (TUR 2 düzeltmesi, 2026-09-08): ansible yapılandırmayı `ANSIBLE_CONFIG` →
# `./ansible.cfg` (CWD) → `~/.ansible.cfg` → `/etc/ansible/ansible.cfg` sırasıyla arar ve
# playbook'un YANINDAKİ dosyaya BAKMAZ. Dosya `deploy/ansible/` altındayken, README'nin belgelediği
# (ve hepsi depo kökünden çağrılan) komutlarda ÖLÇÜLDÜ: `ansible-config dump --only-changed` →
# `CONFIG_FILE() = None`. Yani `host_key_checking`/`interpreter_python`/`pipelining` ayarlarının
# HİÇBİRİ yürürlükte değildi ve dosyanın kendi şerhi ansible'ın davranışını yanlış anlatıyordu.
# `.ansible-lint` de aynı gerekçeyle burada (o da CWD'den yukarı aranır, target dizininden değil).
# `tests/test_ansible_a0_v451.py::test_ansible_cfg_depo_kokunden_yukleniyor` yeri DEĞİL,
# YÜKLENDİĞİNİ ölçer — aynı hata başka bir dizinde tekrarlanamasın diye.
[defaults]
# Yol depo KÖKÜNE göredir: komutlar kökten çağrılır (README "Ops sözleşmesi").
inventory = deploy/ansible/inventory.ini
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# stdout_callback: `yaml` community.general ister (kurulu DEĞİL — ölçüldü 2026-09-08: 'Invalid callback'); çekirdek `default` + yaml sonuç biçimi
stdout_callback = default
callback_result_format = yaml
host_key_checking = True

[ssh_connection]
pipelining = True
