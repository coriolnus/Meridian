notlar: >
  Formül: z_skill = (score − ort_skill_kesit) / sd_skill_kesit (kesitte skill'in ≥3 adayı yoksa z=0); sd_kesit = tüm adayların score sd'si;
  score_golge = score + w_skill · z_skill · sd_kesit. w=0 olan skill'lerde score_golge = score (bugünkü davranış birebir). Kanca P3'te aday sıralamasının (candidates.sort) hemen sonrasında, in-memory, tek append. Pencere sayacı EDG-019 kill#3'ün ölçülemeyen 'ardışık pencere' borcunu kapatır.

