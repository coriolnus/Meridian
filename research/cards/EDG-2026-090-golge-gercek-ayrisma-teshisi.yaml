  ablasyon B (E2 ATR enjeksiyonu) bunu kısmen kapsar, kapsamıyorsa kalan fark sınıfına 'canlı stop ≠ plan.stop (kaynağı loop.py)'
  eklenir. K grid DEĞİŞMEDİ (3); eşikler değişmedi.

