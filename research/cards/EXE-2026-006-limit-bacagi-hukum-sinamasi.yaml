status: measured   # 2026-08-17 Rol-1 — ölçüldü + hüküm: E1 YENİDEN AÇILIR (H1 düştü, H2 ölçülemedi).
                   # 2026-08-21 EK (Ö-51c): Ö3 ΔP&L CI'ı hesaplandı — DÖRT tavanda da 0 İÇİNDE.
                   # Hüküm DEĞİŞMEDİ (H1 hâlâ kırık) ama tek dayanağı H1 kaldı: ne H2 ne Ö3
                   # anlamlılığa ulaşıyor. 'Bacağı aç' bu ölçümden tek başına ÇIKARILAMAZ.
                   # Ön-kayıt notu (tarihçe): "ölçüm TEMİZ ağaçta ve EXE-2026-005 H4 kapısı yeşile
                   # döndükten SONRA koşulur" — İKİSİ DE sağlandı, kill kriterlerinde doğrulandı.

beyanlı_sinirlar: >
  (1) BU KART E1'İN YERİNE GEÇMEZ. E1 kendi penceresinde, kendi evreninde koştu; bu kart onun
  HÜKMÜNÜ düzeltilmiş dolum kuralı altında sınar. Sayılar birebir kıyaslanabilir olmayabilir ve
  farklıysa bu bir çelişki DEĞİL, pencere/kural farkıdır — raporda AYRI sütun olarak durur.
  (2) `EXE-2026-005`in günlük-bar sınırı AYNEN geçerlidir: `low <= limit` "dokunuldu" der ama
  SIRAYI söylemez; aynı gün stop da dokunmuşsa hangisinin önce olduğu ÖLÇÜLEMEZ ve kötümser
  tarafa yazılır. Yani H3 hâlâ bir ALT SINIRDIR.
  (3) **MAX_CHASE KIRPMASI — ÖLÇÜMDEN ÖNCE BEYAN EDİLDİ (inceleme Önemli 3, 2026-08-17).**
  `broker.py`de kapı sırası `max_chase` → limit'tir. Açılış `trigger·(1+0.04)`ün ÜSTÜNDEyse
  `max_chase` önce reddeder ve dinlenen-limit dalına HİÇ gelinmez. Bu kart tavanı 0,005-0,03'e
  indirdiği için dinlenen limitin dönüştürebileceği aralık `(trigger·(1+cap), trigger·1.04]` ile
  SINIRLIDIR: %4'ün üstünde açılan bir gün, low limite dokunmuş olsa bile `max_chase` etiketiyle
  kaybolur. SONUÇ: Ö1'in paydası ve Ö3'ün portföy etkisi EKSİK ölçülür ve hüküm yine bir
  ALT SINIRDIR. Bu kırpma kaldırılmadı — kaldırmak `MAX_ENTRY_GAP_PCT`e dokunmak olurdu ve o
  ayrı bir emniyet sınırıdır (kart değil, operatör kalemi).
  (4) Kod varsayılanının (`0.5`/`0.01`) "doğru" olduğu VARSAYILMAZ — grid onu da bir nokta olarak
  içerir, ayrıcalıklı değil.
  (5) Bu kart canlı bacağın AÇILMASINI önermez; yalnız hükmün ayakta olup olmadığını ölçer.
  Açma kararı strateji kimliğine dokunur ve §5 operatör bloğuna gider.

