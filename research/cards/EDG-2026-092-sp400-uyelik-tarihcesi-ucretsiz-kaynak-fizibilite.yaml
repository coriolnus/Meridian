  2020-07+ için üretilir ve EDG-070'in halefi (sağkalan üst-sınır, gerçek delist barlarıyla) yeni kartla açılır; tutmazsa
  ücretsiz yol KAPANIR, kalem TSK-065 düşer (ücretli yol operatör kararı, bu kartta ÖNERİLMEZ).

