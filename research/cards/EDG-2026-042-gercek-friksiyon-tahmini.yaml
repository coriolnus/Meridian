ara_kosum_2026_08_22: >
  BETİMLEYİCİ ARA-KOŞUM (operatör istedi; kartın izni gereği HÜKÜM TAŞIMAZ; Rol-1 işledi).
  Artefakt: research/olcumler/edg042_betimleyici_2026-08-22/ (canlı snapshot sha d7eaf4b1…,
  çekim 2026-08-22T13:36:55Z, goal.slippage_bps=5 künyeli).
  K1 GİRİŞ (n=13, 4 seans — eşik 30/10 DOLMADI, damga aynen basıldı): medyan +15,017 bps ·
  p25/p75 −43,0/+40,8 · min/maks −130,7/+327,5 · en büyük seans payı %38,5 (şerh eşiği %40'ın
  altında) · medyan model-farkı +10,0 bps. CI HESAPLANMADI (eşik altı — kartın kuralı).
  K2/K3 ÇIKIŞ: n=0 ölçülebilir — beş aday satırın beşi de `broker_teyit` damgasız ve kartın
  kill kriteri teyitsiz satırı kıyasa SOKMAZ (satır satır dökümlü). Bu bir kusur değil
  SIRALAMADIR: damga ilk reconcile turunda basılır (Ö-52 dağıtıldı), sonraki koşumda çıkış
  kovaları ölçülebilir hâle gelir.
  BETİMLEYİCİ GÖZLEM (hüküm DEĞİL, karar kuralı UYGULANMADI): 13 dolumun medyanı model
  varsayımının (5) üç katı ve EDG-040 başabaş bandının [5-15] ÜST SINIRINDA; dağılım vahşi
  (EDG-038'in 15↔134 gözlemiyle tutarlı). n=4 tahmini +29 demişti; n=13 medyanı +15 diyor —
  ikisi de "modelden yukarı" yönünde, hiçbiri istatistiksel hüküm değil.

beyanlı_sinirlar: >
  (1) SEÇİLİM YANLILIĞI YAPISAL: yalnız DOLAN emrin friksiyonu ölçülebilir — kaçan/veto edilen
  emrin "friksiyonu" tanımsız. Ölçülen şey "dolan emirlerin friksiyonu"dur ve gerçek beklenen
  maliyetin ALT SINIRI olabilir (zor dolumlar örneklemden düşer). Bu sınır kaldırılamaz, beyan edilir.
  (2) DÖNEM TEMSİLİ: bugünkü örneklemin tamamı tek aydan (2026-08) ve tek rejim penceresinden;
  eşikler dolduğunda bile ilk hükümler "bu dönemin friksiyonu"dur, evrensel sabit değil.
  (3) BAR-İÇİ STOP TETİK SLİPAJI bu kartla ÖLÇÜLMEZ (broker.py sıfır varsayımı) — o 23d'nin
  kartıdır; K3 yalnız broker'ın stop-bacak dolumunu iç motorun yazdığı çıkışla kıyaslar.
  (4) MEDYAN TEK SAYIYA İNDİRGER: EDG-038 aynı seansta 15↔134 bps ölçtü — dağılım geniş;
  p25/p75 bu yüzden zorunlu çıktı, medyan tek başına karar taşımaz.
  (5) Model-farkı sütunundaki '5' goal.slippage_bps'in BUGÜNKÜ değeridir; goal değişirse koşum
  günkü değeri künyeler (sabitlemez).
