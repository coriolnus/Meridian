card_id: EDG-2026-042
family: friksiyon_olcumu   # ÖLÇÜM-TANIMI kartı (EXE-007 sınıfı) — edge hipotezi DEĞİL
thesis: >
  Sistemin EN KARAR-KRİTİK bilinmeyen sayısı artık gerçek icra friksiyonunun SEVİYESİ.
  EDG-2026-040 duyarlılığı ölçtü ve başabaş bandını verdi: **5-15 bps/bacak** — slip=15'te
  benimsenen C+mb paketi NEGATİF (−3.067$, CI sıfırın dışında). Gerçek friksiyonun eldeki tek
  tahmini ise EDG-037/038'in n=4'lük BETİMLEYİCİ sayısı (medyan +29 bps; resmî damga aynen:
  "SLİPAJ ÖLÇÜLEMEDİ (n=4 < 10)"). Yani bugün elimizde "sistem X bps'te ölür" bilgisi VAR,
  "X'in içinde miyiz" bilgisi YOK.
  n=4'ün kökü ölçüm hatası değil VERİ KITLIĞIYDI: 2026-08-13'te motorun broker'da doldurabildiği
  tek şey tek seanslık 4 giriş emriydi; çıkış dolumu HİÇ yoktu (TIF kelepçesi + tutuş süresi).
  O gün bugüne köprü kuruldu: E2 defteri (`entry_execution.jsonl`) ayna dolumlarını `resmi_acilis`
  ve `fill_vs_resmi_acilis_bps` ile birlikte SÜREKLİ biriktiriyor; çıkış dolum yaması
  (`_exit_fill_yamasi`) kapanan işlemlere `alpaca_fill_price` basıyor. TEZ: kanonik ölçüt
  DEĞİŞTİRİLMEDEN (EDG-038'in ön-kayıtla dondurduğu D1 konsolide-açılış paydası) bu biriken
  defterlerden gerçek friksiyonun bacak-başına bandı ölçülebilir ve EDG-040'ın başabaş bandına
  KARŞI konumlanabilir. BU KART TEK ATIŞ DEĞİL, TEKRARLANABİLİR REÇETEDİR (EXE-007 deseni):
  örneklem eşiği dolana dek her koşum BETİMLEYİCİ kalır ve hüküm taşımaz — n=4 vakasının
  dürüstlüğü korunur, sayı uydurulmaz.

