card_id: EDG-2026-068
family: cf_karsi_olgusal_bilesim
thesis: >
  KART-ÖNCE ÖN-KAYDI (EXE-2026-009 emsali; bu kart bir replay taraması değil, kod-değişikliği
  sözleşmesidir). `cf_backfill._plans_for_session` tarama kuyruğunu bugün
  `dfp.loc[:d].reset_index(drop=True)` ile kurar: `date` indeksten SÜTUNA çevrilmeden atılır.
  Kardeş `backtest.replay` aynı satırı drop'suz yazar. İki kazanç-çapalı üretici
  (`evaluate_pead`: `"date" not in bars.columns` → None; `evaluate_episodic_pivot`:
  `last_date is None` → None) bu yüzden cf'de YAPISAL ölü — PIT sevki doğru kurulu ama çapa hiç
  sorulmuyor (v345 beyanlı-sıfır çivisi bu gerçeği kayıt altında tutuyor). DEĞİŞİKLİK: kuyruk
  kardeşiyle aynı biçime döner (`date` sütun olarak taşınır). ETKİ: cf defterine iki UYUYAN
  kurulum girer ve karşı-olgusal bileşim değişir — v345 çürüme çivisinin kendi sözüyle "bu bir
  KART kararıdır, sessizce alınacak bir yan etki değil". Sözleşme ve hükümler değişiklikten
  ÖNCE burada donar.
evidence_refs:
  - "EDG-2026-062 Görev-3 bulgusu (2026-08-31): cf'de pit_arsiv {0,0,0}, sebep veri kuyruğu"
  - "tests/test_pit_baglama_yolu_v345.py::test_cf_taramasi_bugun_KAZANC_CAPASINA_ULASAMAZ (çürüme çivisi)"
  - "ROADMAP TSK-011; strategy.ARMED_SETUPS = (breakout_vcp, exhaustion_hammer, momentum_burst) — pead/episodic DIŞARIDA"
uygulama_sozlesmesi: >
  (1) DEĞİŞİKLİK: `_plans_for_session` kuyruğu `date`i sütun olarak taşır (kardeş replay ile tek
  biçim); `scan_all` imzası ve 340-bar tail penceresi DEĞİŞMEZ. (2) SİLAHLANMA DEĞİŞMEZ-BEYANI:
  pead/episodic ARMED_SETUPS dışında — değişikliğin tek meşru etkisi uyuyan (dormant_setup) satır
  eklemek + pit_arsiv sayaçlarını konuşturmak; sabit pencerede SİLAHLI plan kimlik kümesi bit-eş
  kalmalı. (3) ÇİVİ DEVRİ: v345 çürüme çivisi bu kartın numarasıyla EMEKLİ edilir (beyanlı-sıfır
  kaydı docstring'de tarihçeye döner), yerine ters-yön çivi gelir: kuyruk `date` taşır VE fikstür
  penceresinde pit_arsiv toplamı > 0. Çivi YERİNDE gevşetilmez; devir kaydı test docstring'ine
  bu kart kimliğiyle yazılır. (4) ÖLÇÜM İZOLASYONU: kıyas koşumları sandbox_state'li pytest
  fikstürüyle YA DA izole state köküyle yapılır — canlı/yerel `state/`e tek satır yazılmaz.
parameter_grid:
  hucreler: [cf_kuyruk_tarihli]   # K += 0 — grid yok; kod-değişikliği ön-kaydı (EXE-009 sınıfı)
