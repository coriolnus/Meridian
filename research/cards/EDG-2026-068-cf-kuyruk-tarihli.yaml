fikstur_kolu_2026_09_02: >
  HÜKÜM DEĞİL — fikstür kolunun ölçümü (TSK-011 ajanı, task-011-report.md; pencere
  2022-08-01..2022-10-01, 45 seans, sandbox_state'li pytest). Kod indi: kuyruk `date`i sütun
  taşıyor (`reset_index()`, kardeş biçim). ÖLÇÜLEN: scan_all'a tarihli çerçeve 0/180 → 180/180;
  pit_arsiv {0,0,0} → {true:54, false:126, olculemedi:180} (olculemedi tamamen SPY — fikstür
  arşivi kapsam dışı; True>0 = dikişin ucu EDGAR arşivine vardı, kill-2 ATEŞLEMEDİ). Çivi devri
  yapıldı (test_cf_taramasi_KAZANC_CAPASINA_ULASIR; mutasyonda 22 çividen YALNIZ o kırmızı).
  Bedel beyanı: fikstür çağrı süresi 0,94s → 1,00s (~%6, beklenen yön). AÇIK KALEMLER (Rol-1
  gerçek-veri kolu, izole state şartıyla): pozitif kontrolün "en az bir uyuyan satır doğar"
  yarısı fikstürde ATEŞLEMEDİ (opened: 0 — sentetik bar geometrisi pead/episodic sinyali
  üretmiyor; kill-4 gereği fikstür kolundan bileşim hükmü YORUMLANMAZ) ve success_metric (a)
  silahlı-küme bit-eş kıyası fikstürde bayağı-doğru (iki kolda da küme boş). NOT: evidence_refs
  ikinci satırındaki eski çivi adı değişiklik-öncesi durumu anlatır, tarihsel olarak doğrudur.
beyanli_sinirlar: >
  (1) Bileşim değişikliği yalnız UYUYAN satırlarda — dormant_setup icraya bağlı değil (31 plan /
  0 işlem, operatör kararı bekliyor), yani canlı karar yüzeyi bu karttan ETKİLENMEZ; kazanç cf
  defterinin gözlem gücünde. (2) `date` sütununu taşımak hesap eklemez (kolon frame'de zaten
  var, yalnız düşürülmüyor) — yine de koşum süresi iki kolda da kaydedilir; beklenmedik yavaşlama
  beyan edilir, hüküm değiştirmez. (3) Bu kart uyuyan kurulumların DEĞERİNİ ölçmez (o ayrı soru,
  uyuyan-kurulum-yolu kalemi); yalnız kuyruğun çapayı taşıyıp taşımadığını ve bileşim deltasının
  sınıfını ölçer.
