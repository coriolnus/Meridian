veri_penceresi: >
  Fikstür kolu: v345 cf penceresi 2022-08-01..2022-10-01 (emsal fikstürle). Gerçek-veri kolu:
  koşum anında parquet deposunda mevcut SON 120 seans; kesin tarih aralığı ilk koşumda bu kartın
  trial kaydına yazılır ve ondan sonra DEĞİŞMEZ (yeni aralık = yeni trial satırı).
success_metric: >
  Üçü BİRDEN, sabit pencerede öncesi/sonrası kıyasla: (a) silahlı plan kimlik kümesi DEĞİŞMEDİ
  (bit-eş); (b) earnings_gate.pit_arsiv toplamı 0'dan >0'a çıktı (çapa artık soruluyor);
  (c) dormant satır deltasının TAMAMI {pead, episodic_pivot} kurulumlarından. Hüküm Rol-1'de,
  aynı turda karta + K defterine işlenir.
kill_criteria:
  - "silahlı plan kümesi değişirse: değişiklik silahlanmaya sızdı — kod geri alınır, hüküm KALDI"
  - "date sütunu varken pit_arsiv {0,0,0} kalırsa: çapa hâlâ erişilemez, hipotez çürük — geri al, yeni teşhis yeni kart"
  - "ölçüm koşumu canlı/yerel state'e yazarsa koşum geçersiz (izolasyon şartı, tekrar koşulur)"
  - "pozitif kontrol ateşlemezse hiçbir sonuç yorumlanmaz"
pozitif_kontrol: >
  YOL-TUTARLI: EDGAR arşivinde `filed <= seans-1` kaydı olan fikstür sembolüyle
  `_plans_for_session` PORTFÖY YOLUNDAN geçerken pead/episodic değerlendiricisi çapaya ulaşır
  (pit_arsiv sayacı artar) ve en az bir uyuyan satır doğar. Tek-enstrümanlı doğrudan
  `evaluate_*` çağrısı pozitif kontrol SAYILMAZ (vaka 2026-08-25: tek-enstrüman PK
  portföy-yolu hatalarına kör).
