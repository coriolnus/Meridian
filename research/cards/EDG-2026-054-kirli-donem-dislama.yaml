universe: >
  edg032c şasisi (künye 2026-08-24 tazelenmiş hâliyle; ölçüm ajanı EDG-048/049 künye-tazeleme
  protokolünü uygular: üç-yönlü bayt-özdeşlik geçmezse DURUR). İki kol: kontrol (bugünkü dünya —
