evidence_refs:
  - "WP4-B gövdesi: bars_integrity sevk (2026-07-31 adapters/data.py) + teyit (wpd_bars_integrity_teyit): 98 kırılma/61 sembol, 46.256 satır dışlanıyor, ayrışma 0"
  - "AÇIK BİLET: dataset.load bilerek bağlanmadı — kapsam kararı operatörde (ROADMAP WP4-B)"
