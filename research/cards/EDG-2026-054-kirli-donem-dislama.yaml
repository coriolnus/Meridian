features_asof: >
  Hücre başına: n · net P&L · PF · maxdd · sharpe. ZORUNLU İKİNCİ EKSEN (kartın asıl sorusu —
  takas): ÖRNEKLEM MUHASEBESİ — dışlanan satır/sembol/gün sayısı, etkilenen işlem sayısı, ve
  öğrenme-tarafı kuraklık göstergeleri (walk-forward pencere sayısı, prescreen aday debisi,
  confirm dilimi n). Δ(dislamali−kontrol) eşlenik ay-kümeli bootstrap (B=5000, seed 20260812).
parameter_grid:
  hucreler: [dislamali]   # K += 1 (kontrol = şasi kapısı, K harcamaz)
cost_model: sasi_ile_ayni
success_metric: >
  KARAR KURALI (donuk, İKİ ŞARTLI — takasın iki yakası): (A) P&L tarafı: Δ CI-alt > 0 → temizlik
  ÖLÇÜLEBİLİR KAZANÇ; CI 0-içi → nötr; CI-üst < 0 → temizlik ZARARLI (örneklem kaybı baskın).
  (B) Örneklem tarafı: confirm dilimi n VEYA walk-forward pencere sayısı %20'den fazla düşerse
  "kuraklık bedeli AĞIR" şerhi zorunludur. BAĞLAMA ÖNERİSİ ancak (A) nötr-ya-da-pozitif VE (B)
  şerhi ateşlemiyorsa verilir — aksi hâlde kalem "beyanlı-bağlanmamış" olarak kapanır ve
  bars_integrity'nin dışlama listesi dataset.load tarafında YALNIZ RAPORLANIR (görünürlük).
