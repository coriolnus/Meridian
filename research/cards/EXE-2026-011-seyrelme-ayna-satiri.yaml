kohort_sapmasi_beyani: >
  Rol-1 yorumu (2026-09-02, eşik/kill DEĞİŞMEDİ — yazım-ânı yorumu): uygulama_sozlesmesi(1)
  "o seansın plan listesi" ifadesi "dolum fırsatını BU açılışta tüketen kohort", yani
  meta[last_date] (önceki seansın planları) olarak uygulanır. Naif okuma (bu turun planları)
  pencere yasası (EXE-009+K2: akşam gönderimi sabah kancasına ertelenir) yüzünden HER silahlı
  plana önce armed_not_submitted ayna-satırı, ertesi sabah submitted satırı yazdırır — kill#1
  her gece tetiklenirdi. Kohort seçimiyle çift-iz sınıfı yapısal olarak kapanır; seans atlansa
  da adres doğru kalır (last_date tanımı gereği).
beyanli_sinirlar: >
  (1) Bu kart seyrelmenin SEBEBİNİ çözmez — okunur kılar; "pencere kaydırması mı azalttı" hükmü
  birikimden sonra ayrı sorudur (EDG-042 takvimi). (2) submitted+dolmamış sınıfı bilerek kapsam
  dışı (izi zaten var; dinlenen limit EXE-2026-005'te). (3) Sözlükteki iki sınıf kod okumasıyla
  daraltılmış çerçevedir; uygulamada plan alanları üçüncü bir AYIRT EDİLEBİLİR sınıf gösterirse
  bu yeni sınıf sözlüğe EKLENMEZ — olculemedi'ye sayılır ve yeni kartla açılır (eşik-sonradan
  değişmez ilkesinin sözlük karşılığı).
