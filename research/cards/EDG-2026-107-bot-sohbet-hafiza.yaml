hipotez: >
  Hermes bot ağ geçidi üzerinden (Telegram/pano/Claude kanalları, `bota_sor`) konuşan kadro botları, ADIM-0 sonrası 14 günlük ve ≥50 sohbet turluk
  pencerede (a) BUGÜNÜN durumu hakkında araç çağırmadan veri (rakam/yüzde/kaynak/sembol) söylemez — `arac_siz_veri is True` turlarının oranı
  ADIM-0'da dondurulan tavanın altında kalır; (b) hafızadan aktardığı her ifadeyi TARİHLİ atıfla söyler ve hafızadan BUGÜN hakkında hiçbir hüküm
  vermez (sıfır tolerans); (c) cevap gecikmesi p50 ADIM-0 tavanının altında kalır; (d) araç sayımı ölçülemeyen tur (`arac_olculemedi`) oranı
  ADIM-0 tavanının altında kalır; (e) öneri→onay oranı ve bot başı soru sayısı yalnız TANI olarak raporlanır.

