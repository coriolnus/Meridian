operator_karari_2026_08_22: >
  SEÇENEK A — SİLAHSIZLANDIRILDI. `strategy.ARMED_SETUPS`ten `pullback` çıkarıldı (tek satır +
  karar yorumu; çiviler v260, v92 sıra çivisi niyet korunarak arındırıldı). Karar günü ek ölçüm:
  cf n 21→29 (ort-R −0,885, profil aynen) · 13-22 Ağu arası canlı pullback işlemi 0 (silahlı ama
  ateşlemiyor — her seans ısı/slot bedeli, karşılıksız). YENİDEN-SİLAHLANMA KAPISI DONUK:
  cf'de n≥30 VE ort-R CI-alt > 0 → KART-ÖNCE yeniden değerlendirme; doğrudan geri ekleme yasak.
  Kanıt birikimi yapısal olarak sürüyor (cf_backfill dormant dalı — v260 çivisi bağlar).

verdict:   # Rol-1 hükmü.
  olcum: >
    ΔP&L +3.121,44$ (CI95 [−2.098,97, +10.780,65] → **0-İÇİ**) · dd 0,1268→0,1263 (−0,0005) ·
    sharpe 0,521→0,594 (+0,073) · işlem n DEĞİŞMEDİ (885→885; boşalan kapasite doldu) · işlem-R
    0,076→0,083. Kartın birinci dalı (CI-alt>0) ve üçüncü dalı (CI-üst<0) TETİKLENMEDİ; ikinci ayak
    ("CI 0-içi iken dd/sharpe belirgin iyileşiyorsa") biçimsel olarak açık ama "belirgin" kartta
    SAYISAL TANIMLANMAMIŞTI ve eşik sonradan konulamaz — ajan `belirgin_mi: None` yazdı, DOĞRU davrandı.
  yan_kanal: >
    Sente kapanıyor: Δ 3.121,44 = eklenen 367,10 + ortak-yol kayması 93,79 + knock-on 242,70 +
    pullback'in kendi kaybının geri alınması 2.417,85. Naif beklenti (+2.418) ile gerçekleşen
    arasındaki +703,59'un ADI var. Bağlayan kısıt SLOT DEĞİL ISI: 39 meşgul seansın hiçbirinde slot
    dolmadı (0/39), `heat_hard` NO_GO 607→593.
  ZAYIFLIK_ADIYLA: >
    Sonuç TEK İŞLEME bağlı: OXY penceresinde doğan IRM/exhaustion_hammer (+4.053R, +2.247,04$)
    farkı domine ediyor. Eklenen 10 işlemin ort-R'si +0,018, CI [−0,708, +1,479] — 0-içi, n=10.
    Yani "çıkarmanın faydası" KANITLANMIŞ DEĞİL.
  hukum: >
    **SİLAHSIZLANMA ÖNERİLİR — ama gerekçe "çıkarmak kazandırıyor" DEĞİL, KANIT ASİMETRİSİ:**
    (i) pullback'in ZARARI üç bağımsız kaynakta tutarlı — replay n=6 ort-R −0,787 **kazanma %0,0** ·
    canlı gerçek n=4 −1,00R · cf n=21 −0,97R. (ii) Çıkarmanın FAYDASI belirsiz (CI 0-içi, tek işlem
    dominasyonu) ama ZARARI da yok: dd ve sharpe iki yönde de iyileşme işaretinde, işlem sayısı sabit.
    (iii) Maliyet asimetrisi: silahlı tutmak her seans slot+ısı+sermaye riski harcıyor; silahsız
    tutmanın maliyeti yalnız "belki iyi olurdu" ve o ihtimal DORMANT haldeyken cf defterinde ÖLÇÜLMEYE
    DEVAM eder — yani kanıt birikmeye devam eder, para riski biter. (iv) Geri alma tek satır.
    KARAR OPERATÖRÜN (kart kuralı). Uygulanırsa: `ARMED_SETUPS`ten çıkar + kart-önce yeniden
    değerlendirme eşiği yaz (ör. cf'de n≥30 ve ort-R CI-alt>0 olursa yeniden silahlanma penceresi).
  kanal_kaniti: >
    Kanal seçimi BEYANLI ve kanıtlı: repo yüzeyi yalnız EKLEME yönünde (`entry.armed_extra`);
    `armed_eksi` repoda SIFIR geçiş → o kanalı açmak strategy.py'yi değiştirmek olurdu (kill#2),
