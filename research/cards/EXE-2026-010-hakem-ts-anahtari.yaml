kill3_yeniden_okuma_BEYANI: >
  Ana kartın kill#3'ü ("geriye dönük pencere yeniden-etiketleme yapılırsa geçersiz") AYNEN
  yürürlükte. ts-türevi bölme ETİKETLEME DEĞİLDİR: hiçbir satıra pencere alanı yazılmaz/değiştirilmez;
  iki ÖLÇÜLMÜŞ olgu (satırın gönderim ts'i + canlı barclock dönüm anı) karşılaştırılır. Aynı
  gerekçe iki emsalde kabul edildi: P-1 kapanışının operatör-istisnalı düzeltmesi (p1_kapanis_2026_08_30)
  ve EDG-042 P-3/AYRIK kararı (p3_karar_ayrik_ts_2026_08_31). Fark beyanla korunur: EDG-042
  K1'i ts'ye göre böler, bu hakem de artık ts'ye göre böler — iki kartın anahtarı BİRLEŞİR ve
  p2_ayrisma_isaretcisi_2026_08_31'deki beyanlı ayrışma KAPANIR (o blok bu kartla tarihlenir).

uygulama_kapsami: >
  (1) pencere_altbant.py bölmeyi gonderim_kolu() ithaliyle yapar (pencere damgası okuma yolu
  kalkar; damga alanı defterde DURUR — silme yok, yazım rejimi değişmez). (2) Haftalık görev
  EK bölümünün sabit dizin işaretçisi ([2] emsaliyle) karta devredilir — bu kartın
  GUNCEL_HAKEM_RECETESI kaydı yürürlükteki betik dizinini söyler. (3) Rapor her koşumda kol
  sayılarını + ts'siz sayısını beyan eder.

