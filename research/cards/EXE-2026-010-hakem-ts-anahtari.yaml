basari_tanimi: >
  (1) Haftalık koşum iki kol için de sayı üretir ve kontrol kolu eşiği geçmiş olarak raporlanır ·
  (2) öneri tetiği "orneklem_birikimde"yi TEDAVİ kolunun doluşuna bağlar (inşaen-kapalı hâl biter) ·
  (3) ts'siz sayısı her koşumda beyanlı · (4) EK işaretçisi tek-kaynağa devredilmiş. Hüküm
  İYİ/KÖTÜ değil, sözleşmenin İŞLEMESİDİR (ana kartın success_metric'iyle aynı sınıf).
