karar: >
  operatör 2026-08-31 (ai-trading-85 aktarımı, birebir: "bunların hepsini main'e devret main
  yapsın") + aynı gün konsolide icra planının onayı ("onaylıyorum, uygula" — planda bu kalem
  "P-2/ts kart revizyonu" olarak sırada). Kill#3 çerçevesine dokunan değişiklik kartsız
  yapılamazdı; bu kart o kaydın kendisidir.

hipotez: >
  Hakem bölmesi `pencere` damgasından `ts`-türevi kola geçince P-2 çözülür: kontrol kolu
  (gönderim ts < canlı barclock dönüm anı) ÖLÇÜLMÜŞ n=15 olur ve alt-bant eşiğini (n>=10)
  GEÇER; tedavi kolu bugün n=2 ve ~0,40 dolum/seans ile ~20 seans (~4 hafta) sonra dolar.
  Bugünkü anahtarla kontrol kolu İNŞAEN boş (pencere="1330" satırı bir daha üretilemez) ve
  geri-al valfi HİÇ açılamaz; ts ile "hiç açılamaz" → "~4 haftada işler"e döner.

