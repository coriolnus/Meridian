card_id: EDG-2026-023
family: derisk_rampa_bandi
thesis: >
  EDG-2026-022 ölçtü: işlem kıtlığının baskın kökü de-risk rampası (tavan_sifir %57.5 + derisk_bagladi
  %8.3 = %65.8 CI>%50). Mevcut bant (tam<=%3dd, lineer→0 @%8dd) normal dalgalanmada bile sistemi çoğu
  gün 0-1 pozisyona kilitliyor; işlem birikimi (öğrenmenin yakıtı: N4 n=92 underpowered, E-serisi aç,
  Faz-6 kilitleri işlem-sayısına bağlı) boğuluyor. TEZ: bandı OPERATÖRÜN SEÇTİĞİ (%15 tam-kapasite /
  %36 sıfır; 2026-08-12 pencere-onayı) değerlere genişletmek replay'de işlem sayısını anlamlı artırır;
  bedeli (max-dd/P&L/PBO) ölçülür ve MOD-FARKINDALIKLI uygulanır: benimsenirse YALNIZ kâğıt hesapta
  (öğrenme dönemi ilkesi — operatör kabulü 2026-08-12); gerçek-para 3/8'de KALIR (DSR-kapısı deseni).

evidence_refs:
  - "EDG-2026-022 verdict: derisk+tavan %65.8 CI[58.7,72.1] baskın; rejim-koşullu (trend_up tavan %59)"
  - "operatör girdileri (2026-08-12, AskUserQuestion penceresi): varyant=yalnız-bant, sayılar=%15/%36,
     mod-ilkesi=KABUL; kayan-tepe ölçüme GİRMEDİ (60g tercihi ileride o kart açılırsa kayıtlı)"
  - "altyapı: EDG-022 replay şasisi (backtest motor yamasız, eff_max_open yakalama deseni hazır)"

universe: "EDG-022 ile AYNI replay evreni: 251 sembol, 2022-01→2026-07, 1147 seans; motor YAMASIZ v3 (yalnız rampa parametreleri varyantta değişir)"

features_asof: >
  İki koşum, aynı motor: (A) TABAN rampa mevcut (tam<=%3, 0@%8) — EDG-022 koşumuyla tutarlılık kontrolü;
  (B) VARYANT rampa (tam<=%15, lineer→0 @%36). Seans-başına: işlem sayısı, doluluk (pozisyon-gün),
  tavan_sifir oranı. Koşum-sonu: net P&L, max drawdown, işlem/yıl, kısıt-sınıf dağılımı (022 tasnifiyle).

parameter_grid:
  rampa: [taban_3_8, varyant_15_36]   # K += 1 (taban yeniden-koşum sayılmaz — 022 tutarlılık çivisi; tek YENİ hücre)

cost_model: pessimistic_band_v2   # motorun kendi maliyet modeli — değişmez

success_metric: >
  Varyantın tabanla kıyası: (i) işlem sayısı artışı (tarih-kümeli bootstrap %95 CI ile); (ii) tavan_sifir
  oranındaki düşüş; (iii) BEDEL ŞEFFAF: max-dd farkı + net P&L farkı + işlem-başına ortalama R değişimi.
  HÜKÜM İKİ AŞAMALI: işlem artışı CI-0-dışı VE max-dd artışı operatöre AÇIKÇA raporlanabilir sınırdaysa
  → 'kâğıt-rampası adayı' (uygulama goal/bounds değişikliği = OPERATÖR ONAYI, otomatik değil).
  Kötüleşme baskınsa → mevcut bant kalır, kart arşiv.

kill_criteria:
  - "varyant işlem sayısını CI ile artırmıyorsa → bant genişletme İŞE YARAMIYOR demektir; kart arşiv,
     kalan kaldıraç eşikler/silahlı-küme (022'nin rejim-koşullu şerhi tekrar okunur)"
  - "taban koşum EDG-022'nin yayınlı dağılımını (%57.5 tavan_sifir ±2pp) YENİDEN ÜRETEMEZSE ölçüm
     GEÇERSİZ (şasi bozulmuş) — önce tutarlılık onarımı"
  - "max-dd varyantta taban×2'yi aşarsa 'aday' hükmü verilmez; sayılar yine raporlanır (karar operatörün)"

k_registry: {registered_at: "2026-08-12T1x", trial_ids: [edg023_rampa_bandi_2026-08-12/varyant]}   # U2 2026-08-23: 1 pending -> gercek trial_id (taban=kontrol, olculen hucre varyant)

status: measured   # 2026-08-12 Rol-1 — ölçüldü + hüküm işlendi (eşikler önceden donuktu, değişmedi).

verdict:   # 2026-08-12 Rol-1 hükmü — ölçüm ajanı karta dokunmadı.
  kill2_capa: >
    Taban tavan_sifir %71.3 ≠ 022-çivisi %57.5±2 — AMA şasi SAĞLAM: config/bar sha'ları birebir, iki koşum
    aynı-motor (sha-eşit), bütünlük temiz (frame_miss=0, dup=0). Sapmanın nedeni ÖLÇÜLDÜ: EDG-022'den sonra
    v233 exhaustion_hammer silahlandı (operatör onayı) → taban 40 hammer işlemi içeriyor, kitap daha dolu,
    tavan_sifir ↑. HÜKÜM: 022-ÇAPASI BAYAT (dünya onaylı kararla değişti), kill#2'nin amacı (şasi sağlamlığı)
    sha-kanıtlarıyla SAĞLANDI, A↔B kıyası GEÇERLİ. Çapa bu koşumun tabanına güncellenir; kill lafzı sessizce
    aşılmadı — gerekçe burada.
  kill1: "TETİKLENMEDİ — işlem artışı +275, CI [+210,+342], 0'ın açık ara dışında (29.5→89.6 işlem/yıl)."
  kill3: >
    TETİKLENDİ — max-dd 0.1775/0.0776 = ×2.287 > ×2 → donuk kural gereği 'kâğıt-rampası adayı' HÜKMÜ
    VERİLMEZ; karar sayılarla OPERATÖRE gider (kartın tasarımı tam buydu).
  sayilar_ozet: >
    A(3/8): 135 işlem, net −7.760$, ort R −0.078, sharpe −0.97, tavan_sifir %71.3, dd %7.8.
    B(15/36): 410 işlem, net +775$, ort R +0.032, sharpe +0.02, tavan_sifir %28.6, dd %17.8.
    Kayma: gevşek bantta bağlayıcı kısıt EVRENE döner (%59.8) — rampa açılırsa evren sorusu yeniden doğar.
  tca_serhi: >
    FRİKSİYON ŞERHİ (2026-08-13; kaynak: EDG-2026-037 / EDG-2026-038 TCA ölçümleri + denetim
    docs/DENETIM-ROADMAP-TUTARLILIK-2026-08-13.md §E). HÜKÜM SİLİNMEDİ — ÜSTÜNE YAZILDI.
    Bu kartın iki koşumu da replay motorunun `slippage_bps=5` varsayımıyla üretildi; o varsayım ilk kez
    ölçüldüğünde iyimser çıktı — kanonik ölçütle (D1 konsolide açılış) giriş bacağında medyan +29,0 bps
    fark, 3/4 aleyhte, model 5 bps sabit. SINIRLAR BEYANLI: n=4, CI geniş, ÇIKIŞ bacağı n=0.
    NE DEĞİŞMEZ: kill#1 ve kill#3'ün DAYANDIĞI ölçütler. İşlem artışı +275 (CI [+210,+342]) bir
    SAYIM; max-dd oranı 0.1775/0.0776 = ×2,287 bir ORAN'dır — friksiyon iki kola da aynı vurur
    (denetim §E.0-i). Kill#3'ün TETİKLENMESİ, "kâğıt-rampası adayı hükmü VERİLMEZ" kararı ve
    kararın operatöre gitmesi AYAKTA. `kill2_capa` bloğunun şasi-sağlamlık kanıtları da etkilenmez.
    NE DEĞİŞİR: `sayilar_ozet`in MUTLAK P&L satırları (A net −7.760$ · B net +775$) ve `operator_karar_paketi`
    içindeki "artıya dönen P&L" İŞARET İDDİASI. Kollar n=135 vs n=410 — ÜÇ KAT fark; her ek işlem iki
    bacak friksiyon taşır, dolayısıyla ΔP&L friksiyona DUYARLIDIR (§E.0-ii) ve mutlak seviyeler
    doğrudan asılıdır (§E.0-iii). B'nin +775$'lık marjı benimsenen paketin marjından İNCE — ölçülen
    +29,0 bps'lik fark, "eksiden artıya" işaretinin ayakta kalıp kalmadığını BELİRSİZLEŞTİRİR.
    Bu şerh bir ÇIKARIMDIR; koşumlar YENİDEN YAPILMADI, hiçbir sayı yeniden hesaplanmadı.
  operator_karar_paketi: >
    Benimseme = goal/bounds değişikliği + YALNIZ KÂĞIT (mod-ilkesi 2026-08-12 kabul; gerçek-para 3/8 SABİT).
    Soru netleşti: öğrenme döneminde +275 işlem/yıl ve artıya dönen P&L, %17.8 kâğıt-dd'ye değer mi?
    EDG-024/025 sonuçlarıyla BİRLİKTE tek pencerede operatöre sunulacak.
