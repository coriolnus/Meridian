# EDG-2026-094 — Geçmiş işlemlerin R çarpanı GİRİŞ-RİSKİ paydasıyla yeniden hesaplanır (AYRI alan; eski değer KALIR)
# ÖN-KAYIT 2026-09-14 17:5xZ (Rol-1). OPERATÖR KARARI aynı saat ("Evet, ayrı kartla yeniden hesapla"): TSK-187 ile
# 2026-09-14'ten itibaren yeni işlemler `r_payda="giris_riski"` (qty_taban × r_per_share) ile ölçülüyor; eski satırlar
# damgasız ("payda = bütçe", risk_dollars). İki payda tek deftere karışmasın diye kıyaslar damgayla ayrılıyor (EDG-088
# PK(2)). Bu kart, geçmişi YENİ paydayla yeniden hesaplayıp AYRI alana yazmanın ölçümü ve yazım reçetesidir.
# HAFIZA KONTROLÜ (17:5xZ): `ops/kart_benzer.py` → EDG-091 (KALDI, selef: payda kaynağı ölçümü), KYS-2026-001 (KALDI,
# kıyas kirlenmesi — bu kartın PK-2'si o sınıfa karşı), EDG-088 (gölge/gerçek ayrışma; PK(2) damga kuralı). Hindsight
# recall bu kart için ölçüm sırası gelince koşulur.

