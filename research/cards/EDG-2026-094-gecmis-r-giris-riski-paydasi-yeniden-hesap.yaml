pozitif_kontrol: >
  (1) damgalı yeni satırlar (r_payda=giris_riski, 2026-09-14+) için hesaplanan r_multiple_giris = defterdeki
  r_multiple (tolerans 0,001) — hesap yolu doğrulaması; (2) sentetik: benimsemesiz bir işlemde qty_giris=qty →
  ΔR=0; benimsenmiş sentetik işlemde (17→38) ΔR beklenen oran (38/17) ile; (3) yazım kuru koşumu: `--kuru`
  hiçbir satırı değiştirmez (DB sha aynı), `--uygula` yalnız hedef satır sayısı kadar extra_json günceller ve
  `r_multiple` sütununun sha'sı DEĞİŞMEZ.

