hipotez: >
  Geçmiş kapanmış işlemler (trades defteri, `kaynak` canlı; replay tohumları HARİÇ) için R'nin giriş-riski
  paydasıyla yeniden hesaplanan değeri (`r_multiple_giris` = pnl_dollars / (qty_giris × r_per_share)) eski
  bütçe-paydalı `r_multiple`dan ADET BENİMSENMİŞ işlemlerde anlamlı ayrışır (medyan |ΔR| / |R_eski| ≥ 0,10),
  benimseme görmemiş işlemlerde ise özdeştir (|ΔR| ≤ 0,01). Ayrışma yalnız benimseme kaynaklıysa, geçmiş
  kıyasların (EDG-088 sınıfı) yeni alanla yeniden okunması meşrudur; ayrışma benimsemesiz işlemlerde de
  görünüyorsa payda tanımı ya da veri (qty_giris) bozuktur → yazım YAPILMAZ.

k_registry: {registered_at: "2026-09-14", trial_ids: [EDG-094-benimsenmis-ayrisma, EDG-094-benimsemesiz-ozdeslik]}
# K=2: birincil ayrışma ölçüsü + özdeşlik (negatif) kontrolü. Yazım adımı K'ye girmez (veri işlemi).

adim_1_olcum: >
  SALT-OKUR (A1 defterinin kopyası ya da `meridian.db` ro): her kapanmış canlı işlem için qty_giris ölçülür —
  kaynak sırası: satırın `extra_json.qty_taban` (varsa) → `extra_json`daki benimseme kaydı (eski adet) → plan
  adedi (`trade_plans` `qty`) → ölçülemedi (None + neden; uydurma YOK). `r_multiple_giris` hesaplanır; damgalı
  yeni satırlar (r_payda="giris_riski") KONTROL kümesidir: hesaplanan değer defterdeki `r_multiple` ile
  eşit olmalı (PK-1). Çıktı: işlem başına tablo (id, ticker, ts_close, qty, qty_giris, kaynak, r_eski, r_yeni,
  ΔR, benimsenmis_mi) + özet (n, benimsenmiş n, medyan |ΔR|/|R|, özdeşlik oranı, ölçülemeyen n) + git blob sha.

adim_2_yazim: >
  ÖLÇÜM GEÇTİYSE ve HÜKÜM Rol-1'de YAZILDIYSA: `ops/r_giris_yeniden_yaz.py --kuru/--uygula` (A1, bakım penceresi,
  worker DURMUŞKEN — CLAUDE.md §9: state yazımı worker koşarken YOK; DB yedeği önce, sha'lı) trades satırlarına
  `extra_json.r_multiple_giris`, `extra_json.r_giris_kaynak` (qty_giris kaynağı) ve `extra_json.r_giris_damga`
  (kart id + tarih) ekler; `r_multiple` alanına DOKUNMAZ (eski değer kalır — operatör kararı). Yazılan satır
  sayısı = ölçüm tablosundaki 'ölçülebildi' sayısı olmalı (ayrışma → durur).

esikler:
  benimsenmis_ayrisma_medyan_alt: 0.10     # medyan |ΔR| / |R_eski| (benimsenmiş işlemler)
  benimsemesiz_ozdeslik_tol: 0.01          # |ΔR| ≤ 0,01 (benimseme görmemiş işlemler, tamamında)
  kontrol_esitlik_tol: 0.001               # PK-1: damgalı yeni satırlarda hesaplanan = defterdeki r_multiple
  olculemeyen_ust_oran: 0.10               # qty_giris ölçülemeyen işlem payı ≤ %10, aksi hâlde yazım YOK

