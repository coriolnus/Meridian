thesis: >
  EDG-013 tanısı (CI'sız, K korunarak) turnover ANA etkisinin momentum-koşulundan bağımsız ve
  daha büyük olduğunu gösterdi (q4 @20 +0,651% tanı vs koşullu +0,315%). Bu kart ana etkiyi
  ÖN-KAYITLI ölçer: yüksek-turnover diliminin taban-fazlası VE rvol20+momentum kontrolünde
  ARTIK katkısı. Hüküm, EDG-013'ün "yaşayan-aday" statüsünün kaderini belirler: ana etki
  bağımsız-anlamlıysa sinyal turnover'dır (013'ün etkileşim-tezi düşer, ama sinyal yaşar);
  artık yoksa ikisi de rvol/mom akrabalığına düşer.
