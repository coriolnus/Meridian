universe: >
  DÖRT KAYNAK, hepsi SALT-OKUMA:
  (1) KONSOLİDE FİYAT — Alpaca `/v2/stocks/bars` `feed=sip` (günlük + 1Min), 2026-08-06 seansı,
      dört sembol (NUE/EMR/BKNG/AMGN). İKİNCİ BAĞIMSIZ KAYNAK: Massive `/v2/aggs` (aynı seans,
      aynı semboller) — çapraz doğrulama; iki kaynak ayrışırsa kanonik ölçüt İLAN EDİLMEZ.
  (2) DOLUM GERÇEĞİ — canlı Alpaca `/v2/orders` (status=all, nested) + `/v2/account/activities`
      (FILL). EDG-037'nin dört giriş dolumu + O TARİHTEN BUGÜNE (2026-08-13) eklenmiş HER TÜRLÜ
      SATIŞ dolumu.
  (3) KORUMA YAŞAM DÖNGÜSÜ — koruma OCO emirlerinin (`P-KORUMA-*`) tip/TIF/status/zaman damgaları
      + `state/mirror_orders.json` + `state/entry_execution.jsonl`.
  (4) DEFTER — `research/olcumler/edg032_final_paket_2026-08-12/islemler_cmb.json` (885 işlem) +
      o koşumun kendi bar arşivi (`state_cmb/bars`) — PF yeniden hesabı için.

features_asof: >
  ÖLÇÜLECEK:
  [A] ÜÇ PAYDA ADAYI yan yana, aynı dört dolum için: (1) konsolide resmî açılış basımı (SIP günlük
      bar `open` = 13:30 açılış müzayedesi), (2) konsolide ilk-dakika VWAP (13:30-13:31 dakika barı
      `vw`), (3) konsolide ilk-dakika orta-noktası ((h+l)/2 aynı barda). Her biri için: bps, işaret,
      medyan/ortalama/notional-ağırlıklı + t-CI95 + bootstrap-CI95 + işaret testi. EDG-037'nin IEX
      sütunu SİLİNMEZ — yan yana kalır (okuyucu ölçüt değişiminin etkisini görebilsin).
      Payda künyesi ADIYLA yazılır: hangi uç, hangi feed parametresi, hangi kod satırı.
  [B] ÇIKIŞ BACAĞI: (i) koruma OCO'sunun iki bacağının tip/TIF/limit_price'ı (kod + CANLI kayıt),
      (ii) `day` TIF'in öldürdüğü korumaların YENİDEN kurulup kurulmadığı — kurulmadıysa/geç
      kurulduysa AÇIK POZİSYONUN KORUMASIZ KALDIĞI PENCERE saat cinsinden ölçülür (bu, slipajdan
      ÖNEMLİ bir bulgudur), (iii) gerçek çıkış dolumu varsa bps (payda: aynı kanonik ölçüt).
  [C] PF yeniden hesabı: [A]'nın kanonik farkıyla + giriş/çıkış bacakları AYRI parametreli
      (asimetrik senaryo: giriş +X bps, çıkış +Y bps) duyarlılık YÜZEYİ + başabaş EĞRİSİ.

parameter_grid:
  yok: >
    betimsel ölçüm + ölçüt düzeltmesi — K += 0. Hipotez sınamıyor; [C]'deki (X,Y) yüzeyi bir
    ARAMA DEĞİL bir DUYARLILIK haritasıdır (parametre seçilmiyor, sonucun parametreye bağımlılığı
    gösteriliyor). Kart hiçbir yapılandırma değeri ÖNERMEZ.

cost_model: gercek_olculen

# --------------------------------------------------------------------------------------------
# ÖN-KAYIT: KANONİK ÖLÇÜT SEÇİMİ — ÖLÇÜMDEN ÖNCE DONDURULDU
# --------------------------------------------------------------------------------------------
# Bu blok, "üç sayıya bakıp en hoşuna gideni kanonik ilan etme" serbestisini KAPATIR. Seçim ve
# gerekçesi burada YAZILIDIR; ölçüm bu gerekçeyi yalnız ÇÜRÜTEBİLİR (aşağıdaki çürütme koşulları),
# "başka sayı daha küçük çıktı" diye DEĞİŞTİREMEZ.
kanonik_olcut_on_kayit:
  secim: "konsolide resmî AÇILIŞ basımı (SIP günlük bar `open`)"
  gerekce_1_model_ozdesligi: >
    ÖLÇTÜĞÜMÜZ ŞEY "gerçek dolum − MODELİN dediği dolum"dur. Modelin dediği dolum
    `broker.py:515` = `next_open × (1+slip)` ve `next_open` replay'in bar arşivinden gelir
    (`adapters/data.py` zinciri: Cboe historical / Nasdaq / Massive grouped — üçü de KONSOLİDE).
    Payda modelin paydasıyla AYNI büyüklük değilse ölçülen fark, model hatası değil KAYNAK farkıdır.
    VWAP ve orta-nokta bu özdeşliği SAĞLAMAZ: motor hiçbir yerde VWAP'a ya da bant orta-noktasına
    göre dolum yazmaz.
  gerekce_2_olcut_hatasi: >
    Açılış müzayedesi basımı TEK ve RESMÎdir (konsolide bantta tek fiyat) — tahmin hatası ~0.
    VWAP ve (h+l)/2 birer TAHMİN EDİCİdir: birinci-dakika örnekleminin kendi gürültüsünü taşırlar.
    Ayrıca (h+l)/2 bir KOTASYON orta-noktası DEĞİLDİR (işlem fiyatlarının menzil ortası) — icra
    ölçütü literatüründe karşılığı yoktur ve bandı inşaen ortalayarak sonucu YAPAY OLARAK yumuşatır.
  gerekce_3_karar_karsiligi: >
    Sistemin verdiği karar "açılışta marketable limit emri gönder"dir (alpaca.py:342-354,
    extended_hours=false). Bu kararın doğal kıyas fiyatı açılış basımıdır. VWAP, ZAMANA YAYILMIŞ
    bir emrin ölçütüdür; bizim emrimiz zamana yayılmıyor.
  curutme_kosullari:   # ölçüm bunlardan BİRİNİ gösterirse seçim GEÇERSİZ, gerekçe yeniden kurulur
    - "replay bar arşivinin açılışı KONSOLİDE DEĞİLSE (kaynak damgası IEX/eksik çıkarsa) gerekçe_1 çöker"
    - "iki bağımsız konsolide kaynak (Alpaca SIP vs Massive) aynı 13:30 açılışında >5 bps ayrışırsa gerekçe_2 çöker"
    - "SIP günlük `open`, SIP 13:30 dakika barının [low,high] bandının DIŞINDAysa (açılış basımı değil, başka bir şey ölçülüyor demektir)"
  esik_donduruldu: >
    Ölçüt-hatası eşiği: |IEX − konsolide| > 5 bps ise "ölçüt taşınması GEREKLİ" sayılır.
    Çıkış bacağı hüküm kapısı: n ≥ 5 gerçek çıkış dolumu. Koruma boşluğu bulgusu eşiği:
    açık pozisyonun canlı koruma emri OLMADIĞI kesintisiz pencere > 1 tam seans.

success_metric: >
  ÜRÜN: (i) üç paydanın YAN YANA tablosu + EDG-037'nin IEX sütunu (silinmeden) + kanonik seçimin
  gerekçesi ve (varsa) çürütülmesi · (ii) konsolide veri künyesi (uç, feed parametresi, kod satırı,
  iki kaynağın çapraz farkı) · (iii) çıkış bacağı: ya bps ölçümü (n≥5) ya da "ÖLÇÜLEMEDİ (n=X) +
  NEDEN" damgası, ve nedenin KENDİSİ (TIF/koruma yaşam döngüsü) bir bulgu olarak · (iv) asimetrik
  (giriş X, çıkış Y) PF duyarlılık yüzeyi + başabaş eğrisi.
  HÜKÜM DEĞİL GİRDİ: bu kart eşiği DEĞİŞTİRMEZ, yapılandırma ÖNERMEZ, kod YAZMAZ. Hükmü Rol-1 işler.
  ÖLÇÜLEMEZSE BU DA BİR ÜRÜNDÜR: "konsolide çekilemedi → ölçüt taşınmadı" ya da "çıkış n=0 →
  round-trip hâlâ yarım" dürüst kapanışı.

kill_criteria:
  - "KONSOLİDE VERİ ÇEKİLEMEZSE ÖLÇÜT TAŞINMAZ: SIP reddi/boş dönerse IEX sayısı 'konsolide' diye ETİKETLENMEZ; [A] 'ÖLÇÜLEMEDİ + ham hata metni' ile kapanır. Uydurma payda YOK."
  - "İKİ KONSOLİDE KAYNAK AYRIŞIRSA (Alpaca SIP vs Massive, aynı 13:30 açılışı, >5 bps) kanonik ölçüt İLAN EDİLMEZ — fark beyan edilir, seçim ertelenir."
  - "ÖLÇÜT KRİZİ ÇÜRÜRSE: konsolide açılış 4/4 satırda IEX'ten ≤5 bps farklıysa [A] DÜŞER ve EDG-037'nin sayıları AYNEN geçerli kalır (kart kendi tezini çürütmüş olur, bu da bir üründür)."
  - "ÇIKIŞ BACAĞI n<5 ise 'ÖLÇÜLEMEDİ (n=X)' damgası ZORUNLU: giriş sayısı çıkışa KOPYALANMAZ; simetrik senaryolar 'VARSAYIM' etiketiyle ve ölçülmediği yazılarak sunulur."
  - "KANONİK SEÇİM POST-HOC DEĞİŞTİRİLEMEZ: `kanonik_olcut_on_kayit` bloğu ölçümden önce donduruldu; yalnız `curutme_kosullari`ndan biri gerçekleşirse seçim düşer."
  - "PAYDA KARIŞTIRMA YASAĞI (EDG-037 kill#3'ün devamı): replay/simüle dolumlar (`replay_seed`, `live_paper`, iç motor) TCA paydasına GİRMEZ; yalnız broker'ın gerçek dolum kayıtları."
  - "MOTOR-DIŞI EMİR YASAĞI: operatörün kendi emirleri (`P-` öneksiz coid) ve tatbikat/smoke emirleri paydadan ÇIKARILIR."

