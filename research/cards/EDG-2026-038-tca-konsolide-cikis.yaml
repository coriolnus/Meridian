thesis: >
  Operatör kararı (2026-08-13): "ölçütü konsolideye taşı ve çıkış slipajını ölç". EDG-037'nin
  paydası (`resmi_acilis`) Alpaca **IEX** günlük bar açılışıydı; `docs/ARASTIRMA-SLIPAJ-AZALTMA-2026-08-13.md`
  §B.6 bunun konsolide 13:30 açılışına göre −36,8 / −27,7 / 0,0 / +16,2 bps saptığını ölçtü — yani
  ÖLÇÜTÜN HATASI, ÖLÇÜLEN BÜYÜKLÜKLE AYNI MERTEBEDE. TEZ (iki ayak):
  (A) Slipajın kanonik paydası, replay motorunun KENDİ dolum yasasının paydasıyla AYNI büyüklük
  olmak zorundadır. `broker.fill_entry` `base_fill = next_open × (1+slip)` yazar ve `next_open`
  replay'in bar arşivinden (`state/bars/*.csv` — Cboe/Nasdaq/Massive zinciri, KONSOLİDE) gelir.
  TCA'nın paydası IEX ise, ölçülen "fark" iki ayrı büyüklüğün farkıdır ve model hatası DEĞİLDİR.
  (B) Round-trip friksiyonun yarısı (çıkış) EDG-037'de n=0 idi. Giriş bacağı LIMIT, çıkış bacağının
  stop kolu `limit_price=null` (= tetiklenince MARKET, `alpaca.py:1024`) — yani replay'in çıkışta da
  5 bps varsaydığı yer (`broker.py:669`), YAPISAL olarak girişten daha iyimser olabilir. Çıkışın
  ÖLÇÜLMEMİŞ olmasının kendisi bir bulgudur ve nedeni (TIF kelepçesi / koruma yeniden kurulumu)
  slipajdan bağımsız bir KORUMA sorusu açabilir.

