verdict:   # Rol-1 hükmü (2026-08-13).
  olcut: >
    KANONİK PAYDA = D1 KONSOLİDE AÇILIŞ (feed=sip). Gerekçe ÖN-KAYITLI ve ölçüm onu doğruladı:
    ölçtüğümüz şey "gerçek − MODELİN dediği" olduğu için payda modelin kendi paydasıyla aynı büyüklük
    olmalı; model `broker.py:515 next_open` → `state/bars/*.csv` → `bars_source.json` = cboe/konsolide
    (dört ismin dördü de), IEX DEĞİL. Modele yakınlık sayıya döküldü: D1 3,9 bps · D0(IEX) 22,0 ·
    D2 14,9 · D3 32,4. DİKKAT — D3 EN KÜÇÜK slipaj sayısını üretiyor ama modelden EN UZAK olan o;
    ön-kayıt tam bu "yaltaklanan ölçüt" seçimini kapatmak için vardı ve İŞE YARADI.
    ÖLÇÜT TAŞINMASI GEREKLİYDİ (kanıt): IEX ilk-dakika işlem sayısı EMR'de 1 (tek 100 hisselik basım),
    SIP'te 221 — payda temsili değildi. Çapraz kontrol: Alpaca SIP ↔ Massive açılış basımı 0,00 bps.
  yeni_sayilar: >
    Kanonik ölçütle giriş bacağı: medyan 29,0 · ortalama 43,0 · ağırlıklı 34,8 bps · **3/4 aleyhte**
    (NUE −20,7 = LEHTE; EMR +26,8 · AMGN +31,2 · BKNG +134,5). EDG-037'nin "4/4 aleyhte, ~9 kat"
    ifadesi ÖLÇÜT ARTEFAKTIYDI — kanonikte oran ~7× ve işaret tutarlılığı 3/4. Model 5 bps sabit.
  edg037_teshis_duzeltmesi: >
    EDG-037 çıkış bacağının n=0 olmasını `ENTRY_TIF=day` kelepçesine bağlamıştı — BU TEŞHİS EKSİKTİ.
    Ölçüldü: 08-06..08-12 beş seansta hiçbir pozisyonun stop'u ya da hedefi DEĞMEDİ (en yakın EMR,
    stop'un +231 bps üstünde; NUE +368 · AMGN +299 · BKNG +746). Korumalar kesintisiz canlı kalsaydı
    da n=0 olurdu. Bağlayıcı kısıt EMİR ÖMRÜ değil TUTUŞ SÜRESİ. TIF kelepçesi gerçek bir KORUMA
    boşluğu üretti (aşağıda) ama ÖLÇÜM boşluğunun sebebi o değil.
  koruma_bulgusu: >
    Koruma OTOMATİK yeniden kurulMUYOR: `submit_protective_oco`nun tek çağıranı `api.koruma_kur` ve o
    üç kapı ardında (ölçüm + operatör onay jetonu + öneri kimliği); bekçi çıplaklığı GÖRÜP alarm
    üretiyor ama KURMUYOR. Ölçülen zincir: 08-06 20:00Z bracket'lar öldü (day TIF) → 08-07 16:23Z elle
    kuruldu → 20:32Z yine öldü (v220 coid çarpışması) → 08-09 08:35Z elle kuruldu. Korumasız duvar
    56,4 saat, SEANS-İÇİ 2,895 saat (0,445 seans) → kartın donuk ">1 seans" eşiğini AŞMADI; bulgu
    olarak DAMGALANMAZ, sayı olarak beyan edilir. Yine de OPERATÖR KALEMİ: koruma kurulumunun elle
    olması, TIF ölümüyle birleşince pozisyonları seans-içi çıplak bırakabiliyor.
  asimetri: >
    MEKANİZMA BEYANI (sayı değil): giriş `type=limit` (TAVANLI) · çıkış stop bacağı `type=stop`,
    `limit_price=null` → tetiklenince MARKET (TAVANSIZ). Replay ikisine de aynı 5 bps'i uyguluyor
    (broker.py:515/:669) VE bar-içi stop dokunuşunu `eff_stop`ta dolmuş sayıyor (:596) — yani
    stop-tetik slipajı modelde SIFIR. Çıkış friksiyonu ölçülene dek bu, adı konmuş bir iyimserliktir.
  pf: >
    Kanonik ölçütle yalnız-giriş başabaşı 19,0 bps; ölçülen giriş farkının medyan(24,0)/ağırlıklı(29,8)/
    ortalama(37,9) ÜÇÜ DE bunun üstünde → çıkış friksiyonu SIFIR olsa bile PF<1 (K2 0,973 · K3 0,943 ·
    K1 0,903). NOKTA TAHMİNİ, HÜKÜM DEĞİL: n=4, t-CI95 [−102,8; 178,7] sıfırı içeriyor. Simetrik
    başabaş 9,49 bps. RESULT_PF_MIN=1.3 GEVŞETİLMEZ — EDG-037 hükmü güçlenerek durur.
  sonraki: >
    (a) ÇIKIŞ ÖRNEKLEMİ tutuş süresine bağlı — beklemek gerekiyor; hızlandırmanın tek meşru yolu
    örneklem biriktirmek, eşik oynatmak DEĞİL. (b) Replay'in bar-içi stop varsayımı (slipaj=0) ayrı
    bir ölçüm kalemi — çıkış n≥5 olunca ilk sınanacak şey bu. (c) `slippage_bps=5` GÜNCELLENMEZ:
    n=4 ile motor sabitini değiştirmek, ölçülmemişi ölçülmüş sanmaktır (EDG-037 kill#1 hâlâ geçerli).
