beyanli_sinirlar: >
  (1) Replay chop kanıtı 2022-2026 penceresinin rejim karışımına bağlıdır — GO, "her chop'ta
  kazanılır" demez. (2) Kart yalnız TABAN kaldıracını ölçer; dd-tetiği/ceza-büyüklüğü ayrı
  kartların işidir. (3) Canlı icra maliyeti dahil değildir (canlı chop işlemi hiç doğmadı).
