  - "ROADMAP §2-13: düzeltme adayı tanımı (sonraki-bar trail)"

universe: "023/026 evreni; şasi 027-F1'in olcum.py'si (eşli-kıyas makinesi + öz-sınamalar) — yalnız trail-düzeltme monkeypatch'i eklenir"

