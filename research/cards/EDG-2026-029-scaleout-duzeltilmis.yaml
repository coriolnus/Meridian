card_id: EDG-2026-029
family: scaleout_duzeltilmis
thesis: >
  EDG-027/H1 scale-out'u CI-negatif ölçtü AMA kökü MEKANİKTİ (§2-13): bankalama barında trail=entry_fill
  kurulunca (entry_fill>open) koşucu AYNI BARDA ~0.7R stop_gap'e kesiliyor — gap-kazananlar budanıyor
  (ENPH +12.3R→0.72R). TEZ: düzeltilmiş davranışla (bankalama barında trail entry_fill'e ÇEKİLMEZ; trail
  güncellemesi bir SONRAKİ bardan) scale-out ½@1.5R kavramının gerçek etkisi ölçülür. Düzeltme ölçüm-içi
  monkeypatch (BEYANLI — motor dosyası değişmez); kavram CI-pozitif çıkarsa motor-düzeltme kartı + kod turu
  pencere-sonrası açılır.

