basari_tanimi: >
  Pencere kapanışında dört kolon (K1–K4) + D + PK/NK sonucu research/olcumler/edg103_okuma_ilgi_atif/ altında;
  hüküm AYNI turda karta + K defterine. Hangi kolon(lar) baskınsa TSK-060 ve 7 kapılı kalem
  (TSK-161/163/164/165/166/169/170) için anlamı:
    - H1 baskın (K1 KALDI) → yapısal/disiplin sorunu; düzeltme ÖNCE §0-5'i güçlendirmek (ör.
      otomatik hatırlatma), sayfaların KENDİSİ hakkında henüz bir şey söylemez — TSK-060 kararı
      ERTELENİR, yeni pencere §0-5 düzeltmesinden SONRA.
    - H2 baskın (K1 GEÇTİ, K2 KALDI) → sayfa KONU TASARIMI kararların gündemiyle kopuk; sayfa
      kümesi (S1–S11) gözden geçirilir ya da konuca daraltılır — TSK-060 kısmi devam (sayfa seti
      revize), 7 kalem beklemede.
    - H3 baskın (K1,K2 GEÇTİ, K3 KALDI) → en ucuz/aksiyona en yakın bulgu: sayfalar gerçekten
      okunuyor ve ilgili ama atıf alışkanlığı eksik. TSK-060 sökme yönü ZAYIFLAR (mekanizma
      çalışıyor); 7 kalem GEÇTİ sinyaline en yakın — önerilen sonraki adım (uygulama DEĞİL, not):
      atıf hatırlatıcısı.
    - H4 baskın (K1,K2,K3 GEÇTİ ama K4 yüksek) → EN GÜÇLÜ sökme sinyali: kararlar zaten
      recall/memory'den doyuyor, sayfalar sistematik yedek/gölge. TSK-060 sökme yönü GÜÇLENİR, 7
      kalem muhtemelen DÜŞER (gerekçeleri sayfa-temelli).
    - D < n_min_karar → 'ölçülemedi'; TSK-060 kararı yine ERTELENİR, dördüncü aynı-yöntem
      denemesine düşülmez (yeni pencere, aynı kart, sayaç sıfırlanmaz — kart AÇIK kalır).

