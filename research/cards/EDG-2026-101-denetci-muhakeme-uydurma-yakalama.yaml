# EDG-2026-101 — Brifing kural denetçisinde muhakeme KAPALI iken "uydurma sözcük" yakalama gücü ve yanlış pozitif oranı — TSK-200
# ÖN-KAYIT 2026-09-16 23:41Z (Rol-1, operatör "full otonom bir şekilde devam et"). Kaynak kalem: ROADMAP TSK-200.
# ÖNCEKİ KARAR: TSK-138 dilim-3 (2026-09-14, ops/denetci_rota.py başlık şerhi) muhakemeyi VARSAYILAN KAPALI yaptı —
# kazanç ölçüldü (çağrı 75–138 s → ~2–10 s), BEDEL ÖLÇÜLMEDİ ("muhakemesiz denetçi uydurma sınıfını daha az yakalayabilir").
# Aynı şerh ara ayarın ("muhakeme tavanı 400") gerçek olay adlarını "uydurma" saydığını yazıyor → ölçüm İKİ YÖNLÜ.
# KAYITTAN ÖLÇÜLEMEDİ (ROADMAP TSK-200 notu, 2026-09-16 22:5xZ, A1 olay defteri): geçmişte işaretlenen "uydurma" kelimelerinin TAMAMI sıradan
# Türkçe ("yazim", "bekçi", "Sistemde", "kritik"); doğru pozitif örnek YOK → yakalama oranı ancak EKİLMİŞ setle ölçülür.
# HAFIZA KONTROLÜ (2026-09-16 23:3xZ, bu ön-kayıttan önce): `ops/kart_benzer.py --hipotez "LLM kural denetçisinde muhakeme kapatılınca uydurma sözcük
