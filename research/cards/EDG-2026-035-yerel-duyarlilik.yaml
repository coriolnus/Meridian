  - "kaba-grid kanıtları: 023 (rampa), 026 (slot/boyut), 028 (zarf 5-vs-10), 033 (boyut-modülasyon düştü)"
  - "024 serap-uyarısı: tam-defter nokta-farkı kırılgan portföy-yolu artefaktı olabilir"

