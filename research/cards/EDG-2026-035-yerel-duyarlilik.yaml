card_id: EDG-2026-035
family: yerel_duyarlilik
thesis: >
  Operatör yönergesi (2026-08-12): "parametreleri aşağı/yukarı oynatıp C+mb @5R'nin en kârlı versiyonunu
  bulalım". Benimsenen nokta KABA grid'lerden geldi (slot 5-vs-20, boyut 1.0-vs-0.5, zarf 5-vs-10) —
  komşuluk ölçülmedi; tepki-yüzeyinin yerel eğimi bilinmiyor. TEZ: OFAT (tek-eksen) komşuluk taraması ya
  CI-üstün bir komşu bulur (pencereye aday) ya da C+mb'nin yerel-optimumluğunu kanıtlar (kapanış).
  SERAP-KORUMASI: nokta-P&L maksimizasyonu YASAK (024 dersi) — benimseme yalnız CI-üstünlükle.

evidence_refs:
  - "EDG-032 damga: C+mb 885 işlem +20.685$ dd %12.7 sharpe 0.521 (taban)"
  - "kaba-grid kanıtları: 023 (rampa), 026 (slot/boyut), 028 (zarf 5-vs-10), 033 (boyut-modülasyon düştü)"
  - "024 serap-uyarısı: tam-defter nokta-farkı kırılgan portföy-yolu artefaktı olabilir"

universe: >
  YENİ-MOTOR varsayılan dünyası (kod-turu sonrası: rampa 15/36 kablolu + slot 20 + 0.5R + mb silahlı) —
  032-cmb ile bit-özdeşlik ŞASİ-KONTROLÜ zorunlu (aynı zamanda dağıtım-regresyon kanıtı). Zarf hücreleri
  guard.py heat_hard_r kanonik yüzeyinde BEYANLI monkeypatch (028 T10 emsali); slot/boyut hücreleri
  goal-param enjeksiyonu (motor yamasız). ZAMANLAMA KURALI (033 dersi): motor dosyaları düzenlenirken
  koşulmaz — dağıtım-sonrası temiz ağaçta.

features_asof: >
  ALTI OFAT hücresi, merkez C+mb: slot {15, 25} · position_size_r {0.40, 0.65} · zarf heat_hard_r
  {6.5, 8.0}. Her hücre-vs-taban: işlem n, ΔP&L+CI, max-dd, sharpe, işlem-R (eşlenik ay-kümeli bootstrap
  5000, seed 20260812). Ek çıktı (karar değil bilgi): üç eksenin yerel eğim haritası.

parameter_grid:
  slot: [15, 25]          # K += 2
  size_r: [0.40, 0.65]    # K += 2
  zarf_r: [6.5, 8.0]      # K += 2  (toplam K += 6)

cost_model: pessimistic_band_v2

success_metric: >
  Hücre 'benimseme adayı' ANCAK: ΔP&L-vs-taban CI-ALT > 0 (CI-üstünlük) VE dd ≤ taban×1.3 VE sharpe ≥ 0.20.
  Aday(lar) DSR/çoklu-test notuyla operatör penceresine gider (uygulama final-paket doğrulaması şartıyla —
  §2-11). HİÇBİR hücre CI-üstün değilse → C+mb YEREL-OPTİMUM KANITLA (kapanış hükmü; eğim haritası yine
  raporlanır). Nokta-P&L sıralaması hüküm girdisi DEĞİLDİR.

kill_criteria:
  - "şasi-kontrolü düşerse (yeni-motor-default ≠ 032-cmb bit-özdeş) ölçüm DURUR — önce dağıtım-regresyon teşhisi"
  - "şasi bütünlüğü (frame/dup/scan==plan) bozuksa geçersiz"
  - "motor dosyalarında koşum sırasında mtime değişimi → o hücre geçersiz, yeniden koşulur (033 dersi)"

k_registry: {registered_at: "2026-08-12T5x", trial_ids: [pending-035-slot15, pending-035-slot25, pending-035-size040, pending-035-size065, pending-035-zarf65, pending-035-zarf80]}

status: measured   # 2026-08-13 Rol-1 — 6 hücre ölçüldü + hüküm: C+mb YEREL-OPTİMUM KANITLA.

verdict:   # Rol-1 hükmü.
  sonuc: >
    ALTI HÜCREDE DE CI-ÜSTÜNLÜK DÜŞTÜ (kartın tek benimseme ayağı) → C+mb @5R YEREL OPTİMUM KANITLA;
    değişiklik önerisi YOK, pencere kurulmaz. Nokta farkları (hüküm girdisi DEĞİL, serap-koruması):
    slot15 +354$ · slot25 0,00$ · size040 −3.553$ · size065 +64$ · zarf65 −9.553$ · zarf80 −5.209$.
    dd (b) ve sharpe (c) ayakları 6/6 geçti — yani komşuluk 'tehlikeli' değil, sadece 'daha iyi değil'.
    K=6 harcandı; aday çıkmadığı için DSR değerlendirmesi konusuz.
  yapisal_bulgu: >
    ÖLÇÜMÜN ASIL KAZANIMI — SLOT TAVANI FİİLEN ÖLÜ BİR KNOB: eşzamanlı pozisyon tepesi 13 (<20), yani
    slot20 hiç bağlamıyor; slot25 defteri tabanla BAYT-ÖZDEŞ (ΔCI=[0,0]). Bağlayıcı kaynak ısı zarfı
    (gerçekleşen tepe tam 5,000R) — 028/032/033'ün üçüncü kez ölçtüğü aynı yasa, artık dördüncü kanıtla.
    slot15'in farkı da slottan DEĞİL yan kanaldan: sektör tavanı paydası max_open'a bağlı (guard.py:359,
    (sektör+1)/max_open > %40 → isim tavanı 20'de 8, 15'te 6) — sector_cap NO_GO 8→33. Yani "slot" knobu
    fiilen "sektör çeşitlendirme" knobu; ikisi yapışık (→ ROADMAP §2-15g). ZARF EKSENİ: hacim üretiyor,
    kalite düşürüyor (n 885→1052→1144, sharpe 0,521→0,278→0,369) ve monoton DEĞİL; zarf80 slot tavanının
    bağladığı ilk hücre (max_open NO_GO 32) — zarf×slot etkileşimi OFAT'ın kör noktasında başlıyor.
    Operatörün "C+mb @10R ne olurdu" sorusu buradan cevaplanır: eğim aleyhte, 10R ölçmeye gerek yok.
  kill1_kanit: >
    ŞASİ-KONTROLÜ GEÇTİ + DAĞITIM-REGRESYON KANITI: v237 yeni-motor default'u, 032-cmb ile BAYT-ÖZDEŞ
    (islemler d4033de6…, seanslar f0c8df92…; 12/12 ölçüm bloğu derin-eşit; n=885, +20.684,69$, dd 0,1268,
    sharpe 0,521). Yani rampa kablolaması + mb silahlaması davranışı ZERRE değiştirmedi — kod turu
    ölçülen dünyayı birebir taşıdı. Beklenen tek fark motor sha'sı (dağıtımın kendisi).
  tca_serhi: >
    KISMİ FRİKSİYON ŞERHİ — YALNIZ `kill1_kanit`taki MUTLAK DAMGA SATIRINA (2026-08-13; kaynak:
    EDG-2026-037 / EDG-2026-038 + denetim docs/DENETIM-ROADMAP-TUTARLILIK-2026-08-13.md §E).
    HÜKÜM SİLİNMEDİ — ÜSTÜNE YAZILDI.
    ŞERHİN İNDİĞİ SATIR: "n=885, +20.684,69$, dd 0,1268, sharpe 0,521". Bu, EDG-2026-032'nin paket
    damgasının tekrarıdır ve onunla AYNI MARUZİYETTEDİR: replay motorunun `slippage_bps=5` varsayımıyla
    üretildi; kanonik ölçütle (D1 konsolide açılış) giriş bacağında medyan +29,0 bps fark ölçüldü,
    3/4 aleyhte, model 5 bps sabit. SINIRLAR BEYANLI: n=4, CI geniş, ÇIKIŞ bacağı n=0.
    NE DEĞİŞMEZ — VE HÜKÜM GÜÇLENİR: "C+mb @5R YEREL OPTİMUM" sonucu 6/6 hücrede CI-üstünlüğün
    DÜŞMESİNE dayanır; zarf hücreleri tabandan DAHA ÇOK işlem üretiyor (n 885→1052→1144) → gerçek
    friksiyonda o hücreler DAHA DA kötüleşir. slot25'in BAYT-ÖZDEŞLİĞİ (ΔCI=[0,0]) ve `kill1_kanit`in
    dağıtım-regresyon kanıtı (v237 default'u ↔ 032-cmb bayt-özdeş) ÖZDEŞLİK iddialarıdır, seviye
    iddiası değil — friksiyondan tamamen bağımsızdır. `yapisal_bulgu` da (slot tavanı ölü knob;
    bağlayıcı kaynak ısı zarfı; slot↔sektör-tavanı yapışıklığı) sayım/yapı bulgusudur.
    YANİ: şerh DAMGAYA iner, HÜKME DEĞİL. Bu bir ÇIKARIMDIR (§E.0); hücreler yeniden koşulmadı.
