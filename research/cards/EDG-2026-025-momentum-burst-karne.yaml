verdict:   # Rol-1 hükmü — ölçüm ajanı karta/ARMED_SETUPS'a dokunmadı.
  olcut_i: "DÜŞTÜ (kıl payı): replay avg-R +0.2695, n=106, çıkış-günü-kümeli CI [−0.0046, +0.5606] — alt sınır 0'ın 0.005R altında. Donuk eşik donuktur; kıl payı eşiği değiştirmez."
  olcut_ii: "GEÇTİ: bileşik ΔP&L +11.917$; slot-çalma zararsız (diğer kurulumlar +2.242$ DAHA İYİ, CI-kurulu değil)."
  olcut_iii: >
    ÇÖZÜLDÜ: −0.114R hiçbir zaman ölçüm DEĞİLMİŞ — v218 kalibrasyonsuz kuru-koşum PROMPT figürü; defterden
    hiçbir dilim türetmiyor (en yakın 2022-H2 −0.1327), üç çağdaş doküman 'yeniden-üretilemedi' diyor, artefaktı
    yok. Gerçek kanıt çelişkisiz: cf +0.0921 (n=1080, CI [−0.025,+0.213], N4 ile birebir) ve replay +0.2695 —
    ikisi aynı yönde pozitif-nokta, ikisi de CI-0-içi.
  hukum: >
    ÜÇÜ BİRDEN şarttı → OTOMATİK SİLAHLANMA YAPILMAZ; momentum_burst DORMANT kalır. Sayılar karar penceresine
    'kıl-payı işareti' olarak gider — manuel silahlanma operatör takdirinde (hammer emsali). DİKKAT İŞARETİ
    (pencereye): 2026 yakın-dönem mb her iki bacakta zayıf (cf 2026-H2 −1.03 n=7; replay 2026 +0.014 n=16) —
    kıl-payı pozitiflik eski yıllardan geliyor olabilir.
  tca_serhi: >
    KISMİ FRİKSİYON ŞERHİ — YALNIZ ÖLÇÜT-ii'ye (2026-08-13; kaynak: EDG-2026-037 / EDG-2026-038 +
    denetim docs/DENETIM-ROADMAP-TUTARLILIK-2026-08-13.md §E). HÜKÜM SİLİNMEDİ — ÜSTÜNE YAZILDI.
    ÖLÇÜT-i (replay avg-R +0.2695, CI [−0.0046,+0.5606]) ŞERH GEREKTİRMEZ, FRİKSİYONLA GÜÇLENİR:
    gerçek friksiyon ort-R'yi aşağı çeker → kıl payı düşen ölçüt daha da net düşer → "OTOMATİK
    SİLAHLANMA YAPILMAZ" hükmü SAĞLAMLAŞIR.
    ÖLÇÜT-ii (bileşik ΔP&L +11.917$) DUYARLI: mb'li kol taban koldan FARKLI SAYIDA işlem üretir
    (n-asimetrik) ve her ek işlem iki bacak friksiyon taşır (denetim §E.0-ii). Bu MUTLAK dolar rakamı
    replay motorunun `slippage_bps=5` varsayımına asılıdır; o varsayım ilk kez ölçüldüğünde iyimser
    çıktı — kanonik ölçütle (D1 konsolide açılış) giriş bacağında medyan +29,0 bps fark, 3/4 aleyhte,
    model 5 bps sabit. SINIRLAR BEYANLI: n=4, CI geniş, ÇIKIŞ bacağı n=0. Aynı satırdaki slot-çalma
    sonucu (+2.242$, CI-kurulu DEĞİL) zaten hüküm taşımıyordu.
    ÖLÇÜT-iii (çelişki teşhisi: −0.114R'nin kalibrasyonsuz PROMPT figürü olduğu) friksiyondan
    TAMAMEN BAĞIMSIZ — dokunulmaz.
    Bu şerh bir ÇIKARIMDIR (§E.0 ayrım kuralı); kol YENİDEN KOŞULMADI.
  canli_durum_serhi: >
