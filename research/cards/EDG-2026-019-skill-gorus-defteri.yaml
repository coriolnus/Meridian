kill1_kaydi_2026_08_23: >
  ROL-1 KAYDI (2026-08-23; WP7 eleme turu yakaladı): İKİ OLGU. (1) KART↔KOD AYRIŞMASI —
  bu kart 'ölçüm kodu yazılmadı' derken görüş katmanı CANLIDA YAZILMIŞ ve çalışıyor
  (5.500 görüş; skill_gorus_durum.json üretiliyor). Kod kartsız sevk edilmiş — yönetişim
  ihlali kayda geçer; katmanın ürettiği hiçbir sayı (terfi adayları dahil) RESMÎ HÜKÜM
  DEĞİLDİR, çünkü kartın ölçümü hiç resmileşmedi. (2) DONUK KILL#1 TETİKLENMİŞ VE
  UYGULANMAMIŞTI — canlı kayıt: kill_p95=KILL, p95_pay 6.57 > tavan 0.10 (08-21'den beri;
  görüş üretimi canlı döngü p95'ini ~×6.6 katlıyor — 'gözlem icrayı yavaşlatamaz' yasası
  ihlalde). KURAL UYGULANIR: katman KAPATILIR (yazım varsayılan-kapalı bayrağa alındı —
  E-partisi v278; defter ve son KILL kaydı kanıt olarak DOKUNULMADAN kalır). YENİDEN AÇILIŞ
  YOLU: yalnız bu kartın RESMÎ ölçümüyle — kill#1 kök çözümü (yazım maliyeti p95-bütçesine
  sığdırılmış: async/örneklem/toplu-yazım sınıfı bir tasarım) kartın koşumundan ÖNCE gelir;
  eşikler AYNEN (kill-list dokunulmaz). Eleme raporundaki FDR-sağkalan adaylar (vcp-screener,
  cikis; emeklilik işareti exhaustion-hammer) resmî koşumda YENİDEN üretilmek zorundadır.

acilis_kaydi_2026_09_01: >
  ROL-1 KAYDI (2026-09-01): kill#1 KÖK ÇÖZÜMÜ İNDİ ve bayrak bu kayıtla açıldı. Tasarım
  kill1 kaydının istediği sınıftan (async/toplu-yazım): kadans içinde artık YALNIZ
  kuyruk-append koşar (tek jsonl satırı; TSK-058 implementasyon turunda ölçüldü 2026-09-01:
  kuyruk-append 5,4-5,7 ms — eski kadans-içi tam koşu 88-220 ms idi ve kadanstan TAMAMEN
  çıkarıldı); görüş üretimi `ops/skill_gorus_uret.py --uygula` ile ayrı süreçte, seans-dışı
  `meridian-skill-gorus.timer` (07:30Z) biriminde. Çiviler: v356 (13+ kuyruk/CLI çivisi,
  16/16 mutasyon kanıtı) + v278 (bayrak↔bu kayıt bağı; kapalı-yol çivileri kapalılığı
  KURARAK yaşamaya devam eder). EŞİKLER VE KILL-LIST AYNEN: p95 mandalı kodda armed
  (kuyruk_kadansi pay/p95 tanımı değişmedi; gozetim_ms AYRI alan olarak ölçülür) — tavan
  yine aşılırsa katman otomatik kapanır ve olay adıyla düşer. BU AÇILIŞ RESMÎ FDR ÖLÇÜMÜ
  DEĞİLDİR: ölçüm görüş birikince (n_min=30, FDR q=0.10, |rank-IC|>=0.05) koşulur; eski
  eleme adayları resmî koşumda YENİDEN üretilmek zorundadır (kill1 şartı aynen). İlk canlı
  üretim koşumunun sonucu bu karta ayrıca işlenecek (kurulum günü elle test-ateşleme, §9).

