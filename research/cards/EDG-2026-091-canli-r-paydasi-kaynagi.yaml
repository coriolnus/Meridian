  status_gecisi: "registered → measured; K 1/1 harcandı (oran ölçüsü) + 1 tanı"
  hukum: "HİPOTEZ KALDI — canlı r_multiple paydası plan riskinden sistematik ayrışıyor (8/16 bant dışı, medyan 1,012, VRTX 0,494 · VLO 1,823) AMA sıkılaştırma ile BİRLİKTE DEĞİL: 2×2 tabloda bant dışı 8 işlemin 0'ında stop-yukarı olayı (eşleşme 0,00 vs eşik 0,80; sıkılaştırma olayı toplam 4, hepsi bant içi/başka işlemlerde). Kartın 'tutmazsa kaynak başka (fiyat modeli / qty / pnl hesabı) → tanı raporu' kolu: KAYNAK ÖLÇÜLDÜ = qty/bütçe."
  kaynak_olculdu: "Canlı payda `meridian/broker.py::PaperBroker.close_position` → `pnl / pos.risk_dollars`; `risk_dollars` = `PaperBroker.size_position` DOLAR BÜTÇESİ (`size_r · RISK_PCT_PER_R · equity`), girişte DONAR (kapanış anı eff_stop'a bakmaz — hipotezin adayı yapısal olarak imkânsız). Hisse başı payda = risk_dollars / qty; `meridian/loop.py::_adet_benimse` (Ö-53/D) kitabın adedini aynadan alırken `risk_dollars`a DOKUNMAZ → payda sessizce kayar. Kanıt: A1 events `adet_benimsendi` 2026-09-03T20:32:45Z VRTX 17 → 38 (sapma sınıfı kitap_kaydi; 14 olay toplam) ↔ VRTX oranı 17/38 ≈ 0,45 ölçülen 0,494 (yuvarlama + dolum farkı). Tanı: payda/giriş-riski medyanı 1,0045 (payda gerçek dolumu izliyor, tetiği değil); qty tabanı: ayna_qty 7 · iç dolum 6 · çoklu tutan 7 · açıklanamadı 4."
  uc_yol_payda: "canlı = replay: POZİSYON bütçesi (`risk_dollars`; replay aynı `PaperBroker` fabrikası, ayna yok → `_adet_benimse` hiç koşmaz, qty bütçeyle tutarlı); gölge (`golge_icra._kapanis_satiri`): HİSSE BAŞI giriş riski (dolum − stop). İkisi ancak qty tam bölündüğünde eşit — `math.floor` artık bırakır (birim ayrışması, adıyla)."
  pk_uclusu: "(1) sentetik oran 1,000 / 0,500 / bütçe-yuvarlama 1,035 el hesabıyla birebir; (2) gerçek ECL 1,01 · REGN 1,05 · MU 1,01 · VRTX 2,03 → betikle ±0,01 (VRTX plan-tetik paydasıyla 2,03; kartın üst yorumu); (3) çapraz gölge 6/6 tam 1,000; replay 6/6 TÜRETİLMİŞ bantta (bütçe/qty), düz ±0,01 ile 5/6 (V, qty 35). RUL: kartın (3) lafzı 'replay R'si plan riskine oran 1,000' replay'in de bütçe paydası kullandığı ÖLÇÜLENE KADAR yazılmış bir öncüldü; yol-tutarlılık sorusu ('betik replay'in R'sini kendi girdilerinden yeniden üretiyor mu') 6/6 EVET → PK GEÇTİ, sapma bulgunun kendisidir (kill#4 tetiklenmedi). Sapma ve düz sayı burada beyanlı."
