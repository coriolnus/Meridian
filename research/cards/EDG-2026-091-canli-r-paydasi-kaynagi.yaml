  kapi_ve_kume: "n_oran 16 ≥ 15 (24 işlem − 5 plansız [ALL·NUE·AMGN… plan satırı donmuş çekimde yok, defterden türetme yapılmadı] − 4 sıfır-R [|r| < R_MULTIPLE_ALT 0,02, `edg088/sayim.py` tek kaynak]); SL bacağı = plan.stop 14 eşit / 4 farklı / 6 ölçülemedi (tanı)."
  sonuc: "research/olcumler/edg091_r_paydasi/sonuc_20260913T192041+0000.json (git blob 0f328f4894ccad5bcacafecf52f618b34c26641c); girdi a1_cekim_2026-09-13.json sha256 e1524a74… doğrulandı; kod `olc.py`, çivi v479 (13; 8/8 mutasyon — TDD sırası ihlali beyanlı, telafi mutasyonla)."
  karar_operatore: "DÜZELTME KARARI (basari_tanimi: karne tarihçesini değiştirir): canlı R paydası TEK KAYNAK — seçenekler (a) `_adet_benimse` adet değişince `risk_dollars`ı `qty · (dolum − stop)` ile yeniden türetsin (hisse başı payda korunur; karneler geriye dönük yeniden hesap AYRI karar), (b) canlı/replay hisse-başı giriş riskine geçsin (gölgeyle aynı birim; bütçe artığı yok), (c) beyanlı iki alan (`r_multiple_butce` + `r_multiple_giris`) — hiçbiri bu kartta uygulanmaz (kill#2), ayrı kalem + tam suite. EDG-088 PK(2) o karardan sonra MEVCUT eşikle yeniden koşar (gölge ↔ gerçek birim eşitlenince kalan fark yalnız fiyat yolu ≈ 0,011 R)."
