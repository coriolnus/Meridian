hipotez: >
  Canlı defterin `r_multiple` paydası, gölge/replay'in kullandığı PLAN/GİRİŞ riskinden (|giriş − plan.stop|) sistematik olarak FARKLI
  bir mesafedir (aday: kapanış anındaki sıkılaştırılmış eff_stop mesafesi ya da koruma-stop mesafesi) ve bu fark, stop'u
  sıkılaştırılmış işlemlerde R büyüklüğünü şişirir/küçültür → canlı karneler (avg_r, PF) replay'le KARŞILAŞTIRILAMAZ hâle gelir.
  Ölçüt: 24 canlı işlemde payda_turetilen / plan_riski oranı; oran ≠ 1 olan işlemlerin payı ve o işlemlerde stop-sıkılaştırma
  olayının (koruma/trailing/replace_order_stop) varlığı. Hipotez tutarsa (oran≠1 ∧ sıkılaştırma birlikte ≥ %80) kaynak kanıtlanmış
  olur ve DÜZELTME kararı (payda = giriş riski, TEK KAYNAK; ya da beyanlı iki alan) operatöre gider; tutmazsa kaynak başka
  (fiyat modeli / qty / pnl hesabı) → tanı raporu.

