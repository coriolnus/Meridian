beyanlı_sinirlar: >
  (1) TEK TAVAN (0,01): tavan taraması değil — "en iyi bilinen nokta" sınanıyor; başka tavanda
  işaret dönüyorsa bu kart onu GÖRMEZ (genişletme yeni kart + K ister).
  (2) B kolunun canlı karşılığı yaklaşıktır: gerçek dinlenen emir gün içi fiyat yoluna bağlı
  dolar, replay bar_low'a bakar (23c beyanı aynen) — B hücreleri iyimser ALT SINIR sınıfıdır.
  (3) Sabit-bps varsayımı (edg040'ın üç beyanı aynen geçerli): gerçek friksiyon isim/likidite
  bağımlı; kapının asıl kestiği kuyruk sabit-bps'te TEMSİL EDİLMEZ, yani kapının yüksek-friksiyon
  değeri burada EKSİK ölçülüyor olabilir — bu kart o yüzden "kapı zararlı" yönünde muhafazakâr,
  "kapı iyi" yönünde güvenilirdir (asimetri beyanı).
