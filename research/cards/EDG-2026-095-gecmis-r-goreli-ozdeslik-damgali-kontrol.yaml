  (sqlite backup, sha256) + events.jsonl adet_benimsendi/koruma/trail süzgeci (sha256). Özdeşlik kümesi = benimsemesiz VE
  stop_kaynak == "plan"; düşük güvenli stop'lu satırlar özdeşlik kümesine ve YAZIM kümesine girmez (ayrı sayılır).
  Çıktı: işlem başına tablo + özet + girdi künyesi + blob sha; hüküm Rol-1.

