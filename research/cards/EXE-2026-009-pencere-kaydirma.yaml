beyanli_sinirlar: >
  (1) 047 tek-dönem ölçümüydü; kaydırmanın gerçek etkisi ancak 042 birikimiyle görünür — hakem
  tam bunun için. (2) Sürüklenme bedeli fiyata gömülü gelir (1345 dolum fiyatları); ayrı bedel
  muhasebesi yapılmaz. (3) Kaçan-hareket etkisi (13:30-13:45 arası sinyal bozulması) bu kartta
