card_id: EXE-2026-009
family: icra_pencere_uygulama
thesis: >
  B-PENCERE-KAYDIR operatör kararı (2026-08-23 brainstorm 2/7, kanıt EDG-2026-047): canlı sabah
  tarama/emir tetiği 13:30→13:45 UTC'ye kayar. BU KART bir replay ölçümü DEĞİL, canlı-değişikliğin
  ÖN-KAYDI ve hakem sözleşmesidir (kart-önce disiplini: değişiklik, hakemi ve geri-alma kuralı
  değişiklikten ÖNCE donar). Hakem: EDG-2026-042'nin haftalık gerçek-friksiyon ölçümü.
evidence_refs:
  - "EDG-2026-047 (measured): Δ%menzil −%42,3 [−%44,3, −%40,1]; bedel medyan +4,65 bps"
  - "docs/KARAR-2026-08-23-YEDI-KARAR.md K2 (operatör onayı + ray seçimi: 042-hakemli süresiz)"
uygulama_sozlesmesi: >
  (1) Tetik: canlı sabah tarama/emir gönderimi 13:45 UTC'ye kayar (yalnız zamanlama; emir tipi/
  mantık DEĞİŞMEZ). (2) DAMGA: E2 icra defterine her dolumda `pencere` alanı yazılır ("1330" =
  kaydırma-öncesi rejim, "1345" = sonrası); damga dolum anındaki YÜRÜRLÜK rejimini söyler,
  geriye dönük yeniden-etiketleme YASAK. (3) OKUYUCU (YASA 6): EDG-042 haftalık koşumu K1'i iki
  alt-bantta raporlar (pencere=1330 · pencere=1345).
hakem_kurali: >
  DONUK ÖNERİ TETİĞİ: 042-K1'in 1345-alt-bandının medyan CI'ı, 1330-alt-bandınınkinden YÜKSEK
  yönde AYRIK olursa (kötüleşme; CI'lar kesişmiyor) haftalık rapor operatöre "GERİ-AL ÖNERİSİ"
  düşürür. Geri alma OTOMATİK DEĞİL — operatör kararı. Alt-bant n<10 iken kıyas yapılmaz
  ("örneklem-birikimde" damgası). Kaydırma süresiz; pilot süresi YOK (operatör seçimi).
parameter_grid:
  hucreler: [canli_pencere_1345]   # K += 0 — replay hücresi yok; canlı-değişiklik ön-kaydı
cost_model: gercek_dolum   # hakem gerçek dolumlardan ölçer (042 kanalı)
success_metric: >
  Bu kart hüküm ÜRETMEZ; başarı ölçütü hakem sözleşmesinin İŞLEMESİDİR: damga her dolumda var,
  alt-bant raporu her haftalık koşumda üretiliyor, öneri tetiği koşulu her koşumda değerlendirilip
  sonucu (tetiklenmedi/tetiklendi/örneklem-birikimde) raporda beyan ediliyor.
kill_criteria:
  - "damga alanı yazılmadan kaydırma canlıya çıkarsa geçersiz (hakem kör doğar)"
  - "öneri tetiği eşiği ölçüm başladıktan sonra değişirse geçersiz"
  - "geriye dönük pencere yeniden-etiketleme yapılırsa geçersiz"
k_registry: {registered_at: "2026-08-23", trial_ids: [EXE-009-canli-pencere]}
status: registered   # 2026-08-23 Rol-1 — ön-kayıt; uygulama kodu bu karttan SONRA (kart-önce)
beyanli_sinirlar: >
  (1) 047 tek-dönem ölçümüydü; kaydırmanın gerçek etkisi ancak 042 birikimiyle görünür — hakem
  tam bunun için. (2) Sürüklenme bedeli fiyata gömülü gelir (1345 dolum fiyatları); ayrı bedel
  muhasebesi yapılmaz. (3) Kaçan-hareket etkisi (13:30-13:45 arası sinyal bozulması) bu kartta
  ölçülmez; tahtada açık soru olarak durur.

acik_kalemler_2026_08_29: >
  AÇIK KALEM KAYDI (Rol-1, EDG-042 haftalık koşum #2'nin ardından operatör sorusu üzerine yapılan
  defter-bütünlüğü teşhisinden doğdu). Kanıt: research/olcumler/edg042_teshis_pencere_damgasi_2026-08-29/
  (TESPIT.md + teshis_damga.py + teshis_damga.json; salt-okuma, canlıya ve state/'e yazma yok).
  BU BLOK HÜKÜM DEĞİLDİR VE HİÇBİR ŞEYİ DEĞİŞTİRMEZ: uygulama_sozlesmesi, hakem_kurali,
  öneri tetiği eşiği (alt-bant n≥10), kill_criteria ve success_metric TEK KARAKTERİ DEĞİŞMEDEN
  yerinde durur (kill#2: "öneri tetiği eşiği ölçüm başladıktan sonra değişirse geçersiz").
  Kalemlerin ÇÖZÜMÜ operatör kararıdır; bu kart onu vermez, kaydeder.

  P-1 — DAMGA GÖNDERİM REJİMİNİ DEĞİL YAZIM REJİMİNİ SÖYLÜYOR (kill#3 sınıfı, MADDİ).
  Kartın sözü: "damga dolum anındaki YÜRÜRLÜK rejimini söyler". Kodun yaptığı
  (`meridian/loop.py:2761`, `_patch_entry_slippage`): `if "pencere" not in r: r["pencere"] =
  barclock.pencere_rejimi()` — yani DEFTERE YAZIM anındaki sabit. Kod mevcut damganın YENİDEN
  yazılmasına karşı korunmuş (yorumu kill#3'ü anıyor) ama BAYAT SATIRA İLK DAMGAYI BUGÜNÜN
  REJİMİYLE basmaya karşı korunmamış. Gönderim ile yazım arasına bir dağıtım girdiğinde iki
  cümle ayrışır ve damga sessizce yalan söyler.
  ÖLÇÜLMÜŞ VAKA (uydurma değil): DE ve PANW satırları `ts=2026-08-21T20:32:22Z` ile EOD-GTC
  yolundan, yani 13:30 rejimi yürürlükteyken gönderildi; canlı `barclock.py` 1345'e
  2026-08-23T14:53:43Z'de döndü (A1 mtime; depoda d8030c0); satırlar 2026-08-24'te yazıldı ve
  "1345" damgasını ORADA aldı. Gerçek 1345 satırları yalnız ECL (`ts=2026-08-26T13:45:01Z`) ve
  CRM (`ts=2026-08-28T13:45:00Z`) — ikisi de pencerenin saniyesinde.
  SONUÇ: hakemin 1345 bandı bugün 4 satırın 2'siyle KONTAMİNE (%50) ve gerçek 1345 örneklemi
  n=2'dir, n=4 değil.
  GÖRÜNMEZLİK (kalemin asıl zehiri): `ts` alanı NE `edg042_*/canli_cek.py`'nin E2 alan
  listesinde NE `pencere_cek.py`'ninkinde var — yani hakem katmanı kendi kontaminasyonunu
  ÖLÇEMEZ; bu teşhis ancak reçete DIŞINDA bir okumayla görüldü.
  OPERATÖR KARARI BEKLEYEN: (a) damga gönderim anına (`ts`) mı bağlanacak yoksa satıra
  gönderim-anı rejimi ayrı alan olarak mı yazılacak; (b) mevcut iki satır (DE, PANW) düzeltilecek
  mi yoksa damgasız'a mı çekilecek — DÜZELTMENİN KENDİSİ de bir yeniden-etiketlemedir ve kill#3
  hükmünü operatör vermeden yapılamaz; (c) hakem çekicisine `ts` eklenip kontaminasyonun her
  koşumda BEYAN edilip edilmeyeceği.

  P-2 — KONTROL KOLU YAPISAL OLARAK BOŞ; ÖNERİ TETİĞİ İNŞAEN ERİŞİLEMEZ.
  `oneri_tetigi` (pencere_altbant.py:96) İKİ bandın da CI'ı olmasını, yani ikisinin de n≥10
  olmasını şart koşar. 1330 bandı bugün n=0. Kaydırma SÜRESİZ (kart: "pilot süresi YOK"),
  yürürlük rejimi 1345 ve geriye dönük etiketleme kill#3 ile yasak — dolayısıyla `pencere="1330"`
  damgalı satır BİR DAHA HİÇ ÜRETİLMEYECEK. Bu haliyle hakem sonsuza dek "orneklem_birikimde"
  diyebilir ve GERİ-AL ÖNERİSİ hiçbir veriyle tetiklenemez. Kartın success_metric'i "hakem
  sözleşmesinin İŞLEMESİ"dir; işleyen bir sözleşme, açılabilen bir valf demektir.
  BEYAN: kaydırma öncesi 13 satır damgasızdır ve kill#3 gereği 1330 SAYILAMAZ — yani "kontrol
  kolu aslında var" savunması bu kartın kendi yasasıyla kapalıdır.
  OPERATÖR KARARI BEKLEYEN: tetiğin kıyas tabanı ne olacak — (a) damgasız kaydırma-öncesi küme
  AYRI ve BEYANLI bir taban olarak mı tanımlanacak (kart revizyonu ister, kill#2'ye dikkat),
  (b) A/B için pencere dönüşümlü mü koşacak, yoksa (c) tetik tek-kollu bir eşiğe mi (örn.
  EDG-040 başabaş bandı) bağlanacak. ÜÇÜ DE KART İŞİDİR; ölçüm başladıktan sonra eşiği kod
  tarafında değiştirmek kill#2'yi tetikler.

  ÖLÇEK NOTU (hüküm değil, n=2): bu kartın öncülü EDG-2026-047 kaydırmanın bedelini medyan
  +4,65 bps öngörmüştü. Gerçek 1345 satırlarının ikisi +175,107 ve +245,034 bps. n=2 ile hiçbir
  şey iddia edilemez; kayda geçirilir ki eşik dolduğunda "öngörü tutmuş muydu" sorusu
  sonradan-akıl olmasın.

p1_kapanis_2026_08_30: >
  P-1 KAPANDI (Rol-1, operatör hükmü 2026-08-29 "damgayı gönderim anına bağla, iki satırı da
  düzelt" — iki yarısı da uygulandı). KOD: damga artık gönderim satırında basılır
  (`mirror_submit_armed`), dolum yaması damgaya DOKUNMAZ (`_patch_entry_slippage`) — commit
  90f6cdc, dağıtım dcef1c6 (2026-08-30T18:29Z, dağıtım-beyanı state/dagitim.json). CANLI DEFTER:
  DE/PANW satırları 1345→1330 düzeltildi — bakım penceresinde, worker durmuşken; kuru koşu
  duzeltilen=2, yazım mod=YAZDI, idempotens doğrulaması duzeltilen=0/zaten_duzeltilmis=2
  (betik ops/pencere_damgasi_duzeltme_2026_08_29.py, --yaz bayrağıyla).
  KILL#3 İSTİSNASI ADIYLA: kill#3 "damgasız/uydurma damgalı satır banda giremez" der; bu düzeltme
  bir UYDURMA değil, iki ÖLÇÜLMÜŞ olgunun (gönderim ts=2026-08-21T20:32:22Z + canlı barclock
  mtime=2026-08-23T14:53:43Z) karşılaştırmasından türeyen deterministik geri-atamadır ve OPERATÖR
  İSTİSNASIYLA yapıldı — istisna yazılmadan yapılsaydı kill kriteri sessizce çiğnenmiş olurdu.
  SONUÇ: hakem bant sayıları değişir (1345 n=4→2, 1330 n=0→2) — BEKLENEN ve doğru; eşikler
  değişmedi, ikisi de n<10, öneri tetiği "orneklem_birikimde". P-2 ve EDG-042 P-3 AÇIK.

p2_ayrisma_isaretcisi_2026_08_31: >
  AYRIŞMA BEYANI TEK YERDE YAŞAR: EDG-2026-042 kartının `p3_karar_ayrik_ts_2026_08_31` bloğu.
  Özü: EDG-042 K1'i `ts`ye göre böler, BU kartın hakemi `pencere` damgasına göre — ve bu
  BİLİNÇLİDİR (kill#3 geriye dönük etiketlemeyi yasaklar; damgasız 13 satır burada hiçbir banda
  girmez, EDG-042'de K1-önce kolunda sayılır). Aynı beyanı burada yeniden yazmak
  EQUIVALENT_TRUTHS tuzağı olurdu; ayrıntı ve birleştirme kararı (P-2'nin yeni çerçevesi,
  operatör kalemi) oradadır.

p2_kapanis_2026_09_01: >
  P-2 KAPANIŞ HÜKMÜ (Rol-1; yetki: operatör 85-aktarımı 2026-08-31 "bunların hepsini main'e
  devret main yapsın" + P-3 ölçümü — yol H1 kaydında ölçülmüştü): HAKEMİN ALT-BANT BÖLMESİ
  `pencere` DAMGASINDAN GÖNDERİM `ts`SİNE GEÇER. Bölücü ve sınır P-3 reçetesiyle TEK KAYNAK:
  `gonderim_kolu()` research/olcumler/edg042_recete_ayrik_2026-08-31/olcum.py'den İTHAL edilir
  (ikinci kopya YAZILMAZ), sınır 2026-08-23T14:53:43Z (canlı barclock inişi, d8030c0). Kol
  adları EDG-042 `p3_karar_ayrik_ts_2026_08_31` tek sözlüğüdür: K1-önce (`giris_once`) ·
  K1-1345 (`giris_1345`); hakem raporu "1330/1345" bant adlarını bırakır.

  NEDEN (ölçülmüş, acik_kalemler P-2): `pencere="1330"` damgalı satır bir daha HİÇ
  üretilmeyecek — damga anahtarıyla kontrol kolu sonsuza dek n=2'de kalır, öneri tetiği İNŞAEN
  erişilemez ve success_metric'in "işleyen sözleşme"si ölü doğar. `ts` anahtarıyla damgasız
  kaydırma-öncesi 13 satır + P-1-düzeltmeli DE/PANW kontrol koluna ölçülerek girer.

  DEĞİŞMEYEN — TEK KARAKTERİ DEĞİŞMEDİ: öneri tetiği eşiği (iki kol da n≥10 + CI ayrıklığı,
  hakem_kurali), kill_criteria üçlüsü, success_metric, uygulama_sozlesmesi'nin DAMGA YAZIMI
  (E2'ye `pencere` damgası dolumda basılmaya devam eder — değişen yalnız OKUYUCUNUN bölme
  anahtarı; damga artık çapraz-doğrulama sütunudur). kill#2'ye GİRMEZ: eşik değişmedi, kova
  TANIMI değişti (P-3'ün aynı cümlesi ve aynı sınıfı). kill#3'e GİRMEZ: ts-bölme etiket YAZMAK
  değil, defterde ZATEN kayıtlı iki ölçülmüş olguyu karşılaştırmaktır (gerekçenin tamamı
  EDG-042 P-3 bloğunda; burada yeniden yazmak EQUIVALENT_TRUTHS olurdu).

  TARİHLİ TABAN (2026-08-31 H1 ölçümü, hüküm değil): ts anahtarıyla K1-önce n=15 · K1-1345 n=2
  (ECL/CRM); tetik tedavi kolunun n≥10'unu bekler (~4 hafta @ 0,40 dolum/seans). Damga↔ts
  çapraz kontrolü: damgalı 4 satırın 4'ünde iki anahtar aynı kolu gösteriyor (P-3 bloğu).

  GÜNCEL DONUK HAKEM İŞARETÇİSİ [ÇEVRİLDİ 2026-09-01, kod inişiyle aynı tur]:
  research/olcumler/edg042_hakem_2026-09-01/ — pencere_altbant.py (sha256 3d8eda316d15dd3b…)
  + pencere_cek.py (sha256 9ad462a56e40ae58…); içerik-adresli (EDG-059 dersi), koşucu diskteki
  dosyayı bu sha'larla kıyaslar, ayrışıyorsa KOŞMAZ ve raporlar. Eski işaretçi
  edg042_kosum_2026-08-22/ TARİHÇEDİR (tek bayt değişmedi). Görev EK'i sabit yol TAŞIMAZ,
  buraya bakar ([2] işaretçi devrinin aynı deseni — sabit metin iki kez bayatlamıştı).
  KOVA BEYANI (uygulamada doğdu): `damga_bilinmeyen` — damgası dolu ama tanınmayan satır;
  ts'yle kola GİRER (bölme anahtarı ts), yalnız damga↔ts çapraz sütununda kıyaslanmaz —
  "ayrışma" saymak uydurma olurdu. Vokabüler: rapor kol adlarıyla konuşur (giris_once/
  giris_1345), "1330/1345 alt-bant" adlandırması bırakıldı; eşik/yön/karar dalları TEK
  KARAKTER değişmedi (beyan betikte + KOMUT.txt'de).
  İLK ATEŞLEME 2026-09-01 ("kurulu ≠ çalışır", gerçek A1 çekimi, salt-okuma): giris_once
  n=15 (tarihli tabanla BİREBİR) · giris_1345 n=3 (taban 2 + 1 yeni dolum — tedavi kolu
  birikiyor) · damga↔ts ayrışan 0 · olculemedi 0 · tetik "orneklem_birikimde" (3<10, doğru).
  Artefaktlar dizinde (pencere_ham.json + pencere_altbant.json — 08-22 emsalinin deseni).
