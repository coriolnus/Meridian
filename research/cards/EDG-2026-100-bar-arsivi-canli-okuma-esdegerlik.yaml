ref:
  - "TSK-020 (backend mimari kararları; UYGULA-3 bar arşivi CANLI 2026-09-13 — bu kart §3.3 kalanıdır)"
  - "docs/TASARIM-BARS-PARQUET-DUCKDB-2026-09-06.md §3.3 (canlı yol: `data.load_many(..., kaynak=\"arsiv\")`, varsayılan CSV; fark çivisi parquet ↔ CSV(sanitize) byte-eşit)"
  - "deploy/oracle-a1/meridian-bar-arsiv.{service,timer} (arşiv üreticisi; manifest tek kaynak)"
