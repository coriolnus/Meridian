revizyonlar:
  - id: "EXE-2026-002-R1"
    tarih: "2026-08-07"
    alan: "kill_criteria[4] — eşleşmeme ölçütünün TANIM KUSURU"
    degisim: >
      Ön-kayıt metni: "Eşleşmeyen gölge satırı oranı > %20 → defter bütünlüğü sorunu; ölçüm
      hükmü VERİLMEZ". Bu ölçüt İKİ FARKLI OLGUYU tek kovaya atıyor ve ayırt edemiyor:
        (a) BOZULMA — gölge satırı biçimsiz, bps hesaplanamıyor (`golge_bozuk`, `bps_yok`).
            Defterin kendisi güvenilmez; hüküm verilemez. Ölçüt DOĞRU çalışır.
        (b) MEŞRU DOLMAMA — gölge satırı sağlam ama iç EOD bacağı hiç dolmamış (`eod_yok`).
            Bu bir bozulma DEĞİL, motorun kararıdır: gölge D gününde tetik kesilince yazılır,
            iç EOD motoru D+1 AÇILIŞINDA doldurur; doldurmamayı seçtiyse (limit kaçtı,
            kapı düşürdü, gap vetosu) eşleşme yapısal olarak OLUŞMAZ ve OLUŞMAMALIDIR.
      Yürürlükteki hâliyle ölçüt, (b) birikince ölçümü BOZULMA sanıp susturur — oysa (b) yalnız
      ÖRNEKLEMİ küçültür ve onun bekçisi zaten `n_min`dir.
      YENİ HÂL: kill#4 YALNIZ (a) sınıflarına uygulanır (`golge_bozuk` + `bps_yok` > %20 →
      hüküm VERİLMEZ). (b) `eod_yok` AYRI sayılır, `kapsam_disi` olarak ADIYLA raporlanır,
      hükmü GEÇERSİZ KILMAZ — eşleşen çift sayısını düşürür ve n_min kapısına havale edilir.
    k_etkisi: "YOK — parametre grid'i değişmedi, eşik (%20) değişmedi, n_min değişmedi.
      Değişen yalnız ölçütün UYGULANDIĞI KÜME. K defterine sayılmaz."
    ne_olculdu: >
      Ölçüm kodu (v212) ilk canlı koşumunda: n_defter=4 · n_eslesen=4 · eslesmeyen n=0, oran=0,0.
      Yani kill#4 BUGÜN TETİKLENMİYOR ve bu revizyon YÜRÜRLÜKTEKİ HÜKMÜ DEĞİŞTİRMİYOR
      (önce de sonra da: "ÖLÇÜLDÜ — ÖRNEKLEM YETERSİZ 4/20", kilit FAIL-CLOSED kapalı).
      Kusuru ölçüm ajanı `intraday_shadow.vs_eod` docstring'inden ve D→D+1 zamanlama yapısından
      çıkardı; karta DOKUNMADI, hükmü Rol-1'e devretti (CLAUDE.md §3).
    kok_neden: >
      Kartı yazarken (Rol-1, aynı gün) eşleşmemenin TEK sebebi olarak defter bozulmasını
      düşündüm. Gölge ile EOD bacağının AYRI GÜNLERDE yazıldığını, ve EOD motorunun bir planı
      doldurmamayı MEŞRU olarak seçebileceğini hesaba katmadım. Ön-kayıt disiplininin amacı
      eşiği sonuca uydurmayı engellemektir; bir ölçütün İKİ AYRI OLGUYU karıştırdığını fark
      etmek eşik oynatmak değildir — ama ancak hükmü DEĞİŞTİRMEDİĞİ anda düzeltmek dürüsttür,
      çünkü o an düzeltmenin kimseye bir faydası yoktur. Bugün tam o an.
    durustluk_beyani: >
      Bu revizyon bir kill ölçütünü GENİŞLETİYOR (daha az durumda tetikleniyor), yani
      teorik olarak ölçümü kolaylaştırıyor. Bu yüzden zamanlama kaydı önemli: kill#4 ölçüldü,
      SIFIR çıktı, ve revizyon o ölçümden SONRA ama hükmü değiştirmeden yazıldı. Eğer kill#4
      tetiklenmiş olsaydı bu düzeltme YAPILMAZDI — tetiklenen bir ölçütü gevşetmek, tam olarak
      ön-kayıt disiplininin yasakladığı şeydir. `n_min=20`, `%95 CI`, `tarih-kümeli bootstrap
      B=10.000` ve maliyet bandı DEĞİŞMEDİ; diğer üç kill maddesi DEĞİŞMEDİ.
    uygulama_borcu: >
      Kod (meridian/faz5_cikis.py) eşleşmeyenleri ZATEN `sinif_dagilimi` ile ayırıyor
      (`eod_yok` / `golge_bozuk` / `bps_yok`) — yani ayrım için gereken veri mevcut. Kill
      kapısının bu sınıflara göre daraltılması AYRI BİR TURDUR ve bu revizyon onun ön şartıdır.
      O tur inene kadar kod ESKİ (geniş) ölçütü uygular; bugün fark yaratmıyor çünkü oran %0.
