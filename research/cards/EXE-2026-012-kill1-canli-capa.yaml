hipotez: >
  EXE-2026-003 planli kolu — tetiği kesilen silahlanmamış GO/REVIEW planının gölge satırı: `_handle_symbol` içindeki planli-kol dalı
  (`intraday_shadow.planli_satir` → `store.append_jsonl(intraday_shadow.PLANLI_ORDERS_FILE)` → `intraday_shadow.planli_yazildi`) —
  canlı karar döngüsünün p95 süresini +%10'dan fazla ARTIRMAZ. Ölçü: pencerenin her işlenen (outcome=processed) barfeed olayı için tur
  süresi X ile AYNI olayda planli dalda geçen toplam süre Z birlikte kaydedilir; karşı-olgusal "kol yokken" tur süresi Y = X − Z;
  R = p95(X) / p95(Y), havuzlanmış. Hipotez: R ≤ 1,10 (tavan EXE-2026-003 KILL#1'den AYNEN).

kill1_yorumu: >
  Donuk metin: "planli kol yazımı canlı sıcak yolda ölçülebilir gecikme yaratıyorsa (p95 döngü süresi +%10'dan fazla artarsa) kol
  kapatılır". Bu kartın okuması: "döngü" = `IntradayConsumer.on_barfeed_event` turunun tamamı — DONGU_SURESI'nin sardığı sınır, v217
  düzeneğinin ölçtüğü sınırla aynı. Evren YALNIZ outcome=processed: `skipped` (seans dışı / 9:45 ET öncesi pencere / HALT) µs dönüşlerdir
  ve p95'i işlenen olayın maliyetinden AŞAĞI çekerdi (geçme yönlü sapma; Faz B etiketi tam bunun için). `error` havuza girmez, sayısı
  raporlanır. processed ⟹ RTH ∧ giriş penceresi açık ∧ HALT yok — ayrı saat süzgeci GEREKMEZ. "+%10 artış" = p95(kol varken) /
  p95(kol yokken) > 1,10 (GÖRELİ oran — mutlak ms değil). "Kol yokken" = aynı olaydan planli dal süresi çıkarılmış hâl (birinci
  mertebe karşı-olgu); v217'nin tabanı `PLANLI_ENABLED=False` dalın erken-dönüş maliyetini (µs) hâlâ taşır, Y onu da çıkarır → R
  hafifçe BÜYÜR (KILL yönü, beyanlı).

