pozitif_kontrol: >
  YOL-TUTARLI, yalnız test ortamı (sandbox_state; canlıya enjeksiyon YOK): gerçek `IntradayConsumer.on_barfeed_event` → gerçek planli
  dal → gerçek alet (X, Z kaydı) → gerçek seans-sonu defter yazımı → research/olcumler/exe012_kill1_canli/ betiğinin KENDİSİ → üçlü
  hüküm. Olay bileşimi v217 gibi ≥ 5 sembol/olay; silahli + planli + plansız sembol karışık; tekilleştirme dönüşleri dahil. Gecikme
  meşgul-bekleme ile enjekte edilir (TSK-213 deseni; uyku değil). Tek-fonksiyon birim çağrısı PK sayılmaz.
  PK-1 DUYARLILIK: planli dal gövdesine her girişte, önceden ölçülmüş p95(Y)'nin %20'si (tavanın iki katı) kadar gecikme; olayların
  tamamında planli giriş var → hüküm KILL.
  PK-2 ÖZGÜLLÜK: AYNI gecikme planli dalın DIŞINA (silahli dal ya da karar defteri yazımı) → p95(X) ≥ %20 artar ama Z onu soğurmaz →
  hüküm YEŞİL.
  NK: `PLANLI_ENABLED=False` → R − 1 = ε (dal erken-dönüşü + kronometre) raporlanır; hüküm YEŞİL.
  PK-3 KÖRLÜK (bedel yasası): p95(Y)'nin ≥ 10 katı gecikme YALNIZ yazım olaylarına, yazım olayı payı < %5 → hüküm YEŞİL kalır AMA t2/t3
  gecikmeyi sayıyla gösterir — istatistiğin nadir-ağır olaya yapısal körlüğü ölçülmüş olur.
  TANIK EŞİ: defter X'lerinin kova sayımı = DONGU_SURESI.anlik() processed sayımı (Prometheus tanığının süreç-içi karşılığı).
  HÜKÜM MANTIĞI: elle kurulmuş girdiyle deterministik çiviler (KILL / YEŞİL / ÖLÇÜLEMEDİ; R_nokta > tavan her durumda KILL).
  MUTASYON (her biri en az bir çiviyi kırmalı): Z'yi dal dışına genişletmek (PK-2) · X'i ikinci kronometreyle almak (tanık eşi) ·
  skipped olayları havuza katmak (evren çivisi) · CI_üst koşulunu kaldırmak (ÖLÇÜLEMEDİ çivisi) · tavana pay eklemek (sınır çivisi).
  ALET BEDELİ: aynı test düzeneğinde alet açık/kapalı olay süresi farkı ölçülür → ADIM-0c alet_olay_basi_maliyeti_us.

veri_penceresi: >
  Başlangıç = max(2026-10-13 [tasarım ön şartı: Faz B verisi ≥ 14 gün; seri 2026-09-29 07:45Z'den beri], ADIM-0c seansından sonraki
  ilk seans). Uzunluk 20 TEMİZ seans (≈ 4 hafta; ABD tatilleri seans değildir, yarım gün seanslar girer). ÖLÇÜLEMEDİ → bir kez +20
  temiz seans (ikinci bakış); yine ÖLÇÜLEMEDİ → nihai ÖLÇÜLEMEDİ, operatöre bildirilir, kol EXE-2026-003'ün öteki hükümlerine göre durur
  (ÖLÇÜLEMEDİ ≠ KILL — UYDURMA YASAĞI; v217 üçlü hüküm felsefesiyle aynı). DST 2026-11-01 pencerede: defter barclock.session_date ile
  çalışır, etkilenmez; tanık sınır anları ET'den türetilir. GERİ-DOLUM YOK: alet öncesi veri (Z ölçülmedi) hükme girmez.

basari_tanimi: >
  (1) Dağıtımdan ÖNCE test ortamında PK-1 KILL, PK-2 YEŞİL, NK YEŞİL + ε raporlu, PK-3 YEŞİL + tanıda görünür; hüküm mantığı çivileri
  yeşil ve listelenen mutasyonların her biri kırmızı. (2) ADIM-0 sayıları karta tarihli + dondurma commit'i. (3) 20 temiz seans; her
  seansta tanık 'eşit' ya da 'tanıksız' adıyla. (4) Üçlü hüküm R_nokta + %95 CI + t1–t6 ile Rol-1 tarafından AYNI turda bu karta + K
  defterine + EXE-2026-003'e işaretçi olarak yazılır; ham kesit + çıktı commit'li BLOB'a bağlı. (5) Hüküm KILL/YEŞİL ise KILL#1'in
  resmî ölçümü bu kart olur; v217 sentetiği regresyon çivisi rolüne geçer (v217_kaderi).

beyanli_sinirlar:
  - "(1) YAPISAL KÖRLÜK: planli yazım seansta seyrek (Ağustos ara ölçümü: fırsat 0–3/seans; processed olay/seans ≈ 1.650 KABA TÜRETME — 2971 olay / ≈ 675 pencere-içi dakika, 09-29/30; ADIM-0 ölçer) → f_yazim binde birkaç ya da daha az. X = Y + Z ve yazımsız olaylarda Z ≤ δ iken q95(X) ≤ q(0,95+f)(Y) + δ: olayların < %5'ine düşen maliyet, büyüklüğü ne olursa olsun, p95'i yalnız Y'nin p(95+f) yüzdeliğine taşıyabilir. KILL#1 metni nadir-ağır gecikmeyi GÖRMEZ; sürekli olay-başı maliyeti (ör. tekilleştirme bozulup defterin her olayda okunması — TSK-213 mutasyon sınıfı) GÖRÜR. Nadir-ağır gecikme t2/t3'te raporlanır; ona ayrı kill = yeni eşik = OPERATÖR KARARI + yeni kart (notlar S2)."
  - "(2) BİRİNCİ MERTEBE ATIF: Z yalnız dalın DOĞRUDAN süresidir; dolaylı etkiler (sayfa önbelleği, GC, kilit çekişmesi, sonraki olaylara taşan G/Ç) ölçülmez → R gerçek etkinin ALT sınırıdır: GEÇME yönlü, büyüklüğü bilinmeyen sapma. t5 kaba iz verir (piyasa hareketliliğiyle karışır, hüküm değil); dolaylı etkiyi ölçmenin tek yolu seanslar arası A/B'dir (ayrı kart, notlar S1)."
  - "(3) Y, `PLANLI_ENABLED=False` tabanından dalın erken-dönüş maliyeti kadar küçüktür → R hafifçe büyür (KILL yönü)."
  - "(4) Kayıt X ölçüldükten SONRA eklenir → X'e girmez; alet maliyeti sıcak yolda ÖLÇÜLMEYEN bir ektir — PK düzeneğinde ölçülür, karta yazılır."
  - "(5) Hüküm penceresine bağlıdır: plan üreticisi değişir de f_giris/f_yazim ADIM-0b'nin tarihsel üst değerini aşarsa yeniden ölçüm tetiği (Rol-1 kaydı; yeni hüküm = yeni kart)."
  - "(6) Bu kart EDG-2026-019/078'in kill#1'lerini ÇAPALAMAZ (aynı yasa, farklı yüzey); alet deseni onlar için ayrı kartlarla kullanılabilir."

telemetri_ilkesi_uzlasmasi: >
  Tasarım §2: "Telemetri GÖZLEMDİR, karar yüzeyi DEĞİL: hiçbir kapı/kill kararı Prometheus'tan okumaz." Uzlaşma üç katlıdır.
  (a) Hükmün girdisi Prometheus DEĞİL, bu kartın kendi defteridir (kart-sahipli ölçüm aleti; okuyucusu Rol-1'in betiği). Zorunlu da:
  DONGU_SURESI kovaları +%10'u çözemez (kova göreli genişliği 1–25 ms bandında %33–100; ayrıntı notlarda). (b) Hüküm otomatik kapı
  değildir: Rol-1 okur, karta yazar, KILL eylemi elle yapılır; EDG-2026-019'un süreç-içi 'p95 mandalı' deseni burada bilerek KURULMAZ.
  (c) Prometheus iki gözlem işi yapar: ADIM-0'da seansları betimler ve seans tanığı olarak defterin sayımını bağımsız doğrular; tanık
  tutmazsa sonuç 'alet kusuru'dur ve kol hakkında HİÇBİR YÖNDE hüküm üretmez. Grafana'daki DONGU_SURESI eğrisi gözlem kalır; KILL#1 bir
  ölçüm kartının hükmüyle işler.

v217_kaderi: >
  Hüküm SONRASI v217 `test_p95_dongu_suresi_kart_tavanini_ASMIYOR` EMEKLİ EDİLMEZ ve bu kartın pozitif kontrolü DEĞİLDİR. PK değil,
  çünkü yolu farklıdır (sentetik döngüde bayrak A/B'si; canlı aletin kaydı ve betiği yok) — yol-tutarsız PK CLAUDE.md §5'e aykırı olurdu.
  Emekli değil, çünkü canlı ölçüm etkiyi ancak DAĞITIMDAN SONRA görür; sentetik çivi olay-başı maliyet regresyonunu DAĞITIMDAN ÖNCE
  yakalar (TSK-213 mutasyonu ~60 µs/sembol → boşta seri 8/8 KIRMIZI). Yeni rolü: dağıtım öncesi regresyon çivisi; ÖLÇÜLEMEDİ skip'i
  artık "KILL#1 ölçülmedi" anlamına gelmez. Hüküm turunda Rol-1: CLAUDE.md §6 3. katmandaki "kart EXE-2026-003 KILL#1'in fiilî ölçümü bu
  seri adımdır" cümlesini ve v217 şerhini günceller; `P95_TAVAN=1.10` ve karttan okuma çivisi AYNEN kalır.

karar_notlari:
  soru1_taban: >
    SEÇİLEN (b) TUR İÇİ ATIF — ama histogramla DEĞİL, olay başına yuvarlamasız kayıtla: iki histogramın oranı kova çözünürlüğüne
    takılır ve Y = X − Z olay başına çıkarılmadıkça karşı-olgu kurulamaz. (a) seanslar arası A/B BU KARTTA YOK: bayrak import anında
    okunur (her geçiş işçi yeniden başlatması), kapalı seanslar EXE-2026-003 verisini kaybeder, seanslar arası p95 oynaklığı bugünkü
    kovalarla ölçülemez bile (%33–100) — ama dolaylı etkiyi yalnız A/B görür → OPERATÖR KARARI S1 (öneri: hayır; istenirse ayrı kart).
    (c1) Prometheus'a ince kovalı (~%5) yeni histogram REDDEDİLDİ: hüküm Prometheus'tan okunurdu (§2 ihlali), saklama 30 gün, ara-değerleme
    hatası hâlâ eşiğin yarısı. (c2) EDG-019 biçimli p95 pay birincil DEĞİL (donuk metin 'p95 döngü süresi artışı' der, pay değil) → t4 tanı.
    (c3) sentetik düzeneği A1'de koşmak REDDEDİLDİ (canlı süreç değil, A1 CPU'sunu işçiyle paylaşır).
  soru2_metrik: >
    Metrik: DONGU_SURESI'nin ölçtüğü değer (meridian_intraday_cycle_seconds), outcome=processed; zaman süzgeci gerekmez (processed
    tanım gereği seans + 9:45 ET sonrası). p95: v217 _p95 tanımı, havuzlanmış, kesin. Kova çözünürlüğü: sınırlar 0,25/0,5/1/2/3/5/7,5/10/
    15/25/50/100/250/500/1000/2500/5000/10000 ms; göreli genişlik 1–25 ms bandında %33 (7,5→10) ile %100 (1→2) arası — +%10 en iyi kovada
    3,3×, olası p95 kovasında (1–2 ms; sentetik p95 1,2–1,8 ms) 10× çözünürlük altında. histogram_quantile hükümde KULLANILMAZ.
  soru3_telemetri: "telemetri_ilkesi_uzlasmasi + kill_list maddeleri 'OTOMATİK KAPI YASAĞI' ve 'Prometheus/Grafana hükmün GİRDİSİ olamaz'"
  soru4_v217: "v217_kaderi"
  soru5_k_kill_pencere_basari: "k_registry · kill_list · veri_penceresi · basari_tanimi"
  operator_kararlari:
    - "S1 KARAR (operatör 2026-09-30 19:1xZ, AskUserQuestion): tur içi ölçüm — seanslar arası A/B YOK (dolaylı etki beyanlı sınır; istenirse ayrı kart)"
    - "S2 KARAR (operatör 2026-09-30 19:1xZ): nadir-ağır gecikme YALNIZ TANI olarak raporlanır, ayrı kill kuralı YOK"
    - "S3 KARAR (operatör 2026-09-30 19:1xZ): KILL çıkarsa Rol-1 piyasa kapalıyken kolu kapatır (işçi yeniden başlatması) ve anında push bildirimi atar — operatör onayı ÖNCEDEN verildi"

