olcum_plani:
  - "ALET (KART SONRASI kod — Opus, TDD, tam suite + dağıtım): (1) X = DONGU_SURESI'ne işlenen değerin KENDİSİ (tek ölçüm, iki görünüm; ikinci kronometre YASAK); (2) Z = `_handle_symbol` planli-kol dalı gövdesinin süresi, olay içindeki semboller üzerinden toplanır, AYNI saatle (`gecikme._saat`); (3) olay kaydı (yalnız processed ve error olayları; skipped kaydedilmez) süreç belleğinde seans başına: outcome, X, Z, olay ofseti (s), planli giriş sayısı, planli yazım sayısı — YUVARLAMASIZ; kayıt X ölçüldükten SONRA eklenir (X'e girmez); (4) seans başına TOPLU yazım `state/` altında tek defter (ad implementasyonda), processed ölçümüne GİRMEYEN bir noktada; satır süreç başlangıç damgasını taşır (seans içi yeniden başlatma tespiti); (5) kapatma yolu olur (intraday_shadow ENABLED deseni), varsayılan açık; (6) okuyucu (Yasa 6): research/olcumler/exe012_kill1_canli/ betiği — codelaw beyanı implementasyon turunda."
  - "HÜKÜM EVRENİ: pencerenin TEMİZ seanslarının processed olayları. Temiz = seans içinde yeniden başlatma yok ∧ tanık 'kusurlu' değil. Y = X − Z; R = p95(X_havuz) / p95(Y_havuz); CI = seans-kümeli bootstrap (yerine koyarak seans çekilir, seçilen seansın TÜM olayları havuza girer; faz5_cikis.tarih_kumeli_bootstrap ile aynı kural, istatistik ortalama değil R — gövde paylaşımı implementasyonda, kopya yasağı)."
  - "ÜÇLÜ HÜKÜM (sınırda pay YOK): R_nokta > 1,10 → KILL · R_nokta ≤ 1,10 ∧ CI_üst ≤ 1,10 → YEŞİL · R_nokta ≤ 1,10 ∧ CI_üst > 1,10 → ÖLÇÜLEMEDİ. Geçerlilik ihlali (kill_list) → ÖLÇÜLEMEDİ ya da GEÇERSİZ, adıyla."
  - "SEANS TANIĞI (Prometheus — GÖZLEM, hüküm girdisi değil): defterdeki X'ler DONGU_SURESI.kovalar ile bisect_left (le) kuralıyla binlenir; outcome=processed için kova başına sayım, Prometheus `meridian_intraday_cycle_seconds_bucket{outcome=processed}` sayaçlarının iki SEANS-DIŞI sınır anındaki (9:45 ET öncesi ve 16:00 ET sonrası, arada sayaç sıfırlanması yok) ham değer farkına EŞİT olmalı (processed tanım gereği yalnız bu aralıkta doğar; skipped ve error aralık dışında da doğabildiği için tanığa girmez, error farkı adıyla raporlanır). Sınırda örnek yoksa seans 'tanıksız' (dışlanmaz, adıyla); örnek var ve sayım farklıysa 'kusurlu' (alet kusuru)."
  - "TANILAR (hüküm üretmez, K'ye girmez): t1 seans başına R_s ve en kötü seans · t2 yazım olayları: n, Z medyan/maks, en kötü olayın X'i (v217 en_kotu_olay_ms karşılığı) · t3 kuyruk: p99(X)/p99(Y), maks(X)/maks(Y), Y'nin p95 komşuluğu q0,94/q0,96 (istatistiğin kırılganlığı) · t4 EDG-2026-019 biçimli pay: olay başına Z/Y'nin p95'i (kartlar arası kıyas) · t5 dolaylı etki izi: her yazım olayından önceki 60 s ile sonraki 60 s (bir bar periyodu) içindeki olayların Y medyanı ve p95'i · t6 f_giris, f_yazim, error sayısı ve Z>0 olan error olayları."
  - "DONDURMA: ham defter kesiti + betik çıktısı research/olcumler/exe012_kill1_canli/ altında commit'lenir; hüküm o BLOB'lara bağlanır (defter state/'te versiyonsuz, Prometheus 30 gün/2 GiB saklar — kaynak silinir)."

