card_id: EDG-2026-037
family: tca_gercek_friksiyon
thesis: >
  Operatör kararı (2026-08-13): "TCA'yı ölç, sonra eşiği tartışalım". Bağlam: benimsenen C+mb paketinin
  replay profit-factor'ü 1,1119 iken `analytics.RESULT_PF_MIN=1.3` — SONUÇ hükmü 4/4 istediği için
  Faz-6 `sonuc_hukmu` kilidi bu paketle AÇILAMIYOR. Eşiğin KENDİ yazılı gerekçesi iki ayak taşıyor
  (analytics.py:2089-2093): (a) "1,0-1,2 bandı 95 işlemlik defterde örneklem gürültüsünün içindedir"
  — bu ayak 885 işlemlik ölçümle ZAYIFLADI; (b) "kâğıt dolumları iyimser, Y2/TCA hâlâ ölçülmedi" —
  bu ayak HÂLÂ AYAKTA ve eşiğin asıl var oluş sebebi. TEZ: gerçek friksiyon ölçülmeden eşik
  tartışılamaz; ölçülürse iki sonuçtan biri çıkar — friksiyon replay varsayımından KÖTÜ ise 1,11 zaten
  şişkindir (eşik haklı), İYİ/EŞİT ise eşiğin (b) ayağı da düşer ve tartışma meşrulaşır.

evidence_refs:
  - "analytics.py:2089-2093 RESULT_PF_MIN gerekçesi (iki ayak, biri ölçülmemiş)"
  - "EDG-032 damgası: C+mb brüt +205.552$ / −184.868$ → PF 1,1119"
  - "kartların cost_model: pessimistic_band_v2 — replay'in VARSAYDIĞI friksiyon"
  - "WP-E dolum boşluğu turu (v234): karar-çıkışı dolumları ölçülür oldu, slipaj örneklemi ~%38 genişledi"
  - "canlı defter: live_paper n=2 — TCA'nın gerçek-icra kolu ÖRNEKLEM YETERSİZ olabilir (ölç, varsayma)"

universe: >
  ÜÇ KAYNAK, üçü de canlı (salt-okuma): (1) ayna emir/dolum defteri (mirror_orders + dolum olayları,
  WP-E damgaları: kismi_dolum/makbuzsuz_boyut/dolum_eq) — plan fiyatı ↔ gerçek dolum farkı;
  (2) trades tablosu `costs` alanı (broker'ın "informational total friction" ifadesi) ve `pnl_dollars`
  (ZATEN NET — analytics.py:2079-2084, friksiyon İKİ KEZ kesilmez); (3) replay'in kendi friksiyon
  modeli (`pessimistic_band_v2` — kodda nerede tanımlı, hangi bileşenleri var, hangi sayıları kullanıyor).

features_asof: >
  ÖLÇÜLECEK: (a) gerçekleşen slipaj dağılımı (bps, giriş ve çıkış bacağı AYRI; tetik↔dolum farkı) —
  n, medyan, p90, ortalama + CI · (b) komisyon/ücret gerçekleşen toplamı · (c) replay'in VARSAYDIĞI
  friksiyon aynı işlemler için ne derdi (yan yana) · (d) FARK: gerçek − varsayılan, dolar VE PF etkisi
  ("friksiyon replay'deki gibi olsaydı PF ne olurdu / gerçekleşen gibi olsaydı ne olurdu").
  ÖRNEKLEM DÜRÜSTLÜĞÜ ŞART: kâğıt-icra işlem sayısı 2; eğer TCA yalnız kapanmış işlemden hesaplanabiliyorsa
  n=2 ile hüküm VERİLMEZ — o zaman payda EMİR düzeyine taşınır (gönderilen/dolan emirler, açık pozisyonların
  giriş bacakları dahil) ve bu genişletme AÇIKÇA beyan edilir.

parameter_grid:
  yok: "betimsel ölçüm — K += 0 (hipotez sınamıyor; eşik tartışmasının GİRDİSİ)"

cost_model: gercek_olculen   # bu kartın ürünü ZATEN friksiyonun kendisi

success_metric: >
  ÜRÜN: (i) gerçek friksiyonun sayısı + örneklem künyesi (n, hangi payda, hangi bacak) · (ii) replay
  varsayımıyla FARKI · (iii) PF'in friksiyon-düzeltilmiş hâli. HÜKÜM DEĞİL GİRDİ: bu kart eşiği
  DEĞİŞTİRMEZ; `RESULT_PF_MIN` tartışması ayrı bir operatör penceresinde, BU sayılarla açılır.
  ÖRNEKLEM YETERSİZSE bu da bir üründür: "TCA ÖLÇÜLEMEDİ (n=X) — eşiğin (b) ayağı çürütülemedi,
  1,3 yerinde kalır" dürüst kapanışı.

kill_criteria:
  - "ayna dolum defterinde eşleşen plan↔dolum çifti <10 ise slipaj 'olculemedi' (+ payda beyanı)"
  - "replay friksiyon modeli koddan OKUNAMAZSA kıyas yapılmaz — uydurulmaz"
  - "kâğıt-icra ile replay'i AYNI potaya koymak yasak: kâğıt dolumları iyimser olabilir, bu kartın konusu tam da o"

k_registry: {registered_at: "2026-08-13T1x", trial_ids: [pending-037-tca]}

status: measured   # 2026-08-13 Rol-1 — ölçüldü + hüküm: EŞİK TARTIŞMASI KAPANDI (eşik lehine, ama asıl bulgu daha ağır).

verdict:   # Rol-1 hükmü.
  olcum: >
    kill#1 ATEŞLENDİ — eşleşen plan↔dolum çifti n=4 (<10) → resmî damga "SLİPAJ ÖLÇÜLEMEDİ (n=4)".
    Sayılar BETİMLEYİCİ, istatistiksel hüküm taşımaz (tek seans 2026-08-06 13:30-13:33Z, tek gün,
    ÇIKIŞ bacağı n=0 — round-trip friksiyonun YARISI hiç ölçülmedi; ortalama farkın t-CI'si sıfırı içeriyor).
    GİRİŞ bacağı, resmî açılış tabanına göre: medyan 35,4 · ortalama 55,1 · notional-ağırlıklı 44,8 bps;
    4/4 ALEYHTE. Model varsayımı 5,0 bps → FARK ağırlıklı +39,8 bps/bacak; dolar 13,34$ → 119,22$ (~8,9×).
  pf_hukmu: >
    EŞİK TARTIŞMASI KAPANDI — `RESULT_PF_MIN=1.3` GEVŞETİLMEZ, çünkü tartışmanın yönü TERSİNE döndü.
    PF ek friksiyonda monoton azalandır: 1,1119 hiçbir friksiyon varsayımıyla YÜKSELEMEZ. Başabaş
    (PF=1,0) için tolere edilebilir ek friksiyon simetrikte 9,49 bps/bacak — ölçülen farkın EN KÜÇÜK
    TEK GÖZLEMİ (+10,0 bps) bile bunun üstünde. Senaryolar: +10bps→PF 0,994 (−1,1k$) · ağırlıklı
    +39,8→0,728 (−66k$) · ortalama +50→0,659 (−88k$). Eşiğin (b) ayağı ("kâğıt dolumları iyimser")
    ÇÜRÜTÜLEMEDİ; aksine E3 kötümser bandı (+5 bps/bacak) DA iyimser çıktı (~4,5×).
  asil_bulgu: >
    İKİ ÖLÇÜM ARIZASI ORTAYA ÇIKTI — ikisi de "varsayımı ölçüm sanmak" sınıfı:
    (1) `trades.costs` GERÇEKLEŞEN FRİKSİYON DEĞİL: 97/97 satırda dolu (toplam 625,19$) ama 0/97'sinde
    gerçek dolum var — alan iç modelin KENDİ slipaj dolarını taşıyor (broker.py:674). Bu alanı "ödediğimiz
    friksiyon" diye okuyan her tüketici varsayımı ölçüm sanmıştır.
    (2) İKİ `live_paper` işlemi (ALL, VLO) AYNADA HİÇ YOK — ne `mirror_orders`'da ne Alpaca emir
    geçmişinde; fiyatları iç simülasyondan. Yani "gerçekleşen kâğıt-icra" saydığımız 2 işlem de
    fiilen SİMÜLE. Gerçek broker dolumu YALNIZ 4 açık pozisyonun giriş bacağında var.
    (3) `pessimistic_band_v2`ın `ampirik_bps: null, ampirik_n: 0` — bugüne dek hiç ölçülmemiş,
    literatürden alınmış bir sayıymış. Bu kart o alanın İLK ampirik girdisini üretti (n=4).
  sonuc: >
    C+mb'nin GÖRECELİ üstünlüğü (EDG-035: yerel optimum) etkilenmez — tüm kollar aynı friksiyon
    varsayımıyla ölçüldü. Ama MUTLAK kârlılık iddiası ("+20.685$") friksiyon varsayımına asılı ve o
    varsayım ilk kez ölçüldüğünde ~9 kat iyimser çıktı. Faz-6 kilidinin kapalı olması ARIZA DEĞİL,
    KORUMA — sistem tam da bu bilinmezlik için o kapıyı koymuş.
  sonraki: >
    ZORUNLU SIRA: (a) ÖRNEKLEM — çıkış bacağı dolumu HİÇ yok çünkü koruma emirleri `expired/canceled`
    (ENTRY_TIF=day kelepçesi, broker.py:60-75); önce o kelepçe incelenmeli, yoksa round-trip friksiyon
    ölçülemez · (b) n≥10 dolum çifti biriktikten sonra EDG-037 TEKRAR koşulur · (c) ancak o zaman
    `goal.slippage_bps=5` ve `pessimistic_band_v2.ampirik_bps` ölçüye göre güncellenir · (d) replay
    hükümleri (EDG-023..035) o güncellemeden SONRA yeniden okunmalı — hepsi 5 bps varsayımıyla üretildi.
