  pencerede (a) cevaplarındaki sayı/kimlik/yol atıflarının ≥%95'ini araç çıktılarında GERÇEKTEN geçen değerlerden kurar (uydurma ≤%5),
  (b) araç çağrılarının ≥%90'ı şemaya uyar (şema dışı ≤%10; "metin olarak araç çağrısı" dahil), (c) cevap gecikmesi p50 ≤20 s,
  (d) günlük sohbet kotası 120 çağrıyı aşmaz ve kota dolduğunda dürüstçe "dolu" der; (e) öneri kabul oranı yalnız TANI olarak raporlanır.

