olcum_plani:
  - "kaynak: state/sohbet.jsonl (mesaj, cevap, araç çağrıları+çıktı özetleri, kaynaklar, model künyesi, süre, jeton) — B1 yazar, B3 sayar"
  - "uydurma: cevaptaki her sayı (tam/ondalık), kimlik (T%05d, P-…, EDG/TSK-…), dosya yolu, sembol için 'araç çıktısında literal geçiyor mu' — uydurma_say.py sınıfları uyarlanır; ölçülemeyen sınıf 'belirsiz' ayrı sayılır (uydurma sayılmaz)"
  - "araç disiplini: her model turu için tool_calls JSON şemaya uyuyor mu; metin içinde araç adı geçen ama tool_calls olmayan tur = 'metin-araç' (EDG-074 sınıfı) → şema dışı"
  - "gecikme: mesaj→cevap süresi p50/p95 (araç turu sayısıyla kırılım — tanı)"
  - "kota: gün başı sohbet çağrı sayısı (sayaç kaynağı: agent_calls kind=sohbet — skill_gorus_llm.kota_durumu deseni); 429/502 dolu pencere payı"
  - "öneri: yazılan öneri n, onaylanan/reddedilen/bekleyen (tanı)"
  - "model kırılımı: künye başına uydurma ve şema uyumu (zincir hangi modele düştü)"

