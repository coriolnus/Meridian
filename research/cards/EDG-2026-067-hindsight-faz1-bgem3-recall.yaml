  yukseltme_2026_09_01: >
    Rol-1 koştu (seans-dışı, 09:5x-11:2xZ). SIRALAMA: model ön-indirme + pip (servis kesintisiz)
    → switchover (stop → pre-drop pg_dump → DB drop+create → extensions → .env → start).
    KANITLAR: pgroonga 4.0.8 + vector 0.8.6 hindsight DB'sinde (paket postgresql-17-pgdg-pgroonga
    arm64, resmî packages.groonga.org deposu — PPA'da PG17 yoktu, söküldü) · migration logu
    "Successfully changed mental_models.embedding dimension to 1024" + "Successfully migrated
    text search to pgroonga" · bge-m3 ONNX snapshot 49 sn'de indi (kod BAAI/bge-m3 sidecar'ını
    adıyla destekliyor) · .env: MODEL_ID=BAAI/bge-m3, DIMENSIONS=1024 (uyumsuzlukta RuntimeError
    — boyut çivisi), POOLING=cls, PREFIX'ler BOŞALTILDI (E5 varsayılanları bge-m3'te yanlış;
    os.getenv boş dizgeyi korur — ölçüldü), MAX_TOKENS=512 varsayılan KALDI (beyan: chunk'lar
    küçük, 8192 CPU'da karesel bedel) · eski .env yedeği /opt/hindsight/.env.bak-20260901-100055.
  reranker_secimi_2026_09_01: >
    KARTTAKİ "ONNX/TEI yolu"nun İKİSİ DE FİİLEN KAPALI ÇIKTI (ölçüldü): 0.9.2 reranker
    fabrikasında onnx dalı YOK (tei/local/cohere/openrouter/flashrank/litellm[-sdk]/
    zeroentropy/siliconflow/google/rrf), TEI ise Docker'sız pratik değil (A1'de docker yok).
    ÜÇÜNCÜ YOL SEÇİLDİ: provider=local + sentence-transformers (torch 2.13.0+cpu; pip'in
    çektiği CUDA bağımlılıkları söküldü — venv 5.8G→2.1G). ÖLÇÜMLER: 10 çift=5,64 sn (CPU,
    ~0,56 sn/çift; skor 0,921 doğru eşleşmede) · soğuk model yüklemesi 65 sn · canlı recall'da
    cross-encoder 8 aday=8,1 sn, sıcak recall ucu-uca ~10,6 sn (soğuk ilk ~8,8 sn'lik ölçüm de
    var; p95 resmî kıyas koşumunda). Zincir: local(bge-reranker-v2-m3) → flashrank(MultiBERT)
    → rrf. Bedel yüksekse hüküm kartın maliyet sütununda görünür — eşik yok (bedel yasası).
  guvenlik_ve_defense_2026_09_01: >
    ApiKeyTenantExtension gün-1: HINDSIGHT_API_TENANT_API_KEY A1-içinde üretildi (openssl,
    değer yalnız .env'de — bağlama/karta girmedi). CANARY ÇİFTİ: anahtarsız /v1/default/banks
    → 401, anahtarlı → 200; /health açık (200). VAKA: bank config PATCH'i düz gövdeyle 422 —
    şema BankConfigUpdate 'updates' sarmalı istiyor; düzeltilince defense yazıldı ve GERİ-OKUMA
    enabled=true + rules=[sensitive_data→redact]. Defense-KAPALIYKEN retain yiyen ilk smoke
    bank'i kill maddesi gereği SİLİNDİ, taze bank'le yinelendi.
  smoke_2026_09_01: >
