kurulum_sozlesmesi: >
  Selef sözleşmesi aynen devralınır (hindsight-api 0.9.2 · native PG17+pgvector · 127.0.0.1
  bind · systemd MemoryMax=8G CPUQuota=200% · Memory Defense bank açılışında AÇIK · gecelik
  pg_dump→backups/ · dışarı giden TEK trafik OpenRouter LLM; recall LLM'siz-lokal) ŞU
  DEĞİŞİKLİKLERLE: (1) embedder BAAI/bge-m3 (ONNX, 1024 boyut; onnx/model.onnx_data dosyası
  modelle birlikte) — boyut 1024 kurulumda doğrulanır. (2) reranker HEDEFİ bge-reranker-v2-m3;
  slim[local-onnx] imajının sentence-transformers taşımadığı selefte mutasyonla kanıtlı —
  ONNX/TEI yolu kurulum adımında seçilir ve SEÇİM kurulum_kayitlarina işlenir; flashrank+rrf
  failover korunur. (3) BM25 backend pgroonga (yalnız hindsight DB'sine; arm64 paket
  ÖN-KONTROLLÜ) — arm64 paketi yoksa ParadeDB pg_search denenir; o da yoksa native turkish
  KALIR ve beyan düşülür. (4) Bank YENİDEN kurulur (selefin bank'i yalnız smoke içerir;
  e5-small embeddings ile uyumsuz — drop+create, Memory Defense İLK GÜNDEN açık). (5) sudo
  adımları dahil kurulumu Rol-1 koşar (operatör tam yetki 2026-09-01 — selefin "operatör
  koşar" hükmü değişti). Birim değişikliği günü elle test-ateşleme ("kurulu ≠ çalışır").
  İşletme kararları (ROADMAP §7 2026-09-01 brainstorm): autoRetain AÇIK (Hermes katmanında;
  bot bağlantısı yine AYRI kartın işi) · auto-consolidation + mental model AÇIK ve ana modelle
  (nemotron-3-ultra-550b:free — selefin LLM kaydı) · prefetch_method=recall sabit ·
  CP UI yalnız 127.0.0.1+ssh tüneli · API-key extension gün-1 + 401 canary.

veri_ve_dondurma: >
  KORPUS: arsiv bank'i = MERIDIAN_ENGINEERING_LOG.md + ROADMAP §7 karar kayıtları +
  research/cards/ hükümleri + docs/ vaka belgeleri (git-sha'lı ingest; batch, harness-yazımlı).
  SORU KÜMESİ: ölçüm BAŞLAMADAN research/olcumler/edg067_hindsight_faz1/sorular.yaml içinde
  dondurulur ve dosyanın GIT BLOB sha'sı bu kartın olcum bölümüne işlenir (EDG-059 dersi).
  Her soru: metin + beklenen-pasaj referansı (dosya+bölüm) + dil etiketi (tr/en). Küme
  donmadan koşulan her kıyas GEÇERSİZ.

