# EDG-2026-067 — Hindsight Faz-1 (halef): bge-m3+pgroonga yükseltmesi + arşiv ingest + recall taban-kıyası
# ÖN-KAYIT 2026-09-01 — selef EDG-2026-065'in (retired, hüküm yok) halefi. Operatör kararı
# 2026-09-01 "yükseltme-önce": embedder/BM25 yükseltmesi arşiv-ingest'ten ÖNCE kurulur; selefin
# Senaryo-A→ölçüm→koşullu-Senaryo-B tasarımı ölçümsüz düştü, reçete yerinde değiştirilmez —
# yeni kart. Selefin kurulum kayıtları (beş sağlık kanıtı, smoke, LLM model kaydı) TARİHÇE
# olarak devralındı; yalnız embedder/reranker/BM25 katmanı değişir. Tasarım belgeleri selefle
# aynı: docs/TASARIM-HINDSIGHT-ENTEGRASYON-2026-08-31.md + docs/INCELEME-HINDSIGHT-DERIN-2026-08-31.md.
# Derin doküman taraması 2026-09-01 (üç bölge) bu kartın reçete kaynağıdır — ROADMAP §7 kaydı.
# BOT RECALL BU KARTIN DEĞİL — ayrı kart (tasarım §6 Faz-2); burada botlara hiçbir erişim yok.

