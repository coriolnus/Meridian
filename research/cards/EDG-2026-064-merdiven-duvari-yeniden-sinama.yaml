# EDG-2026-064 — ısınma merdiveninin duvarı yeniden sınanır: süresiz ölçüm tarihli ölçüme döner
# ÖN-KAYIT 2026-08-31 — operatör kararı (birebir): "merdiven duvarını yeniden sınayacak kartı da
# sıraya al, burayı optimize etmemiz lazım." Birimin kendi şerhi bunu bekliyordu: "Duvar bir
# ÖLÇÜMDÜR ama SÜRESİ YOKTUR ve yeniden sınanmaz." EDG-058'İN KARDEŞİ, sorusu AYRI: 058 K-cezası
# sayımının kendini sıkmasını ölçer (kayıtlı, ölçülmemiş — AYNI pencerede koşulacak); bu kart
# DUVARIN bayatlığını ve yenileme politikasını ölçer. İkisi birbirini KOPYALAMAZ.

card_id: EDG-2026-064
status: registered
family: mekanizma_olcumu   # 058 emsali: edge DEĞİL — mekanizmanın kendi kilidini ölçer
on_kayit: 2026-08-31

hipotez: >
  Bugünkü duvar (carpan=1; warmup_scale.json — 93+ turdur kilitli, hermes.warmup_budget) tek bir
  geçmiş koşumun süre-tavanı ölçümüdür ve makine/önbellek koşulları değiştiği hâlde hiç yeniden
  sınanmamıştır. Aynı makinede (A1) bugünkü önbellek sıcaklığıyla kontrollü yeniden-deneme,
  kesildi-seviyesinin artık daha yüksek olduğunu gösterebilir; gösterirse duvar TARİHLİ ve
  YENİLENEBİLİR bir ölçüme döner. DÜRÜST BEYAN AYNEN KORUNUR (hermes.py 2026-08-06 ölçümü):
  duvarı açmak `cleared`ı artırmayabilir — bağlayıcı kısıt kapıdır ve bütçe K-cezasını büyütür;
  bu kartın vaadi cleared değil KAPSAMA (UCB öncelikleri + sonda önbelleği) ve duvar
  politikasının dürüstlüğüdür. cleared'a etki AYRICA raporlanır, vaat edilmez.

k_registry: {registered_at: "2026-08-31", trial_ids: [EDG-064-duvar-yeniden-deneme]}
# Mekanizma kartı: kurulum/parametre hükmü üretmez; 058 beyanı aynen — pozitif sonuç bile
# kendi başına parametre değişikliği gerekçelendirmez, tasarım sorusunu (yenileme politikası)
