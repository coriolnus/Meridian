basari_tanimi: >
  Üç PK yeşil + K=2 (+kurulum kırılımı tanı) sayıyla raporlanmış + hüküm Rol-1 tarafından aynı turda karta ve K defterine. GEÇER →
  operatöre 'uyuyan planları icraya bağlama' kararı (ARSENAL çıtası: kart-önce + n≥30 ∧ CI-alt>0 + operatör imzası; bağlama AYRI kart-önce
  iş). KALIR → EDG-049 hükmü tazelenir ('teşhis-katmanı'), TSK-175 kapanır, gölge defteri okuyucusuz kalmamak için kapatılır (Yasa 6).

