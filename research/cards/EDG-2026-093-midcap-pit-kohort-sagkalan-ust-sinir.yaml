pozitif_kontrol: >
  YOL-TUTARLI, DÖRT PARÇA: (1) aynı ölçüm kodu large-cap PIT kohortuna (sp500_uyelik_tarihi.csv) koşulunca EDG-016'nın
  kayıtlı sayılarını (yön + CI-0-dışılık) YENİDEN ÜRETMELİ — üretmiyorsa kod ya da veri yolu bozuk (kill-list 2);
  (2) rastgele 20 kohort-gün için dilim ataması ve ileri getiri ELLE (bar dosyalarından) doğrulanır;
  (3) yanlılık göstergesi sentetik testte (kohorttan bilinçli 10 isim düşürülünce) beklenen yönde hareket etmeli;
  (4) PIT-PK: EDG-092 `bilinen_olaylar` kümesinden rastgele 10 giriş/çıkış olayı as-of listede TAM yürürlük gününde
  yansımalı (t-1'de eski, t'de yeni üyelik; tolerans 1 gün, EDG-092 K1 ile aynı) — kohort üreticisinin kendisi ölçülür,
  "kart-veri sayım hatası" sınıfına (EDG-075) karşı.

veri_penceresi: "2020-07-27 (Alpaca IEX ilk-bar tabanı, EDG-070 eksen E) → ölçüm günü; as-of günlük kohort; kapsama ADIM-0'da ölçülür ve kayda blob-sha ile bağlanır"

basari_tanimi: >
  ADIM-0 A+B geçmiş (ya da düşüp harita + eşleme tablosu teslim edilmiş — bu da başarıdır: veri kilidi sayıyla ölçülmüş
  olur) + dört pozitif kontrol yeşil + iki birincil ölçü CI'larıyla ve üç yanlılık göstergesiyle raporlanmış + K defterine
  2 (+1×2 tanı) yazılmış + hükümde damga ("üst-sınır" ya da "PIT-tam", göstergeye göre). Hüküm Rol-1 tarafından aynı
  turda karta + K defterine işlenir. Yan ürün: `research/pit_universe/sp400_uyelik_tarihi.csv` (PIT kaynak, pitlaw kayıtlı)
  ileride canlı evren genişletmesinin (TSK-065 ana hedefi) girdisidir — o karar AYRI (operatör).

