  EKSEN A — KOHORT ÜRETİCİSİ: `research/pit_universe/sp400_uyelik_tarihi.csv` (kolonlar: date, tickers; sp500_uyelik_tarihi.csv
  ile AYNI biçim; as-of günlük, 2020-07-27 → ölçüm günü) EDG-092'nin girdi blob'larından üretilir: güncel liste (SSGA MDY
  holdings xlsx, EDG-092 girdi/) + değişiklik tablosu (Wikipedia S&P 400 oldid 1373849406 ham wikitext, sha256 7d94c2ee…, EDG-092 ham/ — DÜZELTME 2026-09-14 13:2xZ: ilk ön-kayıt yanlışlıkla S&P 500 PK girdisinin oldid'ini [1370891103] anıyordu; üretici doğru dosyayı kullandı, girdi kimliği EDG-092 kartıyla aynı) geriye
  doğru yürütülür (EDG-075/092 as_of algoritması). EDG-092 tanısı: as_of(2020-07-27)=407 ≠ 400 — 12 eşleşmemiş satır
  (spin-off çiftleri, ardışık kitaplama). Bu satırlar ELLE EŞLENİR ve eşleme tablosu (`research/pit_universe/sp400_elle_esleme.yaml`:
  satır → karar → kaynak URL/olay) kartla birlikte teslim edilir; eşlenemeyen satır "belirsiz" olarak KALIR ve gün
  başına belirsiz isim sayısı raporlanır. KAPI: her gün için |as_of(t)| ∈ [392, 408] (400 ± %2) VE belirsiz isim ≤ 12/gün;
  dışında → PIT SIFIR TOLERANS (pitlaw) → askıya. Üretici PIT sözleşmesine kaydolur (`meridian/pitlaw.py` tarayıcı/kaynak
  listesi — yeni PIT kaynağı kayıtsız kalırsa v341/v342 öter).
  EKSEN B — BAR KAPSAMASI (EDG-070 eksen E deseni, A1-içi Alpaca IEX sondası, örneklem DEĞİL tam küme): kohortta 2020-07-27
  sonrası en az bir gün bulunan HER isim için günlük bar aralığı (ilk/son bar) ölçülür; kapsanan isim ≥ 40 (EDG-018/070 ile
  AYNI eşik) VE ortalama bar-geçmişi ≥ 3 yıl; ek olarak "listeden çıkan isimlerin barsız payı" (yanlılık göstergesinin tabanı)
  hesaplanır. Kapsama haritası (isim → ilk_bar, son_bar, kaynak) git BLOB'una bağlanır (EDG-059 vakası ×3).

