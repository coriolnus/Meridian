  yerine "PIT-tam" olur (o hâlde bile Alpaca kapsaması 2020-07-27 öncesini içermediği için pencere kısıtı
  beyanlıdır). Asimetri EDG-070'teki gibi: pozitif "en iyi ihtimalle var", negatif/bilgisiz güçlü "yok".

