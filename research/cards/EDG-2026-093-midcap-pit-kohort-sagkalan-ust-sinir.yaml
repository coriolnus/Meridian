  kayıtlı sayılarını (yön + CI-0-dışılık) YENİDEN ÜRETMELİ — üretmiyorsa kod ya da veri yolu bozuk (kill-list 2);
  (2) rastgele 20 kohort-gün için dilim ataması ve ileri getiri ELLE (bar dosyalarından) doğrulanır;
  (3) yanlılık göstergesi sentetik testte (kohorttan bilinçli 10 isim düşürülünce) beklenen yönde hareket etmeli;
  (4) PIT-PK: EDG-092 `bilinen_olaylar` kümesinden rastgele 10 giriş/çıkış olayı as-of listede TAM yürürlük gününde
  yansımalı (t-1'de eski, t'de yeni üyelik; tolerans 1 gün, EDG-092 K1 ile aynı) — kohort üreticisinin kendisi ölçülür,
  "kart-veri sayım hatası" sınıfına (EDG-075) karşı.

