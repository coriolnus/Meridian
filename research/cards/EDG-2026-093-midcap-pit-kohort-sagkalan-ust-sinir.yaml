  anlamlı pozitif VE rvol20+momentum kontrolünde artık katkı anlamlı) S&P 400 PIT kohortunda (as-of günlük,
  2020-07-27→ölçüm günü; üyelik EDG-092 kaynağından, delist edilen isimlerin barları Alpaca IEX'ten) da aynı
  yönde ve CI-0-dışı olarak ölçülür. ÜST-SINIR damgası KALIR ama DARALIR: EDG-070'ten farklı olarak kohort
  gerçek mid-cap PIT üyeliğidir ve listeden çıkan isimlerin barı çıkış gününe kadar (Alpaca IEX) kohortta
