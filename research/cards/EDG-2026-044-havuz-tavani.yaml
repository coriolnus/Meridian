card_id: EDG-2026-044
family: kaynak_tavani
thesis: >
  Prefill havuzunun cpu−2 tavanı bir tasarım tercihi değil, 2026-08-03 vakasının YAMASIDIR:
  iki işçi iki saat %99,9 CPU'da koşup panoyu 8,8-10,4 sn'ye boğmuştu (o gün öğrenme API
  sürecinin İÇİNDE ipliklerdi). Ö-50 (2026-08-22 ölçümü) riski OTOMATİK YOL İÇİN YAPISAL
  değiştirdi: öğrenme ayrı süreçte (CPUWeight=50), API'de hermes ipliği 0. Ö-50'nin kendi
  şartı: "kazanç duvar-saati cinsinden ölçülmeden eşik değişmez" — bu kart tam onu ölçer.
  TEZ: 4 çekirdekli A1'de işçi 2→3 (cpu−1), arama duvar-saatini anlamlı kısaltır VE API'yi
  bozmaz. YAN ŞART (kanıttan): sprint.py:672'deki İKİZ FORMÜL — tavan değişirse o kopya
  sessizce ayrışır; herhangi bir uygulama İKİSİNİ TEK KAYNAĞA indirmeden geçersizdir.
evidence_refs:
  - "research/olcumler/wp3_havuz_tavani_kanit_2026-08-22/ (01-04: vaka + canlı CPU/PSI/iplik ölçümleri)"
  - "reflect.py _havuz_tavani: max(1, min(tavan, cpu-2)); çağıranlar 4-tavanlı prefill + 3-tavanlı eksik-sonda"
  - "Ö-50 ölçümü: API'de 8 iplik hepsi uvicorn, hermes 0; learn ayrı süreç CPUWeight=50"
  - "atıfsız 0,8-çekirdeklik API patlamaları gözlendi (5 sn pencere) — kill eşiği bunu hesaba katar"
universe: >
  AŞAMA-1 (yerel, koşulsuz): SABİT bir arama iş yükü (aynı tohum/aynı aday kümesi) 2 vs 3
  işçiyle, YEREL makinede — duvar-saati + işçi başına CPU. Kazanç < %20 ise kart burada
  KAPANIR (değmez). AŞAMA-2 (canlı A1, KOŞULLU + OPERATÖR ONAYLI): bakım penceresinde tek
  kontrollü koşum — arama sırasında API p95 (curl döngüsü) + PSI cpu. CANLI VARSAYILAN
  DEĞİŞMEZ: bu kart ölçer; tavanı değiştirme kararı ayrı operatör kalemidir.
features_asof: >
  Ö1 duvar-saati oranı (3-işçi/2-işçi) · Ö2 arama sırasında API p95 ve PSI (aşama-2) ·
  Ö3 ikiz-formül teklemesi: uygulama önerisi tek-kaynaklı mı (sprint.py:672 dahil).
parameter_grid:
  isci: [3]   # K += 1 (taban 2-işçi bugünkü davranış, K harcamaz)
cost_model: yok
success_metric: >
  KARAR KURALI (donuk): Aşama-1 kazanç ≥ %20 VE Aşama-2'de arama-sırası API p95 ≤ 1 sn VE
  PSI cpu full birikimi 0 → tavan cpu−1 OPERATÖR KALEMİ olarak açılır (tek-kaynak şartıyla).
  Kazanç < %20 → kart kapanır, tavan kalır. p95/PSI bozulursa → kapanır, tavan kalır.
kill_criteria:
  - "aşama-2 operatör onayı olmadan canlıda koşulursa geçersiz"
  - "ikiz formül (sprint.py:672) tek kaynağa inmeden tavan değişikliği önerilirse geçersiz"
  - "API p95 ölçümü arama koşarken alınmazsa geçersiz (boşta p95 anlamsız)"
k_registry: {registered_at: "2026-08-22", trial_ids: [pending-044-isci3]}
status: measured     # 2026-08-23 Rol-1 HÜKMÜ aşağıda (aşama-1 yerel; aşama-2 HİÇ AÇILMADI)

verdict: >
  HÜKÜM (Rol-1, 2026-08-23): **AŞAMA-1 EŞİĞİ KARŞILANMADI — KART KAPANIR, TAVAN KALIR (donuk
  kural).** Sabit 6-sondalık arama iş yükünde 2-işçi (bugünkü cpu−2) ort 2676,74 sn ↔ 3-işçi
  (cpu−1) ort 2208,50 sn → kazanç %17,49 < %20. Tekrarlar tutarlı (A↔A %1,3, B↔B %1,5),
  determinizm 4 hücrede birebir, işçiler tam doygun (~%99,3 CPU) — kayanç sınırı boşta-işçi
  değil, sonda-dalga süresinin işçi sayısıyla uzaması. Aşama-2 (canlı p95/PSI) kural gereği
  HİÇ AÇILMADI; sabah masasındaki koşullu bakım-penceresi kalemi DÜŞTÜ. YAN-BULGU (Ö3):
  ikiz formülün tabanları bugün ZATEN farklı — reflect.py:1632 `max(1, cpu−2)` ↔ sprint.py:676
  `max(2, min(4, cpu−2))`; tavan değişmiyorken bile tek-kaynağa indirme XS hijyen adayıdır
  (kill'in şartı yalnız tavan-değişikliği önerisine bağlıydı, öneri yok → kill tetiklenmedi).
  Kart çapası sprint.py:672→676 kaymış (satır kayması, içerik aynı). Beyanlı sınır aynen:
  yerel M3 ölçümü kaba elemeydi — eleme gerçekleşti, A1'e hiç gidilmedi.
beyanlı_sinirlar: >
  (1) Yerel makine A1 değil — aşama-1 yalnız KABA eleme; nihai sayı A1'den. (2) Atıfsız API
  patlamaları (0,8 çekirdek) bu kartın konusu değil ama p95 ölçümünü kirletebilir — koşumda
  eşzamanlılık künyelenir. (3) 4 çekirdekte cpu−1=3; çekirdek sayısı değişirse kart geçersiz.
