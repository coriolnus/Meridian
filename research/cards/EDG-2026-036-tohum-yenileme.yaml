hukum_duzeltmesi:   # 2026-08-13, EDG-032b tam-satır koşumu (research/olcumler/edg032b_tamsatir_2026-08-13/)
  ne_yanlisti: >
    ALTTAKİ "13 UYDURULAMAZ EKSİK alan" hükmü YANLIŞTI ve şimdi ölçümle çürütüldü. O hüküm SLIM
    PROJEKSİYON üzerinden verilmişti (olcum.py:671-673 tam satırı 12 alana kırpıyordu); alanların
    motorda VAR OLUP OLMADIĞI ölçülmemiş, projeksiyonda görünmemesi "yok" sanılmıştı. Kendi kuralımı
    çiğnemişim: yokluğu KANITLAMADAN yokluk hükmü verdim.
  olculen: >
    Tam-satır koşum (aynı dünya — 12-alan projeksiyonu 032-cmb ile BAYT-ÖZDEŞ, sha
    d4033de68f6281a4dc694023cee459ff9c243f434e999aff65b64730bbc11a7d): canlı şemanın 26 alanından
    **25'i 885/885 DOLU**, 1'i yapısal boş (`kaynak` — YAZAR basar, üretici değil; broker.py:666-667),
    **eksik 0**. "13 uydurulamaz"ın 13/13'ü dolu çıktı. `skill_chain` 885/885 dolu (4 çeşit zincir),
    `plan_id` 885/885 canlı biçimde (P-YYYY-MM-DD-TICKER) — yani 036'nın "skills karnesi tohumdan
    beslenemez" KALICI SINIR endişesi de bu artefaktta geçersiz.
  yeni_hukum: >
    YENİLEME YAPILABİLİR. Körleşen 7 tüketicinin 6'sı bu defterle AÇILIR (score_calibration,
    component_ic, threshold_curve, cf_fidelity, mae_profile, skills-gerçek-katman, net_kotumser).
    7.'si (`llm_opinion_calibration`) KALICI OLARAK açılmaz ve bu DOĞRUDUR: LLM görüşü canlı yolda
    basılır (hermes.py:3313), backtest'te `llm_opinion` hiç geçmez — hiçbir replay tohumu üretemez.
    Bu, tohumun dürüst sınırıdır ve damgada yazılmalıdır.
  eksik_adim: >
    Bu koşum yalnız İŞLEM defterini yazdı; gerçek yenileme yolu (`run.py:276-283`) `trade_plans.jsonl`i
    de baştan yazar. Plan defteri OLMADAN yenileme korunum dedektörünü bozar (409 plan ↔ 97 işlem
    dengesi 885 işleme karşı eski planla kalır). → ikinci serileştirme koşumu ŞART (~13 dk, aynı dünya).
  friksiyon_serhi: >
    EDG-037 (TCA) uyarısı tohuma İŞLENMELİ: bu defter `slippage_bps=5` varsayımıyla üretildi ve o
    varsayım ilk ölçümde ~9 kat iyimser çıktı. Tohum GÜNCEL PAKETİ temsil eder ama İYİMSER FRİKSİYONU
    taşır; damgasına yazılmazsa sonraki okuyucu bunu gerçekleşen sanır.
verdict:
  asama0: >
    KILL#1 TETİKLENMEDİ — tohumun EN AZ 15 gerçek tüketicisi var ve 13'ü `kaynak` ayrımı YAPMIYOR.
    Faz-6'nın iki kilidi (edge_verdict analytics.py:1840 · result_verdict :2287) doğrudan tohumdan
    besleniyor; shadowlaw'ın MONEY_GATE_MARGIN/DD_VETO_MARGIN'i tohum defterinden TÜRETİLMİŞ
    (shadowlaw.py:341); component_ic'in "gerçek katman n=95" hükmü tohumun kendisi. Yalnız 3 tüketici
    ayrımı tam yapıyor (learning_scorecard orneklem_n=2, sermaye.py, /api/public/summary).
    TARİHSEL KANIT: rollback defterinde v4 satırı `live_score=−0.0089, n_trades=95, rolled_back=true`
    — tohum ZATEN BİR KEZ canlı sürüm geri aldırmış. Yani soru akademik değil.
  asama1: >
    (b) TÜKETİCİ TUTARLILIĞI DÜŞTÜ — kartın beklentisinin TERSİ ölçüldü. 885-satırlık artefaktla
    7 tüketici KÖRLEŞİYOR (score_calibration IC → None; skills gerçek katman "?" n=885; mae_profile
    → None; llm_calibration çifti 4→1), `sieve` bütünlük dedektörü 8 ihlal (4 kritik) yazıyor,
    shadowlaw kayma bekçisi ateşliyor (margin_scale 0,1865→0,9272, 5×), rollback kapısı AÇILIYOR
    (ham_delta −0,1779 < −0,1 → geri-alma eşiği aşılır). İYİ YÖNLER de ölçüldü: DSR 3e-06→0,0393,
    result_verdict 0/4→1/4 (net_pnl −5.264$ → +20.963$), CI 145,19$→91,64$.
  kok: >
    BU BİR TOHUM DEĞİL ARTEFAKT PROBLEMİ. EDG-032'nin `islemler_cmb.json`'u SLIM PROJEKSİYON
    (olcum.py:671-673 tam satırı 12 alana kırpıyor). Canlı şema 26 alan: 10 taşınabilir, 3 prosedürel
    damga, **13 UYDURULAMAZ EKSİK** (plan_id, side, entry, exit, r_multiple_expected, pnl_pct, costs,
    score, exploration, scaled_out, mfe_r, mae_r, skill_chain). Tam satırlar 032 koşumunda BELLEKTE
    VARDI (broker.py:685-702), diske yazılmadı.
  hukum: >
    YENİLEME ŞU ARTEFAKTLA YAPILMAZ (kart kuralı: (b) düştü → DUR). DOĞRU YOL: 032 koşumunu TAM-SATIR
    serileştirmeyle yeniden koş (deterministik, ~30dk; sha-pinli aynı dünya), sonra yenilemeyi o
    defterle tekrar ölç. Aşama-2 (uygulama) HER HALÜKÂRDA operatör onayı ister ve İKİ EK RİSK kayda
    geçti: (i) `strategy_version=5` damgası tohumu yürürlükteki sürümün paydasına sokar ve geri-alma
    eşiğini aşırır — damga şeması yeniden düşünülmeli (ör. tohum ayrı sürüm-uzayı) · (ii) hermes
    yansıma sayacı defter UZUNLUĞUNU okuyor (790 yeni → sayı kapısı açılır), yani yenileme öğrenme
    kadansını da tetikler.
  yan_kazanim: >
    Denetim, ROADMAP §2-20/split hattına iki somut kalem ekledi: 13 tüketicinin `kaynak` körlüğü
    (sim/gerçek ayrımı KARAR yollarında yok — rollback + hermes sayacı) ve ölçüm artefaktlarının
    şema-eksikliği (replay defterleri canlı şemaya çevrilemiyor → her yenileme/backfill fikri bu
    duvara çarpar).
  artefakt: "research/olcumler/edg036_tohum_2026-08-13/ (sonuc.json + 4 ham ölçüm + 5 arşiv betiği; canlıya HİÇBİR yazım yok)"


