kurulum_sozlesmesi: >
  Reçete SABİT (derin inceleme §10.1, sürüm çivili): hindsight-api-slim[local-onnx]==0.9.2 ·
  native PG17+pgvector (PGDG arm64) · embedder multilingual-e5-small (ONNX, lokal) · reranker
  flashrank ms-marco-MultiBERT-L-12 + rrf failover · 127.0.0.1 bind · systemd MemoryMax=8G
  CPUQuota=200% · Memory Defense bank açılışında AÇIK (sonradan geriye taramaz — §8.5) ·
  gecelik pg_dump→backups/ · dışarı giden TEK trafik OpenRouter LLM (retain/reflect; recall
  LLM'siz-lokal). sudo adımları OPERATÖR koşar (bot-roster emsali), Rol-1 blok verir + kanıt
  toplar. Birim kurulduğu gün elle test-ateşlenir (§9: "kurulu" ≠ "çalışır").

veri_ve_dondurma: >
  KORPUS: arsiv bank'i = MERIDIAN_ENGINEERING_LOG.md + ROADMAP §7 karar kayıtları +
  research/cards/ hükümleri + docs/ vaka belgeleri (git-sha'lı ingest; batch, harness-yazımlı).
  SORU KÜMESİ: ölçüm BAŞLAMADAN research/olcumler/edg065_hindsight_faz1/sorular.yaml içinde
  dondurulur ve o dosyanın GIT BLOB sha'sı bu kartın olcum bölümüne işlenir (EDG-059 dersi:
  çalışma-ağacı referansı kartı sessizce öldürür). Her soru: metin + beklenen-pasaj referansı
  (dosya+bölüm) + dil etiketi (tr/en). Küme donmadan koşulan her kıyas GEÇERSİZ.

