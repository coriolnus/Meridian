card_id: EDG-2026-055
family: veri_kapsama_bedeli
thesis: >
  WP4 eleme bulgusu (2026-08-24): earnings takvimi kapsamı bugün 216/251 (%86,1) — 35 sembolde
  fail-open (kazanç-penceresi bilinmediğinde kapı GEÇİRİYOR; fail-closed olsaydı işlem kaçardı).
  Tasarım bilinçli ama BEDELİ HİÇ ÖLÇÜLMEDİ: fail-open geçen bir planın kazanç gününe denk gelip
  gelmediği ve o vakaların P&L'i bilinmiyor. BU KART retro sayım yapar: "fail-open gerçekleşmiş
  bedeli" — kapı tasarımını DEĞİŞTİRMEZ, bedeli rakamlandırır.
evidence_refs:
  - "docs/ELEME-WP4-HAVUZ-2026-08-23.md A3: kapsam 216/251 ölçüldü (194 sayısı eskimişti); 35 fail-open sembol listeli; tazeleme sağlıklı (son arıza 2026-07-19)"
  - "guard earnings_blackout kontrolü (gate_checks: coverage='known'/fail-open dalı)"
universe: >
  Replay defteri (edg032c dünyası) + earnings takvimi PIT snapshot'ları. Gözlem: fail-open
  damgasıyla geçmiş plan/işlem. PIT ZORUNLU: o günkü takvim bilgisi kullanılır — BUGÜNKÜ takvimle
  geçmişi yargılamak yasak (retro-kapsama tuzağı; ölçülemeyen sembol-dönem None+neden).
features_asof: >
  Vaka tanımı: fail-open ile geçen ve gerçekte kazanç-penceresine (t±1 seans) denk gelmiş işlem.
  Sayım: vaka n · toplam P&L · toplam R · aynı dönemin fail-open-olmayan işlemlerine göre
  dağılım farkı (betimleyici). Ek: bugünkü 35 sembolün tarihsel işlem payı (maruziyet vekili).
parameter_grid:
  hucreler: [failopen_retro_sayim]   # K += 1
cost_model: dogrudan_defter_sayimi
success_metric: >
  KARAR KURALI (donuk): vaka N ≥ 1 VE bu vakaların toplam R'si negatifse → "fail-open ölçülmüş
  bedel taşıyor" → kapıyı DARALTMA tasarımı (kapsama-şartlı fail-closed) ayrı kartla gündeme
  gelir. N = 0 → "ölçülmüş-ret": fail-open bedelsiz, kalem kapanır ve kapsama borcu yalnız
  görünürlük kalemi olur. N ≥ 1 ama toplam R pozitif/nötr → betimleyici şerh, tasarım değişmez.
kill_criteria:
  - "bugünkü takvimle geçmiş yargılanırsa geçersiz (PIT snapshot zorunlu; yoksa o sembol-dönem None+neden)"
  - "fail-open damgası olmayan işlemler vakaya sayılırsa geçersiz"
  - "kapı tasarımına dokunulursa geçersiz (bu kart ÖLÇER, değiştirmez)"
k_registry: {registered_at: "2026-08-24", trial_ids: [pending-055-failopen]}
status: measuring    # 2026-08-24 ölçüldü — R1'in DAL-2'si ateşledi, hüküm YOK (aşağıda)

verdict: >
  HÜKÜM (Rol-1, 2026-08-24): **HÜKÜM YOK — ve bu, R1 şerhi olmasaydı YANLIŞ bir kapanış olurdu.**

  ÖN-SAYIM: `N_giris = 10` (6 kapanmış live_paper + 4 açık pozisyon, giriş tarihi pencerede) ·
  `N_failopen_kapsam = 0` · `N_kapsam_olculemedi = 0`. PIT arşivi 10 anlık görüntü,
  pencere 2026-08-03 → 2026-08-17. İki koşum bayt-özdeş (`7460fb5b…`). Dört kill temiz.

  **R1'in DAL-2'si ateşledi:** `N_giris ≥ 1` ama `N_failopen_kapsam = 0` → BETİMLEYİCİ.
  Bu pencerede fail-open hiç tetiklenmedi, dolayısıyla **bedeli ölçülemez**. Hücre yine de
  hesaplandı ve dürüst kaldı: `vaka_n = 0`, `vaka_toplam_r = null` (boş kümenin toplamına
  `0.0` yazmak yokluğu ölçüm gibi gösterirdi).

  **R1 OLMASAYDI NE OLURDU:** kartın özgün `success_metric`i "N = 0 → ölçülmüş-ret:
  fail-open bedelsiz, kalem kapanır" diyordu. Bugünkü sayıyla o dal ateşler ve kalem
  KAPANIRDI — oysa ölçülen şey bedelin yokluğu değil, **fail-open'ın hiç tetiklenmemiş
  olmasıydı**. Şerh ölçümden ÖNCE yazıldığı için bu kapanış olmadı. Kart `measuring` KALIR.

  ⚑ **EKSEN DIŞI AMA DAHA AĞIR BULGU (eşiksiz, hükümsüz — ama kayda geçiyor):**
  10 girişin **9'unda** kapsam `known` görünüyor, AMA giriş anında bilinen tek rapor tarihi
  GEÇMİŞTEYDİ (NUE 07-27 · HUM 07-29 · VLO 07-30 · MRNA 07-31 · EMR/BKNG/AMGN/MRK 08-04 ·
  ALL 08-05). Yalnız CRM'in ileri çapası vardı (08-26). Yani kapı sembolü TANIYORDU ama
  **ileriye bakacak çapası yoktu** — davranış bakımından fail-open'dan ayırt edilemez.
  Bu, kapsama ölçüsünün kendisinin yanıltıcı olabileceğini gösterir: `known` ≠ KORUNUYOR.
  Bu bulgu bu kartın ekseni DEĞİLDİR ve buradan hüküm çıkmaz; **ayrı bir kart konusudur**
  ve ön-kayıt yazılmadan hiçbir tasarım kararına girdi olamaz.

  ÇAPRAZ DOĞRULAMA: 10 girişin 5'inin planı defterde bulundu, hepsinde kayıtlı
  `coverage = "known"` — PIT yeniden kurulumuyla **0 çelişki**.

beyanli_olculemeyenler: >
  (a) 08-03 öncesi ve 08-17 sonrası canlı girişler arşiv dışında — 2026-08-20'deki beş giriş
  (MRVL · LLY · MRNA · MRK · BDX) ölçüme GİRMEDİ.
  (b) Kartın "fail-open olmayanlarla dağılım farkı" kalemi: kıyaslanacak birinci küme yok.
  (c) NUE/ALL + üç açık pozisyonun KAYITLI kapsam damgası — `trade_plans` 500 satırlık dönen
  defter ve o planlar düştü. Hüküm yolu etkilenmedi (kapsam PIT'ten kuruldu).
  (d) Girişlerin saat damgası yok; `asof` bu yüzden muhafazakâr kuruldu (giriş günü X için
  `fetch_date < X` olan son anlık görüntü — aynı günün akşam tazelemesi geleceği sızdırırdı).
r1_pit_derinligi_serhi_2026_08_24: >
  R1 REVİZYONU (Rol-1, ÖLÇÜMDEN ÖNCE — eşiklere, karar kuralına ve kill listesine DOKUNULMADI;
  bu bir KAPSAM ŞERHİdir, eşik değişikliği DEĞİL).

  DOĞRULAMA TURU BULGUSU (2026-08-24): PIT snapshot arşivi **10 fotoğraf** ve penceresi
  **2026-08-03 → 2026-08-17** ile sınırlı. `success_metric`in "N = 0 → ölçülmüş-ret" dalı bu
  pencerede KÖR BİR TEHLİKE taşıyor: pencerede hiç canlı giriş yoksa N zaten 0 çıkar ve
  ölçüm "fail-open bedelsiz" der — oysa ölçülen şey bedelin yokluğu değil, ÖRNEKLEMİN
  yokluğudur. Bu, bu deponun `kuraklığı kanıt sanmak` hatasıdır.

  ZORUNLU ÖN-SAYIM (karar kuralına GİRMEDEN önce koşulur ve raporlanır):
    N_giris = PIT penceresi (2026-08-03..08-17) içinde CANLI (live_paper) giriş sayısı.
  Ve bu sayıdan kaçının fail-open damgası taşıdığı ayrıca sayılır (N_failopen_kapsam).

  KARAR KURALINA BAĞLAYICI ETKİ:
    * N_giris = 0  →  hüküm YOKTUR. Kart "ölçülemedi — PIT penceresinde canlı giriş yok"
      damgasıyla `measuring` KALIR. **"Ölçülmüş-ret" YAZILAMAZ.**
    * N_giris ≥ 1 ama N_failopen_kapsam = 0  →  "bu pencerede fail-open hiç tetiklenmedi"
      BETİMLEYİCİ damgası; yine ölçülmüş-ret DEĞİL, çünkü kapının bedeli tetiklenmediği
      bir pencerede ölçülemez.
    * N_failopen_kapsam ≥ 1  →  `success_metric` AYNEN uygulanır (N ve toplam R üzerinden).

  Payda her hâlde yüzeyde yazılır: N_giris · N_failopen_kapsam · pencere · snapshot sayısı.
  Kapsanamayan dönem `beyanli_sinirlar` (1)'de zaten beyanlı; bu şerh onu KARAR KURALINA bağlar.

beyanli_sinirlar: >
  (1) PIT snapshot derinliği takvim arşivimiz kadardır — kapsanamayan dönem beyanla dışarıda.
  (2) "Kazanç gününe denk gelmek" zarar demek değildir; kart bedeli SAYAR, nedensellik iddia etmez.
