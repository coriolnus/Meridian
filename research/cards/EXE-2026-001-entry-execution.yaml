revizyonlar:
  - id: "EXE-2026-001-R1"
    tarih: "2026-08-07"
    alan: "horizon → TIF"
    degisim: "TIF=DAY → TIF=GTC (broker.ENTRY_TIF; ENTRY_LAW_VERSION E1-v1 → E1-v2)"
    k_etkisi: "YOK — TIF kart `parameter_grid`inde HİÇ olmadı (grid: limit_offset × gap_davranisi,
      3×2). Bu bir grid noktası eklemesi değil, bir EMNİYET SINIRI düzeltmesidir; K defterine
      sayılmaz ve kill_criteria'ya DOKUNULMADI."
    ne_olculdu: >
      Canlı A1 hesabı, 2026-08-06 20:00-20:02Z: dört motor pozisyonunun koruma bacakları öldü —
      `limit sell` EXPIRED + OCO kardeşi `stop sell` CANCELED. Hiçbir motor çağrısı iptal etmedi;
      Alpaca'nın gün-sonu sona-ermesi öldürdü. Dört pozisyon gece boyunca ÇIPLAK kaldı. Ertesi gün
      broker'da 5 açık pozisyon / 0 açık emir ölçüldü, `portfolio.json` ise dördü için hâlâ stop
      BEYAN EDİYORDU (defter ile broker ayrıştı, hiçbir dedektör görmedi — `reconcile_broker_state`
      o gece 4 MIRROR_DRIFT alarmı bastı, hepsi ADET sapması).
    kok_neden: >
      Alpaca bracket'ında `time_in_force` alanı TEKTİR ve emrin TAMAMINA (parent + TP + SL)
      uygulanır. `broker.ENTRY_TIF="day"` yalnız GİRİŞ bacağını düşünerek seçilmişti, ama aynı
      alan koruma bacaklarının da ömrünü belirliyordu. Kartın kendi metni bu boşluğun kanıtıdır:
      `horizon` satırı yalnız "giriş emri"ni konuşur, ÇIKIŞ bacağının TIF'i bu kartta HİÇ
      tartışılmadı — yani korumanın ömrü hiç kimsenin verdiği bir karar değil, giriş kararının
      beyan edilmemiş yan etkisiydi. Sonuç, deponun KENDİ yazılı yasasının ihlaliydi:
      `alpaca.cancel_open_entries` belgesi "dolmuş parent'lara DOKUNULMAZ — koruyucu bacakları
      canlı pozisyonu koruyor; onları iptal etmek pozisyonu çıplak bırakır (yasak)" der; `tif=day`
      tam o yasağı her gece broker üzerinden uyguluyordu.
    eski_gerekce_hukmu: >
      "GTC bir sonraki seansa BAYAT TETİK taşır (sinyal barı kapanışına sabitlenmiş bir seviye iki
      gün sonra artık o kurulumu temsil etmez)" — GİRİŞ bacağı için ÇÜRÜTÜLMEDİ, geçerliliğini
      koruyor. Değişen, o riskin ARACIdır: bayat tetik artık TIF'e havale edilmiyor.
    yeni_mekanizma: >
      (1) `broker.ENTRY_TIF="gtc"` ve `ENTRY_TIF_ALLOWED=("gtc",)` — "day" beyaz-listeden
      ÇIKARILDI (unutulmadı, kaldırıldı): tek TIF alanı olduğu sürece `execution_v2.tif: day`
      yazan bir yapılandırma korumayı yeniden seans-ömürlü yapardı; korumanın ömrü bir arama
      değişkeni değildir. (2) Bayat tetik koruması `loop.daily_cycle`a taşındı: her turda, o
      seansın dolum kararları verildikten SONRA ve yeni planlar silahlanmadan ÖNCE
      `alpaca.cancel_open_entries()` çağrılır (olay: `mirror_stale_entries_cancelled`, HALT
      yolunun `mirror_entries_cancelled` olayından AYRI ad). O yol yalnız ENGINE_COID_PREFIX
      önekli ve yalnız `filled_qty=0` emirlere dokunur; dolmuş parent'ın koruma bacaklarına ASLA.
      Yani DAY'in körlemesine yaptığı işin yalnız DOĞRU YARISI yapılıyor.
    olcum_etkisi: >
      DoD ölçütleri (a)/(b)/(c) ve kill_criteria DEĞİŞMEDİ. E2 defteri (`entry_execution.jsonl`)
      `tif` alanını her gönderimde yazdığı için yeni yasanın yürürlüğü kayıttan doğrulanabilir;
      `dolmama_orani` paydası bu revizyondan etkilenmez (giriş emrinin YAŞAM SÜRESİ değişti, dolum
      yasası — limit tavanı ve gap davranışı — aynen duruyor). AÇIK İZLEME KALEMİ: GTC girişin
      gün-içi bekleme penceresi denetim kaydındaki "dolum-penceresi asimetrisi" bulgusunu
      genişletebilir; günlük iptal kadansı o pencereyi bir seansla SINIRLAR, ama asimetrinin
      kendisi hâlâ ayrı bir ölçüm kalemidir.
    kapsam_disi_beyan: >
      Bu revizyon 2026-08-06 gecesi çıplak kalan pozisyonları KORUMAZ. Onlar için koruma emri
      göndermek OPERATÖRÜN işidir; hiçbir otomatik yol bu turda emir göndermedi/iptal etmedi.
    yurulukteki_yapilandirma_notu: >
      `state/goal.yaml → execution_v2.tif: day` satırı bu revizyondan sonra ÖLÜ METİNDİR (yasa onu
      kabul etmez, `gtc`ye düşer). Dosyanın yalan söylememesi için satırın temizlenmesi ayrı bir
      SSoT kalemidir (state/goal.yaml git-izli, dagit [1b] canlıya kopyalar) — bu turda
      DOKUNULMADI.

  - id: "EXE-2026-001-R2"
    tarih: "2026-08-07"
    alan: "parameter_grid → limit_offset (işletim noktası)"
    degisim: >
      Yürürlükteki işletim noktası, kartın `B` hücresinden (`min(0,5·ATR14; %1,0)` — modül
      varsayılanı `ENTRY_LIMIT_ATR_MULT=0,5` / `ENTRY_LIMIT_PCT_CAP=0,01`) `state/goal.yaml →
      execution_v2`de `limit_atr_mult: 100,0` / `limit_pct_cap: 0,04`e alınmıştır. Bu değerlerle
      limit tavanı `min(100·ATR; %4·fiyat)` olur ve ATR bacağı hiçbir gerçek barda bağlamaz;
      geriye BAĞLAYAN TEK TAVAN olarak `MAX_ENTRY_GAP_PCT = %4` (broker.py:17) kalır.
    k_etkisi: >
      GRİDE YENİ HÜCRE EKLENMEDİ. Bu nokta ölçümde ZATEN koşuldu: `ref_limitsiz` kolu
      (`limit_atr_mult=1000`, `limit_pct_cap=0,10` → limit tetik×1,10 > max_chase tetik×1,04)
      tam da "limit bağlamaz, %4 chase bağlar" rejimidir ve yürürlükteki yapılandırma bu rejimin
      İÇİNDEDİR — sayısal değerler farklı, DAVRANIŞ AYNI (ikisinde de limit tavanı ölü, bağlayan
      max_chase). Ancak `ref_limitsiz` kart-DIŞI bir REFERANS koldu ve `k_registry.trial_ids`
      içinde YOKTU; bir referans kolu İŞLETİM NOKTASINA terfi ettirmek bir karardır ve sayılır:
      **K += 1** (`e1_grid/ref_limitsiz` trial_ids'e eklendi). kill_criteria DEĞİŞMEDİ.
    ne_olculdu: >
      Kartın KENDİ grid'i (2026-08-03, research/olcumler/e1_grid_2026-08-03/RAPOR_e1.md; R1
      geometrisi, 250 sembol, 2022-01-03→2026-07-29). Net $ (replay defteri, 10bps):
        A = min(0,25·ATR14; %0,5)  -> -7.202,46   (dolmama %34,68)
        B = min(0,50·ATR14; %1,0)  -> -1.182,15   (dolmama %16,48)   <- ESKİ İŞLETİM NOKTASI
        C = min(1,00·ATR14; %1,5)  -> -2.878,30   (dolmama  %9,55)
        REF·limitsiz (limit ölü)   -> +2.957,02   (dolmama  %2,38)   <- YENİ İŞLETİM NOKTASI
      E3 kötümser ikizde de tek artı kolon REF: +1.958,81 (B: -2.045,61). Yani limit bacağı
      İKİ maliyet modelinde de MONOTON ZARARLI ve sıkılaştıkça kötüleşiyor.
    kok_neden: >
      Limit tavanının maliyeti işlem BAŞINA değil, ATLANAN İŞLEMLERDE birikiyor. Dar tavan
      ödül/risk oranını korur ama fiyat tetiği geçip kaçtığında girişi tümden düşürür
      (`entry_missed_limit`: A'da 38, B'de 23, C'de 12, REF'te 0). Ölçüm, atlanan bu işlemlerin
      toplam değerinin, kovalayarak girmenin ödül/risk aşınmasından BÜYÜK olduğunu söylüyor.
      Canlı doğrulama (2026-08-06 dört pozisyon): AMGN +1,78% · EMR +1,60% · BKNG +1,55%
      kovalandı, ödül/risk 2,50'den sırasıyla 1,50 / 1,76 / 1,90'a indi; NUE tetiğin ALTINDA
      doldu (2,63'e YÜKSELDİ). B işletim noktasında bu dördün ÜÇÜ hiç açılmayacaktı.
    olcum_etkisi: >
      `counterfactual.advance` AYNI `MAX_ENTRY_GAP_PCT` sabitini okur (broker.py:75-80 notu),
      dolayısıyla karşı-olgusal defter bu işletim noktasıyla tutarlı kalır — canlı ile cf
      "aynı stratejiyi ölçüyor" hâli KORUNDU. Kartın DoD ölçütleri (a)/(b)/(c) değişmedi;
      `dolmama_orani` beklenen aralığı B'nin %16,48'inden REF'in %2,38'ine kayar ve bu
      kill#1 eşiğinden (>%40) UZAKLAŞIR, ona yaklaşmaz.
    durustluk_beyani: >
      BU KAYIT GERİYE DÖNÜKTÜR VE ÖYLE OKUNMALIDIR. Yapılandırma bu değerleri zaten taşıyordu;
      Rol-1 bunu 2026-08-07'de canlı `entry_law()` çıktısını okurken FARK ETTİ ve ancak ondan
      SONRA kartla karşılaştırdı. Yani bu revizyon bir ön-kayıt DEĞİL, mevcut bir sapmanın
      BEYANIDIR. Eşik sonradan sonuca uydurulmadı — grid 2026-08-03'te, sapma fark edilmeden
      ÖNCE koşulmuştu ve hükmü o gün yazılmıştı; bu revizyon yalnız "işletim noktası artık
      hangi kolon" sorusunu kayda geçirir. Rol-1'in ilk okuması ("kanıtsız sapma") YANLIŞTI:
      kanıt kartın kendi içindeydi ve sapma kanıtın işaret ettiği YÖNDEYDİ.
    operator_hukmu: "operatör 2026-08-07: böyle kalsın (işletim noktası REF·limitsiz rejimi)"
    k1_serhi: >
      K1 ŞERHİ (2026-08-13; kaynak: docs/ARASTIRMA-SLIPAJ-AZALTMA-2026-08-13.md:349-350 + denetim
      docs/DENETIM-ROADMAP-TUTARLILIK-2026-08-13.md A6). HÜKÜM SİLİNMEDİ — ÜSTÜNE YAZILDI.
      Yukarıdaki `ne_olculdu` tablosu ve ondan türeyen `kok_neden` (limit bacağı MONOTON ZARARLI ·
      kaçan dolumlar sistematik KAZANAN) 2026-08-03 E1 grid'inden gelir; o grid REPLAY motorunda
      koşuldu ve replay DİNLENEN LİMİTİ MODELLEMİYOR (K1). Araştırmanın harfi harfine hükmü:
      "K1 kapanmadan yapılan her limit-tavanı ölçümü kaçan işlem maliyetini SİSTEMATİK OLARAK ABARTIR,
      ve 2026-08-03 E1 grid hükmü tam olarak o abartılmış maliyetle verilmiştir."
      NE DEĞİŞMEZ — CANLI DAVRANIŞ. İşletim noktası REF·limitsiz rejiminde KALIR (operatör hükmü
      2026-08-07, yukarıda). Bu şerh bir değişiklik önerisi DEĞİLDİR, hiçbir yapılandırmaya dokunmaz
      ve `k_etkisi`/K defterine etkisi YOKTUR. Dolmama oranları (A %34,68 · B %16,48 · C %9,55 ·
      REF %2,38) doğrudan SAYIMLARDIR ve kill#1 eşiğinden (>%40) uzaklaşma tespiti ayakta kalır.
      NE DEĞİŞİR — GEREKÇENİN GÜCÜ ASKIYA ALINIR. "Atlanan işlemlerin toplam değeri, kovalayarak
      girmenin ödül/risk aşınmasından BÜYÜKTÜR" çıkarımı sistematik olarak ABARTILMIŞ bir kaçan-işlem
      maliyetiyle kuruldu; net $ kolonları (A −7.202,46 · B −1.182,15 · C −2.878,30 · REF +2.957,02)
      bu yanlılığı taşır. Kartın kendi `OKUMA SINIRI` satırı bunun yarısını zaten söylüyordu
      (replay dolum-iyimserliği REF kolonunda en yüksek) — K1 şerhi diğer yarısını ekler.
      FIRSAT KANITI (aynı araştırma :335-345, hüküm değil kanıt): 100 bps tavanla EMR/BKNG/AMGN limit
      fiyatı AYNI SEANSTA işlem gördü; notional-ağırlıklı üst-sınır tasarruf 49,65 bps. Araştırmanın
      kendi şerhi geçerlidir: "limit fiyatı işlem gördü" ≠ "emrimiz doldu" (kuyruk önceliği ve paper
      motorunun davranışı SİMÜLE EDİLMEDİ).
      ŞERH NE ZAMAN KALKAR: ROADMAP §2-23c (K1 — replayde dinlenen limitin modellenmesi) kapandığında.
      O güne dek hiçbir limit-tavanı KARARI bu grid'e dayandırılamaz.
