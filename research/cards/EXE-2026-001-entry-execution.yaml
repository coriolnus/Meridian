# REVİZYONLAR — EKLENİR, ÜZERİNE YAZILMAZ. Yukarıdaki ön-kayıt metni (thesis/horizon/grid/kill)
# olduğu gibi durur; her revizyon NE ÖLÇÜLDÜ + NEDEN DEĞİŞTİ ile ayrı bir girdidir.
