# ANA BULGU: limit-bacağı geriye-dönük defterde MONOTON ZARARLI — net$ A −7.202 · B −1.182 ·
# C −2.878 · LİMİTSİZ +2.957 (E3-kötümserle de +1.959; iki maliyet modelinde de tek artı kolon).
# Kaçan dolumlar sistematik KAZANAN (A hip.R_10 ort +0,23 · B +0,26; C'de kalan 12 kaçak ≈nötr).
# SKOR-PARA AYRIŞMASI kayıtlı: PARA-v3 C(0,0581)>B(−0,0037) ama net$ B>C — hüküm $-merceğiyle.
# GAP-BACAĞI REPLAY'DE ÖLÇÜLEMEDİ (yapısal: replay gap_at_submit geçirmez; mkt↔cancel bayt-aynı) —
