card_id: EDG-2026-033
family: rejim_kosullu_boyut
thesis: >
  §2-15a: Debi kolu bitti (9-kart dalgası); kalan kaldıraç sermaye TAHSİSİ. EDG-030 ayrışımı trend_up
  işlemlerde ort-R 0.736 ölçtü (portföy geneli 0.057) ve e20 zararının ana kalemi trend_up kazananlarının
  yerinden edilmesiydi. TEZ: zarf 5R SABİTKEN işlem-başı riski rejim sınıfına göre modüle etmek (iyi
  rejimde büyük, nötrde küçük) aynı ısıyla daha iyi dağılım verir. CI çürütürse düz-0.5R kanıtla doğrulanır.

evidence_refs:
  - "EDG-030 verdict e20: trend_up ort-R 0.736 (50/66 kayıp-işlem trend_up, −13.4k$); yan-kanal mekanizması"
  - "EDG-026: C-taban 772 işlem +9.869$ dd %12.4 sharpe 0.285 (sha-pinli)"
  - "ROADMAP §2-15a (2026-08-12 öneri-kaydı)"

universe: "C-şasi AYNEN (026 olcum.py; rampa 15/36 + slot20 + 0.5R taban + zarf 5R dokunulmaz); rejim sınıfı motorun KENDİ sınıflayıcısından (030 kırılım deseni); boyut-çarpanı TEK kanonik yüzeyde BEYANLI monkeypatch (position_size_r tüketim noktası — ajan yüzeyi keşfeder, tek nokta, öz-sınamalı)"

features_asof: >
  İKİ hücre + kontrol: H1 'yukarı-asimetri' (trend_up 0.75R, diğer açık rejimler 0.5R) · H2 'tam-modülasyon'
  (trend_up 0.75R, açık-ama-trend_up-olmayan 0.35R). KONTROL (şasi-sınaması, hücre değil): çarpan≡1.0
  smoke-penceresinde C ile bit-özdeşlik ŞART. Kıyas C'ye: işlem n, net P&L farkı+CI, max-dd, sharpe,
  rejim-kırılımlı karne, ısı-kullanım profili, eşleşen-(date,ticker) işlemlerde saf-boyut-etkisi ayrışımı.

parameter_grid:
  hucre: [yukari_asimetri, tam_modulasyon]   # K += 2 (kontrol koşumu hücre sayılmaz — şasi doğrulaması)

cost_model: pessimistic_band_v2

success_metric: >
  Hücre-vs-C eşlenik ay-kümeli bootstrap (5000, seed 20260812): ΔP&L CI-alt > 0 VE dd ≤ C×1.3 → 'benimseme
  adayı' pencereye (uygulama her durumda final-paket doğrulaması + operatör onayı gerektirir — §2-11).
  CI-0-içi/negatif → düz-0.5R kanıtla doğrulanır (kapanış hükmü).

kill_criteria:
  - "kontrol bit-özdeşliği düşerse ölçüm GEÇERSİZ (yama yüzeyi yan-etkili)"
  - "trend_up işlem sayısı taban-defterde <30 → olculemedi"
  - "şasi bütünlüğü bozuksa geçersiz"

k_registry: {registered_at: "2026-08-12T4x", trial_ids: [edg033_rejim_boyut_2026-08-12/h1, edg033_rejim_boyut_2026-08-12/h2]}   # U2 2026-08-23: 2 pending -> gercek trial_id (sonuc.json hucreler)

status: measured   # 2026-08-12 Rol-1 — iki hücre ölçüldü + hüküm: DÜZ-0.5R KANITLA DOĞRULANDI.

verdict:   # Rol-1 hükmü.
  sonuc: >
    İKİ HÜCRE DE DÜŞTÜ (başarı-koşulu ΔP&L CI-alt>0 sağlanmadı): h1 yukarı-asimetri ΔP&L −7.624$
    (CI [−22.410,+7.380]), sharpe 0.285→0.053 · h2 tam-modülasyon Δ−8.897$ (CI [−22.639,+4.368]),
    sharpe→0.023. Kartın kuralı gereği DÜZ-0.5R KANITLA DOĞRULANDI; kart arşiv.
  tca_serhi: >
    FRİKSİYON ŞERHİ + DİL DÜZELTMESİ (2026-08-13; kaynak: EDG-2026-037 / EDG-2026-038 + denetim
    docs/DENETIM-ROADMAP-TUTARLILIK-2026-08-13.md §E). HÜKÜM SİLİNMEDİ — ÜSTÜNE YAZILDI.
    BU KART, dokuz replay kartı içinde friksiyon YÖNÜ ALEYHTE olan TEK karttır (denetim §E.1):
    hüküm ZAYIFLAR, tersine DÖNMEZ — BELİRSİZLEŞİR.
    MEKANİZMA: h1/h2 kolları tabandan DAHA AZ işlem üretiyor — 0.75R planlar sabit 5R zarfını 2× hızla
    dolduruyor ve C'nin ~170 pozitif-beklentili işlemi hiç doğmuyor (yukarıdaki `mekanizma` bloğunun
    kendi ölçümü). Gerçek friksiyonda TABAN daha çok friksiyon yer → ΔP&L farkları (−7.624$ / −8.897$)
    DARALIR → zaten 0-içi olan CI'lar daha da belirsizleşir.
    DİL DÜZELTMESİ (denetim eylemi): yukarıdaki `sonuc` satırı SİLİNMEDİ, ŞÖYLE OKUNMALIDIR —
    "düz-0.5R KANITLA DOĞRULANDI" → "düz-0.5R BU FRİKSİYON VARSAYIMI ALTINDA (`slippage_bps=5`)
    DOĞRULANDI". Kartın kapanış hükmü ve arşiv kararı DEĞİŞMEZ; değişen tek şey kanıtın GÜCÜDÜR.
    NE DEĞİŞMEZ: eşli ölçütler — saf-boyut etkisinin eşleşen trend_up işlemlerde POZİTİF olması
    (+1.429$, 137 çift) ve "ZARF 5R sistemin bağlayıcı kaynağıdır" yasası (kompozisyon/sayım bulgusu;
    heat_hard NO_GO 168→343). `kill3_serhi`nin sha-drift kanıtları da friksiyondan bağımsızdır.
    NE DEĞİŞİR: "kanıtla doğrulandı" ifadesinin gücü + mutlak ΔP&L ve sharpe SEVİYELERİ.
    ÖLÇÜM: kanonik ölçütle giriş bacağı medyan +29,0 bps (model 5 bps; n=4, CI geniş, çıkış bacağı
    n=0). Bu şerh bir ÇIKARIMDIR (§E.0 ayrım kuralı); hücreler YENİDEN KOŞULMADI.
  mekanizma: >
    ÖĞRETİCİ (sente kapanan ayrışım): saf-boyut etkisi eşleşen trend_up işlemlerde h1'de POZİTİF (+1.429$,
    137 çift) — hipotezin çekirdeği yanlış değil. Kaybın ana kalemi KOMPOZİSYON: 0.75R planlar sabit 5R
    zarfını 2× hızla dolduruyor (heat_hard NO_GO 168→343), C'nin ~170 pozitif-beklentili işlemi (ort-R
    .104) hiç doğmuyor; yerine gelen az sayıda işlem negatif seçilimli (−.178). 028/032 ile aynı yasa:
    ZARF 5R sistemin bağlayıcı kaynağı — zarfa dokunmadan işlem-başı boyut büyütmek işlem SAYISINI kısar
    ve seçilimi bozar. (Zarf×boyut birlikte-büyütme AYRI hipotez olurdu ama 028 zarf-10'un kalite çöküşünü
    zaten ölçtü — önerilmez, yeni kart açılmaz.)
  kill3_serhi: >
    Sha kayıt-drifti TETİKLENDİ ama ölçüm GEÇERLİ-şerhli: paralel implementasyon ajanının commit'lenmemiş
    motor düzenlemeleri hücre İTHALİNDEN 3-6 dk sonra diske indi; çalışma-zamanı C-özdeşliği dört bağımsız
    kanıtla gösterildi (kontrol-koşumu C-sha'ları + bit-özdeşlik 10/10, import-zamanlaması, yeni-şasi
    3-arg-çökerdi argümanı, defterde 0 mb işlemi; rejim-kimliği 0 uyuşmazlık). SÜREÇ DERSİ kayıtlı
    (hafıza: paralel-oturum-dagitimi): motor düzenlenirken ölçüm ajanı worktree'de koşmalı.
