status: measured     # 2026-08-22 Rol-1 HÜKMÜ (Ö-51d) — aşağıda. (ön-kayıt 2026-08-14)

verdict: >
  HÜKÜM (Rol-1, 2026-08-22): kartın sorusu GEÇERLİ ama CANLI YASADA CEVAPLANAMAZ — B kolu
  örneklemi YAPISAL olarak boş (limit = trigger·1,04 = max_chase tavanıyla birebir; max_chase
  ÖNCE sınanır → kapının ateşleyebileceği aralık BOŞ KÜME; BULGU-B-KOLU.md, ölçüldü:
  trigger=100, atr ∈ {None,1,2,4} dördünde de ulaşılmaz). Bu bir ölçüm başarısızlığı DEĞİL,
  kendisi bir bulgudur: E1 hükmünün canlı yapılandırmayı BAĞLAMADIĞINI gösterdi.
  BULGU'nun (a)/(b) sorusu ARDIL KARTTA cevaplandı: dar-tavan bölgesi `EXE-2026-006` olarak
  AYRI ön-kayıtla koşuldu (K=8 ORADA sayıldı) ve E1 hükmü YENİDEN AÇILDI (H1 monotonluk düştü,
  H2 ölçülemedi, Ö1 kimlikli ölçümde %61-74 → K1 şerhi AÇIK).
  K-DEFTERİ KARARI: bu karta EK K YAZILMAZ — dar-tavan grid'i bu kartın grid'ini değiştirmek
  yerine ardıl kartta ön-kayıtlandı; doğru yol da buydu (eşik sonradan değişmez, bölge beyanı
  yeni karttır). A kolu bit-özdeşlik kapısı bu kartın kalıcı mirası: 2026-08-22'de yeniden
  koşuldu ve dört tavanda da BAYT ÖZDEŞ çıktı.
  AÇIK KALAN TEK ŞEY OPERATÖR KALEMİ: D5 limit-tavanı kararı (canlı yasada tavan max_chase'ten
  KÜÇÜK seçilirse kapı canlanır) — o karar B4 ile birlikte §5'te durur; bu kart onu VERMEZ.

ozdeslik_hukmu: >
  **A KOLU ÖZDEŞLİK KAPISININ TANIMI DARALTILDI — ROL-1 HÜKMÜ, operatör onaylı (2026-08-17).**
  Kill kriteri "A kolu edg032b ile bit-özdeş DEĞİLSE ölçüm DURUR" AYNEN geçerlidir; değişen
  "bit-özdeş"in HANGİ ALANLAR üzerinde ölçüldüğüdür.
  ÖLÇÜLEN (duman penceresi 2022-01-01→2022-06-30, `bar_low` A kolunda HİÇ geçilmeden):
  `islemler bayt-özdeş=True` · `seanslar bayt-özdeş=True` · sonuç bloklarının 12'sinden 11'i eşit
  (performans · doluluk · tepe_isi · betim · tasnif_tum_seans · birincil · ci95_ay_kumeli · islem ·
  mb_sayaclari · butunluk_ortak · config_sha_sandbox). TEK farklı blok `replay`, ve o blokta TEK
  farklı alan: **`n_endeks_satir` 1408 (yerel) ↔ 1403 (ref_032)**. Bloğun geri kalanı — start, end,
  strategy_version, params_by_regime, n_sembol=251, max_open, no_trade_before, cost_model — birebir.
  HÜKÜM: `n_endeks_satir` özdeşlik kümesinden ÇIKARILIR. Gerekçe üç ayaklı:
  (a) O alan bir GİRDİ ENVANTERİ SAYACIdır, şasi özelliği değil — `olcum.py:659` onu
  `dataset.load_cached()`in döndürdüğü endeksin uzunluğundan üretir ve endeks HER YENİ SEANSLA
  büyür. (b) Bu yüzden kapı, taban tarihinden (2026-08-12) sonra **YAPISAL OLARAK GEÇİLEMEZ**;
  geçilemeyen bir kapı kill kriteri değil, ölü bir kapıdır. (c) Şasinin ÜRÜNÜ sağlam olduğu
  ÖLÇÜLDÜ — işlem defteri VE seanslar bayt-özdeş; bir dolum kuralı farkı orada görünürdü.
  DOKUNULMAYAN: `research/olcumler/edg032b_tamsatir_2026-08-13/olcum.py` DEĞİŞTİRİLMEDİ ve
  `edg032_final_paket_2026-08-12` DOKUNULMADI — ikisi de tamamlanmış ölçümlerin dondurulmuş
  artefaktıdır. Daraltma yalnız BU kartın A kolu kabulünde geçerlidir; eski koşumun kapısı ne
  yaptıysa öyle kalır.
  REDDEDİLEN ALTERNATİF: "tabanı yeniden üret" ÖNERİLDİ ve GERİ ÇEKİLDİ — referans EDG-032'nin
  dondurulmuş kanıtıdır, yeniden üretmek taban yenilemek değil TARİHİ TAHRİF ETMEK olurdu.
  KAPSAM: bu hüküm YALNIZ `n_endeks_satir`ı kapsar. Başka bir alan ayrışırsa kill kriteri AYNEN
  ateşler ve ölçüm DURUR — daraltma bir emsal değil, adıyla sınırlı tek bir istisnadır.

beyanlı_sinirlar: >
  (1) GÜNLÜK BAR SINIRI: `low <= limit` "gün içinde dokunuldu" der ama SIRAYI söylemez. Aynı gün
  hem stop hem limit dokunmuşsa hangisinin önce olduğu ÖLÇÜLEMEZ. Kart bunu kötümser tarafa
  yazar (kill kriteri) — yani bu ölçüm bile hâlâ bir ALT SINIRDIR.
  (2) Bu kart 23d'yi (bar-içi stop `eff_stop`ta dolmuş sayılıyor, stop slipajı SIFIR) ÇÖZMEZ.
  İkisi birlikte "giriş LİMİT tavanlı ↔ çıkış stop→MARKET tavansız" asimetrisini kuruyor;
  23c kapanınca asimetrinin YARISI kapanır ve bu, kalan yarıyı DAHA görünür kılar.
  (3) 23e (gün-içi pencere seçimi) bugünkü replayde MODELLENEMEZ (`timeframe=1Day` tek yol) —
  bu kartın kapsamı DIŞINDADIR ve karıştırılmamalıdır.
