card_id: EDG-2026-030
family: rejim_esigi
thesis: >
  Seansların %40.8'i rejim kapısıyla TÜMDEN kapalı (EDG-022: rejim_kapali — exposure_budget=0); eşik
  regime.min_exposure_score=40 HİÇ ölçülmedi. Debi kaldıraçları (rampa/slot) açıldıktan sonra kalan en
  büyük karartma bu. TEZ: eşiği düşürmenin (40→30, 40→20) işlem debisi + P&L + dd etkisi C-dünyasında
  ölçülür. Kötü-rejim işlemi eklemek P&L'i CI ile bozuyorsa eşik yerinde doğrulanır (o da hüküm).

evidence_refs:
  - "EDG-022: rejim_kapali %40.8 (468/1147 seans)"
  - "goal: regime.min_exposure_score 40 (ölçülmemiş seçim)"

universe: "023/026 evreni; C-şasi (026 olcum.py düzeni); eşik param-enjeksiyonu (goal params — motor yamasız)"

features_asof: "İKİ hücre: esik_30, esik_20 — C-tabana (026 hazır) kıyas; eşlenik ay-kümeli bootstrap CI; metrikler: işlem n, net P&L, max-dd, sharpe, rejim-kırılımlı eklenen-işlem R'si (eklenenlerin çoğu düşük-skor rejimlerden gelecek — ayrı raporlanır)"

parameter_grid:
  esik: [30, 20]   # K += 2

cost_model: pessimistic_band_v2

success_metric: "Hücre-vs-C: işlem artışı CI + EKLENEN işlemlerin ort-R CI'sı. Eklenen-R CI-0-üstü VE dd C×1.5 altında → 'gevşetme adayı' pencereye; eklenen-R CI-negatif → eşik 40 kanıtla doğrulandı (kapanış)."

kill_criteria:
  - "eklenen işlem <30/hücre → olculemedi"
  - "şasi bütünlüğü bozuksa geçersiz"

k_registry: {registered_at: "2026-08-12T2x", trial_ids: [pending-030-esik30, pending-030-esik20]}

status: measured   # 2026-08-12 Rol-1 — hüküm: GEVŞETME ÖNERİLMEZ, eşik-40 kanıtla yerinde.

verdict:   # Rol-1 hükmü.
  e30: "kill#1 TETİKLENDİ / İNERT — [30,40) bandı pencerede hiç oluşmadı (skor örgüsü); C ile bit-özdeş."
  e20: >
    Eklenen 299 işlem ort-R −0.004 CI [−0.191,+0.204] (değer kanıtı YOK); tam-defter nokta −16.1k$, dd ×1.31,
    sharpe 0.285→−0.18. Ayrıştırma (sente kapanan): asıl zarar yan-kanallar — regime_flip bastırılması
    (141→63; çıkışlar time_stop/stop'a kaydı, −6.1k$) + trend_up kazananlarının ısı/slot-çalınmasıyla hiç
    doğmaması (66 işlem, 50'si trend_up ort-R 0.736; −13.4k$). Chop-işlemleri eklemek portföyün İYİ işlemlerini
    yerinden ediyor.
  hukum: "%41 karartma KANITLA HAKLI: 30 anlamsız (boş bant), 20 zararlı-eğilimli. Eşik 40 kalır; kart arşiv. Pencereden kalem düştü (karar gerekmez)."
  artefakt: "research/olcumler/edg030_rejim_esigi_2026-08-12/ (eşik-yüzeyi kanıtlı — monkeypatch'siz; öz-sınamalar 0 ihlal)"

