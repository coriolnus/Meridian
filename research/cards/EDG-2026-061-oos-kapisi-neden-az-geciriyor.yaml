hukum_A: >
  ÇÜRÜDÜ. 32 düğmenin 29'u gerçek ölçüm aldı — eşik 16'ydı, sonuç neredeyse iki katı.
  "Arama uzayı yapısal olarak kapalı" tezi ölçümle DÜŞTÜ. Hiç önerilmemiş yalnız iki düğme
  var (`stop_buffer_atr`, `stop_mode`) ve bir düğme önerilip hiç ölçülmemiş
  (`entry.w_turnover`). Darboğaz "uzaya girilemiyor" DEĞİL.

hukum_B: >
  ÖLÇÜLEMEDİ — ve ölçülememesinin SEBEBİ kendi başına bulgudur. Kart ölçülebilirlik kapısını
  ≥3 çift-yön düğme olarak DONDURMUŞTU; R1 penceresinde bu sayı SIFIR, R1 öncesinde BİR.
  Yani arama aynı düğmenin iki yönünü neredeyse hiç denemiyor. "İncumbent yerel optimumda mı?"
  sorusu bu defterle CEVAPLANAMAZ ve kart gereği "çoğunluk sağlanmadı" DENMEZ.
  PENCERE AYRIMI ZORUNLU TUTULDU: defterin kendi uyarısı (`pencere_kiyas_uyarisi`) R0/R1
  kıyasını YASAKLIYOR ("aynı ada sahip iki farklı sınavdır"). Tüm satırları birlikte toplamak
  sistemin kendi yasağını çiğneyip sahte bir sayı üretecekti.

hukum_C: >
  DOĞRULANDI. `stop_loss_atr_mult` 60 önerinin 21'ini almış (%35), eşik %25'ti. İkinci sıra
  `entry.rs_rating_min` yalnız 5 (%8,3). Öneri katmanı KEŞFETMİYOR, TEKRARLIYOR.

asil_bulgu_kartin_sormadigi: >
  KEŞİFSEL (karar kuralına GİRMEDİ, eşik değiştirilmedi) ama sorunun asıl cevabı burada:
  R1 penceresindeki 15 gerçek ölçümün 6'sı (%40) TAM SIFIR ΔS ve p=0,000 verdi — düğme
  oynadı, skor KIPIRDAMADI. Altısı: entry.w_tight · exit.early_kill_bars ·
  exit.early_kill_pivot · exit.scale_out_r · regime.vix_backwardation_gate · portfolio.heat_cap.
  ATILLIK CANLI PARAMETRELERLE DOĞRULANDI: `exit.scale_out_frac = 0.0` olduğu için
  `scale_out_r` hiçbir şey satmıyor (broker.py); diğer beşinin `old` değeri None, yani öneri
  kodun KENDİ VARSAYILANINI "değiştiriyor" (`entry.w_tight None→0,3` = varsayılanın aynısı).
  `regime.vix_backwardation_gate` için guard.py zaten "doğrulanmış VERİ-YOK (Massive 403 +
  FMP boş)" diyor.
  DEPO BU SINIFI ZATEN TEŞHİS ETMİŞ: probgate.py'deki "p = 0,000 İKİ AYRI GERÇEĞİ AYNI SAYIYLA
  SÖYLÜYORDU" bloğu üç düğmeyi ADIYLA anıyor ve şu cümleyi kuruyor: "'Düğme atıl' bir RET
  değil, kendi başına bir HÜKÜMdür." Ama yalnız ÖLÇÜMÜ eklenmiş (`search_ayrim` alanı),
  KAYNAĞI kapatılmamış. Bugünkü bedeli üç kalem:
    (1) her atıl öneri TAM bir 2000-replikasyonlu bootstrap yakıyor;
    (2) defterde `rejected_by_backtest` olarak duruyor — operatörün gördüğü "32 backtest
        reddi" sayısını kirletiyor, gerçek red ile atıl düğme AYNI görünüyor;
    (3) guard o (değişken, değer) çiftini KALICI kara listeye çakıyor — usta-anahtar bir gün
        açılırsa o arama noktası haksız yere kapalı kalır.

cevap: >
