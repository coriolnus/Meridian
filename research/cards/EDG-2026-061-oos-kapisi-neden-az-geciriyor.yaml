  YARIŞA HİÇ GİRMİYOR. Kapı sağlam (30/30 aday gerçekten ölçüldü), arama uzayı açık (29/32
  düğme denendi) — ama ölçüm bütçesinin %40'ı skoru oynatması İMKÂNSIZ düğmelere, %35'i tek
  bir düğmeye gidiyor, ve aynı düğmenin iki yönü neredeyse hiç denenmiyor. Yani sorun
  "eşik çok sert" ya da "uzay kapalı" değil: ARAMA BÜTÇESİNİN NEREYE HARCANDIĞI.

