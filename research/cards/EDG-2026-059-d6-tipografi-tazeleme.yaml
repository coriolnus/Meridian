card_id: EDG-2026-059
family: arayuz_olcumu
thesis: >
  D6 tip-rampası ölçümü (2026-08-07) `DESIGN.md`de yürürlükte duruyor ama ölçtüğü İKİ GİRDİ de
  değişti: (a) sevk edilen YÜZ Recursive Sans → **Inter** (2026-08-24 Dub dönüşümü), (b) korpus
  151 blok / 56.249 karakter → **209 / 101.876** (+%81). Harness'ın `OLCUT` satırı hâlâ
  Recursive yüklüyor, yani bugün koşulsa SEVK EDİLMEYEN bir bileşimi ölçerdi.
  BU KART O SAYILARI YENİDEN ÖLÇER. Yeni bir tasarım iddiası TEST ETMEZ; yürürlükteki
  belgenin yürürlükteki sayılarla eşleşmesini sağlar.

evidence_refs:
  - "research/olcumler/tipografi_rampa_2026-08-07/ON_KAYIT.md — özgün ön-kayıt, dört spesifikasyon"
  - "research/olcumler/tipografi_rampa_2026-08-07/TAZELEME-2026-08-14.md §dördüncü tazeleme — neden tazeleme DEĞİL kart"
  - "docs/KARAR-2026-08-24-B-DUB-DONUSUMU.md §3 — yüz değişimi (Inter/Satoshi/Geist Mono)"
  - "olcum_sonucu.json — özgün koşum (korpus 151 blok / 56.249 karakter, yüz system-ui + Recursive)"

universe: >
  `docs/RUNBOOK.md`ten `korpus_uret.py` ile türetilen ÜÇ artefakt. GİRDİ ÇALIŞMA AĞACINDAKİ
  DOSYA DEĞİL, `girdi_sabitleme.blob`dur (209 blok, 101.876 karakter, sha256 9f5c91203284d794) —
  gerekçe orada. Tarayıcı: Browser pane, ölçüm makinesinin dpr'ı ve ekran boyutu
  SONUÇLA BİRLİKTE kaydedilir (özgün koşumda da öyleydi:
  "2026-08-07, Chrome, dpr 2, ekran 1710x1112"). Canlıya DOKUNULMAZ; salt okuma.

features_asof: >
  Dört spesifikasyon AYNEN korunur (MEVCUT 15/1.65/78ch · SADECE_BOYUT 14/1.65/78ch ·
  ADAY 14/1.80/72ch · OLCUT 14/1.80/72ch) — DEĞİŞEN TEK ŞEY `OLCUT`un YÜZÜDÜR:
  ~~RecursiveSans~~ → **Inter** (`index.html`in `.md` sınıfıyla BİREBİR, özgün ön-kaydın
  kuralı buydu: "ürünün kendi uzun-metin spesifikasyonu"). Bu bir eşik değişikliği DEĞİL,
  aynı kuralın bugünkü karşılığıdır ve ölçümden ÖNCE burada beyan edilmiştir.
  Ölçülenler: cpl_medyan · cpl_ortalama · x_yuksekligi_px · cap_px · toplam_satir ·
  korpus_yuksekligi_px (özgün koşumun alan kümesiyle birebir).

parameter_grid:
  spesifikasyon: [MEVCUT, SADECE_BOYUT, ADAY, OLCUT]   # K = 4, özgün ön-kayıtla aynı

cost_model: yok_tarayici_olcumu

success_metric: >
  KARAR KURALI (DONUK, ölçümden önce yazıldı) — bu kart bir EDGE aramaz, BAYATLIK ölçer:
    * `DESIGN.md`de duran D6 sayıları ile yeniden ölçülen sayılar arasındaki fark
      **cpl_medyan'da ≤ 3 CPL ve x_yuksekligi'nde ≤ 0,3 px** ise: sayılar YÜRÜRLÜKTEDİR,
      belgeye yalnız yeni damga (tarih + korpus künyesi) düşülür.
    * Fark bu bandın DIŞINDA ise: `DESIGN.md`in D6 satırları yeni sayılarla DEĞİŞTİRİLİR ve
      eski sayılar üstü çizili + tarihli olarak KALIR (SİLME YOK).
  Eşiğin gerekçesi: 3 CPL, özgün koşumun spesifikasyonlar ARASI en küçük farkının (92,0 → 78,0
  = 14 CPL) beşte birinden küçüktür; yani "ölçüm gürültüsü" ile "gerçek kayma" ayrılabilir.
  0,3 px x-yüksekliği, özgün K3 ölçütünün toleransının (0,5 px) altındadır.
  HÜKÜM SIRALAMASI DEĞİŞMEZ İDDİASI YOKTUR: sıralama da ölçülür ve değişirse yazılır.

kill_criteria:
  - "koşum girdiyi ÇALIŞMA AĞACINDAN okursa geçersiz — girdi `girdi_sabitleme.blob`dur
     (çalışma ağacındaki dosya `test_korpus_ureticisi_artefaktlari_birebir_uretiyor` çivisi
     yüzünden RUNBOOK her değiştiğinde yeniden üretilir; blob değişmez)"
  - "koşum sırasında sabitlenen blob değiştirilirse ya da korpus yeniden üretilip girdi olarak
     kullanılırsa geçersiz (hareketli hedef yasağı — özgün kriterin KORUNAN çekirdeği)"
  - "sonuçlar görüldükten SONRA blob yeniden sabitlenirse geçersiz (koşum ÖNCESİ yeniden
     sabitleme meşrudur ve `girdi_sabitleme.gecmis`e yazılır; sonrası ölçümü seçmektir)"
  - "dört spesifikasyondan biri ölçüm sırasında değiştirilirse geçersiz"
  - "eşikler (3 CPL / 0,3 px) ölçümden sonra oynatılırsa geçersiz"
  - "`OLCUT` yüzü Inter DIŞINDA bir şeye çevrilirse geçersiz — kart tam da 'sevk edilen yüz' iddiasını ölçüyor"
  - "canlı state'e YAZILIRSA geçersiz"

girdi_sabitleme:
  # 2026-08-29 · OPERATÖR ONAYLI DÜZELTME. DEĞİŞEN: girdinin ADRESLENMESİ.
  # DEĞİŞMEYEN: girdinin KENDİSİ — içerik sha256 aynen `9f5c91203284d794`, yani kartın
  # 2026-08-24'te KAYDETTİĞİ korpusun ta kendisi. Ölçüm sonradan SEÇİLMEDİ (§3).
  #
  # NEDEN GEREKTİ — YAPISAL ÇELİŞKİ, tek seferlik kaza değil:
  #   Eski kriter girdinin çalışma ağacında `9f5c91203284d794` olarak DONMUŞ kalmasını şart
  #   koşuyordu. Ama `tests/test_tipografi_rampa_v209.py::test_korpus_ureticisi_artefaktlari_
  #   birebir_uretiyor` çivisi, `docs/RUNBOOK.md` her değiştiğinde o dosyanın YENİDEN
  #   ÜRETİLMESİNİ zorunlu kılar. İki şart aynı anda sağlanamaz; kart koşulmadan önce girdi
  #   ÜÇ KEZ kaybolmuştu (ölçüldü — 17e8aa3 08-25 · 0f646b1 08-26 · d976b84 08-26; ayrıntı
  #   research/olcumler/tipografi_rampa_2026-08-07/TAZELEME-2026-08-14.md §beşinci tazeleme).
  #   Kartın `beyanli_sinirlar` (3) maddesi bunun tersini öngörmüştü ("çapa sınıfı kapandı,
  #   tekrar BEKLENMİYOR") — öngörü TUTMADI: RUNBOOK artık satır kaymasıyla değil gerçek
  #   sözleşme değişiklikleriyle değişiyor ve çivi her seferinde yeniden üretimi zorluyor.
  #
  # ÇÖZÜM: git blob'u İÇERİK-ADRESLİDİR ve çalışma ağacından bağımsızdır. Çivi dosyayı
  # istediği kadar yeniden üretsin, blob değişmez ve `git cat-file` ile aynen alınır.
  # Doğrulandı: blob'un sha256'sı kartın beyan ettiği değerin AYNISI.
  blob: e57e575bb219d37be2c069023d27b5734dacee80
  icerik_sha256_ilk16: 9f5c91203284d794
  yol: research/olcumler/tipografi_rampa_2026-08-07/ornek_metin.json
  okuma: "git cat-file blob e57e575bb219d37be2c069023d27b5734dacee80"
  dogrulama: "git cat-file blob <blob> | sha256sum  →  ilk 16 hane icerik_sha256_ilk16 ile aynı olmalı"
  # Blob COMMIT'TEN bağımsızdır: `88c69a1` bugün onu taşıyor ama blob geçmiş yeniden
  # yazılsa da aynı kalır — sabitleme commit'e değil İÇERİĞE yapılmıştır.
  gecmis:
    - {tarih: "2026-08-24", blob: e57e575bb219d37be2c069023d27b5734dacee80, neden: "ilk kayıt (o gün çalışma-ağacı yoluyla ifade edilmişti)"}
    - {tarih: "2026-08-29", blob: e57e575bb219d37be2c069023d27b5734dacee80, neden: "adresleme çalışma ağacından git blob'una taşındı; İÇERİK DEĞİŞMEDİ"}
  # KOŞUM ÖNCESİ yeniden sabitleme MEŞRUDUR (kart hâlâ `registered`, hiç koşulmadı) ve buraya
  # yazılır. Daha yeni bir korpusla ölçmek istenirse: blob'u değiştir, `gecmis`e satır ekle,
  # SONRA koş. Sonuçları gördükten sonra değiştirmek kill kriteridir.

