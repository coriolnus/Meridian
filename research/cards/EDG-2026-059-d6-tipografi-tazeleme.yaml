beyanli_sinirlar: >
  (1) Bu kart bir TASARIM KARARI vermez. Özgün D6'nın hükmü (28/20/14 merdiveni, 14px gövde)
  operatör onaylı ve YÜRÜRLÜKTE; kart yalnız o hükmün altındaki SAYILARIN bugünkü girdiyle
  eşleşip eşleşmediğini ölçer.
  (2) İKİ DEĞİŞKEN BİRDEN OYNADI (yüz + korpus) ve bu kart onları AYIRMAZ — ayırmak iki ayrı
  koşum ister ve bu kartın sorusu "hangisi ne kadar etkiledi" değil, "yürürlükteki sayı doğru mu".
  Ayrıştırma gerekirse ayrı kart açılır.
  (3) [2026-08-24'te YAZILDI] Çapa sınıfı kapandı (`dosya::sembol`), yani bu kart koşulduktan
  sonra korpusun ilgisiz satır kaymalarıyla yeniden bayatlaması BEKLENMİYOR — kartın kendisi bir
  tekrar sınıfının SON halkasıdır.
  (3-DÜZELTME, 2026-08-29 — ÖNGÖRÜ TUTMADI, satır SİLİNMEDİ): korpus kart kaydedildikten sonra
  ÜÇ KEZ daha değişti (17e8aa3 · 0f646b1 · d976b84) ve bu turda dördüncü kez değişti. Sebep
  öngörünün gözden kaçırdığı ikinci yoldur: çapa sınıfı gerçekten kapandı, ama `docs/RUNBOOK.md`
  GERÇEK sözleşme değişiklikleriyle de değişiyor (yeni mekanizma, değişen alarm mesajı, günlük
  maddesi) — üretilmiş belge canlı bir belgedir. Yani bayatlama "ilgisiz satır kayması"ndan
  değil, MEŞRU içerik değişiminden geliyor ve bu SÜRECEK. `girdi_sabitleme` bloğu tam olarak
  bu yüzden var: kart artık çalışma ağacının kararlılığına DAYANMIYOR.
