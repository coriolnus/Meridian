beyanli_sinirlar: >
  (1) Bu kart bir TASARIM KARARI vermez. Özgün D6'nın hükmü (28/20/14 merdiveni, 14px gövde)
  operatör onaylı ve YÜRÜRLÜKTE; kart yalnız o hükmün altındaki SAYILARIN bugünkü girdiyle
  eşleşip eşleşmediğini ölçer.
  (2) İKİ DEĞİŞKEN BİRDEN OYNADI (yüz + korpus) ve bu kart onları AYIRMAZ — ayırmak iki ayrı
  koşum ister ve bu kartın sorusu "hangisi ne kadar etkiledi" değil, "yürürlükteki sayı doğru mu".
  Ayrıştırma gerekirse ayrı kart açılır.
  (3) Çapa sınıfı 2026-08-24'te kapandı (`dosya::sembol`), yani bu kart koşulduktan sonra
  korpusun ilgisiz satır kaymalarıyla yeniden bayatlaması BEKLENMİYOR — kartın kendisi bir
  tekrar sınıfının SON halkasıdır.
