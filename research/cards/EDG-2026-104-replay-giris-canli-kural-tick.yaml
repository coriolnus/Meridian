  konsolide akıştan geç/seyrek olabilir — DOGMAZ oranını YUKARI yanlayabilir; PK-3 bu yanlılığın kaba ölçüsüdür. (3) Canlı yolun diğer
  kapıları (gap_veto, HALT, sermaye, sektör tavanı, `open_below_stop`un canlı karşılığı) öykünmez — yalnız zamanlama + tetik + limit
  tavanı. (4) DOGMAZ işlemlerin P&L etkisi ve 'canlı kuralla yeniden replay' bu kartın işi DEĞİL (tanı (g) yalnız betimler; P&L ayrı
  kart). (5) Replay'in kendi redleri (max_chase, missed_limit, open_below_stop) zaten `trades`'e girmez — bu kart yalnız replay'in
  DOLDURDUĞU girişleri sınar; canlı kuralın doğurup replay'in reddettiği işlemler (ters yön) ölçülmez. (6) Tek strateji sürümü (91).

