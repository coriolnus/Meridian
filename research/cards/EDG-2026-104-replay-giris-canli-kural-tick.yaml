olcum_plani:
  - "girdi dondurma: replay_seed trades + eşleşen trade_plans satırları ölçüm başında JSON'a dökülür, sha256'ları sonuca yazılır
     (içerik-adresli; §5). Sabitler (9:45 ET, limit_pct_cap, slip) betik başlığında SEMBOL çapasıyla beyanlı; betik `meridian` İÇE
     AKTARMAZ — sabitlerin motorla eşitliğini ölçüm betiğinin kendi çivisi doğrular (EDG-102 deseni)."
  - "gün akışı: giriş gününün (ts_open) `islem/<gün>.parquet`inden ticker kayıtları, NORMAL SEANS (09:30 ≤ ET < 16:00, DST-farkında),
     ts'e göre kararlı sıralı."
  - "canlı kural öykünücüsü (tek tanım, iki dal): t0 = ts ≥ 09:45 ET olan ilk kayıt, p0 = fiyatı. (a) p0 ≥ tetik → GAP dalı
     (marketable-limit): dolum = t0'dan SONRAKİ ilk kayıt içinde fiyatı ≤ L olan ilk kayıt. (b) p0 < tetik → STOP-LIMIT dalı: aktivasyon =
     t0'dan itibaren fiyatı ≥ tetik olan ilk kayıt (EDG-069 'tetik kırılımı' tanımı); dolum = aktivasyondan SONRAKİ ilk kayıt içinde
     fiyatı ≤ L olan ilk kayıt. 16:00 ET'ye dek dolum yoksa satır DOGMAZ. t0 yoksa (09:45 sonrası hiç kayıt) satır `akis_yok`
     sınıfına gider (paydaya GİRMEZ, sayılır). L = tetik × (1 + limit_pct_cap)."
  - "H1 birincil: dogmaz_orani = DOGMAZ / (DOGMAZ + DOLAN), yüzde; %95 CI seans-kümeli bootstrap B=5000, seed=20260812."
  - "H2 birincil: DOLAN satırlarda fark_bps = (canli_dolum − trades.entry) / trades.entry × 1e4 (aleyhte pozitif — canlı daha pahalı);
     medyan + %95 CI, aynı bootstrap künyesi."
  - "TANI (hüküm değil): (a) dal kırılımı — açılış<tetik (392) ve açılış≥tetik (434) ayrı dogmaz oranı ve fark medyanı; (b) 9:30
     kuralı: aynı öykünücü t0 = 09:30 ile — 9:45 penceresinin kendi payını tetik semantiğinden ayırır (EXE-2026-009'un bedeli);
     (c) aktivasyon/dolum gecikmesi (t0'dan dakika) dağılımı; (d) yıl ve fiyat kovası; (e) `kosul` bit 0x20'li kayıtlar dışlanınca iki
     birincil; (f) dolum anı kotasyon spread'i (k_satis_fiyat − k_alis_fiyat); (g) DOGMAZ satırların replay sonucu (exit_reason, r_multiple)
     dağılımı — yalnız BETİMLEYİCİ, P&L etkisi ayrı kartın işidir."

