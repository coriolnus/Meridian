card_id: EDG-2026-011
family: inplay_candidate_priority   # WP-K/G5 — aday SIRALAMA overlay'i (kurulum değil)
thesis: >
  Aynı gün üretilen adaylar arasında "in-play" olanlar (kazanç-katalizörü yakınlığı + yüksek rvol)
  diğer adaylardan daha iyi ileri getiri/isabet taşır → slot kısıtlıyken aday SIRALAMASINA
  öncelik-katmanı olur. Ölçüt WP-M #3 standardına uygun: taban = AYNI-GÜN ADAY HAVUZU (piyasa
  sürüklenmesi ayıklanır); rvol zaten skorda olduğundan ARTIMLILIK şartı var.
evidence_refs: [ROADMAP WP-K/G5 (katalizör+RVOL), earnings kapsaması 194/251 (WP-D — kapsam beyanı
  zorunlu), katalog "in-play" pratiği (birinci-el yok — caveat; hüküm kendi verimizde)]
