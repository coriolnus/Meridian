features_asof: >
  in_play(t) = |t - en_yakın_earnings_tarihi| <= P gün (yalnız t'de BİLİNEN takvim; earnings
  kapsamı dışındaki 57 sembol için None — dilime girmez, beyan edilir) VE rvol20(t) >= 1.5.
  Karşılaştırma katmanları: yalnız-katalizör, yalnız-rvol, ikisi (artımlılık ayrışsın).
horizon: "cf-katmanlı retrospektif: aday-gün dilimlerinin 5/10/20g ileri getirisi, taban = aynı-gün aday-havuzu ortalaması; 21g blok-bootstrap CI"
