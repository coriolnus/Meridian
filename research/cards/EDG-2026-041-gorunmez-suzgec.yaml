family: ogrenme_on_elemesi
thesis: >
  ROADMAP WP3-A/28a (denetim D2: EN ÜST öncelik): `hermes_bg_proposal_rejected` — arka plan
  turunda üretilen **47 öneri deftere HİÇ girmedi**; aynı pencerede giren 1. Yani "52 hipotez
  ürettik" cümlesi ÜRETİMİN değil ÖN-ELEMENİN hayatta kalanlarını sayıyor.
  AMA ROADMAP'in kendi uyarısı bağlayıcı: "28a'nın kodu KENDİ KARŞI-GEREKÇESİNİ taşıyor —
  'tek satır aç' diye sunulamaz, KART-ÖNCE." Karşı-gerekçe okundu ve GEÇERLİ bulundu
  (`hermes.py`, `hermes_bg_proposal_rejected` bloğunun üstü, C16-(b) bacağı / denetim #27):
  arka plan turunda `@`siz bir öneri, CANLI OLMAYAN bir rejimin kanıtıyla CANLI davranışı
  değiştirme ruhsatına dönüşür; sertifika korkuluğu tam da bunu engellemek için var.
  TEZ: sorun kapının VARLIĞI değil, kapının **ayrımsız ve kayıtsız** olması. Bu kart iki şeyi
  ayırır — (i) korkuluğun korunması ZORUNLU, (ii) reddedilen önerinin GÖRÜNMEZ olması bir
  ölçüm-bütünlüğü kusurudur ve korkuluktan BAĞIMSIZ olarak düzeltilebilir.

