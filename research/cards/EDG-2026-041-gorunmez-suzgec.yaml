universe: >
  CANLI öğrenme döngüsü (replay DEĞİL). Ölçüm birimi: arka plan turunda üretilip
  `hermes_bg_proposal_rejected` ile düşen öneriler + aynı pencerede deftere giren öneriler.
  Pencere: 2026-08-02T14:00 → kartın koşum anı. Kaynak: canlı `state/events.jsonl` +
  öneri defteri (salt-okuma; motor DEĞİŞTİRİLMEDEN önce ölçülür).

features_asof: >
  ÖLÇÜLECEK — üçü de reddedilen önerilerin KENDİ kayıtlarından:
  (a) 47 reddin kaçında `certified` (bg_regime) BİLİNİYORDU, kaçında `None`du. Kod
      `certified = None if target_regime == "auto" else target_regime` diyor; `auto` hâlinde
      koşul `background and preg is None`e iner, yani **hangi rejimin sertifikalı olduğu
      bilinmeden** her global öneri düşer. Bu iki hâl AYRI sayılır — biri "korkuluk çalıştı",
      diğeri "korkuluk ölçemediği için kesti".
  (b) Reddedilen önerilerin değişken dağılımı: kaçı ZATEN rejim-hedefliydi (`x@rejim`) ve
      farklı rejime gitmeye çalışıyordu (korkuluğun ASIL hedefi), kaçı düz global (`x`).
  (c) Reddedilenlerin kaçı, `x@<certified>` biçimine YENİDEN YAZILABİLİR olurdu — yani
      kanıtı kendi rejiminin içinde tutarak hayatta kalabilir miydi.

parameter_grid:
  yok: "betimsel ölçüm + mekanizma kararı — K += 0 (edge hipotezi sınamıyor; öğrenme borusunun kendi ölçümü, EDG-036 emsali)"

cost_model: yok   # canlı defter ölçümü; friksiyon varsayımı KONU DIŞI

success_metric: >
  Bu kart bir HİPOTEZ SINAMAZ, bir MEKANİZMA KARARI verir. Üç dal, ölçümden ÖNCE donuk:
  D1 — KAYIT (koşulsuz, korkuluktan BAĞIMSIZ): reddedilen öneri deftere REDDEDİLDİ olarak
       girmelidir. Bugün hiç girmiyor ve bu, "üretim" ile "hayatta kalan"ı aynı sayıya
       katlıyor (28b'nin '52 aslında 23' bulgusunun kökü). Bu dal ölçüm sonucundan BAĞIMSIZ
       olarak uygulanır — çünkü kusur kapının hükmünde değil, GÖRÜNÜRLÜĞÜNDE.
  D2 — YENİDEN YÖNLENDİRME (koşullu): eğer (c) ölçümü, reddedilenlerin ≥%50'sinin
       `x@<certified>` biçimine yeniden yazılabilir olduğunu VE `certified`in bilindiğini
       gösterirse → öneri ATILMAK yerine kendi rejimine ÇİVİLENİR. Korkuluk AYNEN korunur
       (kanıt rejimini terk etmez), yalnız iş çöpe gitmez.
  D3 — DOKUNMA (koşullu): eğer reddedilenlerin çoğunda `certified is None` ise, korkuluk
       ölçemediği için kesiyordur ve doğru düzeltme BU KARTTA DEĞİLDİR (arka plan turunun
       sertifikasını taşıması ayrı bir iştir → ROADMAP kalemi açılır). Kapı DEĞİŞMEZ.
  HER ÜÇ DALDA DA: sertifika korkuluğunun davranışı — "canlı-dışı rejimin kanıtı canlı
  davranışı değiştiremez" — BOZULAMAZ. Bu bir kill kriteridir, başarı ölçütü değil.

