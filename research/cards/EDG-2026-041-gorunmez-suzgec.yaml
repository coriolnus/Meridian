  - "reddedilen önerilerin kayıtları okunamazsa (olay defteri eksik/bozuk) sayılar 'olculemedi' damgalanır; 47 rakamı TEŞHİS BELGESİNDEN alınır ve yeniden ÖLÇÜLMEDEN hüküm verilmez"
  - "D1 kaydı öneri defterine GERÇEK öneri gibi girerse geçersiz — reddedilen öneri 'aday' değildir; ayrı damga şart, yoksa 28b'nin ters yönü doğar (sayı bu kez ŞİŞER)"
  - "ölçüm motoru değiştirdikten SONRA koşulursa geçersiz — önce ölç, sonra değiştir"

