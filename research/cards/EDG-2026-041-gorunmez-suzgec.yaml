verdict:   # Rol-1 hükmü.
  olcum: >
    47 red, ilk 2026-08-02T14:00:41Z, son 2026-08-13T17:26:34Z (teşhis belgesinin sayısı canlı
    defterde BİREBİR doğrulandı).
    (a) `bg_regime` 47/47'de **BİLİNİYOR** ve hepsinde aynı: `chop`. `None(auto)` **SIFIR**.
    (b) 46/47 düz global (`@`siz) · 1/47 rejim-hedefli (`exit.time_stop_days@trend_up`).
    (c) Değişken dağılımı: `entry.w_turnover` 21 · `exit.trail_atr_mult` 16 ·
        `regime.vix_backwardation_gate` 8 · `exit.breakeven_r` 1 · `exit.time_stop_days@trend_up` 1.
  hukum: >
    **D3 ELENDİ, D1 + D2 TETİKLENDİ.** D3'ün şartı ("çoğunda `certified is None`") ölçümle
    ÇÜRÜDÜ: sertifika 47/47'de biliniyordu — yani korkuluk körlükten değil, AYRIMSIZLIKTAN
    kesiyordu. D2'nin eşiği (≥%50 yeniden yazılabilir) **%97,9 ile aşıldı** (46/47).
    D1 KOŞULSUZ: reddedilen öneri deftere REDDEDİLDİ damgasıyla girer. Bugünkü görünmezlik,
    "üretim" ile "hayatta kalan"ı aynı sayıya katlıyor — 28b'nin "52 aslında 23" bulgusunun kökü.
    D2 UYGULANIR: `@`siz öneri ATILMAK yerine `x@<certified>` biçimine ÇİVİLENİR.
    KORKULUK BOZULMUYOR — GÜÇLENİYOR: korkuluğun invaryantı "kanıt kendi rejimini terk etmesin"
    idi. Ret bu invaryantı sağlar ama işi çöpe atar; yeniden yazım AYNI invaryantı sağlar ve işi
    korur. `chop` sertifikalı kanıt yalnız `chop` parametrelerini değiştirir; canlı-DIŞI rejimin
    kanıtı canlı davranışa SIZMAZ (denetim #27 deliği kapalı kalır).
    TEK İSTİSNA AYNEN REDDEDİLİR: rejim-hedefli ama FARKLI rejime giden öneri
    (`exit.time_stop_days@trend_up`, sertifika `chop`) — korkuluğun ASIL hedefi budur, 1/47.
  yan_bulgu: >
    28a ile 28c BİRBİRİNİ BESLİYOR: reddedilen 47'nin 37'si iki değişkende toplanıyor
    (`entry.w_turnover` 21 + `exit.trail_atr_mult` 16). Aynı tekrar deseni 28c'nin kökü
    (`already_failed` hafızası yalnız explore dalında). Yani döngü aynı düğmeyi tekrar tekrar
    öneriyor VE o öneriler sessizce düşüyor — ikisi birlikte çözülmezse biri diğerinin etkisini
    maskeler. İkisi de bu turda (v245) ele alınıyor.
  uygulama_hukmu: >
    UYGULANDI 2026-08-14 (v247-A). **D1'İN YERİ KARTIN LAFZINDAN AYRILDI — ROL-1 ONAYI, gerekçeli.**
    Kart "reddedilen öneri DEFTERE girer" diyor ve `hypotheses.jsonl` akla geliyor. Ölçüm bunun
    kartın KENDİ kill kriterini ("aday sayan tüketicide aday gibi sayılmamalı") **dört ayrı yerde
    ihlal edeceğini** gösterdi:
    (i) `analytics.dead_families` durum süzgeci TAŞIMIYOR ve `DEAD_FAMILY_MIN_N=3` — ölçülen
    dağılımda `entry.w_turnover` 21 satır demek, aile anında "ölü" sayılır ve düğme
    `virgin_knobs()` bakir listesinden DÜŞER. Yani reddedilen öneriler **öneri uzayını daraltırdı**.
    (ii) `watchdog._learning_liveness` yaşı `ts`ten ölçüyor → taze ret satırı "öğrenme durdu"
    alarmını **sıfırlar**; kusuru gösterecek tek alarm kendi kaydıyla maskelenir.
    (iii) `selfreview`in 25/15'lik pencereleri düğmeyi "denendi" sayar ve gerçek hipotezi dışarı iter.
    (iv) `api.hypotheses_total` → `landing.js` **kamuya açık ship-oranının paydası**.
    SEÇİLEN YER `events.jsonl`: `ledgers.CONTRACTS`ta sözleşmeli, **aday sayan tüketicisi yok**.
    Kayıt `damga="REDDEDILDI"` + `red_nedeni` + `old/new/source/rationale` taşıyor (eskiden yalnız
    `variable`+`bg_regime` vardı — NE önerildiği okunamıyordu).
    **KARTIN RUHU LAFZINA ÜSTÜN TUTULDU:** amaç "üretim ile hayatta kalanı ayırmak"tı; `hypotheses`
    seçeneği o amacı sağlamak yerine ölçülebilir biçimde ZARAR verirdi.
    ASIL GÖVDEYİ D2 TAŞIYOR: 47'nin 46'sı artık çivilenip `reflect.submit`e gidiyor ve GERÇEK defter
    satırı üretiyor; D1'in kalan nüfusu **1/47**.
    ÖLÇÜLEN SONUÇ (kuru koşum): `entry.w_turnover@chop` guard'da düşer (21/47) ·
    `regime.vix_backwardation_gate@chop` `regime.*` kuralında düşer (8/47) · `exit.trail_atr_mult@chop`
    + `exit.breakeven_r@chop` guard'ı geçip **KAPIYA ULAŞIR (17/47)**. Yani daha önce sessizce imha
    edilen 47 önerinin **17'si artık kapıya varıyor** — kartın ölçütü tam olarak buydu.
    AÇIK: `hypotheses.jsonl` yolunu açmak altı dosya (analytics/watchdog/selfreview/api/app.js/
    landing.js) düzeltmeyi gerektirir → ROADMAP kalemi, bu turda YAPILMADI.
  sinir: >
    Kurtarılan önerilerin İYİ olduğu İDDİA EDİLMİYOR (kartın beyanlı sınırı 1): yeniden yazılan
    öneri `probgate`ten yine geçmek zorundadır ve bu kart o geçişi ÖLÇMEZ. Ölçülen tek şey,
    kapıya HİÇ ULAŞAMAMA kusurunun kapandığıdır. Etki ancak bir sonraki öğrenme penceresinde
    ölçülebilir (ship sayısı DEĞİL, kapıya ULAŞAN öneri sayısı — ikisi ayrı ölçüt).

beyanlı_sinirlar: >
  (1) Bu kart öğrenme döngüsünün ÜRETİM tarafını ölçer, KALİTE tarafını değil: reddedilen 47
  önerinin İYİ öneriler olduğu İDDİA EDİLMİYOR. Kurtarılmaları hâlinde kapıdan (probgate) yine
  geçmeleri gerekir; bu kart yalnız "kapıya hiç ulaşamıyorlar" kusurunu ele alır.
  (2) 28d (chop dilimi 27 < eşik 30) AYRI bir tıkanıklıktır ve bu kartla ÇÖZÜLMEZ; ikisi
  birbirinin yerine geçmez — 28a boruyu açar, 28d ölçüm yeteneğini geri verir.
  (3) Kartın (c) ölçütü ("yeniden yazılabilir mi") bir ÇIKARIMDIR: yeniden yazılan önerinin
  guard'dan geçeceği ÖLÇÜLMEZ, yalnız biçimsel uygunluk sayılır. Bu ayrım hükümde yazılı kalır.
