<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İsim çakışması — ölçüm (D4)</title>
<!--
  BLOKE EDİCİ 1'İN ÖLÇÜLMESİ. Ölçüm raporu §7/1: "sabitlenen iki kesit aynı `nameID1`/postscript
  adını taşıyor — yeniden adlandırılmazsa self-host'ta MONO KAYBOLUR."
  Bu sayfa iddiayı BEYAN ETMEZ, SINAR. Üç çift yan yana yüklenir:
     ESKİ  — ölçüm turunun ürettiği, isimleri ÇAKIŞAN iki TTF
     YENİ  — D4'ün ürettiği, isimleri AYRIŞTIRILMIŞ iki woff2 (dağıtılan dosyalar)
     KONTROL — hiç @font-face yok; sistem yedeği (sonucun tabanı)
  AYIRT EDİCİ ÖLÇÜM: `i` ile `M` glif genişliği. Monospace bir yüzde İKİSİ EŞİT olmak
  zorundadır; oransal bir yüzde eşit OLAMAZ. Yani "mono gerçekten yüklendi mi" sorusu
  bir görüntüye değil bir sayıya bağlanır.
-->
<style>
@font-face{font-family:'ESKI Sans';src:url('/eski/RecursiveSansLinear-VF.ttf') format('truetype');font-weight:300 1000;font-display:block}
@font-face{font-family:'ESKI Mono';src:url('/eski/RecursiveMonoLinear-VF.ttf') format('truetype');font-weight:300 1000;font-display:block}
@font-face{font-family:'YENI Sans';src:url('/fonts/recursive-sans-vf.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'YENI Mono';src:url('/fonts/recursive-mono-vf.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'GEIST Mono';src:url('/eski/GeistMono-VF.ttf') format('truetype');font-weight:100 900;font-display:block}
body{font-family:ui-monospace,monospace;font-size:13px;background:#fbf9f8;color:#050505;padding:20px;line-height:1.6}
pre{background:#f1ece8;padding:14px;border:1px solid #e2deda;white-space:pre-wrap}
h1{font-size:17px} td{padding:2px 14px 2px 0}
</style>
</head>
<body>
<h1>İSİM ÇAKIŞMASI — ölçüm</h1>
<div id="ornek"></div>
<pre id="cikti">ölçülüyor…</pre>
<script src="olcum.js"></script>
</body>
</html>
