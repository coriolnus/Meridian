     sahte sayı verir)."
  - "40 sondanın 30'undan azı ölçülebilirse (cand_oos None / dilim ince / walk-forward düştü)
     dağılım hükmü VERİLMEZ; ölçülen n raporlanır ve 'n yetersiz' yazılır — ekstrapolasyon YOK."
  - "Ölçüm sırasında canlı `state/` değişirse (mtime kontrolü koşum başında ve sonunda) koşum
     ATILIR: donmuş dilim varsayımı düşmüştür."
  - "Kapı yasasında ölçüm uğruna TEK SATIR değişirse koşum geçersizdir — `_gate_eval` çağrısı
     birebir üretimdeki hâliyle koşar (yalnız kayıt bayrakları False)."

