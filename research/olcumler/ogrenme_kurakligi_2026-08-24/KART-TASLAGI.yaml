thesis: >
  Canlı öğrenme kapısı 2026-08-17'den beri hiçbir aday geçirmedi (153/153 koşum `cleared: 0`) ve
  bu sayı BUGÜN teşhis edilemiyor: gerekçe kanalı ya süreçte bayat (meridian-learn 7 gün eski
  derleme) ya da yapısal olarak siliniyor (sprint_run.py:118 izi `cleared==0` iken boşaltıyor;
  hermes_search_probe `why` taşımıyor). İki bağımsız kanalda ölçülmüş 37 P(ΔS>0) değerinin en
  yükseği 0,799 iken canlı ısınma K=40 ile 0,995, ship yolu K=8 ile 0,975 istiyor. HİPOTEZ:
  `cleared: 0` bir edge ölçümü değil bir K ölçümüdür — yani "geçen yok" cümlesi hiçbir bilgi
  taşımıyor. KARŞI HİPOTEZ EŞİT AĞIRLIKTA MASADA: eşiğe en çok yaklaşmış tek vaka (H00033,
  P=0,799) fold-çoğunluğundan da düşmüştü, yani bağlayıcı terim eşik OLMAYABİLİR.
  Bu kart HANGİ TERİMİN bağladığını sayar; hiçbir eşiği değiştirmez.

