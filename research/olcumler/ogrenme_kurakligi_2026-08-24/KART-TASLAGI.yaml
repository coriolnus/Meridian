universe: >
  DONMUŞ VERİ: ölçüm anındaki `state/` kopyası (bars revizyonu + strategy.yaml + hypotheses.jsonl
  + inc_cache.json + probe_cache.json) bir kez alınır ve ölçüm boyunca DEĞİŞMEZ. Canlı `state/`
  altına YAZILMAZ, canlı birim RESTART EDİLMEZ. Motor yamasız; kapı yasası (reflect._gate_eval)
  ve probgate AYNEN koşar — tek fark, hükmün DEFTERE değil ölçüm artefaktına yazılması
  (record_erosion=False, record_session=False; aşınma sayacı beslenmez).

features_asof: >
  Isınmanın bugünkü planını birebir yeniden kur: `coordinate_descent_search`ün sonda üretim
  bloğu (reflect.py ~1975-2032) aynı girdilerle koşturulur → ilk 40 imza. Her imza için:
  (1) P(ΔS>0) [probgate.evaluate → prob.p], (2) p_required(K) dört K değeri için,
  (3) magnitude_ok / majority (fold_wins/fold_total) / tail_ok / dd_ok / dd_mtm_ok terimlerinin
  her biri AYRI AYRI, (4) cand_oos − inc_oos, (5) `why` dizgesi, (6) erosion_margin'in o an
  yürürlükte olup olmadığı ve değeri. Çıktı: 40 satırlık tablo + terim başına veto sayımı.
  Ölçülemeyen satır (cand_oos None, dilim ince, walk-forward düştü) "olculemedi" kovasına
  yazılır ve BAŞARISIZLIK SAYILMAZ (uydurma yasağı).

parameter_grid:
  k_esigi: [1, 2, 8, 40]      # K += 4 (ÇARPILARAK sayılır) — 1=tek aday, 2=en gevşek gerçekçi ship,
                              # 8=son gerçek aramanın K'sı, 40=canlı ısınmanın K'sı.
                              # P ölçümü K'dan BAĞIMSIZDIR; ızgara yalnız HÜKÜM eşiğini seçer,
                              # ama yine de dört karar olduğu için dördü de K'ya yazılır.
  # BAŞKA HİÇBİR EKSEN YOK. P_BASE, extra_p, formül, sonda üretim kuralı, kill-list DONDURULMUŞTUR.

cost_model: yok   # bu kart P&L ölçmez; friksiyon modeli uygulanmaz (kapı içi istatistik ölçümü)

success_metric: >
  ÖLÇÜMDEN ÖNCE DONDURULMUŞ DÖRT HÜKÜM (sonradan değiştirilemez):
  H1 YAPISAL ERİŞİLMEZLİK — 40 sondanın maks P < 0,90 ise: en gevşek gerçekçi K'da (K=2 → 0,90)
     bile hiçbir aday geçemezdi ⇒ `cleared: 0` bilgi taşımıyor; sınıf (a) DOĞRULANDI.
  H2 K TANIMI BAĞLAYICI — en az bir sondada P ≥ 0,90 VE aynı sonda majority+tail_ok+dd_ok'u
     geçiyorsa: aday K=2'de ship olurdu, K=40'ta olmaz ⇒ bağlayıcı terim "K = planlanan sonda"
     tanımıdır (reflect.py:2049); kusur kapıda değil K muhasebesinde.
  H3 EŞİK BAĞLAYICI DEĞİL — en yüksek üç P'li sonda majority/tail_ok/dd_ok'tan düşüyorsa: eşiği
     indirmek hiçbir şeyi değiştirmez (H00033 deseninin tekrarı) ⇒ öğrenme kuraklığının kökü
     olasılıksal eşik DEĞİL, fold tutarlılığı/kuyruk/düşüş vetolarıdır.
  H4 DÜRÜST YEREL-OPTİMAL — 40 sondanın TAMAMINDA cand_oos ≤ inc_oos VE maks P < 0,50 ise:
     sınıf (c) doğrulanır, v1 bu veri diliminde gerçekten yerel-optimaldir ve `cleared: 0`
     DÜRÜST bir cevaptır. Bu İYİ HABERDİR ve öyle raporlanır.
  Birden fazla hüküm aynı anda tetiklenirse ikisi de yazılır; uzlaştırma YOK.
  BU KART HİÇBİR EŞİĞİ DEĞİŞTİRMEZ: pozitif sonuç bile yalnız ROADMAP önerisi doğurur; değişiklik
  ayrı bir tur + taban yeniden-dondurma (BASE-2026-001 karnesi) ister.

