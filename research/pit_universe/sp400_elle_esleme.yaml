# EDG-2026-093 ADIM-0 EKSEN A — S&P 400 değişiklik tablosunun ADAY satırlarının kararları.
#
# ÜRETİLMİŞ DOSYA — ELLE DÜZENLENMEZ. Üretici (`research/olcumler/edg093_midcap_pit/
# kohort.py`) her `--uygula` koşumunda bu dosyayı YENİDEN ÜRETİR; kararlar tablonun KENDİ
# gerekçe hücresinden MEKANİK olarak türetilir (tek-kaynak). Elle düzenlenmiş bir karar
# tablosu koşuma `--esleme <yol>` ile AÇIK yoldan verilir; şema kapısı onu da korur.
#
# ADAY SATIR İKİ KAYNAKTAN gelir: (a) pencere içindeki TEK YANLI tablo satırları,
# (b) geri sarmada ETKİSİZ adım üreten satırlar (`satir.etkisiz_adimlar`).
#
# `karar` SÖZLÜĞÜ (dışındaki değer REDDEDİLİR):
#   esle:<eski>-><yeni>  YENİDEN ADLANDIRMA KİMLİĞİ — bu satırdaki <eski> sembolü bugünkü
#                        <yeni> ile AYNI ihraçtır; as-of yürütmesinde UYGULANIR (satır
#                        <yeni> ile yazılır). Yalnız gerekçe hücresi yeniden adlandırmayı
#                        AÇIKÇA söylediğinde (sözlük + borsa parantezinde sembol) önerilir.
#   cift:<cikan>-><giren>  İKİ YARIM SATIR aynı endeks değişiminin iki kitaplamasıdır
#                        (ANOTASYON — değişiklik listesi ve tarihler DEĞİŞMEZ).
#   dusur                satır tabloda hatalı kitaplanmış; değişiklik listesinden ÇIKARILIR.
#   belirsiz             karar YOK — sembol o tarihten ÖNCEKİ günlerde 'belirsiz' sayılır.
#
# `gerekce` tablonun KENDİ Reason/<ref> hücresinden alınır; ağa ÇIKILMAZ, metin UYDURULMAZ.
# MDY güncel listesindeki varlık/yokluk TANIdır, karar gerekçesi OLAMAZ (tek kaynak tablo).
# `kaynak.wikitext_satir_no` ayrıştırılmış tablo satır indeksidir (ham wikitext sha'sı sonuç
# JSON'unun `girdi_kimligi` alanında); `satir.alt_no` çok-sembollü hücrenin alt indeksidir.
